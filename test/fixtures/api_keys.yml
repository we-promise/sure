# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# Keys are stored as digests only. A test that needs to authenticate with one of
# these keys gets its secret from `fixture_api_key` in test_helper.rb.

active_key:
  key_digest: <%= ApiKey.digest("test_key_123") %>
  key_prefix: "test_key"
  name: "Production API Key"
  user: family_admin
  scopes: ["read_write"]
  last_used_at: <%= 1.hour.ago %>
  expires_at: <%= 1.year.from_now %>
  revoked_at: null

expired_key:
  key_digest: <%= ApiKey.digest("expired_key_456") %>
  key_prefix: "expired_"
  name: "Expired API Key"
  user: family_member
  scopes: ["read"]
  last_used_at: <%= 1.week.ago %>
  expires_at: <%= 1.day.ago %>
  revoked_at: null

revoked_key:
  key_digest: <%= ApiKey.digest("revoked_key_789") %>
  key_prefix: "revoked_"
  name: "Revoked API Key"
  user: family_admin
  scopes: ["read_write"]
  last_used_at: <%= 1.day.ago %>
  expires_at: null
  revoked_at: <%= 1.hour.ago %>

one:
  id: <%= SecureRandom.uuid %>
  user: family_admin
  name: "Test API Key"
  key_digest: <%= ApiKey.digest("test_one_key_123") %>
  key_prefix: "test_one"
  scopes: [ "read" ]

two:
  id: <%= SecureRandom.uuid %>
  user: family_admin
  name: "Second API Key"
  key_digest: <%= ApiKey.digest("test_two_key_456") %>
  key_prefix: "test_two"
  scopes: [ "read_write" ]
  revoked_at: <%= 1.day.ago %>
