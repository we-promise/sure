name: Pipelock Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pipelock Scan
        uses: luckyPipewrench/pipelock@818ca0a7af4dbcd56ada7fa57e2dc32f9e799e34 # v2.8.0
        with:
          version: '2.8.0'
          scan-diff: 'true'
          fail-on-findings: 'true'
          test-vectors: 'false'
          exclude-paths: |
            .env.example
            compose.example.yml
            compose.example.ai.yml
            config/locales/views/reports/
            docs/hosting/ai.md
            # Self-hosting guide documents env snippets whose placeholders
            # (REMOTE_USER_SHARED_SECRET, POSTGRES_PASSWORD) scan as secrets, and an
            # inline pipelock:ignore would show up in the block readers copy. Excluded
            # whole-file, so a real secret added here later won't be caught either
            docs/hosting/docker.md
            app/models/provider/binance.rb
            workers/preview/package-lock.json
            # Preview Dockerfile uses local dev credentials (rails/rails) that are
            # not real secrets; Dockerfile format does not support inline # pipelock:ignore
            Dockerfile.preview
            # Header-auth integration test uses placeholder secrets ("s3cr3t")
            test/integration/remote_user_header_authentication_test.rb
