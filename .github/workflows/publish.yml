# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners

# Conditions for pushing the image to GHCR:
#   - Triggered by push to default branch (`main`)
#   - Triggered by push to a version tag (`v*`)
#   - Triggered by a scheduled run
#   - Triggered manually via `workflow_dispatch` with `push: true`
#
# Conditional expression:
#   github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push

name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit SHA) to build'
        required: true
        type: string 
        default: 'main'
      push:
        description: 'Push the image to container registry'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'charts/**'
      - 'mobile/**'
  schedule:
    - cron: '30 1 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Update this pair for each compatibility release through December.
  COMPATIBILITY_RELEASE: '2026.10.31'
  COMPATIBILITY_VERSION: '0.7.6'

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Resolve canonical release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release: ${{ steps.release.outputs.release }}
      stable: ${{ steps.release.outputs.stable }}
      alpha: ${{ steps.release.outputs.alpha }}
      compatibility_version: ${{ steps.release.outputs.compatibility_version }}
      release_name: ${{ steps.release.outputs.release_name }}
      alias_note: ${{ steps.release.outputs.alias_note }}
      image_tags: ${{ steps.release.outputs.image_tags }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Resolve release tags
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .sure-version)"
          # Historical refs remain buildable through workflow_dispatch.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$version" =~ ^[2-9][0-9]{3}\.[1-9][0-9]?\.[1-9][0-9]?(-(alpha|beta|rc)(\.(0|[1-9][0-9]*))?)?$ ]] || exit 1
            base="${version%%-*}"
            [[ "$(date -u -d "${base//./-}" +%Y.%-m.%-d)" == "$base" ]] || exit 1
          fi
          stable=false; alpha=false; compatibility=""
          [[ "$version" == *-* ]] || stable=true
          [[ "$version" != *-alpha* ]] || alpha=true
          if [[ "$stable" == true && "$version" == 2026.* && "$version" == "$COMPATIBILITY_RELEASE" ]]; then
            compatibility="$COMPATIBILITY_VERSION"
            [[ -z "$compatibility" || "$compatibility" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          fi
          publish=true; release=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF" == "refs/tags/v${version}" ]]; then
              release=true
            elif [[ -n "$compatibility" && "$GITHUB_REF" == "refs/tags/v${compatibility}" ]]; then
              publish=false
            else
              echo "Tag does not match .sure-version or its compatibility alias." >&2
              exit 1
            fi
          fi
          {
            printf '%s\n' "publish=$publish" "release=$release" "stable=$stable" "alpha=$alpha"
            printf '%s\n' "compatibility_version=$compatibility"
            echo "release_name=v${version}${compatibility:+ — compatibility: v${compatibility}}"
            echo "alias_note=${compatibility:+Compatibility alias: v${compatibility} (same commit and image).}"
            echo 'image_tags<<RELEASE_TAGS'
            if [[ "$release" == true ]]; then
              echo "type=raw,value=$version"
              [[ -z "$compatibility" ]] || echo "type=raw,value=$compatibility"
              [[ "$stable" != true ]] || echo 'type=raw,value=stable'
              [[ "$alpha" != true ]] || echo 'type=raw,value=latest'
            else
              echo 'type=sha,format=long'
              if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
                echo 'type=schedule,pattern=nightly'
                echo "type=schedule,pattern=nightly-{{date 'ddd'}}"
              fi
            fi
            echo 'RELEASE_TAGS'
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: [prepare]
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      require_js_dependency_audit: false

  build:
    name: Build Docker image
    needs: [prepare, ci]

    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runs-on: ubuntu-24.04
          - platform: arm64
            runs-on: ubuntu-24.04-arm

    timeout-minutes: 60
    runs-on: ${{ matrix.runs-on }}

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date (RFC 3339 format)
        id: date
        run: echo "date=$(date -Iseconds)" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: ${{ needs.prepare.outputs.image_tags }}
          labels: |
            org.opencontainers.image.version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.vendor=we-promise
            org.opencontainers.image.title=Sure
            org.opencontainers.image.description=A multi-arch Docker image for the Sure Rails app

      - name: Publish 'linux/${{ matrix.platform }}' image by digest
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          build-args: BUILD_COMMIT_SHA=${{ github.sha }}
          platforms: 'linux/${{ matrix.platform }}'
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.platform }},mode=max
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          push: true
          # DO NOT REMOVE `oci-mediatypes=true`, fixes annotation not showing up on job.merge.steps[-1]
          # ref: https://github.com/docker/build-push-action/discussions/1022
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,oci-mediatypes=true

      - name: Export the Docker image digest
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push }}
        run: |
          mkdir -p "${RUNNER_TEMP}"/digests
          echo "${DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/digest-${PLATFORM}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}

      - name: Upload the Docker image digest
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest & push multi-arch tag
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event.inputs.push }}
    needs: [prepare, build]

    timeout-minutes: 60
    runs-on: 'ubuntu-24.04'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.compatibility_version != ''
      - name: Create or verify compatibility tag
        id: compatibility
        if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.compatibility_version != ''
        env:
          COMPATIBILITY_VERSION: ${{ needs.prepare.outputs.compatibility_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPATIBILITY_VERSION" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          # A non-force push either creates the alias or leaves the existing tag intact.
          if ! git push origin "HEAD:refs/tags/v${COMPATIBILITY_VERSION}"; then
            git fetch --no-tags origin "refs/tags/v${COMPATIBILITY_VERSION}"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]]; then
              echo "Compatibility tag points to another commit; refusing to move it." >&2
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download Docker image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push Docker image
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
          REF_NAME: ${{ github.ref_name }}
        shell: bash -xeuo pipefail {0}
        run: |
          tag_args=()
          while IFS=$'\n' read -r tag; do
            [[ -n "${tag}" ]] || continue
            tag_args+=("--tag=${tag}")
          done <<< "${TAGS}"

          image_args=()
          for PLATFORM in amd64 arm64; do
            image_args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$(<"${DIGESTS_DIR}/digest-${PLATFORM}")")
          done

          annotations=(
            "index:org.opencontainers.image.created=$(date -Iseconds)"
            'index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}'
            'index:org.opencontainers.image.revision=${{ github.sha }}'
            "index:org.opencontainers.image.ref.name=${REF_NAME}"
            'index:org.opencontainers.image.vendor=we-promise'
            'index:org.opencontainers.image.licenses=AGPL-3.0'
            'index:org.opencontainers.image.title=Sure'
            'index:org.opencontainers.image.description=A multi-arch Docker image for the Sure Rails app'
          )
          annotation_args=()
          for annotation in "${annotations[@]}"; do
            annotation_args+=("--annotation=${annotation}")
          done
          if [[ $GITHUB_REF_TYPE == "tag" ]]; then
            annotation_args+=("--annotation=index:org.opencontainers.image.version=$GITHUB_REF_NAME")
          fi

          attempts=0
          until docker buildx imagetools create \
            "${annotation_args[@]}" \
            "${tag_args[@]}" \
            "${image_args[@]}" \
          ; do
            attempts=$((attempts + 1))
            if [[ $attempts -ge 3 ]]; then
              echo "[$(date -u)] ERROR: Failed after 3 attempts." >&2
              exit 1
            fi
            delay=$((2 ** attempts))
            if [[ $delay -gt 15 ]]; then delay=15; fi
            echo "Push failed (attempt $attempts). Retrying in ${delay} seconds..."
            sleep ${delay}
          done


  deploy_demo:
    name: Deploy alpha to Render demo
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.alpha == 'true'
    needs: [prepare, merge]

    timeout-minutes: 15
    runs-on: 'ubuntu-24.04'

    environment:
      name: demo
      url: ${{ vars.RENDER_DEMO_URL }}

    concurrency:
      group: render-demo
      cancel-in-progress: false

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Verify Render deployment configuration
        env:
          DEMO_URL: ${{ vars.RENDER_DEMO_URL }}
          WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEMO_WEB_DEPLOY_HOOK_URL }}
          WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEMO_WORKER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          missing=()
          [[ -n "${DEMO_URL}" ]] || missing+=(RENDER_DEMO_URL)
          [[ -n "${WEB_DEPLOY_HOOK_URL}" ]] || missing+=(RENDER_DEMO_WEB_DEPLOY_HOOK_URL)
          [[ -n "${WORKER_DEPLOY_HOOK_URL}" ]] || missing+=(RENDER_DEMO_WORKER_DEPLOY_HOOK_URL)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing demo environment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy web service
        env:
          WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEMO_WEB_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}"
          curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "imgURL=${image}" \
            "${WEB_DEPLOY_HOOK_URL}"

      - name: Wait for web service
        env:
          DEMO_URL: ${{ vars.RENDER_DEMO_URL }}
        shell: bash
        run: |
          demo_url="${DEMO_URL%/}"

          # Render deploy hooks are asynchronous. Give the deployment time to
          # start before polling the public health endpoint.
          sleep 60

          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 15 "${demo_url}/up" > /dev/null; then
              echo "Demo web service is healthy."
              exit 0
            fi

            echo "Health check attempt ${attempt}/24 failed; retrying in 15 seconds."
            sleep 15
          done

          echo "Demo web service did not become healthy in time." >&2
          exit 1

      - name: Smoke test sign-in page
        env:
          DEMO_URL: ${{ vars.RENDER_DEMO_URL }}
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 30 \
            "${DEMO_URL%/}/sessions/new" > /dev/null

      - name: Deploy worker
        env:
          WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEMO_WORKER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}"
          curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "imgURL=${image}" \
            "${WORKER_DEPLOY_HOOK_URL}"


  deploy_app:
    name: Deploy stable to Render sure-app
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.stable == 'true'
    needs: [prepare, merge]

    timeout-minutes: 15
    runs-on: 'ubuntu-24.04'

    environment:
      name: stable
      url: https://sure-web-6y53.onrender.com

    concurrency:
      group: render-sure-app-stable
      cancel-in-progress: false

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Verify Render deployment configuration
        env:
          APP_URL: https://sure-web-6y53.onrender.com
          WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_APP_WEB_DEPLOY_HOOK_URL }}
          WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_APP_WORKER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi

          missing=()
          [[ -n "${APP_URL}" ]] || missing+=(RENDER_APP_URL)
          [[ -n "${WEB_DEPLOY_HOOK_URL}" ]] || missing+=(RENDER_APP_WEB_DEPLOY_HOOK_URL)
          [[ -n "${WORKER_DEPLOY_HOOK_URL}" ]] || missing+=(RENDER_APP_WORKER_DEPLOY_HOOK_URL)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing stable environment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy web service
        env:
          WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_APP_WEB_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}"
          curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "imgURL=${image}" \
            "${WEB_DEPLOY_HOOK_URL}"

      - name: Wait for web service
        env:
          APP_URL: https://sure-web-6y53.onrender.com
        shell: bash
        run: |
          app_url="${APP_URL%/}"

          # Render deploy hooks are asynchronous. Give the deployment time to
          # start before polling the public health endpoint.
          sleep 60

          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 15 "${app_url}/up" > /dev/null; then
              echo "App web service is healthy."
              exit 0
            fi

            echo "Health check attempt ${attempt}/24 failed; retrying in 15 seconds."
            sleep 15
          done

          echo "App web service did not become healthy in time." >&2
          exit 1

      - name: Smoke test sign-in page
        env:
          APP_URL: https://sure-web-6y53.onrender.com
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 30 \
            "${APP_URL%/}/sessions/new" > /dev/null

      - name: Deploy worker
        env:
          WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_APP_WORKER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}"
          curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "imgURL=${image}" \
            "${WORKER_DEPLOY_HOOK_URL}"


  helm:
    name: Package Helm chart
    needs: [prepare, merge]
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/helm-publish.yml
    with:
      chart_version: ${{ github.ref_name }}
      app_version: ${{ github.ref_name }}
      update_gh_pages: true
      compatibility_version: ${{ needs.prepare.outputs.compatibility_version }}
    secrets: inherit

  mobile:
    name: Build Mobile Apps
    needs: [prepare, merge]
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit

  desktop:
    name: Build macOS Desktop App
    needs: [prepare, merge]
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

  release:
    name: Create GitHub Release
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, merge, mobile, desktop, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/mobile-artifacts

      - name: Download iOS build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-build-unsigned
          path: ${{ runner.temp }}/ios-build

      - name: Download Helm chart artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: helm-chart-package
          path: ${{ runner.temp }}/helm-artifacts

      - name: Download desktop DMG artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-release-dmg
          path: ${{ runner.temp }}/desktop-artifacts

      - name: Prepare release assets
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p ${{ runner.temp }}/release-assets

          echo "=== Debugging: List downloaded artifacts ==="
          echo "Mobile artifacts:"
          ls -laR "${{ runner.temp }}/mobile-artifacts" || echo "No mobile-artifacts directory"
          echo "iOS build:"
          ls -laR "${{ runner.temp }}/ios-build" || echo "No ios-build directory"
          echo "==========================================="

          # Copy debug APK if it exists
          if [ -f "${{ runner.temp }}/mobile-artifacts/app-debug.apk" ]; then
            cp "${{ runner.temp }}/mobile-artifacts/app-debug.apk" "${{ runner.temp }}/release-assets/sure-${REF_NAME}-debug.apk"
            echo "✓ Debug APK prepared"
          fi

          # Copy release APK if it exists
          if [ -f "${{ runner.temp }}/mobile-artifacts/app-release.apk" ]; then
            cp "${{ runner.temp }}/mobile-artifacts/app-release.apk" "${{ runner.temp }}/release-assets/sure-${REF_NAME}.apk"
            echo "✓ Release APK prepared"
          fi

          # Create iOS app archive (zip the .app bundle)
          # Path preserves directory structure from artifact upload
          if [ -d "${{ runner.temp }}/ios-build/ios/iphoneos/Runner.app" ]; then
            cd "${{ runner.temp }}/ios-build/ios/iphoneos"
            zip -r "${{ runner.temp }}/release-assets/sure-${REF_NAME}-ios-unsigned.zip" Runner.app
            echo "✓ iOS build archive prepared"
          fi

          # Copy iOS build info
          if [ -f "${{ runner.temp }}/ios-build/ios-build-info.txt" ]; then
            cp "${{ runner.temp }}/ios-build/ios-build-info.txt" "${{ runner.temp }}/release-assets/"
          fi

          # Copy Helm chart package(s)
          if compgen -G "${{ runner.temp }}/helm-artifacts/*.tgz" > /dev/null; then
            cp ${{ runner.temp }}/helm-artifacts/*.tgz "${{ runner.temp }}/release-assets/"
            echo "✓ Helm chart package prepared"
          fi

          # Copy the universal macOS desktop build.
          if compgen -G "${{ runner.temp }}/desktop-artifacts/*.dmg" > /dev/null; then
            cp ${{ runner.temp }}/desktop-artifacts/*.dmg "${{ runner.temp }}/release-assets/"
            echo "✓ Desktop DMG prepared"
          fi

          echo "Release assets:"
          ls -la "${{ runner.temp }}/release-assets/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.stable != 'true' }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release-assets/*
          body: |
            ${{ needs.prepare.outputs.alias_note }}

            ## Mobile Debug Builds

            This release includes debug builds of the mobile applications.  Download from the `Assets` area below.

            - **Android APK**: Debug build for testing on Android devices
            - **iOS Build**: Unsigned iOS build (requires code signing for installation)

