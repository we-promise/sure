name: Chart Release

on:
  push:
    tags:
      - 'chart-v*'
  workflow_dispatch:
    inputs:
      app_version:
        description: Existing immutable app image version to package (without v)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      chart_version: ${{ steps.tag.outputs.chart_version }}
      app_version: ${{ steps.tag.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve chart release tag
        id: tag
        shell: bash
        env:
          APP_VERSION_INPUT: ${{ inputs.app_version }}
        run: |
          set -euo pipefail

          # Chart-only releases select an existing image, never the dev defaults.
          APP_SEMVER=$(sed -n 's/^appVersion: "\{0,1\}\([^" ]*\)"\{0,1\}/\1/p' charts/sure/Chart.yaml)
          APP_SEMVER="${APP_VERSION_INPUT:-$APP_SEMVER}"
          APP_SEMVER="${APP_SEMVER#v}"
          if [[ ! "$APP_SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+(\.[0-9]+)?)?$ || "$APP_SEMVER" == 0.0.0-* ]]; then
            echo "::error::Select an existing immutable app_version input, or pin Chart.yaml appVersion for a chart tag release."
            exit 1
          fi
          echo "Selected app version: $APP_SEMVER"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Use the app version as the chart version (monorepo: versions stay in sync)
            TAG_NAME="chart-v${APP_SEMVER}"

            if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG_NAME} already exists. Use a new chart-v tag for another chart release of this app version."
              exit 1
            fi

            git config user.name "${GITHUB_ACTOR}"
            git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
            if ! git tag "$TAG_NAME"; then
              echo "::error::Failed to create tag ${TAG_NAME}"
              exit 1
            fi
            if ! git push origin "$TAG_NAME"; then
              echo "::error::Failed to push tag ${TAG_NAME} to origin"
              exit 1
            fi
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          CHART_VERSION="${TAG_NAME#chart-v}"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_SEMVER" >> "$GITHUB_OUTPUT"

  publish_chart:
    needs: prepare_release
    uses: ./.github/workflows/helm-publish.yml
    with:
      chart_version: ${{ needs.prepare_release.outputs.chart_version }}
      app_version: ${{ needs.prepare_release.outputs.app_version }}
      update_gh_pages: true
    secrets: inherit

  release:
    needs: [prepare_release, publish_chart]
    runs-on: ubuntu-latest
    steps:
      - name: Download Helm chart artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: helm-chart-package
          path: ${{ runner.temp }}/helm-artifacts

      - name: Create chart GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          name: ${{ needs.prepare_release.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ runner.temp }}/helm-artifacts/*.tgz
