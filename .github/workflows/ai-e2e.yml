name: AI e2e

# On every release tag (alphas and stable): the AI features end to end against free live models,
# configured through the AI ENV a self-hoster sets — Kilo's free router (`kilo-auto/free`) as the
# LLM and OpenCode Zen's free Jev as the judge:
# - test/e2e/ai: categorize (Kilo, Jev, and a Jev shadow run), merchant detection, bill setup,
#   PDF import, documents and a chat round-trip in the browser, through the jobs and pages users hit;
# - the free legs of the transport tests' live mode (test/models/ai/live).
# Kilo's free router and Zen's Jev answer without a key; KILO_API_KEY and KILO_ORG_ID, when set as
# repository secrets, are sent for higher rate limits. Documents (embedding into pgvector and
# search) and Cohere's OCR run on a free Cohere trial key, COHERE_LIVE_API_KEY, and skip without it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILS_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
  REDIS_URL: redis://localhost:6379
  PLAID_CLIENT_ID: foo
  PLAID_SECRET: bar
  KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
  KILO_ORG_ID: ${{ secrets.KILO_ORG_ID }}
  COHERE_LIVE_API_KEY: ${{ secrets.COHERE_LIVE_API_KEY }}
  JEV_LIVE_API_KEY: public   # OpenCode Zen's anonymous key for its free Jev, not a secret

jobs:
  e2e:
    name: AI features end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16   # documents need the vector extension
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            google-chrome-stable libvips poppler-utils postgresql-client libpq-dev
          # The runner's chromedriver lags google-chrome-stable; Selenium Manager fetches a matching one.
          sudo rm -f /usr/bin/chromedriver

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      # One process: the live calls run one at a time, within the free tiers' rate limits.
      - name: End-to-end tests
        env:
          AI_E2E: "1"
          DISABLE_PARALLELIZATION: "true"
        run: bin/rails test test/e2e/ai

      - name: Keep screenshots from a failed chat test
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: ai-e2e-screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  live:
    name: Transport tests, free models live
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils   # OCR renders pages

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      # Only the free legs: Kilo's `kilo-auto/free` route, Jev on Zen and Cohere's OCR (skipped
      # without its trial key). The paid routes in the same files stay with the `ai-live` label.
      - name: Transport tests, live
        env:
          AI_LIVE: "1"
          DISABLE_PARALLELIZATION: "true"
        run: |
          export KILO_API_KEY="${KILO_API_KEY:-anonymous}"
          bin/rails test test/models/ai/live -v -n "/kilo-auto\/free|test_jev: |test_cohere: /"
