# required private settings: SECRET_KEY_BASE and POSTGRES_PASSWORD
# run: docker compose --env-file /path/to/private.env -f compose.fork.yml up --build
# open http://localhost:3000; set PORT to use another local port

name: sure-fork

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-sure_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your private environment}
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-app: &app
  image: sure-fork:local
  pull_policy: never
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-local}
  volumes:
    - app-storage:/rails/storage
  environment:
    <<: *db_env
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in your private environment}
    SELF_HOSTED: "true"
    RAILS_FORCE_SSL: "false"
    RAILS_ASSUME_SSL: "false"
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

  worker:
    <<: *app
    command: bundle exec sidekiq

  db:
    image: postgres:16
    environment:
      <<: *db_env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  postgres-data:
  redis-data:
