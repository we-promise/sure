# ISO 3166-1 alpha-2 country codes mapped to a portfolio region and a
# development classification.
#
# Format:
#   COUNTRY_CODE:
#     region: one of the five region names below
#     development: developed | emerging
#
# The five regions are the split most portfolio trackers report against, and
# they are deliberately coarse: a region is only useful in an allocation chart
# if it has enough holdings in it to be a slice rather than a sliver.
#
#   north_america, europe, asia_pacific, latin_america, middle_east_africa
#
# Stored as snake_case keys rather than display text, matching ASSET_CLASSES
# and ASSET_SUB_CLASSES. The label a user sees is a translation of the key,
# so renaming "Middle East & Africa" to "EMEA" is a locale edit and not a
# data migration, and a non-English UI is not stuck with English regions.
#
# `development` follows the broad developed/emerging split the major index
# families agree on. Where they disagree -- South Korea is developed to MSCI's
# competitors and emerging to MSCI, and Poland and Greece have each moved --
# this file takes one position and records it here rather than in code, so
# changing it is a data edit and not a deploy of new logic.
#
# A country absent from this file leaves `region` nil. That is on purpose:
# an unclassified holding is honest, and 3.4 gives it an explicit
# "Unclassified" bucket. Guessing a region from an unknown code would put a
# holding in a slice no one can justify.

# ---------------------------------------------------------------- North America
US:
  region: north_america
  development: developed
CA:
  region: north_america
  development: developed
MX:
  region: latin_america
  development: emerging

