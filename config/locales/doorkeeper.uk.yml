        access_denied: 'Власник ресурсу або сервер авторизації відхилив запит.'
        invalid_scope: 'Запитана область є недійсною, невідомою або неправильно сформованою.'
        invalid_code_challenge_method:
          zero: 'Сервер авторизації не підтримує PKCE, оскільки немає прийнятних значень code_challenge_method.'
          one: 'code_challenge_method має бути %{challenge_methods}.'
          other: 'code_challenge_method має бути одним з %{challenge_methods}.'
        server_error: 'Сервер авторизації зіткнувся з неочікуваною умовою, яка завадила йому виконати запит.'
        temporarily_unavailable: 'Сервер авторизації наразі не може обробити запит через тимчасове перевантаження або технічне обслуговування сервера.'

        # Configuration error messages
        credential_flow_not_configured: 'Потік облікових даних власника ресурсу не вдався через те, що Doorkeeper.configure.resource_owner_from_credentials не налаштовано.'
        resource_owner_authenticator_not_configured: 'Пошук власника ресурсу не вдався через те, що Doorkeeper.configure.resource_owner_authenticator не налаштовано.'
        admin_authenticator_not_configured: 'Доступ до панелі адміністратора заборонено через те, що Doorkeeper.configure.admin_authenticator не налаштовано.'

        # Access grant errors
        unsupported_response_type: 'Сервер авторизації не підтримує цей тип відповіді.'
        unsupported_response_mode: 'Сервер авторизації не підтримує цей режим відповіді.'

        # Access token errors
        invalid_client: 'Автентифікація клієнта не вдалася через невідомого клієнта, відсутність автентифікації клієнта або непідтримуваний метод автентифікації.'
        invalid_grant: 'Надане надання авторизації є недійсним, простроченим, відкликаним, не відповідає URI перенаправлення, використаному в запиті на авторизацію, або було видано іншому клієнту.'
        unsupported_grant_type: 'Тип надання авторизації не підтримується сервером авторизації.'

        invalid_token:
          revoked: "Токен доступу було відкликано"
          expired: "Термін дії токена доступу закінчився"
          unknown: "Токен доступу недійсний"
        revoke:
          unauthorized: "Ви не авторизовані для відкликання цього токена"

        forbidden_token:
          missing_scope: 'Доступ до цього ресурсу вимагає області "%{oauth_scopes}".'

    flash:
      applications:
        create:
          notice: 'Додаток створено.'
