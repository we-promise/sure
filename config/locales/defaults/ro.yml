---
ro:
  activerecord:
    errors:
      messages:
        record_invalid: Validare nereuşită %{errors}
        restrict_dependent_destroy:
          has_many: Înregistrarea nu poate fi ștearsă deoarece există înregistrări dependente (%{record})
          has_one: Înregistrarea nu poate fi ștearsă deoarece există o înregistrare dependentă (%{record})
  date:
    abbr_day_names:
    - dum
    - lun
    - mar
    - mie
    - joi
    - vin
    - sâm
    abbr_month_names:
    -
    - ian
    - feb
    - mar
    - apr
    - mai
    - iun
    - iul
    - aug
    - sep
    - oct
    - noi
    - dec
    day_names:
    - duminică
    - luni
    - marți
    - miercuri
    - joi
    - vineri
    - sâmbătă
    formats:
      default: "%d-%m-%Y"
      long: "%d %B %Y"
      short: "%d %b"
      month_year: '%B %Y'
      short_month_year: '%b %Y'
      short_with_year: '%d %b %Y'
    month_names:
    -
    - ianuarie
    - februarie
    - martie
    - aprilie
    - mai
    - iunie
    - iulie
    - august
    - septembrie
    - octombrie
    - noiembrie
    - decembrie
    order:
    - :day
    - :month
    - :year
  datetime:
    distance_in_words:
      about_x_hours:
        few: aproximativ %{count} ore
        one: aproximativ o oră
        other: aproximativ %{count} de ore
      about_x_months:
        few: aproximativ %{count} luni
        one: aproximativ o lună
        other: aproximativ %{count} de luni
      about_x_years:
        few: aproximativ %{count} ani
        one: aproximativ un an
        other: aproximativ %{count} de ani
      almost_x_years:
        few: aproape %{count} ani
        one: aproape %{count} an
        other: aproape %{count} de ani
      half_a_minute: jumătate de minut
      less_than_x_minutes:
        few: mai puțin de %{count} minute
        one: mai puțin de un minut
        other: mai puțin de %{count} de minute
      less_than_x_seconds:
        few: mai puțin de %{count} secunde
        one: mai puțin de o secundă
        other: mai puțin de %{count} de secunde
      over_x_years:
        few: mai mult de %{count} ani
        one: mai mult de un an
        other: mai mult de %{count} de ani
      x_days:
        few: "%{count} zile"
        one: "%{count} zi"
        other: "%{count} de zile"
      x_minutes:
        few: "%{count} minute"
        one: "%{count} minut"
        other: "%{count} de minute"
      x_months:
        few: "%{count} luni"
        one: "%{count} lună"
        other: "%{count} de luni"
      x_seconds:
        few: "%{count} secunde"
        one: "%{count} secundă"
        other: "%{count} de secunde"
      x_years:
        one: '%{count} an'
        few: '%{count} ani'
        other: '%{count} de ani'
    prompts:
      day: ziua
      hour: ora
      minute: minutul
      month: luna
      second: secunda
      year: anul
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: trebuie dat acceptul
      blank: nu poate fi necompletat
      confirmation: nu se potrivește cu %{attribute}
      empty: nu poate fi necompletat
      equal_to: trebuie să fie egal cu %{count}
      even: trebuie să fie par
      exclusion: este rezervat
      greater_than: trebuie să fie mai mare decât %{count}
      greater_than_or_equal_to: trebuie să fie mai mare sau egal cu %{count}
      inclusion: nu este inclus în listă
      invalid: este invalid
      less_than: trebuie să fie mai mic decât %{count}
      less_than_or_equal_to: trebuie să fie mai mic sau egal cu %{count}
      not_a_number: nu este un număr
      not_an_integer: trebuie să fie un număr întreg
      odd: trebuie să fie impar
      taken: este deja folosit
      too_long: este prea lung (se pot folosi maximum %{count} caractere)
      too_short: este prea scurt (minimum de caractere este %{count})
      wrong_length: nu are lungimea corectă (trebuie să aibă %{count} caractere)
      in: trebuie să fie în %{count}
      model_invalid: 'Validarea a eșuat: %{errors}'
      other_than: trebuie să fie diferit de %{count}
      present: trebuie să fie necompletat
      required: trebuie să existe
    template:
      body: 'Încearcă să corectezi următoarele câmpuri:'
      header:
        few: 'Nu am putut salva acest %{model}: %{count} erori.'
        one: 'Nu am putut salva acest %{model}: o eroare'
        other: 'Nu am putut salva acest %{model}: %{count} de erori.'
  helpers:
    select:
      prompt: Alege
      search_placeholder: Caută
      default_label: Selectează...
    submit:
      create: Creare %{model}
      submit: Salvare %{model}
      update: Modificare %{model}
  number:
    currency:
      format:
        delimiter: "."
        format: "%n %u"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: RON
    format:
      delimiter: "."
      precision: 3
      separator: ","
      significant: false
      strip_insignificant_zeros: false
      round_mode: default
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion: miliard
          million: milion
          quadrillion: quadrilion
          thousand: mie
          trillion: trilion
          unit: ''
      format:
        delimiter: ","
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            few: Bytes
            one: Byte
            other: Bytes
          gb: GB
          kb: KB
          mb: MB
          tb: TB
          eb: EB
          pb: PB
    percentage:
      format:
        delimiter: ","
        format: '%n%'
    precision:
      format:
        delimiter: ''
  support:
    array:
      last_word_connector: " și "
      two_words_connector: " și "
      words_connector: ", "
  time:
    am: am
    formats:
      default: "%a %d %b %Y, %H:%M:%S %z"
      long: "%d %B %Y %H:%M"
      short: "%d %b %H:%M"
    pm: pm
  defaults:
    brand_name: '%{brand_name}'
    product_name: '%{product_name}'
    common:
      close: Închide
  global:
    expand: Extinde
  mcp:
    errors:
      invalid_session_id: ID de sesiune MCP invalid
      unsupported_protocol_version: 'Versiune de protocol MCP neacceptată: %{version}'
  oauth:
    registration:
      invalid_redirect_uris: redirect_uris trebuie să folosească https, http loopback sau o schemă URI de aplicație nativă
