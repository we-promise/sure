---
pt-PT:
  defaults:
    brand_name: "%{brand_name}"
    product_name: "%{product_name}"
    common:
      close: "Fechar"
  global:
    expand: "Expandir"
  mcp:
    errors:
      invalid_session_id: "ID de sessão MCP inválido"
      unsupported_protocol_version: "Versão de protocolo MCP não suportada: %{version}"
  activerecord:
    errors:
      messages:
        record_invalid: "Foram encontrados erros de validação: %{errors}"
        restrict_dependent_destroy:
          has_many: Não é possível eliminar o registo porque existem %{record} dependentes
          has_one: Não é possível eliminar o registo porque existe um %{record} dependente
  date:
    abbr_day_names:
    - dom
    - seg
    - ter
    - qua
    - qui
    - sex
    - sáb
    abbr_month_names:
    - 
    - jan
    - fev
    - mar
    - abr
    - mai
    - jun
    - jul
    - ago
    - set
    - out
    - nov
    - dez
    day_names:
    - domingo
    - segunda-feira
    - terça-feira
    - quarta-feira
    - quinta-feira
    - sexta-feira
    - sábado
    formats:
      default: "%Y-%m-%d"
      long: "%d de %B de %Y"
      short: "%d de %B"
      month_year: "%B %Y"
      short_month_year: "%b %Y"
    month_names:
    - 
    - janeiro
    - fevereiro
    - março
    - abril
    - maio
    - junho
    - julho
    - agosto
    - setembro
    - outubro
    - novembro
    - dezembro
    order:
    - :day
    - :month
    - :year
  datetime:
    distance_in_words:
      about_x_hours:
        one: cerca de %{count} hora
        other: cerca de %{count} horas
      about_x_months:
        one: cerca de %{count} mês
        other: cerca de %{count} meses
      about_x_years:
        one: cerca de %{count} ano
        other: cerca de %{count} anos
      almost_x_years:
        one: quase %{count} ano
        other: quase %{count} anos
      half_a_minute: metade de um minuto
      less_than_x_minutes:
        one: menos de um minuto
        other: menos de %{count} minutos
      less_than_x_seconds:
        one: menos de %{count} segundo
        other: menos de %{count} segundos
      over_x_years:
        one: mais de %{count} ano
        other: mais de %{count} anos
      x_days:
        one: "%{count} dia"
        other: "%{count} dias"
      x_minutes:
        one: "%{count} minuto"
        other: "%{count} minutos"
      x_months:
        one: "%{count} mês"
        other: "%{count} meses"
      x_seconds:
        one: "%{count} segundo"
        other: "%{count} segundos"
      x_years:
        one: "%{count} ano"
        other: "%{count} anos"
    prompts:
      day: Dia
      hour: Hora
      minute: Minuto
      month: Mês
      second: Segundo
      year: Ano
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: tem de ser aceite
      blank: é obrigatório
      confirmation: não corresponde a %{attribute}
      empty: é obrigatório
      equal_to: tem de ser igual a %{count}
      even: tem de ser número par
      exclusion: não está disponível
      greater_than: tem de ser superior a %{count}
      greater_than_or_equal_to: tem de ser igual ou superior a %{count}
      in: deve estar em %{count}
      inclusion: não está incluído na lista
      invalid: é inválido
      less_than: deve ser inferior a %{count}
      less_than_or_equal_to: deve ser inferior ou igual a %{count}
      model_invalid: "Validação falhou: %{errors}"
      not_a_number: não é um número
      not_an_integer: deve ser um número inteiro
      odd: deve ser ímpar
      other_than: deve ser diferente de %{count}
      present: deve estar vazio
      required: é obrigatório
      taken: já existe
      too_long:
        one: "é demasiado longo (máximo: %{count} caracter)"
        other: "é demasiado longo (máximo: %{count} caracteres)"
      too_short:
        one: "é demasiado curto (mínimo: %{count} caracter)"
        other: "é demasiado curto (mínimo: %{count} caracteres)"
      wrong_length:
        one: tem o tamanho errado (deve ter %{count} caracter)
        other: tem o tamanho errado (deve ter %{count} caracteres)
    template:
      body: "Foram detectados problemas nos seguintes campos:"
      header:
        one: "%{count} erro impediu que este %{model} fosse guardado"
        other: "%{count} erros impediram que este %{model} fosse guardado"
  helpers:
    select:
      prompt: Por favor, selecione
      search_placeholder: "Pesquisar"
      default_label: "Selecionar..."
    submit:
      create: Criar %{model}
      submit: Guardar %{model}
      update: Atualizar %{model}
  number:
    currency:
      format:
        delimiter: "."
        format: "%n %u"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: "€"
    format:
      delimiter: "."
      precision: 3
      round_mode: default
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion:
            one: mil milhões
            other: mil milhões
          million:
            one: milhão
            other: milhões
          quadrillion:
            one: quadrilião
            other: quadriliões
          thousand: mil
          trillion:
            one: trilião
            other: triliões
          unit: ""
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: Byte
            other: Bytes
          eb: EB
          gb: GB
          kb: KB
          mb: MB
          pb: PB
          tb: TB
    percentage:
      format:
        delimiter: "."
        format: "%n%"
    precision:
      format:
        delimiter: "."
  support:
    array:
      last_word_connector: " e "
      two_words_connector: " e "
      words_connector: ", "
  time:
    am: am
    formats:
      default: "%a, %d de %B de %Y, %H:%M:%S %z"
      long: "%d de %B de %Y, %H:%M"
      short: "%d de %B %H:%M"
    pm: pm
