    errors:
      messages:
        # Common error messages
        invalid_request:
          unknown: 'O pedido está em falta de um parâmetro obrigatório, inclui um valor de parâmetro não suportado ou está, de outro modo, malformado.'
          missing_param: 'Parâmetro obrigatório em falta: %{value}.'
          request_not_authorized: 'O pedido precisa de ser autorizado. O parâmetro obrigatório para autorizar o pedido está em falta ou é inválido.'
          invalid_code_challenge: 'É necessário um code challenge.'
        invalid_redirect_uri: "O URI de redirecionamento pedido está malformado ou não corresponde ao URI de redirecionamento do cliente."
        unauthorized_client: 'O cliente não está autorizado a realizar este pedido com este método.'
        access_denied: 'O proprietário do recurso ou o servidor de autorização negou o pedido.'
        invalid_scope: 'O âmbito pedido é inválido, desconhecido ou malformado.'
        invalid_code_challenge_method:
          zero: 'O servidor de autorização não suporta PKCE porque não existem valores code_challenge_method aceites.'
          one: 'O code_challenge_method tem de ser %{challenge_methods}.'
          other: 'O code_challenge_method tem de ser um de %{challenge_methods}.'
        server_error: 'O servidor de autorização encontrou uma condição inesperada que o impediu de cumprir o pedido.'
        temporarily_unavailable: 'O servidor de autorização está atualmente impossibilitado de processar o pedido devido a uma sobrecarga temporária ou a manutenção do servidor.'

        # Configuration error messages
        credential_flow_not_configured: 'O fluxo Resource Owner Password Credentials falhou porque o Doorkeeper.configure.resource_owner_from_credentials não está configurado.'
        resource_owner_authenticator_not_configured: 'A pesquisa de Resource Owner falhou porque o Doorkeeper.configure.resource_owner_authenticator não está configurado.'
        admin_authenticator_not_configured: 'O acesso ao painel de administração é proibido porque o Doorkeeper.configure.admin_authenticator não está configurado.'

        # Access grant errors
        unsupported_response_type: 'O servidor de autorização não suporta este tipo de resposta.'
        unsupported_response_mode: 'O servidor de autorização não suporta este modo de resposta.'

        # Access token errors
        invalid_client: 'A autenticação do cliente falhou devido a um cliente desconhecido, à ausência de autenticação do cliente ou a um método de autenticação não suportado.'
        invalid_grant: 'A concessão de autorização fornecida é inválida, expirou, foi revogada, não corresponde ao URI de redirecionamento utilizado no pedido de autorização ou foi emitida para outro cliente.'
        unsupported_grant_type: 'O tipo de concessão de autorização não é suportado pelo servidor de autorização.'

        invalid_token:
          revoked: "O token de acesso foi revogado"
          expired: "O token de acesso expirou"
          unknown: "O token de acesso é inválido"
        revoke:
          unauthorized: "Não está autorizado a revogar este token"

        forbidden_token:
          missing_scope: 'O acesso a este recurso exige o âmbito "%{oauth_scopes}".'

