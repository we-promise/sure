---
pt-BR:
  activerecord:
    attributes:
      goal:
        color: Cor
        currency: Moeda
        linked_accounts: Contas vinculadas
        name: Nome
        notes: Notas
        state: Estado
        target_amount: Valor do objetivo
        target_date: Data-alvo
    errors:
      models:
        goal:
          attributes:
            base:
              at_least_one_linked_account_required: Selecione pelo menos uma conta
                para financiar este objetivo.
              whole_account_conflict_on_restore: >-
                Não é possível restaurar este objetivo: “%{account_name}” está agora
                totalmente reservada para “%{goal_name}”. Digite primeiro um valor
                numa delas.
            currency:
              locked_after_linked: Não é possível alterar a moeda depois de o objetivo
                estar associado a contas.
            kind:
              locked_once_consumed: >-
                Este objetivo já registrou dinheiro como gasto, pelo que não pode
                tornar-se uma reserva.
              locked_while_released: Reabra este objetivo antes de o transformar numa
                reserva.
            linked_accounts:
              currency_mismatch: Todas as contas associadas têm de compartilhar a
                mesma moeda.
              must_be_fundable: Todas as contas associadas têm de ser contas de dinheiro
                ou de investimento.
              must_belong_to_family: As contas associadas têm de pertencer à mesma
                família que o objetivo.
            target_amount:
              below_consumed: >-
                Não é possível definir um objetivo abaixo do que este objetivo já
                registrou como gasto.
            target_mode:
              months_requires_maintained: Apenas uma reserva que mantém pode ter o
                objetivo definido em meses de despesas.
            target_months:
              blank: Indique quantos meses de despesas esta reserva deve cobrir.
              only_with_months_mode: Os meses de despesas só se aplicam quando o objetivo
                é definido dessa forma.
