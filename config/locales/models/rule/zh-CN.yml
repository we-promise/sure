              invalid_split_count: 拆分数量必须在 %{min} 到 %{max} 之间
              split_name_required: "拆分 #%{index} 缺少名称"
              split_name_too_long: "拆分 #%{index} 名称过长（最多 255 个字符）"
              split_name_invalid: "拆分 #%{index} 名称包含无效字符"
              split_type_invalid: "拆分 #%{index} 类型必须为固定金额或百分比"
              split_share_invalid: "拆分 #%{index} 份额必须为正数"
              split_category_invalid: "拆分 #%{index} 分类不属于该家庭"
              split_merchant_invalid: "拆分 #%{index} 商户不属于该家庭"
