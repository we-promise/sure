              fixed_shares_must_equal_condition_amount: 拆分份额总和必须等于 %{amount}，即此规则条件所要求的确切金额
        rule/condition:
          attributes:
            value:
              regex_invalid: 不是有效的正则表达式
              regex_too_complex: 过于复杂，无法安全运行
              regex_too_long: 过长（最多 %{count} 个字符）
              regex_backreference: 不能使用后向引用（\1 到 \9）
