              split_category_invalid: "split #%{index} category does not belong to this family"
              split_merchant_invalid: "split #%{index} merchant does not belong to this family"
              split_tags_invalid: "split #%{index} has a tag that does not belong to this family"
              percentages_must_total_100: "percentages must add up to 100 (got %{total})"
