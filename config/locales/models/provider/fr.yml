---
fr:
  providers:
    chimnie:
      errors:
        insufficient_balance: Le solde de votre compte Chimnie est insuffisant pour cette requête.
        invalid_uprn: Un UPRN est un nombre de 12 chiffres maximum. Veuillez vérifier l'UPRN et réessayer.
        no_estimate: Chimnie ne dispose d'aucune estimation de valeur pour ce bien.
        not_found: Chimnie n'a trouvé aucun bien correspondant à cet UPRN.
        unauthorized: Chimnie a rejeté la clé API. Vérifiez la clé dans Paramètres → Auto-hébergement.
        unsupported_property: Chimnie n'estime que les biens résidentiels ; cet UPRN correspond à un bien commercial ou à usage mixte.
    dvf:
      errors:
        address_not_found: Cette adresse est introuvable dans la Base Adresse Nationale. Vérifiez l'adresse et le code postal.
        area_required: Indiquez la surface habitable du bien pour l'estimer à partir des ventes DVF.
        not_enough_sales: Il n'y a pas assez de ventes comparables récentes près de cette adresse pour estimer sa valeur.
        unavailable: Le service de données ouvertes DVF est injoignable. Réessayez plus tard.
        unsupported_property_type: DVF n'estime que les appartements et les maisons. Choisissez le type Appartement, Copropriété, Maison individuelle ou Maison de ville.
    property_valuation:
      entry_name: Estimation %{provider}
      missing_fields: Indiquez un nom et une adresse américaine complète (rue, ville, État et code postal).
      missing_fields_fr: Indiquez un nom, l'adresse et le code postal, le type de bien (appartement ou maison) et la surface habitable. DVF ne couvre pas l'Alsace-Moselle (57, 67, 68) ni Mayotte.
      missing_fields_gb: Veuillez indiquer un nom, l'adresse postale et le code postal, ainsi que l'UPRN du bien.
      not_configured: Ce fournisseur de données immobilières n'est pas configuré.
      preview_expired: Cet aperçu de bien a expiré, relancez la recherche sur l'adresse.
    realie:
      errors:
        location_mismatch: Realie a trouvé un bien situé dans une autre ville ou un autre code postal. Vérifiez l'adresse.
        no_property: Realie n'a renvoyé aucun bien pour cette adresse.
        no_valuation: Realie n'a renvoyé aucune valorisation pour ce bien.
        not_found: Realie n'a trouvé aucun bien correspondant à cette adresse.
    rentcast:
      errors:
        no_valuation: RentCast n'a renvoyé aucune estimation de valeur pour cette adresse.
        not_found: RentCast n'a trouvé aucun bien correspondant à cette adresse.
