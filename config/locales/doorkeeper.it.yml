    errors:
      messages:
        access_denied: Il proprietario della risorsa o il server di autorizzazione
          ha negato la richiesta.
        admin_authenticator_not_configured: L'accesso al pannello amministrativo è
          vietato perché Doorkeeper.configure.admin_authenticator non è configurato.
        credential_flow_not_configured: Il flusso Resource Owner Password Credentials
          è fallito perché Doorkeeper.configure.resource_owner_from_credentials non
          è configurato.
        forbidden_token:
          missing_scope: L'accesso a questa risorsa richiede lo scope "%{oauth_scopes}".
        invalid_client: L'autenticazione del client è fallita a causa di client sconosciuto,
          nessuna autenticazione inclusa o metodo di autenticazione non supportato.
        invalid_code_challenge_method:
          one: Il code_challenge_method deve essere %{challenge_methods}.
          other: Il code_challenge_method deve essere uno tra %{challenge_methods}.
          zero: Il server di autorizzazione non supporta PKCE poiché non ci sono valori
            accettati per code_challenge_method.
        invalid_grant: La concessione di autorizzazione fornita non è valida, è scaduta,
          è stata revocata, non corrisponde all'URI di reindirizzamento usato nella
          richiesta di autorizzazione o è stata emessa per un altro client.
        invalid_redirect_uri: L'URI di reindirizzamento richiesto è malformato o non
          corrisponde all'URI del client.
        invalid_request:
          invalid_code_challenge: Il code challenge è obbligatorio.
          missing_param: 'Parametro obbligatorio mancante: %{value}.'
          request_not_authorized: La richiesta deve essere autorizzata. Il parametro
            obbligatorio per autorizzare la richiesta è mancante o non valido.
          unknown: La richiesta è priva di un parametro obbligatorio, include un valore
            di parametro non supportato o è comunque malformata.
        invalid_scope: Lo scope richiesto non è valido, sconosciuto o malformato.
        invalid_token:
          expired: Il token di accesso è scaduto
          revoked: Il token di accesso è stato revocato
          unknown: Il token di accesso non è valido
        resource_owner_authenticator_not_configured: Ricerca del Resource Owner fallita
          perché Doorkeeper.configure.resource_owner_authenticator non è configurato.
        revoke:
          unauthorized: Non sei autorizzato a revocare questo token
        server_error: Il server di autorizzazione ha incontrato una condizione imprevista
          che gli ha impedito di soddisfare la richiesta.
        temporarily_unavailable: Il server di autorizzazione non è attualmente in
          grado di gestire la richiesta a causa di un sovraccarico temporaneo o di
          manutenzione.
        unauthorized_client: Il client non è autorizzato a eseguire questa richiesta
          con questo metodo.
        unsupported_grant_type: Il tipo di concessione di autorizzazione non è supportato
          dal server di autorizzazione.
        unsupported_response_mode: Il server di autorizzazione non supporta questa
          modalità di risposta.
        unsupported_response_type: Il server di autorizzazione non supporta questo
          tipo di risposta.
