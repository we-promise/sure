        rule_hint: La regola di corrispondenza del commerciante, inserita e disattivata in Regole. Nell'ordine delle regole, una transazione senza commerciante ottiene quello che hanno tutti i suoi quasi duplicati, come "NETFLIX.COM 8812" e "Netflix com". I trasferimenti sono esclusi.
        similar_threshold: Somiglianza
        similar_threshold_hint: Somiglianza più bassa delle descrizioni, ignorando numeri e codici di riferimento (0,5–0,99). Il valore inferiore riempie di più, con più errori. Anche l'applicazione della sintonizzazione automatica lo imposta.
