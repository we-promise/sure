        spread_filter_hint: Non dicono nulla sulla categoria. Il numero indica quanto al di sopra della quota pari deve essere l'utilizzo di una categoria.
        word_split: Le parole sono composte da
        word_split_ascii: a–z e 0–9
        word_split_hint: Ogni altro carattere divide le parole. Le lettere di qualsiasi scrittura mantengono parole come Geschäft o Кофейня intere; con i simboli interni, anche le lettere unite da un simbolo rimangono una parola, come mcdonald's, s/o e m&s (un simbolo alle due estremità, come in *netflix, viene comunque eliminato).
