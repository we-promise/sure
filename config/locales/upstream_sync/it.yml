      matcher:
        lock_similar_merchants: Blocca i commercianti impostati dai matcher
        lock_similar_merchants_hint: Interrompe le regole, AI e le sincronizza modificandole, a meno che non si faccia clic su Applica su una regola. I suoi lucchetti non contano come confermati (ottimizzazione del matcher del commerciante).
