        similar_common_share_hint: Una parola o un pezzo di 3 lettere in più di questa quota di transazioni da cui copia (0,01–1), e in almeno 50 di esse, è troppo comune per distinguerle, come "carta" o "pagamento", quindi viene ignorato. Più in alto ne conta di più. Anche l'applicazione della sintonizzazione automatica lo imposta.
        similar_min_neighbours: Commercianti che concordano
        similar_min_neighbours_hint: Quanti quasi duplicati deve avere il commerciante, senza che nessuno ne abbia un altro. 1 copia una singola transazione, anche gli errori.
