        notes:
          environment_disabled: L'integrazione caricata è disabilitata per questo ambiente Rails.
          explicitly_disabled: SKYLIGHT_ENABLED disabilita esplicitamente la strumentazione.
          self_hosted_checkout_disabled: Il pagamento dell'abbonamento e il portale di fatturazione sono disabilitati in modalità self-hosted. I webhook Stripe possono ancora essere configurati; gli ID del prezzo di checkout non sono richiesti qui.
          browser_analytics_disabled: Le analisi del browser sono disabilitate per questo ambiente. Ciò non disabilita il client server configurato separatamente.
          shared_feedback_configured: Il feedback self-hosted ha un progetto in bundle separato ed è abilitato dalla sua configurazione. Non richiede un operatore POSTHOG_KEY. La disattivazione del browser e la disponibilità di SDK non sono controllate.
          shared_feedback_disabled: Il progetto di feedback self-hosted separato è disabilitato dall'impostazione del feedback o dell'ambiente. Ciò non disabilita l'analisi di proprietà dell'operatore.
          production_only: Questa integrazione viene utilizzata solo in produzione dalla configurazione corrente dell'applicazione.
        services:
          langfuse:
            title: Langfuse
            description: Tracciabilità e reporting di valutazione AI opzionali. Con questo controllo non vengono inviate tracce o richieste di valutazione.
            guidance: Imposta insieme LANGFUSE_PUBLIC_KEY e LANGFUSE_SECRET_KEY. LANGFUSE_HOST è facoltativo. Riavviare i servizi interessati dopo aver modificato queste impostazioni.
          sentry:
            title: Sentry
            description: Segnalazione facoltativa di errori e prestazioni. L'inizializzatore corrente consente la creazione di report solo in produzione.
            guidance: Imposta SENTRY_DSN e riavvia i servizi interessati. Controlla la configurazione SDK caricata senza acquisire un errore o inviare un evento.
          skylight:
            title: Skylight
            description: Strumentazione opzionale per le prestazioni dell'applicazione. La presenza della configurazione non conferma che l'agente è in esecuzione o segnala.
            guidance: Imposta SKYLIGHT_AUTHENTICATION e assicurati che Skylight sia caricato nell'ambiente Rails previsto. SKYLIGHT_ENABLED=false disabilita la strumentazione; la sola bandiera non carica la gemma. Riavvia dopo le modifiche.
          stripe:
            title: Stripe
            description: Webhook di fatturazione e pagamento dell'abbonamento opzionali. Questo controllo non crea un client Stripe, non convalida le credenziali né effettua richieste di pagamento.
            guidance: Imposta STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET insieme. Anche il pagamento dell'abbonamento gestito richiede STRIPE_MONTHLY_PRICE_ID e STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Analisi facoltativa di proprietà dell'operatore, utilizzando la configurazione caricata all'avvio. Configurato non significa che un utente ha acconsentito all'analisi.
            guidance: Imposta POSTHOG_KEY e un POSTHOG_HOST non vuoto oppure lascia l'host non configurato per utilizzare il valore predefinito. L'analisi del browser richiede la produzione o POSTHOG_DEVELOPMENT_ENABLED in fase di sviluppo. POSTHOG_FEEDBACK_ENABLED controlla il feedback separato ospitato autonomamente, non l'analisi dell'operatore.
          logtail:
            title: Logtail
            description: Inoltro registro di produzione opzionale. Quando non è configurata, l'applicazione continua a registrare sull'output standard.
            guidance: Imposta insieme LOGTAIL_API_KEY e LOGTAIL_INGESTING_HOST e riavvia i servizi interessati. Nessun registro di test viene emesso da questo controllo.
