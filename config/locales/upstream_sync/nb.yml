            title: Langfuse
            description: Valgfri AI sporing og evalueringsrapportering. Ingen spor eller evalueringsforespørsler sendes av denne sjekken.
            guidance: Sett LANGFUSE_PUBLIC_KEY og LANGFUSE_SECRET_KEY sammen. LANGFUSE_HOST er valgfritt. Start de berørte tjenestene på nytt etter å ha endret disse innstillingene.
          sentry:
            title: Sentry
            description: Valgfri feil- og ytelsesrapportering. Den gjeldende initialiseringen muliggjør rapportering bare i produksjon.
            guidance: Sett SENTRY_DSN og start de berørte tjenestene på nytt. Dette sjekker den innlastede SDK-konfigurasjonen uten å fange opp en feil eller sende en hendelse.
          skylight:
            title: Skylight
            description: Valgfri applikasjonsytelsesinstrumentering. Konfigurasjonstilstedeværelse bekrefter ikke at agenten kjører eller rapporterer.
            guidance: Sett SKYLIGHT_AUTHENTICATION og sørg for at Skylight er lastet inn i det tiltenkte Rails-miljøet. SKYLIGHT_ENABLED=false deaktiverer instrumentering; flagget alene laster ikke edelstenen. Start på nytt etter endringer.
          stripe:
            title: Stripe
            description: Valgfri abonnementsfakturering og betalingswebhooks. Denne sjekken oppretter ikke en Stripe-klient, validerer ikke legitimasjon eller sender betalingsforespørsler.
            guidance: Sett STRIPE_SECRET_KEY og STRIPE_WEBHOOK_SECRET sammen. Utsjekking av administrert abonnement krever også STRIPE_MONTHLY_PRICE_ID og STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Valgfri operatøreid analyse, ved å bruke konfigurasjonen som ble lastet ved oppstart. Konfigurert betyr ikke at en bruker har samtykket til analyser.
            guidance: Angi POSTHOG_KEY og en ikke-blank POSTHOG_HOST, eller la verten være udefinert for å bruke standarden. Nettleseranalyse krever produksjon eller POSTHOG_DEVELOPMENT_ENABLED under utvikling. POSTHOG_FEEDBACK_ENABLED kontrollerer separat egenvertsbasert tilbakemelding, ikke operatøranalyse.
          logtail:
            title: Logtail
            description: Valgfri videresending av produksjonslogg. Når den er ukonfigurert, fortsetter applikasjonen å logge til standard utgang.
            guidance: Sett LOGTAIL_API_KEY og LOGTAIL_INGESTING_HOST sammen og start de berørte tjenestene på nytt. Ingen testlogg sendes ut av denne sjekken.
