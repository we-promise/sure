            guidance: Configure POSTHOG_KEY y un POSTHOG_HOST que no esté en blanco, o deje el host sin configurar para usar el valor predeterminado. Los análisis del navegador requieren producción o POSTHOG_DEVELOPMENT_ENABLED en desarrollo. POSTHOG_FEEDBACK_ENABLED controla los comentarios autohospedados por separado, no los análisis del operador.
          logtail:
