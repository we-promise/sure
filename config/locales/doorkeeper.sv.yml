        invalid_grant: 'Det angivna auktoriseringstillståndet är ogiltigt, har gått ut, återkallats, matchar inte omdirigerings-URI:n som användes i auktoriseringsförfrågan, eller utfärdades till en annan klient.'
        unsupported_grant_type: 'Denna typ av auktoriseringstillstånd stöds inte av auktoriseringsservern.'

        invalid_token:
          revoked: "Åtkomsttoken har återkallats"
          expired: "Åtkomsttoken har gått ut"
          unknown: "Åtkomsttoken är ogiltig"
        revoke:
          unauthorized: "Du är inte behörig att återkalla denna token"

        forbidden_token:
          missing_scope: 'Åtkomst till denna resurs kräver scope "%{oauth_scopes}".'

