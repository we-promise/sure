        credential_flow_not_configured: El flujo Resource Owner Password Credentials falló porque Doorkeeper.configure.resource_owner_from_credentials no está configurado.
        resource_owner_authenticator_not_configured: La búsqueda del Resource Owner falló porque Doorkeeper.configure.resource_owner_authenticator no está configurado.
        admin_authenticator_not_configured: El acceso al panel de administración está prohibido porque Doorkeeper.configure.admin_authenticator no está configurado.
