      messages:
        access_denied: El propietario del recurso o el servidor de autorización ha denegado la solicitud.
        admin_authenticator_not_configured: El acceso al panel de administración está prohibido porque Doorkeeper.configure.admin_authenticator no está configurado.
        credential_flow_not_configured: El flujo Resource Owner Password Credentials ha fallado porque Doorkeeper.configure.resource_owner_from_credentials no está configurado.
        forbidden_token:
          missing_scope: El acceso a este recurso requiere el ámbito «%{oauth_scopes}».
        invalid_client: La autenticación del cliente ha fallado porque el cliente es desconocido, no se ha incluido autenticación del cliente o el método de autenticación no es compatible.
        invalid_code_challenge_method:
          one: code_challenge_method debe ser %{challenge_methods}.
          other: 'code_challenge_method debe ser uno de los siguientes: %{challenge_methods}.'
          zero: El servidor de autorización no admite PKCE porque no hay valores aceptados de code_challenge_method.
        invalid_grant: La concesión de autorización proporcionada no es válida, ha caducado, se ha revocado, no coincide con la URI de redirección usada en la solicitud de autorización o se ha emitido para otro cliente.
        invalid_redirect_uri: La URI de redirección solicitada tiene un formato incorrecto o no coincide con la URI de redirección del cliente.
        invalid_request:
          invalid_code_challenge: Se requiere un desafío de código.
          missing_param: 'Falta el parámetro obligatorio: %{value}.'
          request_not_authorized: La solicitud necesita autorización. Falta un parámetro obligatorio para autorizarla o no es válido.
          unknown: Falta un parámetro obligatorio en la solicitud, contiene un valor de parámetro no compatible o presenta otro error de formato.
        invalid_scope: El ámbito solicitado no es válido, es desconocido o tiene un formato incorrecto.
        invalid_token:
          expired: El token de acceso ha caducado
          revoked: El token de acceso se ha revocado
          unknown: El token de acceso no es válido
        resource_owner_authenticator_not_configured: No se pudo encontrar al propietario del recurso porque Doorkeeper.configure.resource_owner_authenticator no está configurado.
        revoke:
          unauthorized: No tienes autorización para revocar este token
        server_error: El servidor de autorización ha encontrado una situación inesperada que le ha impedido completar la solicitud.
        temporarily_unavailable: El servidor de autorización no puede atender la solicitud en este momento debido a una sobrecarga temporal o a tareas de mantenimiento.
        unauthorized_client: El cliente no está autorizado para realizar esta solicitud con este método.
        unsupported_grant_type: El servidor de autorización no admite el tipo de concesión de autorización.
        unsupported_response_mode: El servidor de autorización no admite este modo de respuesta.
        unsupported_response_type: El servidor de autorización no admite este tipo de respuesta.
