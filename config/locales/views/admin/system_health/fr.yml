        queued: Vérification du worker mise en file d'attente. Elle apparaîtra ci-dessous dès qu'un processus worker la prendra en charge, généralement en quelques secondes.
      optional_services:
        description: 'Intégrations optionnelles côté opérateur. Les services non configurés sont donnés à titre informatif. Ces vérifications n''inspectent que les paramètres : elles ne testent pas la connectivité, n''envoient pas d''événements de test et ne modifient pas le consentement aux statistiques. Dépliez un service pour voir les détails de configuration.'
        missing_settings: 'Paramètres manquants : %{settings}'
        notes:
          browser_analytics_disabled: Les statistiques côté navigateur sont désactivées pour cet environnement. Cela ne désactive pas le client serveur, configuré séparément.
          environment_disabled: L'intégration chargée est désactivée pour cet environnement Rails.
          explicitly_disabled: SKYLIGHT_ENABLED désactive explicitement l'instrumentation.
          production_only: Avec la configuration actuelle de l'application, cette intégration n'est utilisée qu'en production.
          self_hosted_checkout_disabled: Le paiement des abonnements et le portail de facturation sont désactivés en mode auto-hébergé. Les webhooks Stripe peuvent toujours être configurés ; les identifiants de prix de paiement ne sont pas requis ici.
          shared_feedback_configured: Les retours en auto-hébergement passent par un projet intégré distinct, activé par sa propre configuration. Ils ne nécessitent pas de POSTHOG_KEY côté opérateur. Le refus côté navigateur et la disponibilité du SDK ne sont pas vérifiés.
          shared_feedback_disabled: Le projet distinct de retours en auto-hébergement est désactivé par son paramètre de retours ou d'environnement. Cela ne désactive pas les statistiques propres à l'opérateur.
        services:
