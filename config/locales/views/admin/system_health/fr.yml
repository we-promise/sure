        description: Configuration visible par ce processus web. Ces vérifications n'envoient pas d'e-mails, ne contactent pas les fournisseurs et ne téléversent ni ne téléchargent de fichiers. Configuré signifie que les paramètres sont présents, pas que l'envoi, l'accès aux fournisseurs ou l'accès au stockage a été vérifié.
