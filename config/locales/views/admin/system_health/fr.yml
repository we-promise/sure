            description: Traçage IA et rapports d'évaluation optionnels. Cette vérification n'envoie aucune trace ni requête d'évaluation.
            guidance: Définissez LANGFUSE_PUBLIC_KEY et LANGFUSE_SECRET_KEY ensemble. LANGFUSE_HOST est optionnel. Redémarrez les services concernés après avoir modifié ces paramètres.
            title: Langfuse
          logtail:
            description: Transfert optionnel des journaux de production. Lorsqu'il n'est pas configuré, l'application continue d'écrire ses journaux sur la sortie standard.
            guidance: Définissez LOGTAIL_API_KEY et LOGTAIL_INGESTING_HOST ensemble, puis redémarrez les services concernés. Cette vérification n'émet aucun journal de test.
            title: Logtail
          posthog:
            description: Statistiques optionnelles propres à l'opérateur, selon la configuration chargée au démarrage. Configuré ne signifie pas qu'un utilisateur a consenti aux statistiques.
            guidance: Définissez POSTHOG_KEY et un POSTHOG_HOST non vide, ou laissez l'hôte non défini pour utiliser la valeur par défaut. Les statistiques côté navigateur nécessitent la production, ou POSTHOG_DEVELOPMENT_ENABLED en développement. POSTHOG_FEEDBACK_ENABLED contrôle les retours distincts en auto-hébergement, pas les statistiques de l'opérateur.
            title: PostHog
          sentry:
            description: Remontée optionnelle des erreurs et des performances. L'initialiseur actuel n'active la remontée qu'en production.
            guidance: Définissez SENTRY_DSN et redémarrez les services concernés. Cette vérification contrôle la configuration du SDK chargé sans capturer d'erreur ni envoyer d'événement.
            title: Sentry
          skylight:
            description: Instrumentation optionnelle des performances de l'application. La présence d'une configuration ne confirme pas que l'agent fonctionne ou envoie des données.
            guidance: Définissez SKYLIGHT_AUTHENTICATION et assurez-vous que Skylight est chargé dans l'environnement Rails prévu. SKYLIGHT_ENABLED=false désactive l'instrumentation ; ce drapeau seul ne charge pas la gem. Redémarrez après toute modification.
            title: Skylight
          stripe:
            description: Facturation des abonnements et webhooks de paiement optionnels. Cette vérification ne crée pas de client Stripe, ne valide pas les identifiants et n'effectue aucune requête de paiement.
            guidance: Définissez STRIPE_SECRET_KEY et STRIPE_WEBHOOK_SECRET ensemble. Le paiement des abonnements gérés nécessite aussi STRIPE_MONTHLY_PRICE_ID et STRIPE_ANNUAL_PRICE_ID.
            title: Stripe
        statuses:
          configured: Configuré
          disabled: Désactivé dans ce processus
          incomplete: Configuration incomplète
          not_checked: Non vérifié
          not_configured: Non configuré
        title: Services optionnels
      configuration:
        checks:
          exchange_rates:
            guidance: Choisissez un fournisseur de taux de change et ajoutez sa clé d'API si nécessaire dans les paramètres d'auto-hébergement, ou configurez-le dans l'environnement de déploiement. EXCHANGE_RATE_PROVIDER et les clés d'API des fournisseurs définies dans l'environnement sont prioritaires.
            issues:
              invalid_provider: Le fournisseur de taux de change sélectionné n'est pas reconnu. La récupération automatique des taux échoue tant qu'un fournisseur pris en charge n'est pas sélectionné.
            statuses:
              configured: Le fournisseur de taux de change sélectionné est configuré.
              not_configured: Aucun fournisseur de taux de change utilisable n'est configuré. La conversion automatique des devises peut être indisponible lorsqu'un taux enregistré manque.
            title: Taux de change
          securities:
            guidance: Choisissez les fournisseurs et ajoutez les clés d'API requises dans les paramètres d'auto-hébergement, ou configurez-les dans l'environnement de déploiement. Les valeurs de l'environnement sont prioritaires. Les fournisseurs publics ne nécessitent pas de clé d'API.
            statuses:
              configured: Tous les fournisseurs de cours de marché activés sont configurés.
              disabled: Aucun fournisseur de cours de marché n'est activé. La recherche automatique de titres et la récupération des cours ne sont pas disponibles.
              incomplete: Au moins un fournisseur de cours de marché activé a une configuration manquante ou une sélection invalide. Les titres attribués à ce fournisseur risquent de ne pas recevoir de mises à jour de cours.
              not_configured: Les fournisseurs de cours de marché activés n'ont pas de clé d'API. La recherche automatique de titres et la récupération des cours ne sont pas disponibles via ces fournisseurs.
            title: Cours de marché
          smtp:
            guidance: SMTP ne peut pas être configuré dans l'interface d'administration. Définissez les variables d'environnement d'e-mail pour les services web et worker, puis redémarrez-les tous les deux. SMTP_USERNAME et SMTP_PASSWORD peuvent tous deux être omis pour un relais sans authentification.
            issues:
              address: SMTP_ADDRESS
              app_domain: APP_DOMAIN (utilisé dans les liens des e-mails)
              authentication: SMTP_USERNAME et SMTP_PASSWORD (renseignez les deux ou aucun)
              port: SMTP_PORT (un nombre de 1 à 65535)
              sender: EMAIL_SENDER (remplacez l'expéditeur par défaut sender@sure.local)
            statuses:
              configured: Les paramètres SMTP sont présents.
              disabled: L'envoi d'e-mails est désactivé dans la configuration active du mailer.
              incomplete: Certains paramètres d'e-mail sont manquants ou incomplets. Les e-mails système ou les liens qu'ils contiennent risquent de ne pas fonctionner.
              not_checked: Ce processus utilise une autre méthode d'envoi que SMTP, comme un aperçu de développement. L'envoi SMTP n'est pas évalué.
              not_configured: SMTP n'est pas configuré. Les réinitialisations de mot de passe, les invitations et les autres e-mails système ne peuvent pas être envoyés via SMTP.
            title: E-mail (SMTP)
          storage:
            guidance: Vérifiez ACTIVE_STORAGE_SERVICE et les paramètres de déploiement du stockage sélectionné. Le disque local nécessite un stockage persistant partagé par les services web et worker. Changer de stockage ne migre pas les fichiers existants ; prévoyez toute migration séparément.
            issues:
              bucket: Bucket de stockage
              credentials: Clé d'accès et clé secrète du stockage (renseignez les deux ou utilisez une découverte externe des identifiants)
              endpoint: Point de terminaison du stockage (et CLOUDFLARE_ACCOUNT_ID pour R2)
              region: Région de stockage
              root: Racine du stockage local
            statuses:
              configured: Les paramètres de stockage sont présents ; le disque local ne nécessite pas d'identifiants cloud.
              incomplete: Des paramètres de stockage requis sont manquants ou incomplets. Le téléversement ou la récupération des fichiers risque de ne pas fonctionner.
              not_checked: Ce stockage utilise une découverte externe des identifiants ou une configuration personnalisée. Son accès ne peut pas être déterminé à partir de ces seuls paramètres.
              not_configured: Le stockage sélectionné n'a pas de configuration correspondante. Les téléversements de fichiers peuvent être indisponibles.
            title: Téléversements et stockage de fichiers
