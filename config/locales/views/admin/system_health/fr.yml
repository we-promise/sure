            openai_credentials: Identifiants OpenAI
            pdf_text_extraction: Traitement PDF par extraction de texte
            pdf_text_extraction_failure_reason: Motif de l'échec de l'extraction de texte
            pdf_vision_processing: Traitement PDF vision / natif
            pdf_vision_processing_failure_reason: Motif de l'échec vision / natif
            pgvector_extension: Extension vector de PostgreSQL
            pgvector_table: Table des fragments vectoriels
            probe_request_timeout: Délai d'expiration de la sonde de vérification
            selected_provider: Fournisseur sélectionné
            storage_probe: Vérification du stockage pgvector
          last_checked: Vérifications en direct terminées il y a %{time_ago}. Les résultats sont mis en cache brièvement.
          llm:
            description: Les vérifications en direct contrôlent le modèle configuré, lui demandent un appel de fonction trivial comme le fait l'assistant, puis testent séparément l'extraction de texte et le traitement vision / natif à l'aide d'un PDF synthétique d'une page ne contenant aucune donnée client. Les valeurs des identifiants ne sont jamais affichées.
            title: LLM et traitement des PDF
          local_setup:
            description: Faites tourner le LLM via votre point de terminaison local compatible OpenAI, stockez les vecteurs de documents dans pgvector et faites pointer les paramètres d'embeddings vers un point de terminaison d'embeddings compatible OpenAI. L'image PostgreSQL doit inclure l'extension vector, et les dimensions d'embedding doivent correspondre au modèle sélectionné.
            title: Installation locale recommandée
          not_checked_help: Ouvrez directement l'URL de statut de l'IA ou lancez les vérifications pour contrôler la disponibilité des services.
          pdf_statuses:
            failing: Vérification du PDF synthétique échouée
            not_checked: Non vérifié
            supported: Vérification du PDF synthétique réussie
            unavailable: Indisponible tant qu'aucun fournisseur de LLM n'est configuré
            unsupported: Désactivé ou non pris en charge par le fournisseur ou le modèle effectif
