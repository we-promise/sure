            together: Together
          run_checks: Relancer les vérifications
          values:
            available: Disponible
            available_not_enabled: Disponible, non activé
            configured: Configuré
            enabled: Activé
            fallback: "(solution de repli)"
            'no': Non
            not_available: Non disponible
            not_configured: Non configuré
            not_found: Introuvable
            not_set: Non défini
            'yes': Oui
          vector_statuses:
            failing: Vérification en direct échouée
            missing: Non configuré
            not_checked: Non vérifié
            not_configured: Non configuré
            passing: Vérifications en direct réussies
            scaffolded: Ébauché
          vector_store:
            description: La vérification en direct interroge l'API du magasin de vecteurs hébergé, ou teste la table pgvector et crée un court embedding sans le stocker.
            title: Magasin de vecteurs et recherche documentaire
          worker:
            configuration_statuses:
              match: Identique au web
              mismatch: Différente du web
            coverage_notice: Chaque vérification ne contrôle qu'un seul processus worker, celui qui la dépile. Avec plusieurs réplicas de worker, un résultat positif ne garantit pas que tous les workers sont sains ; relancez la vérification pour en tester un autre.
            description: Les vérifications ci-dessus ont été exécutées depuis ce processus web. La majeure partie du travail lié à l'IA (réponses de l'assistant, traitement des PDF, embeddings, catégorisation automatique et détection des marchands) s'exécute en réalité dans un processus worker Sidekiq, dont l'accès réseau, le DNS, les règles de proxy ou même les identifiants chargés peuvent différer. Mettez une vérification en file d'attente pour contrôler la configuration et la connectivité propres à un worker.
            empty:
              description: Cliquez sur « Vérifier la configuration du worker » pour mettre une vérification asynchrone en file d'attente. Le résultat apparaît ici dès qu'un processus worker la prend en charge.
              title: Aucun worker ne s'est encore manifesté
            labels:
              checked_at: Vérifié le
              configuration: Configuration
              process: Processus worker
            settings_origin:
              database_backed: 'Les paramètres de fournisseur, de modèle et de clé d''API modifiés dans Paramètres → Auto-hébergement sont stockés en base de données. rails-settings-cached invalide le cache partagé à l''écriture : le web comme le worker résolvent donc la nouvelle valeur dès la requête ou la tâche suivante, sans redémarrage.'
              env_backed: 'La configuration des embeddings, ainsi que toute valeur définie uniquement par variable d''environnement, est figée au démarrage de chaque conteneur. Rails ne peut pas modifier l''environnement d''un autre conteneur : changer ces valeurs impose donc de redémarrer ou de recréer à la fois le service web et le service worker. Tout outillage de déploiement qui n''en redémarre qu''un seul (déploiement partiel, Secret mis à jour sans redémarrage du pod) ne prendra pas le changement en compte.'
              title: Quels paramètres exigent un redémarrage ?
            statuses:
              failing: En échec
              passing: Opérationnel
              stale: Obsolète
            title: Vérification du worker
            verify_button: Vérifier la configuration du worker
