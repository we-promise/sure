            title: LLM- og PDF-behandling
          loading: Kjører direktekontroller …
          local_setup:
            description: Kjør LLM via ditt lokale OpenAI-kompatible endepunkt, lagre
              dokumentvektorer i pgvector, og pek innstillingene for vektorrepresentasjoner
              mot et OpenAI-kompatibelt endepunkt for dette. PostgreSQL-imaget må
              inkludere vector-utvidelsen, og vektordimensjonene må samsvare med den
              valgte modellen.
            title: Anbefalt lokalt oppsett
          not_checked_help: Åpne KI-statusadressen direkte eller kjør kontrollene
            for å verifisere at tjenesten svarer.
          run_checks: Kjør kontrollene på nytt
          vector_store:
            description: Direktekontrollen spør API-et til det driftede vektorlageret,
