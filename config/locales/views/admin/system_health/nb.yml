        ai:
          run_checks: Kjør sjekkene på nytt
          last_checked: Sanntidssjekkene ble fullført for %{time_ago} siden. Resultatene mellomlagres en kort stund.
          not_checked_help: Åpne URL-en for AI-status direkte, eller kjør sjekkene for å bekrefte at tjenestene svarer.
          alerts:
            custom_openai:
              title: Sjekken av hostet vektorlager mislyktes for dette egendefinerte endepunktet
              message: Det konfigurerte endepunktet besto ikke /v1/vector_stores-sanntidssjekken. De fleste lokale og OpenAI-kompatible endepunkter implementerer ikke det API-et. Chat og PDF-behandling kan fortsatt fungere; bruk pgvector med et eget embedding-endepunkt for et vanlig lokalt oppsett. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            function_calling_unsupported:
              title: Modellen støtter ikke funksjonskall
              message: Endepunktet besvarte en vanlig chatforespørsel, men avviste den samme forespørselen med tools-parameteren. AI-assistenten leser kontoer, transaksjoner og beholdninger gjennom funksjonskall, så chatten vil fortsette å feile – ofte med en lite hjelpsom 404 – helt til du bruker en modell som støtter verktøy. Velg en modell der leverandøren dokumenterer støtte for funksjonskall. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            function_calling_not_used:
              title: Modellen svarte uten å kalle verktøyet den ble bedt om å kalle
              message: Endepunktet godtok tools-parameteren, men modellen svarte med tekst i stedet for å kalle helsesjekkverktøyet. AI-assistenten kan ikke lese økonomiske data uten verktøykall, så chatten kan svare med ingenting eller med oppdiktede tall. Velg helst en modell der leverandøren dokumenterer støtte for funksjonskall.
            llm_probe_failed:
              title: Sanntidssjekken av LLM mislyktes
              message: Sure kunne ikke bekrefte både det konfigurerte endepunktet og modellen. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            llm_model_not_available:
              title: Den konfigurerte AI-modellen er ikke tilgjengelig
              message: Endepunktet svarte, men listet ikke opp eller leverte den konfigurerte modellen. Velg en aktiv modell for den valgte leverandøren, og kjør sjekkene på nytt. For Gemini via et OpenAI-kompatibelt oversettelseslag bruker du en modell som støttes i dag, for eksempel gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Sjekken av tekstuttrekk fra syntetisk PDF mislyktes
              message: Sure kunne ikke fullføre tekstbanen, som trekker ut innebygd PDF-tekst lokalt og sender den til den konfigurerte modellen. Ingen kundedata ble sendt. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            pdf_vision_processing_failed:
              title: Sjekken av syntetisk PDF med bilde-/native behandling mislyktes
              message: Sure kunne ikke fullføre PDF-banen for bilde eller native dokument gjennom den konfigurerte modellen. Ingen kundedata ble sendt. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            vector_probe_failed:
              title: Sanntidssjekken av dokumentsøk mislyktes
              message: Sure kunne ikke bekrefte det valgte vektorlageret og alle nødvendige embedding-tjenester. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            pgvector_extension_not_enabled:
              title: Vektorutvidelsen i PostgreSQL er ikke aktivert
              message: pgvector-adapteren er valgt, men PostgreSQL har ikke aktivert vector-utvidelsen for denne databasen. Bruk et PostgreSQL-image som inkluderer pgvector, aktiver deretter utvidelsen som databaseeier eller superbruker, og kjør migreringene på nytt med VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Tabellen vector_store_chunks mangler
              message: pgvector-utvidelsen er aktivert, men chunks-tabellen ble ikke funnet. Sjekk migreringsstatusen, og kjør deretter vektorlager-migreringen på nytt med VECTOR_STORE_PROVIDER=pgvector slik at Sure kan opprette vector_store_chunks.
            pgvector_probe_failed:
              title: Lagringssjekken for pgvector mislyktes
              message: Sure kunne ikke gjøre spørringer mot chunks-tabellen i pgvector. Sjekk tillatelsene i PostgreSQL, vector-utvidelsen og migreringen for vector_store_chunks. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            embedding_dimensions_mismatch:
              title: Embedding-dimensjonene samsvarer ikke
              message: Embedding-endepunktet returnerte en vektor med en lengde som ikke samsvarer med EMBEDDING_DIMENSIONS. Sett EMBEDDING_MODEL og EMBEDDING_DIMENSIONS til modellens dokumenterte vektorstørrelse, start Sure på nytt slik at miljøet blir gjeldende, og endre eller gjenopprett deretter embedding-kolonnen/-tabellen i pgvector og lag nye embeddinger av dokumentene hvis eksisterende data brukte en annen størrelse.
            embedding_probe_timeout:
              title: Sanntidssjekken av embedding fikk tidsavbrudd
              message: Embedding-endepunktet svarte ikke innen AI_HEALTH_PROBE_TIMEOUT. Øk denne tidsgrensen for helsesjekken hvis leverandøren er treg, og start deretter Sure på nytt slik at miljøet blir gjeldende i alle prosesser. Hvis vanlige AI-chatkall også får tidsavbrudd, øker du OPENAI_REQUEST_TIMEOUT separat.
            embedding_probe_failed:
              title: Sanntidssjekken av embedding mislyktes
              message: Sure kunne ikke lage en kort test-embedding gjennom det konfigurerte endepunktet og modellen. Sjekk EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN og loggene til embedding-leverandøren. Feilen ble registrert i Innstillinger → Feilsøking og Rails.logger.
            qdrant:
              title: Støtte for Qdrant er ikke implementert ennå
              message: Qdrant-adapteren finnes bare som et skjelett, og opplasting og søk i dokumenter mislykkes foreløpig. Velg OpenAI eller pgvector for dokumentsøk.
            missing_vector_store:
              title: Ingen vektorlager er konfigurert
              message: Opplastede dokumenter kan ikke indekseres eller søkes i før en vektorlager-adapter og kravene til den er konfigurert.
            unavailable_vector_store:
              title: Det valgte vektorlageret er ikke tilgjengelig
              message: Sjekk kravene til adapteren nedenfor. For pgvector må databasen ha vector-utvidelsen eller en eksisterende vector_store_chunks-tabell.
          llm:
            title: LLM og PDF-behandling
