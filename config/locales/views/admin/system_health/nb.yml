              title: Hvilke innstillinger krever omstart?
            title: Verifisering av arbeidsprosess
            verify_button: Verifiser arbeidsprosessens konfigurasjon
          alerts:
            custom_openai:
              message: Det konfigurerte endepunktet bestod ikke tilgjengelighetskontrollen
                av /v1/vector_stores. De fleste lokale og OpenAI-kompatible endepunkter
                implementerer ikke dette API-et. Chat og PDF-behandling kan fortsatt
                fungere. Bruk pgvector med et eget endepunkt for vektorrepresentasjoner
                for et vanlig lokalt oppsett. Feilen ble registrert i Innstillinger
                → Feilsøkingslogger og Rails.logger.
              title: Kontrollen av det driftede vektorlageret mislyktes ved dette
                egendefinerte endepunktet
            embedding_dimensions_mismatch:
              message: Endepunktet for vektorrepresentasjoner returnerte en vektor
                med lengde som ikke samsvarer med EMBEDDING_DIMENSIONS. Angi EMBEDDING_MODEL
                og EMBEDDING_DIMENSIONS etter modellens dokumenterte vektorstørrelse,
                og start Sure på nytt slik at miljøet vedvarer. Endre eller opprett
                deretter pgvector-kolonnen/-tabellen på nytt, og generer nye dokumentvektorer
                hvis eksisterende data brukte en annen størrelse.
              title: Vektordimensjonene samsvarer ikke
            embedding_probe_failed:
              message: Sure kunne ikke opprette en kort testvektor via det konfigurerte
                endepunktet og modellen. Kontroller EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN og loggene hos leverandøren av vektorrepresentasjoner.
                Feilen ble registrert i Innstillinger → Feilsøkingslogger og Rails.logger.
              title: Direktekontrollen av vektorrepresentasjoner mislyktes
            embedding_probe_timeout:
              message: Endepunktet for vektorrepresentasjoner svarte ikke før AI_HEALTH_PROBE_TIMEOUT.
                Øk denne tidsgrensen hvis leverandøren er treg, og start Sure på nytt
                slik at miljøet vedvarer i alle prosesser. Hvis vanlige KI-chatsamtaler
                også får tidsavbrudd, øk OPENAI_REQUEST_TIMEOUT separat.
              title: Direktekontrollen av vektorrepresentasjoner fikk tidsavbrudd
            function_calling_not_used:
              message: Endepunktet godtok tools-parameteren, men modellen svarte med
                tekst i stedet for å kalle helsekontrollverktøyet. KI-assistenten
                kan ikke lese økonomidata uten verktøykall, så chatten kan svare uten
                innhold eller med oppdiktede tall. Velg helst en modell der leverandøren
                dokumenterer støtte for funksjonskall.
              title: Modellen svarte uten å kalle verktøyet den ble bedt om å bruke
            function_calling_unsupported:
              message: Endepunktet behandlet en vanlig chatforespørsel, men avviste
                den samme forespørselen med tools-parameteren. KI-assistenten leser
                kontoer, transaksjoner og beholdninger gjennom funksjonskall. Chatten
                vil derfor fortsette å feile, ofte med en lite nyttig 404-feil, frem
                til du velger en modell som støtter verktøy. Velg en modell der leverandøren
                dokumenterer støtte for funksjonskall. Feilen ble registrert i Innstillinger
                → Feilsøkingslogger og Rails.logger.
              title: Modellen støtter ikke funksjonskall
            llm_model_not_available:
              message: Endepunktet svarte, men listet ikke opp eller leverte den konfigurerte
                modellen. Velg en aktiv modell for den valgte leverandøren, og kjør
                kontrollene på nytt. For Gemini gjennom et OpenAI-kompatibelt oversettelseslag
                bruker du en modell som støttes nå, for eksempel gemini-2.5-flash.
              title: Den konfigurerte KI-modellen er ikke tilgjengelig
            llm_probe_failed:
              message: Sure kunne ikke verifisere både det konfigurerte endepunktet
                og modellen. Feilen ble registrert i Innstillinger → Feilsøkingslogger
                og Rails.logger.
              title: Direktekontrollen av LLM mislyktes
            missing_vector_store:
              message: Opplastede dokumenter kan ikke indekseres eller søkes i før
                en vektorlageradapter og dens forutsetninger er konfigurert.
              title: Ingen vektorlager er konfigurert
            pdf_text_extraction_failed:
              message: Sure kunne ikke fullføre tekstbanen som trekker ut innebygd
                PDF-tekst lokalt og sender den til den konfigurerte modellen. Ingen
                kundedata ble sendt. Feilen ble registrert i Innstillinger → Feilsøkingslogger
                og Rails.logger.
              title: Kontrollen av tekstuttrekk fra syntetisk PDF mislyktes
            pdf_vision_processing_failed:
              message: Sure kunne ikke fullføre PDF-behandlingen via bilder eller
                opprinnelig dokumentformat med den konfigurerte modellen. Ingen kundedata
                ble sendt. Feilen ble registrert i Innstillinger → Feilsøkingslogger
                og Rails.logger.
              title: Kontrollen av syntetisk PDF via bilde/opprinnelig format mislyktes
            pgvector_extension_not_enabled:
              message: pgvector-adapteren er valgt, men vector-utvidelsen er ikke
                aktivert for denne PostgreSQL-databasen. Bruk et PostgreSQL-image
                som inkluderer pgvector, aktiver utvidelsen som databaseeier eller
                superbruker, og kjør migreringene på nytt med VECTOR_STORE_PROVIDER=pgvector.
              title: PostgreSQL-utvidelsen vector er ikke aktivert
            pgvector_probe_failed:
              message: Sure kunne ikke spørre pgvector-tabellen med tekstsegmenter.
                Kontroller PostgreSQL-rettigheter, vector-utvidelsen og vector_store_chunks-migreringen.
                Feilen ble registrert i Innstillinger → Feilsøkingslogger og Rails.logger.
              title: Lagringskontrollen for pgvector mislyktes
            pgvector_table_not_found:
              message: pgvector-utvidelsen er aktivert, men tabellen med tekstsegmenter
                ble ikke funnet. Kontroller migreringsstatusen og kjør vektorlager-migreringen
                på nytt med VECTOR_STORE_PROVIDER=pgvector slik at Sure kan opprette
                vector_store_chunks.
              title: Tabellen vector_store_chunks mangler
            qdrant:
              message: Qdrant-adapteren har bare grunnstrukturen på plass. Dokumentopplasting
                og søk mislykkes foreløpig. Velg OpenAI eller pgvector for dokumentsøk.
              title: Qdrant-støtte er ikke implementert ennå
            unavailable_vector_store:
              message: Kontroller adapterkravene nedenfor. For pgvector må databasen
                tilby vector-utvidelsen eller en eksisterende vector_store_chunks-tabell.
              title: Det valgte vektorlageret er utilgjengelig
            vector_probe_failed:
              message: Sure kunne ikke verifisere det valgte vektorlageret og alle
                nødvendige tjenester for vektorrepresentasjoner. Feilen ble registrert
                i Innstillinger → Feilsøkingslogger og Rails.logger.
              title: Direktekontrollen av dokumentsøk mislyktes
          failure_codes:
            dimensions_mismatch: Vektordimensjonene samsvarer ikke med de konfigurerte
