                køjobb. Omstart er ikke nødvendig.
              env_backed: Konfigurasjon av vektorrepresentasjoner og alle verdier
                som bare angis via miljøvariabler, fastsettes når hver container starter.
                Rails kan ikke endre miljøet i en annen container. Endringer krever
                derfor omstart eller nyoppretting av både web- og arbeidsprosesstjenestene.
