          worker:
            title: Verifisering av worker
            description: Sjekkene ovenfor ble kjørt fra denne webprosessen. Det meste av AI-arbeidet -- assistentsvar, PDF-behandling, embeddinger, automatisk kategorisering og gjenkjenning av forhandlere -- kjører faktisk i en Sidekiq-worker-prosess, som kan ha annen nettverkstilgang, DNS, andre proxy-regler eller til og med annen innlastet legitimasjon. Legg en sjekk i kø for å verifisere workerens egen konfigurasjon og tilkobling.
            verify_button: Verifiser worker-konfigurasjon
            coverage_notice: Hver sjekk verifiserer nøyaktig én worker-prosess -- den som henter den fra køen. Med mer enn én worker-replika bekrefter ikke et bestått resultat at alle workere er friske; legg sjekken i kø på nytt for å teste en annen.
            empty:
              title: Ingen worker har rapportert inn ennå
              description: Klikk «Verifiser worker-konfigurasjon» for å legge en asynkron sjekk i kø. Resultatet vises her når en worker-prosess plukker den opp.
            labels:
              process: Worker-prosess
              checked_at: Sjekket
              configuration: Konfigurasjon
            configuration_statuses:
              match: Samsvarer med web
              mismatch: Avviker fra web
            statuses:
              passing: Bestått
              failing: Feiler
              stale: Utdatert
            settings_origin:
              title: Hvilke innstillinger krever omstart?
              database_backed: Innstillinger for leverandør, modell og API-nøkkel som endres under Innstillinger → Selvhosting, lagres i databasen. rails-settings-cached ugyldiggjør den delte hurtigbufferen ved skriving, så både web og worker henter den nye verdien ved neste forespørsel eller jobb i kø -- ingen omstart nødvendig.
              env_backed: Embedding-konfigurasjonen, og alle verdier som bare er satt via en miljøvariabel, låses når hver container starter. Rails kan ikke endre miljøet til en annen container, så endringer her krever at både web- og worker-tjenestene startes eller opprettes på nytt -- og deploy-verktøy som bare starter én av dem på nytt (delvis utrulling, en oppdatert Secret uten omstart av pod) vil ikke fange opp endringen.
          local_setup:
            title: Anbefalt lokalt oppsett
            description: Kjør LLM-en gjennom ditt lokale OpenAI-kompatible endepunkt, lagre dokumentvektorer i pgvector, og pek embedding-innstillingene mot et OpenAI-kompatibelt embedding-endepunkt. PostgreSQL-imaget må inkludere vector-utvidelsen, og embedding-dimensjonene må samsvare med den valgte modellen.
