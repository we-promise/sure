            guidance: "Sett SENTRY_DSN og start de berørte tjenestene på nytt. Dette sjekker den innlastede SDK-konfigurasjonen uten å fange opp en feil eller sende en hendelse."
          skylight:
            title: "Skylight"
            description: "Valgfri ytelsesinstrumentering av applikasjonen. At konfigurasjonen finnes, bekrefter ikke at agenten kjører eller rapporterer."
            guidance: "Sett SKYLIGHT_AUTHENTICATION og sørg for at Skylight lastes inn i riktig Rails-miljø. SKYLIGHT_ENABLED=false deaktiverer instrumenteringen; flagget alene laster ikke inn gemmen. Start på nytt etter endringer."
          stripe:
            title: "Stripe"
            description: "Valgfri abonnementsfakturering og betalings-webhooks. Denne sjekken oppretter ingen Stripe-klient, validerer ikke legitimasjon og gjør ingen betalingsforespørsler."
            guidance: "Sett STRIPE_SECRET_KEY og STRIPE_WEBHOOK_SECRET sammen. Betaling av abonnement i administrert modus krever også STRIPE_MONTHLY_PRICE_ID og STRIPE_ANNUAL_PRICE_ID."
          posthog:
            title: "PostHog"
            description: "Valgfri analyse som eies av operatøren, med konfigurasjonen som ble lastet inn ved oppstart. Konfigurert betyr ikke at en bruker har samtykket til analyse."
            guidance: "Sett POSTHOG_KEY og en POSTHOG_HOST som ikke er tom, eller la verten være usatt for å bruke standardverdien. Nettleseranalyse krever produksjon, eller POSTHOG_DEVELOPMENT_ENABLED i utvikling. POSTHOG_FEEDBACK_ENABLED styrer de separate tilbakemeldingene i selvhostet modus, ikke analysen til operatøren."
          logtail:
            title: "Logtail"
            description: "Valgfri videresending av produksjonslogger. Når den ikke er konfigurert, fortsetter applikasjonen å logge til standard utdata."
            guidance: "Sett LOGTAIL_API_KEY og LOGTAIL_INGESTING_HOST sammen, og start de berørte tjenestene på nytt. Denne sjekken sender ingen testlogg."
