---
pt-BR:
  admin:
    system_health:
      hosted_usage:
        loading: Carregando uso do serviço hospedado…
        title: Uso do serviço hospedado
        snapshot: Instantâneo do banco de dados (somente leitura) de %{time}
        summary:
          trial_households_count: Famílias em teste (últimos 30 dias)
          trial_members_count: Contas de membros atualmente em teste
          trials_expiring_soon_count: Testes que expiram nos próximos 7 dias
          cleanup_eligible_count: Famílias elegíveis para limpeza
          active_supporter_households_count: Famílias apoiadoras ativas (local)
          supporter_subscription_count: Registros de assinatura vinculados ao Stripe
        summary_help: Os totais de teste abrangem as assinaturas registradas nos últimos 30 dias. Os totais de testes expirando, de limpeza e de apoiadores abrangem todos os registros atuais correspondentes, sem os limites das tabelas.
        limitations_title: O que estes números podem nos dizer
        limitations: As tabelas atuais não armazenam o histórico completo de testes, pagamentos ou atividade de sessões. A criação de assinaturas pode refletir importações. Contas de membros não são pessoas únicas verificadas. Esta tela não altera nenhum dado de família ou de assinatura. As redefinições da demo compartilhada removem famílias e sessões antigas, então o histórico de visitantes não pode ser reconstruído.
        trials:
          title: Famílias em teste recentes
          description: Assinaturas registradas desde %{date} que mantêm uma data de fim do teste, incluindo testes convertidos. Mostrando até %{limit} famílias.
          sessions_help: As sessões são registros de login armazenados de usuários habilitados, não usuários online no momento nem visitas. Sair da conta exclui um registro. O horário de criação mais recente não indica quando o usuário foi visto pela última vez.
          empty: Nenhuma família em teste registrada neste período
        cleanup:
          title: Elegibilidade para limpeza
          description: "Corresponde ao escopo de limpeza existente: uma assinatura pausada ou em teste encerrada há mais de 14 dias, ou nenhuma assinatura e uma família criada há mais de 45 + 14 dias. Mostrando até %{limit} famílias."
          eligibility_help: Logins recentes não impedem a correspondência. A elegibilidade não confirma a exclusão; 90 dias é o prazo de retenção do arquivo, não o limite para a limpeza de testes.
          disabled: A limpeza agendada de testes fica desativada fora do modo gerenciado. Estas são apenas correspondências de escopo.
          empty: Nenhuma família corresponde ao escopo de limpeza
          reasons:
            expired_trial_grace_elapsed: Teste encerrado; carência de 14 dias esgotada
            no_subscription_grace_elapsed: Sem assinatura; 45 + 14 dias decorridos
        supporters:
          title: Status local dos apoiadores
          description: Registros de assinatura locais atuais com IDs de cliente e de assinatura no formato do Stripe; a assinatura sintética da demo fica de fora. Os status não confirmam pagamentos recebidos nem datas do primeiro pagamento. Nenhuma requisição é feita ao Stripe.
          empty: Nenhum registro de assinatura vinculado ao Stripe
        columns:
          household: ID da família
          recorded_at: Registro da assinatura
          trial_ends_at: Fim do teste
          status: Status atual
          members: Contas de membros
          retained_sessions: Sessões de login armazenadas
          recent_sessions: Sessões armazenadas criadas nos últimos 30 dias
          latest_session: Último login armazenado
          cleanup_eligible: Elegível para limpeza
          cleanup_reason: Motivo
          subscription_rows: Registros de assinatura
        statuses:
          unknown: Desconhecida
          incomplete: Incompleta
          incomplete_expired: Incompleta, expirada
          trialing: Em teste
          active: Ativa
          past_due: Em atraso
          canceled: Cancelada
          unpaid: Não paga
          paused: Pausada
          no_subscription: Sem assinatura
        not_recorded: Não registrado
        eligible: Elegível
        not_eligible: Não elegível
        synthetic_demo: Demo sintética
      push_notifications:
        send_test: Enviar notificação push de teste
        queueing: Enfileirando…
        title: Notificações push
        requested_at: Último teste solicitado em %{time}
        result_help: O aceite pelo APNs não confirma a entrega no seu dispositivo. Atualize para ver os resultados do worker. Os resultados ficam guardados por 24 horas.
        results_label: Resultados do teste
        device: Dispositivo %{number}
        pending: Pendente
        refresh: Atualizar resultados
        columns:
          device: Dispositivo
          environment: Ambiente do APNs
          status: Resultado
          checked_at: Última atualização
        environments:
          sandbox: Sandbox
          production: Produção
        messages:
          enqueue_failed: Não foi possível enfileirar o teste. Verifique o Sidekiq e atualize os resultados abaixo.
          ready: Envie uma notificação de teste para os dispositivos iOS habilitados e registrados na sua conta.
          queued: Notificação de teste enfileirada. Atualize os resultados abaixo para verificar o status.
          hosted_only: As notificações push estão disponíveis apenas no modo hospedado.
          ineligible: Apenas um superadministrador ativo pode enviar uma notificação de teste.
          no_devices: Ative as notificações push no app Sure para iOS nesta conta para enviar um teste.
          disabled: O envio de notificações push foi desativado pelo operador.
          not_configured: As credenciais do APNs não estão configuradas.
          cooldown: Aguarde 30 segundos antes de enviar outro teste.
          storage_unavailable: Não foi possível salvar a solicitação de teste. Verifique a configuração do cache compartilhado.
        statuses:
          queued: Na fila
          accepted: Aceita pelo APNs
          skipped: "Ignorada: não é mais elegível"
          rejected: Rejeitada pelo APNs; verifique os logs de depuração de push
          unregistered: O registro do dispositivo não é mais válido
          retrying: Tentando novamente após uma falha temporária
          failed: Falhou; verifique os logs de depuração de push
          enqueue_failed: Não foi possível enfileirar; verifique o Sidekiq
          expired: Expirou sem um resultado final
      push_notification:
        title: Notificação de teste do Sure
        body: Esta é uma notificação push de teste da sua conta Sure.
      verify_worker_ai:
        queued: Verificação do worker enfileirada. Ela aparecerá abaixo assim que um processo worker a executar, geralmente em poucos segundos.
      optional_services:
        title: Serviços opcionais
        description: "Integrações opcionais do operador. Serviços não configurados são apenas informativos. Estas verificações inspecionam somente as configurações: não testam a conectividade, não enviam eventos de teste nem alteram o consentimento de análise de dados. Expanda um serviço para ver os detalhes de configuração."
        missing_settings: "Configurações ausentes: %{settings}"
        statuses:
          configured: Configurado
          not_configured: Não configurado
          incomplete: Configuração incompleta
          disabled: Desativado neste processo
          not_checked: Não verificado
        notes:
          environment_disabled: A integração carregada está desativada neste ambiente Rails.
          explicitly_disabled: SKYLIGHT_ENABLED desativa explicitamente a instrumentação.
          self_hosted_checkout_disabled: O checkout de assinaturas e o portal de cobrança ficam desativados no modo auto-hospedado. Os webhooks do Stripe ainda podem ser configurados; os IDs de preço do checkout não são necessários aqui.
          browser_analytics_disabled: A análise de dados no navegador está desativada neste ambiente. Isso não desativa o cliente de servidor configurado separadamente.
          shared_feedback_configured: O feedback auto-hospedado tem um projeto próprio incluído e é ativado pela configuração dele. Ele não exige uma POSTHOG_KEY do operador. A recusa (opt-out) no navegador e a disponibilidade do SDK não são verificadas.
          shared_feedback_disabled: O projeto separado de feedback auto-hospedado está desativado pela configuração de feedback ou de ambiente. Isso não desativa a análise de dados do próprio operador.
          production_only: Pela configuração atual da aplicação, esta integração só é usada em produção.
        services:
          langfuse:
            title: Langfuse
            description: Rastreamento de IA e relatórios de avaliação opcionais. Esta verificação não envia rastros nem requisições de avaliação.
            guidance: Defina LANGFUSE_PUBLIC_KEY e LANGFUSE_SECRET_KEY juntas. LANGFUSE_HOST é opcional. Reinicie os serviços afetados depois de alterar essas configurações.
          sentry:
            title: Sentry
            description: Relatórios opcionais de erros e desempenho. O inicializador atual ativa os relatórios apenas em produção.
            guidance: Defina SENTRY_DSN e reinicie os serviços afetados. Esta verificação analisa a configuração do SDK carregado sem capturar erros nem enviar eventos.
          skylight:
            title: Skylight
            description: Instrumentação opcional de desempenho da aplicação. A presença da configuração não confirma que o agente está em execução ou enviando dados.
            guidance: Defina SKYLIGHT_AUTHENTICATION e confirme que o Skylight está carregado no ambiente Rails desejado. SKYLIGHT_ENABLED=false desativa a instrumentação; a flag sozinha não carrega a gem. Reinicie após as alterações.
          stripe:
            title: Stripe
            description: Cobrança de assinaturas e webhooks de pagamento opcionais. Esta verificação não cria um cliente do Stripe, não valida credenciais nem faz requisições de pagamento.
            guidance: Defina STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET juntas. O checkout de assinaturas gerenciadas também precisa de STRIPE_MONTHLY_PRICE_ID e STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Análise de dados opcional do próprio operador, usando a configuração carregada na inicialização. Estar configurado não significa que um usuário consentiu com a análise de dados.
            guidance: Defina POSTHOG_KEY e um POSTHOG_HOST não vazio, ou deixe o host sem definir para usar o padrão. A análise de dados no navegador exige produção ou POSTHOG_DEVELOPMENT_ENABLED em desenvolvimento. POSTHOG_FEEDBACK_ENABLED controla o feedback auto-hospedado separado, não a análise de dados do operador.
          logtail:
            title: Logtail
            description: Encaminhamento opcional de logs de produção. Quando não está configurado, a aplicação continua registrando os logs na saída padrão.
            guidance: Defina LOGTAIL_API_KEY e LOGTAIL_INGESTING_HOST juntas e reinicie os serviços afetados. Esta verificação não emite nenhum log de teste.
      configuration:
        description: Configuração visível para este processo web. Estas verificações não enviam e-mails, não contatam provedores nem enviam ou baixam arquivos. Configurado significa que as configurações estão presentes, não que o envio, o acesso aos provedores ou o acesso ao armazenamento foram verificados.
        statuses:
          configured: Configurado
          not_configured: Não configurado
          incomplete: Configuração incompleta
          disabled: Desativado
          not_checked: Não verificado
        settings_needed: Configurações a revisar
        unknown_provider: Seleção de provedor não reconhecida
        provider_statuses:
          configured: Configurado
          not_configured: Chave de API ausente
          invalid: Seleção inválida
        configure_providers: Abrir configurações de auto-hospedagem
        storage_backend: "Armazenamento selecionado: %{backend}"
        storage_backends:
          local: Disco local
          test: Disco de teste
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: Armazenamento compatível com S3
          google: Google Cloud Storage
          other: Backend personalizado ou não reconhecido
        checks:
          smtp:
            title: E-mail (SMTP)
            statuses:
              configured: As configurações de SMTP estão presentes.
              not_configured: O SMTP não está configurado. Redefinições de senha, convites e outros e-mails do sistema não podem ser enviados por SMTP.
              incomplete: Algumas configurações de e-mail estão ausentes ou incompletas. Os e-mails do sistema ou os links que eles contêm podem não funcionar.
              disabled: O envio de e-mails está desativado na configuração do mailer em execução.
              not_checked: Este processo usa um método de envio diferente de SMTP, como uma pré-visualização de desenvolvimento. O envio por SMTP não é avaliado.
            guidance: O SMTP não pode ser configurado na interface de administração. Defina as variáveis de ambiente de e-mail nos serviços web e worker e depois reinicie os dois. SMTP_USERNAME e SMTP_PASSWORD podem ser omitidas juntas para um relay sem autenticação.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (um número de 1 a 65535)
              sender: EMAIL_SENDER (substitua o padrão sender@sure.local)
              app_domain: APP_DOMAIN (usado nos links dos e-mails)
              authentication: SMTP_USERNAME e SMTP_PASSWORD (informe as duas ou nenhuma)
          securities:
            title: Preços de mercado
            statuses:
              configured: Todos os provedores de preços de mercado ativados estão configurados.
              not_configured: Os provedores de preços de mercado ativados estão sem as chaves de API. A busca automática de ativos e a consulta de preços não estão disponíveis por esses provedores.
              incomplete: Pelo menos um provedor de preços de mercado ativado tem configuração ausente ou seleção inválida. Os ativos atribuídos a esse provedor podem não receber atualizações de preço.
              disabled: Nenhum provedor de preços de mercado está ativado. A busca automática de ativos e a consulta de preços não estão disponíveis.
            guidance: Escolha os provedores e adicione as chaves de API necessárias nas configurações de auto-hospedagem, ou configure-os no ambiente de implantação. Os valores definidos no ambiente têm precedência. Provedores públicos não precisam de chave de API.
          exchange_rates:
            title: Taxas de câmbio
            statuses:
              configured: O provedor de taxas de câmbio selecionado está configurado.
              not_configured: Nenhum provedor de taxas de câmbio utilizável está configurado. A conversão automática de moedas pode ficar indisponível quando faltar uma taxa armazenada.
            guidance: Escolha um provedor de taxas de câmbio e, se necessário, adicione a chave de API dele nas configurações de auto-hospedagem, ou configure-o no ambiente de implantação. EXCHANGE_RATE_PROVIDER e as chaves de API de provedores definidas no ambiente têm precedência.
            issues:
              invalid_provider: O provedor de taxas de câmbio selecionado não é reconhecido. A consulta automática de taxas falhará até que um provedor compatível seja selecionado.
          storage:
            title: Envio e armazenamento de arquivos
            statuses:
              configured: As configurações de armazenamento estão presentes; o disco local não precisa de credenciais de nuvem.
              not_configured: O backend de armazenamento selecionado não tem configuração correspondente. O envio de arquivos pode ficar indisponível.
              incomplete: Configurações obrigatórias de armazenamento estão ausentes ou incompletas. O envio ou a recuperação de arquivos pode não funcionar.
              not_checked: Este backend usa descoberta externa de credenciais ou uma configuração personalizada. Não é possível determinar o acesso apenas com estas configurações.
            guidance: Revise ACTIVE_STORAGE_SERVICE e as configurações de implantação do backend selecionado. O disco local precisa de armazenamento persistente compartilhado pelos serviços web e worker. Trocar de backend não migra os arquivos existentes; planeje qualquer migração separadamente.
            issues:
              root: Raiz do armazenamento local
              bucket: Bucket de armazenamento
              region: Região do armazenamento
              credentials: Chave de acesso e chave secreta do armazenamento (informe as duas ou use a descoberta externa de credenciais)
              endpoint: Endpoint do armazenamento (e CLOUDFLARE_ACCOUNT_ID para o R2)
      show:
        title: Saúde do sistema
        tabs:
          hosted_usage: Uso
          background_jobs: Tarefas
          ai: IA
          configuration: Configuração
        alert:
          title: As tarefas em segundo plano não estão sendo executadas
        status_section_title: Status do Sidekiq
        status_section_description: Estado atual do worker em segundo plano responsável pelas sincronizações, saldos e cálculos de patrimônio líquido.
        counters_section_title: Contadores de tarefas
        counters_section_description: Contadores agregados do Sidekiq em todas as filas.
        queues_section_title: Filas
        queues_section_description: Tamanho de cada fila e idade da tarefa mais antiga. A latência é o número de segundos que a tarefa mais antiga está aguardando.
        labels:
          status: Status
          processes: Processos worker
          last_heartbeat: Último sinal de vida
          max_queue_latency: Idade da tarefa mais antiga
          enqueued: Na fila
          retries: Novas tentativas
          failed: Com falha
          processed_total: Total processado
          queue: Fila
          size: Tamanho
          latency: Latência
        values:
          healthy: Saudável
          unhealthy: Degradado
          time_ago: há %{time_ago}
          never: Nunca
          seconds: "%{seconds} s"
          no_queues: Nenhuma fila registrada. O worker pode não estar em execução.
        ai:
          run_checks: Executar verificações novamente
          last_checked: Verificações em tempo real concluídas há %{time_ago}. Os resultados ficam em cache por pouco tempo.
          not_checked_help: Abra diretamente a URL de status da IA ou execute as verificações para confirmar que o serviço está ativo.
          loading: Executando verificações em tempo real…
          alerts:
            custom_openai:
              title: A verificação do vector store hospedado falhou neste endpoint personalizado
              message: O endpoint configurado não passou na verificação de disponibilidade de /v1/vector_stores. A maioria dos endpoints locais e compatíveis com OpenAI não implementa essa API. O chat e o processamento de PDF ainda podem funcionar; para a configuração local habitual, use pgvector com um endpoint de embeddings separado. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            function_calling_unsupported:
              title: O modelo não suporta chamada de funções
              message: O endpoint atendeu a uma requisição de chat simples, mas rejeitou a mesma requisição com o parâmetro tools. O assistente de IA lê contas, transações e posições por meio de chamadas de função, então o chat continuará falhando — muitas vezes com um erro 404 pouco útil — até que seja usado um modelo com suporte a tools. Escolha um modelo cujo provedor documente suporte a chamada de funções. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            function_calling_not_used:
              title: O modelo respondeu sem chamar a ferramenta solicitada
              message: O endpoint aceitou o parâmetro tools, mas o modelo respondeu com texto em vez de chamar a ferramenta de verificação de saúde. O assistente de IA não consegue ler dados financeiros sem chamadas de ferramentas, então o chat pode responder vazio ou com números inventados. Prefira um modelo cujo provedor documente suporte a chamada de funções.
            llm_probe_failed:
              title: A verificação em tempo real do LLM falhou
              message: O Sure não conseguiu verificar o endpoint e o modelo configurados. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            llm_model_not_available:
              title: O modelo de IA configurado não está disponível
              message: O endpoint respondeu, mas não listou nem disponibilizou o modelo configurado. Escolha um modelo ativo para o provedor selecionado e execute as verificações novamente. Para o Gemini por meio de uma camada de tradução compatível com OpenAI, use um modelo atualmente suportado, como gemini-3.8-flash.
            pdf_text_extraction_failed:
              title: A verificação de extração de texto com PDF sintético falhou
              message: O Sure não conseguiu concluir o caminho que prioriza texto, que extrai localmente o texto incorporado ao PDF e o envia ao modelo configurado. Nenhum dado de cliente foi enviado. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            pdf_vision_processing_failed:
              title: A verificação de visão/nativa com PDF sintético falhou
              message: O Sure não conseguiu concluir o caminho de PDF por imagem ou documento nativo com o modelo configurado. Nenhum dado de cliente foi enviado. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            vector_probe_failed:
              title: A verificação em tempo real da busca de documentos falhou
              message: O Sure não conseguiu verificar o vector store selecionado e todos os serviços de embedding necessários. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            pgvector_extension_not_enabled:
              title: A extensão vector do PostgreSQL não está habilitada
              message: O adaptador pgvector está selecionado, mas o PostgreSQL não habilitou a extensão vector para este banco de dados. Use uma imagem do PostgreSQL que inclua o pgvector, habilite a extensão como proprietário do banco de dados ou superusuário e execute as migrações novamente com VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: A tabela vector_store_chunks está ausente
              message: A extensão pgvector está habilitada, mas a tabela de chunks não foi encontrada. Verifique o status das migrações e execute novamente a migração do vector store com VECTOR_STORE_PROVIDER=pgvector para que o Sure possa criar a vector_store_chunks.
            pgvector_probe_failed:
              title: A verificação de armazenamento do pgvector falhou
              message: O Sure não conseguiu consultar a tabela de chunks do pgvector. Verifique as permissões do PostgreSQL, a extensão vector e a migração da vector_store_chunks. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            embedding_dimensions_mismatch:
              title: As dimensões do embedding não correspondem
              message: O endpoint de embedding retornou um vetor cujo tamanho não corresponde a EMBEDDING_DIMENSIONS. Defina EMBEDDING_MODEL e EMBEDDING_DIMENSIONS com o tamanho de vetor documentado do modelo, reinicie o Sure para que o ambiente seja aplicado e, em seguida, altere ou recrie a coluna/tabela de embeddings do pgvector e gere novamente os embeddings dos documentos se os dados existentes usaram outro tamanho.
            embedding_probe_timeout:
              title: A verificação em tempo real do embedding excedeu o tempo limite
              message: O endpoint de embedding não respondeu antes de AI_HEALTH_PROBE_TIMEOUT. Aumente esse tempo limite da verificação de saúde se o provedor for lento e reinicie o Sure para que o ambiente seja aplicado em todos os processos. Se as chamadas normais do chat de IA também excederem o tempo limite, aumente OPENAI_REQUEST_TIMEOUT separadamente.
            embedding_probe_failed:
              title: A verificação em tempo real do embedding falhou
              message: O Sure não conseguiu criar um embedding de teste curto com o endpoint e o modelo configurados. Verifique EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN e os logs do provedor de embeddings. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            qdrant:
              title: O suporte ao Qdrant ainda não foi implementado
              message: O adaptador do Qdrant existe apenas como estrutura inicial, e as operações de envio e busca de documentos falham no momento. Selecione OpenAI ou pgvector para a busca de documentos.
            missing_vector_store:
              title: Nenhum vector store configurado
              message: Os documentos enviados não podem ser indexados nem pesquisados até que um adaptador de vector store e seus requisitos sejam configurados.
            unavailable_vector_store:
              title: O vector store selecionado não está disponível
              message: Verifique os requisitos do adaptador abaixo. Para o pgvector, o banco de dados precisa oferecer a extensão vector ou uma tabela vector_store_chunks já existente.
          llm:
            title: LLM e processamento de PDF
            description: As verificações em tempo real validam o modelo configurado, pedem a ele uma chamada de função trivial como o assistente faz e, separadamente, testam a extração de texto e o processamento por visão/nativo com um PDF sintético de uma página sem dados de clientes. Os valores das credenciais nunca são exibidos.
          vector_store:
            title: Vector store e busca de documentos
            description: A verificação em tempo real consulta a API do vector store hospedado ou testa a tabela do pgvector e cria um embedding curto sem armazená-lo.
          labels:
            selected_provider: Provedor selecionado
            effective_provider: Provedor efetivo
            model: Modelo
            endpoint: Endpoint
            function_calling: Chamada de funções (tools)
            pdf_text_extraction: Caminho de extração de texto do PDF
            pdf_vision_processing: Caminho de visão/nativo do PDF
            llm_request_timeout: Tempo limite de requisição do LLM
            probe_request_timeout: Tempo limite da verificação de saúde
            openai_credentials: Credenciais da OpenAI
            openai_compatible_credentials: Credenciais da API compatível com OpenAI
            anthropic_credentials: Credenciais da Anthropic
            adapter: Adaptador
            adapter_available: Adaptador disponível
            pgvector_extension: Extensão vector do PostgreSQL
            pgvector_table: Tabela de chunks de vetores
            embedding_model: Modelo de embedding
            embedding_endpoint: Endpoint de embedding
