---
pt-BR:
  admin:
    system_health:
      hosted_usage:
        cleanup:
          description: >-
            Corresponde aos critérios de limpeza existentes: assinatura pausada ou
            em teste encerrada há mais de 14 dias, ou família sem assinatura criada
            há mais de 45 + 14 dias. Exibindo até %{limit} famílias.
          disabled: >-
            A limpeza agendada de testes está desativada fora do modo gerenciado.
            Estes registros apenas atendem aos critérios.
          eligibility_help: >-
            Logins recentes não impedem a elegibilidade. Atender aos critérios não
            confirma a exclusão; os 90 dias são o prazo de retenção do arquivo, não
            o limite da limpeza de testes.
          empty: Nenhuma família atende aos critérios de limpeza
          reasons:
            expired_trial_grace_elapsed: Teste encerrado; prazo de carência de 14
              dias esgotado
            no_subscription_grace_elapsed: Sem assinatura; 45 + 14 dias decorridos
          title: Elegibilidade para limpeza
        columns:
          cleanup_eligible: Elegível para limpeza
          cleanup_reason: Motivo
          household: ID da família
          latest_session: Login mais recente mantido
          members: Contas de membros
          recent_sessions: Sessões mantidas criadas nos últimos 30 dias
          recorded_at: Assinatura registrada
          retained_sessions: Sessões de login mantidas
          status: Estado atual
          subscription_rows: Registros de assinatura
          trial_ends_at: Fim do teste
        eligible: Elegível
        limitations: >-
          As tabelas atuais não mantêm o histórico completo de testes, pagamentos
          ou atividade das sessões. A criação de uma assinatura pode refletir uma
          importação. As contas de membros não representam necessariamente pessoas
          distintas verificadas. Esta tela não altera dados de famílias ou assinaturas.
          As redefinições da demonstração compartilhada removem famílias e sessões
          antigas, portanto não é possível reconstruir o histórico de visitantes.
        limitations_title: O que estes números permitem saber
        loading: Carregando o uso da versão hospedada…
        not_eligible: Não elegível
        not_recorded: Não registrado
        snapshot: Retrato do banco de dados, somente para leitura, em %{time}
        statuses:
          active: Ativa
          canceled: Cancelada
          incomplete: Incompleta
          incomplete_expired: Incompleta, expirada
          no_subscription: Sem assinatura
          past_due: Em atraso
          paused: Pausada
          trialing: Em teste
          unknown: Desconhecido
          unpaid: Não paga
        summary:
          active_supporter_households_count: Famílias apoiadoras ativas (local)
          cleanup_eligible_count: Famílias elegíveis para limpeza
          supporter_subscription_count: Registros de assinatura conectados ao Stripe
          trial_households_count: Famílias em teste (últimos 30 dias)
          trial_members_count: Contas atuais de membros em teste
          trials_expiring_soon_count: Testes que expiram nos próximos 7 dias
        summary_help: >-
          Os totais de testes abrangem assinaturas registradas nos últimos 30 dias.
          Os totais de testes a expirar, limpeza e apoiadores abrangem todos os registros
          atuais correspondentes, sem os limites das tabelas.
        supporters:
          description: >-
            Registros locais atuais de assinaturas com IDs de cliente e assinatura
            no formato do Stripe; a assinatura sintética de demonstração é excluída.
            Os estados não confirmam pagamentos recebidos nem datas do primeiro pagamento.
            Nenhuma solicitação é feita ao Stripe.
          empty: Nenhum registro de assinatura conectado ao Stripe
          title: Estado local dos apoiadores
        synthetic_demo: Demonstração sintética
        title: Uso da versão hospedada
        trials:
          description: >-
            Assinaturas registradas desde %{date} que mantêm uma data de término do
            teste, incluindo testes convertidos. Exibindo até %{limit} famílias.
          empty: Nenhuma família em teste registrada neste período
          sessions_help: >-
            As sessões são registros de login mantidos para usuários habilitados,
            não usuários atualmente conectados nem visitas. Sair da conta exclui um
            registro. O horário de criação mais recente não indica a última atividade.
          title: Famílias em teste recentes
      push_notification:
        body: Esta é uma notificação push de teste para a sua conta Sure.
        title: Notificação de teste Sure
      push_notifications:
        columns:
          checked_at: Última atualização
          device: Dispositivo
          environment: Ambiente APNs
          status: Resultado
        device: Dispositivo %{number}
        environments:
          production: Produção
          sandbox: Sandbox
        messages:
          cooldown: Aguarde 30 segundos antes de enviar outro teste.
          disabled: O operador desativou o envio de notificações push.
          enqueue_failed: >-
            Não foi possível colocar o teste na fila. Verifique o Sidekiq e atualize
