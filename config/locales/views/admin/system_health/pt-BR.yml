          time_ago: há %{time_ago}
          unhealthy: Degradado
      verify_worker_ai:
        queued: >-
          Verificação do worker colocada na fila. Ela aparecerá abaixo quando um processo
          worker executar a tarefa, geralmente em poucos segundos.
