            model_not_available: O provedor não retornou o modelo configurado
            no_tool_call: O modelo respondeu sem chamar a ferramenta de verificação de saúde
            tools_refused: O serviço atendeu à mesma requisição sem tools e a recusou com elas
            invalid_response: O serviço retornou uma resposta inesperada
            dimensions_mismatch: As dimensões do vetor de embedding não correspondem às dimensões configuradas
            extension_not_enabled: A extensão vector do PostgreSQL não está habilitada
            table_not_found: A tabela vector_store_chunks não foi encontrada
            render_missing_binary: O renderizador pdftoppm (poppler-utils) não está disponível neste contêiner
            timeout: O serviço não respondeu antes do tempo limite da verificação
            request_failed: A requisição ao serviço falhou
            unsupported_provider: O provedor não suporta esta verificação
          worker:
            title: Verificação do worker
            description: As verificações acima foram executadas a partir deste processo web. A maior parte do trabalho de IA -- respostas do assistente, processamento de PDF, embeddings, categorização automática e detecção de comerciantes -- é executada, na verdade, em um processo worker do Sidekiq, que pode ter acesso de rede, DNS, regras de proxy ou até credenciais carregadas diferentes. Enfileire uma verificação para validar a configuração e a conectividade do próprio worker.
            verify_button: Verificar configuração do worker
            coverage_notice: Cada verificação valida exatamente um processo worker -- aquele que a retirar da fila. Com mais de uma réplica do worker, um resultado aprovado não confirma que todos os workers estão saudáveis; enfileire a verificação novamente para testar outro.
            empty:
              title: Nenhum worker respondeu ainda
              description: Clique em “Verificar configuração do worker” para enfileirar uma verificação assíncrona. O resultado aparecerá aqui assim que um processo worker a executar.
            labels:
              process: Processo worker
              checked_at: Verificado
              configuration: Configuração
            configuration_statuses:
              match: Igual à web
              mismatch: Diferente da web
            statuses:
              passing: Aprovado
              failing: Com falha
              stale: Desatualizado
            settings_origin:
              title: Quais configurações exigem reinicialização?
              database_backed: As configurações de provedor, modelo e chave de API alteradas em Configurações → Auto-hospedagem ficam armazenadas no banco de dados. O rails-settings-cached invalida o cache compartilhado a cada gravação, então tanto a web quanto o worker obtêm o novo valor na próxima requisição ou tarefa enfileirada -- sem necessidade de reinicialização.
              env_backed: A configuração de embeddings, e qualquer valor definido apenas por variável de ambiente, é fixada quando cada contêiner é iniciado. O Rails não pode alterar o ambiente de outro contêiner, então mudar esses valores exige reiniciar ou recriar os serviços web e worker -- e qualquer ferramenta de implantação que reinicie apenas um deles (rollout parcial, um Secret atualizado sem reiniciar o pod) não aplicará a alteração.
          local_setup:
            title: Configuração local recomendada
            description: Execute o LLM pelo seu endpoint local compatível com OpenAI, armazene os vetores dos documentos no pgvector e aponte as configurações de embedding para um endpoint de embeddings compatível com OpenAI. A imagem do PostgreSQL precisa incluir a extensão vector, e as dimensões do embedding precisam corresponder ao modelo selecionado.
