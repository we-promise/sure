            endpoint: Endpoint
            failure_reason: Motivo da falha
            function_calling: Chamadas de funções (ferramentas)
            function_calling_failure_reason: Motivo da falha na chamada de função
            llm_request_timeout: Tempo limite das solicitações ao LLM
            model: Modelo
            openai_compatible_credentials: Credenciais de API compatíveis com OpenAI
            openai_credentials: Credenciais OpenAI
            pdf_text_extraction: Fluxo de extração de texto do PDF
            pdf_text_extraction_failure_reason: Motivo da falha na extração de texto
            pdf_vision_processing: Fluxo de visão/documento nativo do PDF
            pdf_vision_processing_failure_reason: Motivo da falha no processamento
              de visão/documento nativo
            pgvector_extension: Extensão vector do PostgreSQL
            pgvector_table: Tabela de blocos de vetores
            probe_request_timeout: Tempo limite das solicitações de verificação de
              saúde
            selected_provider: Serviço selecionado
            storage_probe: Verificação do armazenamento pgvector
          last_checked: >-
            Verificações em tempo real concluídas há %{time_ago}. Os resultados ficam
            em cache por um breve período.
          llm:
            description: >-
              As verificações em tempo real confirmam o modelo configurado e solicitam
              uma chamada de função simples, como faz o assistente. Depois, testam
              separadamente a extração de texto e o processamento de visão/documento
              nativo com um PDF sintético de uma página, sem dados de clientes. Os
              valores das credenciais nunca são exibidos.
            title: Processamento de LLM e PDF
          loading: Executando verificações em tempo real…
          local_setup:
            description: >-
              Execute o LLM pelo seu endpoint local compatível com OpenAI, armazene
              os vetores dos documentos no pgvector e aponte as configurações de embeddings
              para um endpoint de embeddings compatível com OpenAI. A imagem do PostgreSQL
              deve incluir a extensão vector, e as dimensões dos embeddings devem
              corresponder ao modelo selecionado.
            title: Configuração local recomendada
          not_checked_help: >-
            Abra diretamente o URL de estado da IA ou execute as verificações para
            confirmar que o serviço está operacional.
          pdf_statuses:
            failing: Verificação sintética de PDF falhou
            not_checked: Não verificado
            supported: Verificação sintética de PDF passou
            unavailable: Indisponível até que um provedor de LLM seja configurado
            unsupported: Desativado ou não suportado pelo serviço/modelo efetivo
          probe_statuses:
            failing: A verificação em tempo real falhou
            not_checked: Não verificado
            not_configured: Não configurado
            passing: Verificação em tempo real aprovada
