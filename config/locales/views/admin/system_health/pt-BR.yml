        ai:
          run_checks: Executar verificações novamente
          last_checked: Verificações em tempo real concluídas há %{time_ago}. Os resultados ficam em cache por pouco tempo.
          not_checked_help: Abra diretamente a URL de status da IA ou execute as verificações para confirmar que o serviço está ativo.
          alerts:
            custom_openai:
              title: A verificação do vector store hospedado falhou neste endpoint personalizado
              message: O endpoint configurado não passou na verificação de disponibilidade de /v1/vector_stores. A maioria dos endpoints locais e compatíveis com OpenAI não implementa essa API. O chat e o processamento de PDF ainda podem funcionar; para a configuração local habitual, use pgvector com um endpoint de embeddings separado. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            function_calling_unsupported:
              title: O modelo não suporta chamada de funções
              message: O endpoint atendeu a uma requisição de chat simples, mas rejeitou a mesma requisição com o parâmetro tools. O assistente de IA lê contas, transações e posições por meio de chamadas de função, então o chat continuará falhando — muitas vezes com um erro 404 pouco útil — até que seja usado um modelo com suporte a tools. Escolha um modelo cujo provedor documente suporte a chamada de funções. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            function_calling_not_used:
              title: O modelo respondeu sem chamar a ferramenta solicitada
              message: O endpoint aceitou o parâmetro tools, mas o modelo respondeu com texto em vez de chamar a ferramenta de verificação de saúde. O assistente de IA não consegue ler dados financeiros sem chamadas de ferramentas, então o chat pode responder vazio ou com números inventados. Prefira um modelo cujo provedor documente suporte a chamada de funções.
            llm_probe_failed:
              title: A verificação em tempo real do LLM falhou
              message: O Sure não conseguiu verificar o endpoint e o modelo configurados. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            llm_model_not_available:
              title: O modelo de IA configurado não está disponível
              message: O endpoint respondeu, mas não listou nem disponibilizou o modelo configurado. Escolha um modelo ativo para o provedor selecionado e execute as verificações novamente. Para o Gemini por meio de uma camada de tradução compatível com OpenAI, use um modelo atualmente suportado, como gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: A verificação de extração de texto com PDF sintético falhou
              message: O Sure não conseguiu concluir o caminho que prioriza texto, que extrai localmente o texto incorporado ao PDF e o envia ao modelo configurado. Nenhum dado de cliente foi enviado. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            pdf_vision_processing_failed:
              title: A verificação de visão/nativa com PDF sintético falhou
              message: O Sure não conseguiu concluir o caminho de PDF por imagem ou documento nativo com o modelo configurado. Nenhum dado de cliente foi enviado. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            vector_probe_failed:
              title: A verificação em tempo real da busca de documentos falhou
              message: O Sure não conseguiu verificar o vector store selecionado e todos os serviços de embedding necessários. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            pgvector_extension_not_enabled:
              title: A extensão vector do PostgreSQL não está habilitada
              message: O adaptador pgvector está selecionado, mas o PostgreSQL não habilitou a extensão vector para este banco de dados. Use uma imagem do PostgreSQL que inclua o pgvector, habilite a extensão como proprietário do banco de dados ou superusuário e execute as migrações novamente com VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: A tabela vector_store_chunks está ausente
              message: A extensão pgvector está habilitada, mas a tabela de chunks não foi encontrada. Verifique o status das migrações e execute novamente a migração do vector store com VECTOR_STORE_PROVIDER=pgvector para que o Sure possa criar a vector_store_chunks.
            pgvector_probe_failed:
              title: A verificação de armazenamento do pgvector falhou
              message: O Sure não conseguiu consultar a tabela de chunks do pgvector. Verifique as permissões do PostgreSQL, a extensão vector e a migração da vector_store_chunks. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            embedding_dimensions_mismatch:
              title: As dimensões do embedding não correspondem
              message: O endpoint de embedding retornou um vetor cujo tamanho não corresponde a EMBEDDING_DIMENSIONS. Defina EMBEDDING_MODEL e EMBEDDING_DIMENSIONS com o tamanho de vetor documentado do modelo, reinicie o Sure para que o ambiente seja aplicado e, em seguida, altere ou recrie a coluna/tabela de embeddings do pgvector e gere novamente os embeddings dos documentos se os dados existentes usaram outro tamanho.
            embedding_probe_timeout:
              title: A verificação em tempo real do embedding excedeu o tempo limite
              message: O endpoint de embedding não respondeu antes de AI_HEALTH_PROBE_TIMEOUT. Aumente esse tempo limite da verificação de saúde se o provedor for lento e reinicie o Sure para que o ambiente seja aplicado em todos os processos. Se as chamadas normais do chat de IA também excederem o tempo limite, aumente OPENAI_REQUEST_TIMEOUT separadamente.
            embedding_probe_failed:
              title: A verificação em tempo real do embedding falhou
              message: O Sure não conseguiu criar um embedding de teste curto com o endpoint e o modelo configurados. Verifique EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN e os logs do provedor de embeddings. A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
            qdrant:
              title: O suporte ao Qdrant ainda não foi implementado
              message: O adaptador do Qdrant existe apenas como estrutura inicial, e as operações de envio e busca de documentos falham no momento. Selecione OpenAI ou pgvector para a busca de documentos.
            missing_vector_store:
              title: Nenhum vector store configurado
              message: Os documentos enviados não podem ser indexados nem pesquisados até que um adaptador de vector store e seus requisitos sejam configurados.
            unavailable_vector_store:
              title: O vector store selecionado não está disponível
              message: Verifique os requisitos do adaptador abaixo. Para o pgvector, o banco de dados precisa oferecer a extensão vector ou uma tabela vector_store_chunks já existente.
          llm:
            title: LLM e processamento de PDF
            description: As verificações em tempo real validam o modelo configurado, pedem a ele uma chamada de função trivial como o assistente faz e, separadamente, testam a extração de texto e o processamento por visão/nativo com um PDF sintético de uma página sem dados de clientes. Os valores das credenciais nunca são exibidos.
          vector_store:
            title: Vector store e busca de documentos
            description: A verificação em tempo real consulta a API do vector store hospedado ou testa a tabela do pgvector e cria um embedding curto sem armazená-lo.
