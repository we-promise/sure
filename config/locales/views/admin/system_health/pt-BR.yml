          no_devices: >-
            Ative as notificações push no aplicativo iOS Sure para esta conta para
            enviar um teste.
          not_configured: As credenciais APNs não estão configuradas.
          queued: >-
            Notificação de teste na fila. Atualize os resultados abaixo para consultar
            o estado.
          ready: >-
            Envie uma notificação de teste para os dispositivos iOS ativados e registrados
            na sua conta.
          storage_unavailable: >-
            Não foi possível salvar a solicitação de teste. Verifique a configuração
            do cache compartilhado.
        pending: Pendente
        queueing: Colocando na fila…
        refresh: Atualizar resultados
        requested_at: Último teste pedido em %{time}
        result_help: >-
          A aceitação pelo APNs não confirma a entrega no dispositivo. Atualize para
          ver os resultados do worker. Os resultados são salvos durante 24 horas.
        results_label: Resultados do teste
        send_test: Enviar notificação de teste
        statuses:
          accepted: Aceito pelo APNs
          enqueue_failed: Não foi possível colocar na fila; verifique o Sidekiq
          expired: Expirou sem resultado final
          failed: Falhou; consulte os registros push
          queued: Na fila
          rejected: Rejeitado pelo APNs; consulte os registros push
          retrying: Tentando novamente após uma falha temporária
          skipped: 'Ignorado: já não é elegível'
          unregistered: O registro do dispositivo já não é válido
        title: Notificações push
      show:
        ai:
          adapters:
            openai: Armazenamento de vetores hospedado pela OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: >-
                O endpoint configurado não passou na verificação de funcionamento
                /v1/vector_stores. A maioria dos endpoints locais e compatíveis com
                OpenAI não implementa essa API. O chat e o processamento de PDF podem
                continuar a funcionar; para a configuração local habitual, utilize
                pgvector com um endpoint de embeddings separado. A falha foi registrada
                em Configurações → Registros de depuração e no Rails.logger.
              title: >-
                A verificação do armazenamento de vetores hospedado falhou neste endpoint
                personalizado
            embedding_dimensions_mismatch:
              message: >-
                O endpoint de embeddings retornou um vetor cujo comprimento não corresponde
                a EMBEDDING_DIMENSIONS. Defina EMBEDDING_MODEL e EMBEDDING_DIMENSIONS
                conforme o tamanho do vetor documentado para o modelo e reinicie o
                Sure para aplicar as variáveis de ambiente. Depois, altere ou recrie
                a coluna/tabela de embeddings do pgvector e gere novamente os embeddings
                dos documentos se os dados existentes usavam outro tamanho.
              title: As dimensões dos embeddings não correspondem
            embedding_probe_failed:
              message: >-
                O Sure não conseguiu criar um embedding curto de teste com o endpoint
                e o modelo configurados. Verifique EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN e os logs do provedor de embeddings. A falha
                foi registrada em Configurações → Logs de depuração e no Rails.logger.
              title: A verificação em tempo real dos embeddings falhou
            embedding_probe_timeout:
              message: >-
                O endpoint de embeddings não respondeu dentro do prazo de AI_HEALTH_PROBE_TIMEOUT.
                Aumente esse tempo limite de verificação se o provedor for lento e
                reinicie o Sure para aplicar as variáveis de ambiente em todos os
                processos. Se as chamadas normais do chat com IA também excederem
                o tempo limite, aumente OPENAI_REQUEST_TIMEOUT separadamente.
              title: A verificação em tempo real dos embeddings excedeu o tempo limite
            function_calling_not_used:
              message: >-
                O endpoint aceitou o parâmetro tools, mas o modelo respondeu com texto
                em vez de chamar a ferramenta de verificação. O assistente de IA não
                consegue ler dados financeiros sem chamar ferramentas, por isso o
                chat pode responder sem dados ou com valores inventados. Prefira um
                modelo cujo provedor documente o suporte a chamadas de funções.
              title: O modelo respondeu sem chamar a ferramenta solicitada
            function_calling_unsupported:
              message: >-
                O endpoint atendeu a uma solicitação simples de chat, mas rejeitou
                a mesma solicitação com o parâmetro tools. O assistente de IA lê contas,
                transações e posições por meio de chamadas de funções, portanto o
                chat continuará falhando — muitas vezes com um erro 404 pouco esclarecedor
                — até que seja usado um modelo compatível com ferramentas. Escolha
                um modelo cujo provedor documente o suporte a chamadas de funções.
                A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
              title: O modelo não oferece suporte a chamadas de funções
            llm_model_not_available:
              message: >-
                O endpoint respondeu, mas não listou nem disponibilizou o modelo configurado.
                Escolha um modelo ativo do provedor selecionado e execute as verificações
                novamente. Para usar o Gemini por uma camada de compatibilidade com
                a OpenAI, escolha um modelo com suporte atual, como gemini-2.5-flash.
              title: O modelo de IA configurado não está disponível
            llm_probe_failed:
              message: >-
                O Sure não conseguiu verificar tanto o endpoint como o modelo configurados.
                A falha foi registrada em Configurações → Registros de depuração e
                no Rails.logger.
              title: A verificação em tempo real do LLM falhou
            missing_vector_store:
              message: >-
                Os documentos enviados não podem ser indexados nem pesquisados até
                que um adaptador de armazenamento de vetores e seus requisitos sejam
                configurados.
              title: Não existe nenhum armazenamento de vetores configurado
            pdf_text_extraction_failed:
              message: >-
                O Sure não conseguiu concluir o fluxo que extrai localmente o texto
                incorporado ao PDF e o envia ao modelo configurado. Nenhum dado de
                clientes foi enviado. A falha foi registrada em Configurações → Logs
                de depuração e no Rails.logger.
              title: A verificação sintética de extração de texto de PDF falhou
            pdf_vision_processing_failed:
              message: >-
                O Sure não conseguiu concluir o fluxo de processamento do PDF como
                imagem ou documento nativo com o modelo configurado. Nenhum dado de
                clientes foi enviado. A falha foi registrada em Configurações → Logs
                de depuração e no Rails.logger.
              title: A verificação de visão/documento nativo com PDF sintético falhou
            pgvector_extension_not_enabled:
              message: >-
                O adaptador pgvector está selecionado, mas a extensão vector não está
                habilitada neste banco de dados PostgreSQL. Use uma imagem do PostgreSQL
                que inclua o pgvector, habilite a extensão como proprietário do banco
                ou superusuário e execute novamente as migrações com VECTOR_STORE_PROVIDER=pgvector.
              title: A extensão vector do PostgreSQL não está habilitada
            pgvector_probe_failed:
              message: >-
                O Sure não conseguiu consultar a tabela de trechos do pgvector. Verifique
                as permissões do PostgreSQL, a extensão vector e a migração vector_store_chunks.
                A falha foi registrada em Configurações → Logs de depuração e no Rails.logger.
              title: A verificação do armazenamento pgvector falhou
            pgvector_table_not_found:
              message: >-
                A extensão pgvector está habilitada, mas a tabela de trechos não foi
                encontrada. Verifique o estado das migrações e execute novamente a
                migração do armazenamento de vetores com VECTOR_STORE_PROVIDER=pgvector
                para que o Sure possa criar vector_store_chunks.
              title: A tabela vector_store_chunks está ausente
            qdrant:
              message: >-
                O adaptador Qdrant está estruturado, mas as operações de envio e pesquisa
                de documentos falham atualmente. Selecione OpenAI ou pgvector para
                a pesquisa de documentos.
              title: O suporte para Qdrant ainda não está implementado
            unavailable_vector_store:
              message: >-
                Verifique os requisitos do adaptador abaixo. Para o pgvector, o banco
                de dados deve oferecer a extensão vector ou uma tabela vector_store_chunks
                existente.
              title: O armazenamento de vetores selecionado está indisponível
            vector_probe_failed:
              message: >-
                O Sure não conseguiu verificar o armazenamento de vetores selecionado
                e todos os serviços de embeddings exigidos. A falha foi registrada
                em Configurações → Registros de depuração e no Rails.logger.
              title: A verificação em tempo real da pesquisa de documentos falhou
          failure_codes:
            dimensions_mismatch: >-
              As dimensões dos vetores de embeddings não correspondem às dimensões
              configuradas
            extension_not_enabled: A extensão vector do PostgreSQL não está ativada
            invalid_response: O serviço devolveu uma resposta inesperada
            model_not_available: O modelo configurado não foi devolvido pelo serviço
