            openai_compatible: Compatível com OpenAI
            openrouter: OpenRouter
            together: Together
          run_checks: Executar verificações novamente
          values:
            available: Disponível
            available_not_enabled: Disponível, não ativado
            configured: Configurado
            enabled: Ativado
            fallback: "(alternativa)"
            'no': Não
            not_available: Não disponível
            not_configured: Não configurado
            not_found: Não encontrado
            not_set: Não definido
            'yes': Sim
          vector_statuses:
            failing: A verificação em tempo real falhou
            missing: Não configurado
            not_checked: Não verificado
            not_configured: Não configurado
            passing: Verificações em tempo real aprovadas
            scaffolded: Estrutura inicial disponível
          vector_store:
            description: >-
              A verificação em tempo real consulta a API do armazenamento de vetores
              hospedado ou testa a tabela pgvector e cria um embedding curto sem armazená-lo.
            title: Armazenamento de vetores e pesquisa de documentos
          worker:
            configuration_statuses:
              match: Igual à configuração web
              mismatch: Diferente da configuração web
            coverage_notice: >-
              Cada verificação examina exatamente um processo worker: aquele que retirar
              a tarefa da fila. Se houver mais de uma réplica de worker, um resultado
              aprovado não confirma que todos estejam saudáveis; coloque outra verificação
              na fila para testar outro processo.
            description: >-
              As verificações acima foram executadas neste processo web. A maior parte
              do trabalho de IA — respostas do assistente, processamento de PDFs,
              embeddings, categorização automática e identificação de estabelecimentos
              — é executada em um processo worker do Sidekiq, que pode ter acesso
              à rede, DNS, regras de proxy ou até credenciais carregadas diferentes.
              Coloque uma verificação na fila para testar a configuração e a conectividade
              do próprio worker.
            empty:
              description: >-
                Clique em "Verificar configuração do worker" para colocar uma verificação
                assíncrona na fila. O resultado aparecerá aqui quando um processo
                worker executar a tarefa.
              title: Nenhum worker retornou uma verificação ainda
            labels:
              checked_at: Verificado
              configuration: Configuração
              process: Processo worker
            settings_origin:
              database_backed: >-
                As configurações de provedor, modelo e chave de API alteradas em Configurações
                → Hospedagem própria são armazenadas no banco de dados. O rails-settings-cached
                invalida o cache compartilhado ao gravar, então tanto o processo web
                quanto o worker usam o novo valor na próxima solicitação ou tarefa
                da fila, sem precisar reiniciar.
              env_backed: >-
                A configuração de embeddings e qualquer valor definido apenas por
                variável de ambiente são fixados quando cada contêiner inicia. O Rails
                não pode alterar o ambiente de outro contêiner, portanto essas mudanças
                exigem reiniciar ou recriar os serviços web e worker. Ferramentas
                de implantação que reiniciem apenas um deles (implantação parcial
                ou atualização de um Secret sem reiniciar o pod) não aplicarão a alteração
                em todos os processos.
              title: Quais configurações exigem reinicialização?
            statuses:
              failing: Com falha
              passing: Aprovado
              stale: Desatualizado
            title: Verificação do worker
            verify_button: Verificar configuração do worker
        alert:
          title: As tarefas em segundo plano não estão sendo executadas
        counters_section_description: Contadores agregados do Sidekiq em todas as
