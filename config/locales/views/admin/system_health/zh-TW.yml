        ai:
          run_checks: 重新執行檢查
          last_checked: 即時檢查已於 %{time_ago}前完成。結果會短暫快取。
          not_checked_help: 直接開啟 AI 狀態網址，或執行檢查來確認服務是否運作中。
          alerts:
            custom_openai:
              title: 這個自訂端點的代管向量儲存庫檢查失敗
              message: 設定的端點沒有通過 /v1/vector_stores 存活檢查。大多數本機與 OpenAI 相容端點都沒有實作這個 API。聊天與 PDF 處理可能仍可正常運作；一般的本機設定請改用 pgvector 搭配獨立的 embedding 端點。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            function_calling_unsupported:
              title: 此模型不支援函式呼叫
              message: 端點能處理一般聊天請求，但拒絕了帶有 tools 參數的相同請求。AI 助理是透過函式呼叫讀取帳戶、交易與持股，因此在改用支援 tools 的模型之前，聊天會一直失敗（常常只回傳沒什麼幫助的 404）。請選擇供應商文件明確支援函式呼叫的模型。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            function_calling_not_used:
              title: 模型沒有呼叫要求的工具就直接回答
              message: 端點接受了 tools 參數，但模型以文字回覆，沒有呼叫健康檢查工具。AI 助理若無法呼叫工具就讀不到財務資料，因此聊天可能沒有回應或捏造數字。建議選擇供應商文件明確支援函式呼叫的模型。
            llm_probe_failed:
              title: LLM 即時檢查失敗
              message: Sure 無法同時驗證設定的端點與模型。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            llm_model_not_available:
              title: 設定的 AI 模型無法使用
              message: 端點有回應，但沒有列出或提供設定的模型。請為所選供應商挑選一個可用的模型，然後重新執行檢查。若是透過 OpenAI 相容轉接層使用 Gemini，請使用目前支援的模型，例如 gemini-2.5-flash。
            pdf_text_extraction_failed:
              title: 合成 PDF 文字擷取檢查失敗
              message: Sure 無法完成「文字優先」流程：在本機擷取 PDF 內嵌文字，再傳送給設定的模型。沒有傳送任何客戶資料。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            pdf_vision_processing_failed:
              title: 合成 PDF 視覺／原生檢查失敗
              message: Sure 無法透過設定的模型完成圖片或原生文件 PDF 流程。沒有傳送任何客戶資料。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            vector_probe_failed:
              title: 文件搜尋即時檢查失敗
              message: Sure 無法驗證所選的向量儲存庫以及所有必要的 embedding 服務。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            pgvector_extension_not_enabled:
              title: PostgreSQL vector 擴充功能尚未啟用
              message: 已選擇 pgvector 轉接器，但 PostgreSQL 尚未為這個資料庫啟用 vector 擴充功能。請使用內含 pgvector 的 PostgreSQL 映像檔，再以資料庫擁有者或 superuser 身分啟用該擴充功能，並以 VECTOR_STORE_PROVIDER=pgvector 重新執行 migration。
            pgvector_table_not_found:
              title: 缺少 vector_store_chunks 資料表
              message: pgvector 擴充功能已啟用，但找不到 chunks 資料表。請檢查 migration 狀態，然後以 VECTOR_STORE_PROVIDER=pgvector 重新執行向量儲存庫的 migration，讓 Sure 建立 vector_store_chunks。
            pgvector_probe_failed:
              title: pgvector 儲存檢查失敗
              message: Sure 無法查詢 pgvector 的 chunks 資料表。請檢查 PostgreSQL 權限、vector 擴充功能以及 vector_store_chunks migration。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            embedding_dimensions_mismatch:
              title: Embedding 維度不符
              message: Embedding 端點回傳的向量長度與 EMBEDDING_DIMENSIONS 不符。請將 EMBEDDING_MODEL 與 EMBEDDING_DIMENSIONS 設為該模型文件所列的向量大小，重新啟動 Sure 讓環境設定生效；若既有資料使用不同大小，還需要修改或重建 pgvector 的 embedding 欄位／資料表，並重新為文件產生 embedding。
            embedding_probe_timeout:
              title: Embedding 即時檢查逾時
              message: Embedding 端點未在 AI_HEALTH_PROBE_TIMEOUT 之前回應。如果供應商速度較慢，請調高這個健康檢查逾時，然後重新啟動 Sure，讓每個處理程序都套用新的環境設定。如果一般 AI 聊天呼叫也會逾時，請另外調高 OPENAI_REQUEST_TIMEOUT。
            embedding_probe_failed:
              title: Embedding 即時檢查失敗
              message: Sure 無法透過設定的端點與模型建立簡短的測試 embedding。請檢查 EMBEDDING_URI_BASE、EMBEDDING_MODEL、EMBEDDING_ACCESS_TOKEN 以及 embedding 供應商的紀錄。這次失敗已記錄在「設定 → 偵錯紀錄」與 Rails.logger。
            qdrant:
              title: 尚未實作 Qdrant 支援
              message: Qdrant 轉接器目前只有基本架構，文件上傳與搜尋操作都會失敗。請改選 OpenAI 或 pgvector 來進行文件搜尋。
            missing_vector_store:
              title: 尚未設定向量儲存庫
              message: 在設定好向量儲存庫轉接器及其需求之前，上傳的文件無法建立索引或被搜尋。
            unavailable_vector_store:
              title: 所選的向量儲存庫無法使用
              message: 請檢查下方的轉接器需求。若使用 pgvector，資料庫必須提供 vector 擴充功能，或已有 vector_store_chunks 資料表。
          llm:
            title: LLM 與 PDF 處理
            description: 即時檢查會驗證設定的模型，並像 AI 助理一樣要求它執行一次簡單的函式呼叫，接著再用一份不含任何客戶資料的單頁合成 PDF，分別測試文字擷取與視覺／原生處理。憑證內容絕不會顯示。
          vector_store:
            title: 向量儲存庫與文件搜尋
            description: 即時檢查會查詢代管的向量儲存庫 API，或測試 pgvector 資料表並建立一筆不會儲存的簡短 embedding。
