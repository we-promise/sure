          worker:
            title: Worker 驗證
            description: 上方的檢查是從這個 web 處理程序執行的。但大多數 AI 工作——助理回覆、PDF 處理、embedding、自動分類與商家偵測——其實是在 Sidekiq worker 處理程序中執行，而 worker 的網路存取、DNS、proxy 規則，甚至載入的憑證都可能不同。排入一次檢查，即可驗證 worker 本身的設定與連線。
            verify_button: 驗證 worker 設定
            coverage_notice: 每次檢查只會驗證一個 worker 處理程序，也就是取出該工作的那一個。若有多個 worker 副本，檢查通過並不代表每個 worker 都正常；請再排入一次檢查以抽查其他 worker。
            empty:
              title: 還沒有 worker 回報
              description: 點擊「驗證 worker 設定」即可排入非同步檢查。worker 處理程序接手後，結果就會顯示在這裡。
            labels:
              process: Worker 處理程序
              checked_at: 檢查時間
              configuration: 設定
            configuration_statuses:
              match: 與 web 一致
              mismatch: 與 web 不同
            statuses:
              passing: 通過
              failing: 失敗
              stale: 已過時
            settings_origin:
              title: 哪些設定需要重新啟動？
              database_backed: 在「設定 → 自行代管」中變更的供應商、模型與 API 金鑰設定會儲存在資料庫。rails-settings-cached 會在寫入時讓共用快取失效，因此 web 與 worker 在下一個請求或排入的工作中都會讀到新值——不需要重新啟動。
              env_backed: Embedding 設定，以及任何只透過環境變數設定的值，都會在各容器啟動時固定。Rails 無法變更其他容器的環境，因此變更這些設定需要重新啟動或重建 web 與 worker 兩個服務——任何只重新啟動其中一個的部署工具（部分推出、更新了 Secret 卻沒有重啟 pod）都不會套用變更。
          local_setup:
            title: 建議的本機設定
            description: 透過本機的 OpenAI 相容端點執行 LLM，將文件向量儲存在 pgvector，並把 embedding 設定指向 OpenAI 相容的 embeddings 端點。PostgreSQL 映像檔必須包含 vector 擴充功能，且 embedding 維度必須與所選模型相符。
