            settings_origin:
              database_backed: >-
                在「設定 → 自行架設」中變更的供應商、模型與 API 金鑰會儲存在資料庫。rails-settings-cached 會在寫入時使共用快取失效，因此網頁與背景程序在下一個請求或佇列工作就會讀取新值，無需重新啟動。
              env_backed: >-
                嵌入設定及僅透過環境變數設定的值，會在每個容器啟動時固定。Rails 無法變更其他容器的環境，因此修改後必須重新啟動或重建網頁與背景服務。只重新啟動其中一項的部署工具（部分部署、更新
                Secret 卻未重新啟動 Pod）無法完整套用變更。
              title: 哪些設定需要重新啟動？
