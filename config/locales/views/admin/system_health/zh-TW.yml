            description: >-
              上方檢查由此網頁程序執行。大多數 AI 工作（助理回覆、PDF 處理、嵌入、自動分類與商家辨識）實際在 Sidekiq 背景程序中執行，其網路存取、DNS、代理規則，甚至載入的憑證都可能不同。請將檢查加入佇列，驗證背景程序本身的設定與連線。
