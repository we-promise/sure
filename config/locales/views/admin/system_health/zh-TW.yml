      show:
        ai:
          adapters:
            openai: OpenAI 代管向量儲存
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: >-
                設定的端點未通過 /v1/vector_stores 存活檢查。多數本機與 OpenAI 相容端點並未實作此 API。聊天和 PDF 處理可能仍可使用；一般本機設定請使用
                pgvector 搭配獨立的嵌入端點。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: 此自訂端點的代管向量儲存檢查失敗
            embedding_dimensions_mismatch:
              message: >-
                嵌入端點回傳的向量長度與 EMBEDDING_DIMENSIONS 不符。請依模型文件中的向量大小設定 EMBEDDING_MODEL 與 EMBEDDING_DIMENSIONS，重新啟動
                Sure 以套用環境設定。若既有資料使用不同大小，還需修改或重建 pgvector 嵌入欄位／資料表，並重新產生文件嵌入。
              title: 嵌入維度不符
            embedding_probe_failed:
              message: >-
                Sure 無法透過設定的端點與模型建立簡短測試嵌入。請檢查 EMBEDDING_URI_BASE、EMBEDDING_MODEL、EMBEDDING_ACCESS_TOKEN
                及嵌入服務供應商日誌。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: 嵌入服務即時檢查失敗
            embedding_probe_timeout:
              message: >-
                嵌入端點未在 AI_HEALTH_PROBE_TIMEOUT 時限內回應。若供應商回應較慢，請提高此健康檢查逾時值，再重新啟動 Sure，讓每個程序套用環境設定。若一般 AI
                聊天呼叫也逾時，請另外提高 OPENAI_REQUEST_TIMEOUT。
              title: 嵌入服務即時檢查逾時
            function_calling_not_used:
              message: 端點接受 tools 參數，但模型回覆文字而未呼叫健康檢查工具。AI 助理必須透過工具呼叫才能讀取財務資料，因此聊天可能沒有答案，或提供虛構數字。建議選用供應商文件明確支援函式呼叫的模型。
              title: 模型直接回答，未依要求呼叫工具
            function_calling_unsupported:
              message: >-
                端點可處理一般聊天請求，卻拒絕相同但帶有 tools 參數的請求。AI 助理透過函式呼叫讀取帳戶、交易與持有部位，因此在改用支援工具的模型前，聊天會持續失敗，且常只顯示無助於診斷的
                404。請選用供應商文件明確支援函式呼叫的模型。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: 模型不支援函式呼叫
            llm_model_not_available:
              message: 端點已有回應，但未列出或提供設定的模型。請為所選供應商選擇可用模型，再重新檢查。若 Gemini 經由 OpenAI 相容轉接層使用，請選擇目前支援的模型，例如
                gemini-2.5-flash。
              title: 設定的 AI 模型不可用
            llm_probe_failed:
              message: Sure 無法同時驗證設定的端點與模型。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: LLM 即時檢查失敗
            missing_vector_store:
              message: 必須先設定向量儲存介接器及其必要條件，才能為上傳的文件建立索引與搜尋。
              title: 尚未設定向量儲存
            pdf_text_extraction_failed:
              message: Sure 無法完成文字優先流程，也就是在本機擷取 PDF 內嵌文字後傳送給設定的模型。未傳送任何客戶資料。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: 合成 PDF 文字擷取檢查失敗
            pdf_vision_processing_failed:
              message: Sure 無法透過設定的模型完成影像或原生文件 PDF 處理流程。未傳送任何客戶資料。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: 合成 PDF 視覺／原生處理檢查失敗
            pgvector_extension_not_enabled:
              message: >-
                已選擇 pgvector 介接器，但 PostgreSQL 尚未為此資料庫啟用 vector 擴充套件。請使用包含 pgvector 的 PostgreSQL 映像檔，以資料庫擁有者或超級使用者身分啟用擴充套件，再以
                VECTOR_STORE_PROVIDER=pgvector 重新執行資料庫遷移。
              title: PostgreSQL vector 擴充套件尚未啟用
            pgvector_probe_failed:
              message: >-
                Sure 無法查詢 pgvector 區塊資料表。請檢查 PostgreSQL 權限、vector 擴充套件及 vector_store_chunks 遷移。失敗已記錄於「設定
                → 偵錯日誌」與 Rails.logger。
              title: pgvector 儲存檢查失敗
            pgvector_table_not_found:
              message: >-
                pgvector 擴充套件已啟用，但找不到區塊資料表。請檢查遷移狀態，再以 VECTOR_STORE_PROVIDER=pgvector 重新執行向量儲存遷移，讓 Sure
                建立 vector_store_chunks。
              title: 缺少 vector_store_chunks 資料表
            qdrant:
              message: Qdrant 介接器目前只有基本架構，文件上傳與搜尋操作仍會失敗。請選擇 OpenAI 或 pgvector 進行文件搜尋。
              title: 尚未實作 Qdrant 支援
            unavailable_vector_store:
              message: 請檢查下方介接器需求。使用 pgvector 時，資料庫必須提供 vector 擴充套件，或已有 vector_store_chunks 資料表。
              title: 所選向量儲存不可用
            vector_probe_failed:
              message: Sure 無法驗證所選向量儲存及所有必要的嵌入服務。失敗已記錄於「設定 → 偵錯日誌」與 Rails.logger。
              title: 文件搜尋即時檢查失敗
          failure_codes:
            dimensions_mismatch: 嵌入向量維度與設定的維度不符
