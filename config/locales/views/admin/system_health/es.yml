            labels:
              checked_at: Comprobados
              configuration: Configuración
              process: Proceso de trabajo
            statuses:
              stale: Desactualizada
              failing: Con fallos
              passing: Correcto
            configuration_statuses:
              match: Coincide con el proceso web
              mismatch: Difiere del proceso web
            coverage_notice: 'Cada comprobación verifica exactamente un proceso de trabajo: el que la extraiga de la cola. Con varias réplicas de trabajadores, un resultado correcto no confirma que todos funcionen bien; vuelve a poner la comprobación en cola para muestrear otro.'
            description: Las comprobaciones anteriores se ejecutaron desde este proceso web. La mayor parte del trabajo de IA —respuestas del asistente, procesamiento de PDF, embeddings, clasificación automática y detección de comercios— se ejecuta realmente en un proceso de trabajo de Sidekiq, que puede tener un acceso de red, DNS, reglas de proxy o incluso credenciales cargadas diferentes. Pon una comprobación en cola para verificar la configuración y conectividad propias de un trabajador.
            empty:
              description: Haz clic en «Verificar configuración del trabajador» para poner una comprobación asíncrona en cola. El resultado aparecerá aquí cuando un proceso de trabajo la recoja.
              title: Todavía no se ha recibido ninguna comprobación de un trabajador
            settings_origin:
              database_backed: Los ajustes de proveedor, modelo y clave API modificados en Ajustes → Autoalojamiento se almacenan en la base de datos. rails-settings-cached invalida la caché compartida al escribir, por lo que tanto el proceso web como el trabajador obtienen el nuevo valor en la siguiente solicitud o tarea en cola, sin necesidad de reiniciar.
              env_backed: La configuración de embeddings y cualquier valor establecido solo mediante una variable de entorno quedan fijados al iniciar cada contenedor. Rails no puede cambiar el entorno de otro contenedor, así que estos cambios requieren reiniciar o recrear tanto el servicio web como el de trabajadores. Las herramientas de despliegue que solo reinicien uno (despliegue parcial o actualización de un Secret sin reiniciar el pod) no aplicarán el cambio en ambos.
              title: "¿Qué ajustes requieren reiniciar?"
            title: Verificación del trabajador
            verify_button: Verificar configuración del trabajador
          adapters:
            openai: Almacén vectorial alojado en OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: El endpoint configurado no ha superado la comprobación de disponibilidad de /v1/vector_stores. La mayoría de los endpoints locales y compatibles con OpenAI no implementan esa API. El chat y el procesamiento de PDF pueden seguir funcionando; para una configuración local habitual, utiliza pgvector con un endpoint de embeddings independiente. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación del almacén vectorial alojado ha fallado en este endpoint personalizado
            embedding_dimensions_mismatch:
              message: El endpoint de embeddings ha devuelto un vector cuya longitud no coincide con EMBEDDING_DIMENSIONS. Configura EMBEDDING_MODEL y EMBEDDING_DIMENSIONS según el tamaño de vector documentado del modelo, reinicia Sure para aplicar el entorno y después modifica o vuelve a crear la columna o tabla de embeddings de pgvector. Si los datos existentes usaban otro tamaño, vuelve a generar los embeddings de los documentos.
              title: Las dimensiones de los embeddings no coinciden
            embedding_probe_failed:
              message: Sure no ha podido crear un embedding breve de prueba mediante el endpoint y el modelo configurados. Comprueba EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN y los registros del proveedor de embeddings. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación en vivo de embeddings ha fallado
            embedding_probe_timeout:
              message: El endpoint de embeddings no respondió antes de AI_HEALTH_PROBE_TIMEOUT. Aumenta ese tiempo de espera si el proveedor es lento y reinicia Sure para aplicar el entorno en todos los procesos. Si las llamadas normales del chat de IA también agotan el tiempo, aumenta OPENAI_REQUEST_TIMEOUT por separado.
              title: La comprobación en vivo de embeddings ha agotado el tiempo de espera
            function_calling_not_used:
              message: El endpoint aceptó el parámetro tools, pero el modelo respondió con texto en lugar de llamar a la herramienta de comprobación. El asistente de IA no puede leer datos financieros sin llamadas a herramientas, por lo que el chat puede no responder o inventar cifras. Elige preferentemente un modelo cuyo proveedor documente compatibilidad con llamadas a funciones.
              title: El modelo respondió sin llamar a la herramienta solicitada
            function_calling_unsupported:
              message: El endpoint atendió una solicitud de chat simple, pero rechazó la misma solicitud con el parámetro tools. El asistente de IA lee cuentas, transacciones y posiciones mediante llamadas a funciones, por lo que el chat seguirá fallando, a menudo con un error 404 poco útil, hasta que el modelo admita herramientas. Elige un modelo cuyo proveedor documente compatibilidad con llamadas a funciones. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: El modelo no admite llamadas a funciones
            llm_model_not_available:
              message: El endpoint respondió, pero no incluyó ni atendió el modelo configurado. Elige un modelo activo del proveedor seleccionado y vuelve a ejecutar las comprobaciones. Para Gemini mediante una capa de compatibilidad con OpenAI, utiliza un modelo compatible actualmente, como gemini-2.5-flash.
              title: El modelo de IA configurado no está disponible
            llm_probe_failed:
              message: Sure no ha podido verificar tanto el endpoint como el modelo configurados. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación en vivo del LLM ha fallado
            missing_vector_store:
              message: Los documentos subidos no se pueden indexar ni buscar hasta que se configure un adaptador de almacén vectorial y sus requisitos.
              title: No hay ningún almacén vectorial configurado
            pdf_text_extraction_failed:
              message: Sure no ha podido completar el proceso que extrae localmente el texto incrustado en el PDF y lo envía al modelo configurado. No se han enviado datos de clientes. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación de extracción de texto del PDF sintético ha fallado
            pdf_vision_processing_failed:
              message: Sure no ha podido completar el procesamiento del PDF como imagen o documento nativo mediante el modelo configurado. No se han enviado datos de clientes. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación visual o nativa del PDF sintético ha fallado
            pgvector_extension_not_enabled:
              message: El adaptador pgvector está seleccionado, pero PostgreSQL no tiene habilitada la extensión vector para esta base de datos. Usa una imagen de PostgreSQL que incluya pgvector, habilita la extensión como propietario de la base de datos o superusuario y vuelve a ejecutar las migraciones con VECTOR_STORE_PROVIDER=pgvector.
              title: La extensión vector de PostgreSQL no está habilitada
            pgvector_probe_failed:
              message: Sure no ha podido consultar la tabla de fragmentos de pgvector. Comprueba los permisos de PostgreSQL, la extensión vector y la migración de vector_store_chunks. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación de almacenamiento de pgvector ha fallado
            pgvector_table_not_found:
              message: La extensión pgvector está habilitada, pero no se ha encontrado la tabla de fragmentos. Comprueba el estado de las migraciones y vuelve a ejecutar la migración del almacén vectorial con VECTOR_STORE_PROVIDER=pgvector para que Sure pueda crear vector_store_chunks.
              title: Falta la tabla vector_store_chunks
            qdrant:
              message: El adaptador Qdrant tiene una estructura inicial, pero actualmente fallan las operaciones de subida y búsqueda de documentos. Selecciona OpenAI o pgvector para buscar documentos.
              title: La compatibilidad con Qdrant aún no está implementada
            unavailable_vector_store:
              message: Comprueba los requisitos del adaptador que aparecen abajo. Para pgvector, la base de datos debe proporcionar la extensión vector o una tabla vector_store_chunks existente.
              title: El almacén vectorial seleccionado no está disponible
            vector_probe_failed:
              message: Sure no ha podido verificar el almacén vectorial seleccionado y todos los servicios de embeddings necesarios. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
              title: La comprobación en vivo de búsqueda de documentos ha fallado
          failure_codes:
            dimensions_mismatch: Las dimensiones del vector de embeddings no coinciden con las configuradas
            invalid_response: El servicio ha devuelto una respuesta inesperada
            model_not_available: El proveedor no ha devuelto el modelo configurado
