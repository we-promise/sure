            settings_origin:
              title: "¿Qué ajustes necesitan un reinicio?"
              database_backed: Los ajustes de proveedor, modelo y clave API que cambias en Ajustes → Autoalojamiento se guardan en la base de datos. rails-settings-cached invalida la caché compartida al escribir, así que tanto la web como el worker usan el valor nuevo en la siguiente petición o tarea en cola, sin reiniciar.
              env_backed: La configuración de embeddings, y cualquier valor que solo se defina con una variable de entorno, queda fijada al arrancar cada contenedor. Rails no puede cambiar el entorno de otro contenedor, así que para cambiarlos hay que reiniciar o recrear los servicios web y worker; una herramienta de despliegue que solo reinicie uno de ellos (despliegue parcial, un Secret actualizado sin reiniciar el pod) no aplicará el cambio.
          local_setup:
            title: Configuración local recomendada
            description: Ejecuta el LLM con tu endpoint local compatible con OpenAI, guarda los vectores de documentos en pgvector y apunta los ajustes de embeddings a un endpoint de embeddings compatible con OpenAI. La imagen de PostgreSQL debe incluir la extensión vector y las dimensiones de los embeddings deben coincidir con el modelo seleccionado.
