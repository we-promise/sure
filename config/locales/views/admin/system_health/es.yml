            model_not_available: El proveedor no devolvió el modelo configurado
            no_tool_call: El modelo respondió sin llamar a la herramienta de comprobación de estado
            tools_refused: El servicio atendió la misma solicitud sin herramientas y la rechazó con ellas
            invalid_response: El servicio devolvió una respuesta inesperada
            dimensions_mismatch: Las dimensiones del vector de embedding no coinciden con las dimensiones configuradas
            extension_not_enabled: La extensión vector de PostgreSQL no está activada
            table_not_found: No se encontró la tabla vector_store_chunks
