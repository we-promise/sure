        ai:
          run_checks: Volver a ejecutar las comprobaciones
          last_checked: Comprobaciones en vivo completadas hace %{time_ago}. Los resultados se almacenan en caché durante un breve tiempo.
          not_checked_help: Abre directamente la URL de estado de la IA o ejecuta las comprobaciones para verificar que el servicio está activo.
          alerts:
            custom_openai:
              title: La comprobación del almacén de vectores alojado falló en este endpoint personalizado
              message: El endpoint configurado no superó la comprobación de actividad de /v1/vector_stores. La mayoría de los endpoints locales y compatibles con OpenAI no implementan esa API. Puede que el chat y el procesamiento de PDF sigan funcionando; usa pgvector con un endpoint de embeddings independiente para la configuración local habitual. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            function_calling_unsupported:
              title: El modelo no admite llamadas a funciones
              message: El endpoint atendió una solicitud de chat simple, pero rechazó la misma solicitud con el parámetro tools. El asistente de IA lee cuentas, transacciones y posiciones mediante llamadas a funciones, por lo que el chat seguirá fallando (a menudo con un 404 poco útil) hasta que uses un modelo que admita herramientas. Elige un modelo cuyo proveedor documente la compatibilidad con llamadas a funciones. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            function_calling_not_used:
              title: El modelo respondió sin llamar a la herramienta que se le pidió
              message: El endpoint aceptó el parámetro tools, pero el modelo respondió con texto en lugar de llamar a la herramienta de comprobación de estado. El asistente de IA no puede leer datos financieros sin llamadas a herramientas, por lo que el chat puede responder sin contenido o con cifras inventadas. Es preferible un modelo cuyo proveedor documente la compatibilidad con llamadas a funciones.
            llm_probe_failed:
              title: Falló la comprobación en vivo del LLM
              message: Sure no pudo verificar a la vez el endpoint y el modelo configurados. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            llm_model_not_available:
              title: El modelo de IA configurado no está disponible
              message: El endpoint respondió, pero no listó ni sirvió el modelo configurado. Elige un modelo activo del proveedor seleccionado y vuelve a ejecutar las comprobaciones. Para Gemini a través de una capa de traducción compatible con OpenAI, usa un modelo compatible actualmente, como gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Falló la comprobación de extracción de texto con el PDF sintético
              message: Sure no pudo completar la ruta basada en texto, que extrae localmente el texto incrustado del PDF y lo envía al modelo configurado. No se envió ningún dato de clientes. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            pdf_vision_processing_failed:
              title: Falló la comprobación de visión/nativa con el PDF sintético
              message: Sure no pudo completar la ruta de PDF como imagen o documento nativo a través del modelo configurado. No se envió ningún dato de clientes. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            vector_probe_failed:
              title: Falló la comprobación en vivo de la búsqueda de documentos
              message: Sure no pudo verificar el almacén de vectores seleccionado ni todos los servicios de embeddings necesarios. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            pgvector_extension_not_enabled:
              title: La extensión vector de PostgreSQL no está activada
              message: El adaptador pgvector está seleccionado, pero PostgreSQL no ha activado la extensión vector para esta base de datos. Usa una imagen de PostgreSQL que incluya pgvector, activa la extensión como propietario de la base de datos o superusuario y vuelve a ejecutar las migraciones con VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Falta la tabla vector_store_chunks
              message: La extensión pgvector está activada, pero no se encontró la tabla de fragmentos. Comprueba el estado de las migraciones y vuelve a ejecutar la migración del almacén de vectores con VECTOR_STORE_PROVIDER=pgvector para que Sure pueda crear vector_store_chunks.
            pgvector_probe_failed:
              title: Falló la comprobación del almacenamiento de pgvector
              message: Sure no pudo consultar la tabla de fragmentos de pgvector. Comprueba los permisos de PostgreSQL, la extensión vector y la migración de vector_store_chunks. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            embedding_dimensions_mismatch:
              title: Las dimensiones del embedding no coinciden
              message: El endpoint de embeddings devolvió un vector cuya longitud no coincide con EMBEDDING_DIMENSIONS. Establece EMBEDDING_MODEL y EMBEDDING_DIMENSIONS con el tamaño de vector documentado del modelo, reinicia Sure para que el entorno se mantenga y, después, modifica o vuelve a crear la columna o tabla de embeddings de pgvector y vuelve a generar los embeddings de los documentos si los datos existentes usaban otro tamaño.
            embedding_probe_timeout:
              title: Se agotó el tiempo de la comprobación en vivo de embeddings
              message: El endpoint de embeddings no respondió antes de AI_HEALTH_PROBE_TIMEOUT. Aumenta ese tiempo de espera de la comprobación de estado si el proveedor es lento y reinicia Sure para que el entorno se aplique en todos los procesos. Si las llamadas normales al chat de IA también agotan el tiempo, aumenta OPENAI_REQUEST_TIMEOUT por separado.
            embedding_probe_failed:
              title: Falló la comprobación en vivo de embeddings
              message: Sure no pudo crear un embedding de prueba corto a través del endpoint y el modelo configurados. Comprueba EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN y los registros del proveedor de embeddings. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            qdrant:
              title: La compatibilidad con Qdrant aún no está implementada
              message: El adaptador de Qdrant existe como esqueleto, pero las operaciones de subida y búsqueda de documentos fallan actualmente. Selecciona OpenAI o pgvector para la búsqueda de documentos.
            missing_vector_store:
              title: No hay ningún almacén de vectores configurado
              message: Los documentos subidos no se pueden indexar ni buscar hasta que se configure un adaptador de almacén de vectores y sus requisitos.
            unavailable_vector_store:
              title: El almacén de vectores seleccionado no está disponible
              message: Revisa los requisitos del adaptador que aparecen abajo. Para pgvector, la base de datos debe ofrecer la extensión vector o una tabla vector_store_chunks existente.
          llm:
            title: LLM y procesamiento de PDF
            description: Las comprobaciones en vivo verifican el modelo configurado, le piden una llamada a función trivial como hace el asistente y, por separado, prueban la extracción de texto y el procesamiento de visión/nativo con un PDF sintético de una página que no contiene datos de clientes. Los valores de las credenciales nunca se muestran.
          vector_store:
            title: Almacén de vectores y búsqueda de documentos
            description: La comprobación en vivo consulta la API del almacén de vectores alojado, o prueba la tabla de pgvector y crea un embedding corto sin almacenarlo.
