        ai:
          run_checks: Ejecutar comprobaciones nuevamente
          last_checked: Las comprobaciones en vivo se completaron hace %{time_ago}.
            Los resultados se almacenan en caché brevemente.
          not_checked_help: Abra la URL de estado de IA directamente o ejecute las comprobaciones
            para verificar la vida del servicio.
          alerts:
            custom_openai:
              title: La verificación del almacén de vectores alojado falló en este
                punto final personalizado
              message: El punto final configurado no pasó la verificación de actividad
                /v1/vector_stores. La mayoría de los puntos finales locales y compatibles
                con OpenAI no implementan ese API. Es posible que el chat y el procesamiento
                PDF aún funcionen; use pgvector con un punto final de incrustaciones
                separado para la configuración local habitual. El error se registró
                en Configuración → Registros de depuración y Rails.logger.
            function_calling_unsupported:
              title: El modelo no admite llamadas a funciones.
              message: El punto final atendió una solicitud de chat simple pero rechazó
                la misma solicitud que llevaba el parámetro de herramientas. El asistente
                de IA lee cuentas, transacciones y tenencias a través de llamadas a funciones,
                por lo que el chat sigue fallando (a menudo con un 404 inútil) hasta
                que el modelo admite herramientas. Elija un modelo cuyo proveedor
                documente el soporte de llamada de funciones. El error se registró
                en Configuración → Registros de depuración y Rails.logger.
            function_calling_not_used:
              title: El modelo respondió sin llamar a la herramienta que se le pidió
                que llamara.
              message: El punto final aceptó el parámetro de herramientas, pero el
                modelo respondió con texto en lugar de llamar a la herramienta de
                verificación de estado. El asistente de IA no puede leer datos financieros
                sin llamadas a herramientas, por lo que el chat puede responder sin
                nada o con cifras inventadas. Prefiera un modelo cuyo proveedor documente
                el soporte de llamada de funciones.
            llm_probe_failed:
              title: La verificación en vivo LLM falló
              message: Sure no pudo verificar tanto el punto final configurado como
                el modelo. El error se registró en Configuración → Registros de depuración
                y Rails.logger.
            llm_model_not_available:
              title: El modelo de IA configurado no está disponible
              message: El punto final respondió, pero no enumeró ni proporcionó el
                modelo configurado. Elija un modelo activo para el proveedor seleccionado
                y luego ejecute las comprobaciones nuevamente. Para Gemini a través
                de una capa de traducción compatible con OpenAI, utilice un modelo
                actualmente compatible, como gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: La comprobación de extracción de texto sintético PDF falló
              message: Sure no pudo completar la ruta de texto primero que extrae
                el texto PDF incrustado localmente y lo envía al modelo configurado.
                No se enviaron datos del cliente. El error se registró en Configuración
                → Registros de depuración y Rails.logger.
            pdf_vision_processing_failed:
              title: La verificación sintética PDF de visión/nativa falló
              message: Sure no pudo completar la ruta de la imagen o del documento
                nativo PDF a través del modelo configurado. No se enviaron datos del
                cliente. El error se registró en Configuración → Registros de depuración
                y Rails.logger.
            vector_probe_failed:
              title: La verificación en vivo de búsqueda de documentos falló
              message: Sure no pudo verificar el almacén de vectores seleccionado
                y todos los servicios de incorporación requeridos. El error se registró
                en Configuración → Registros de depuración y Rails.logger.
            pgvector_extension_not_enabled:
              title: La extensión de vector PostgreSQL no está habilitada
              message: El adaptador pgvector está seleccionado, pero PostgreSQL no
                ha habilitado la extensión vectorial para esta base de datos. Utilice
                una imagen PostgreSQL que incluya pgvector, luego habilite la extensión
                como propietario de la base de datos o superusuario y vuelva a ejecutar
                las migraciones con VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Falta la tabla vector_store_chunks
              message: La extensión pgvector está habilitada, pero no se encontró
                la tabla de fragmentos. Verifique el estado de la migración, luego
                vuelva a ejecutar la migración del almacén de vectores con VECTOR_STORE_PROVIDER=pgvector
                para que Sure pueda crear vector_store_chunks.
            pgvector_probe_failed:
              title: La verificación de almacenamiento pgvector falló
              message: Sure no pudo consultar la tabla de fragmentos pgvector. Verifique
                los permisos PostgreSQL, la extensión del vector y la migración de
                vector_store_chunks. El error se registró en Configuración → Registros
                de depuración y Rails.logger.
            embedding_dimensions_mismatch:
              title: Las dimensiones de empotramiento no coinciden.
              message: El punto final de incrustación devolvió un vector cuya longitud
                no coincide con EMBEDDING_DIMENSIONS. Establezca EMBEDDING_MODEL y
                EMBEDDING_DIMENSIONS en el tamaño de vector documentado del modelo,
                reinicie Sure para que el entorno persista, luego modifique o vuelva
                a crear la columna/tabla de incrustación pgvector y vuelva a incrustar
                documentos si los datos existentes usaban un tamaño diferente.
            embedding_probe_timeout:
              title: Se agotó el tiempo de espera para la verificación en vivo de
                incrustación.
              message: El punto final de incorporación no respondió antes de AI_HEALTH_PROBE_TIMEOUT.
                Aumente ese tiempo de espera de verificación de estado si el proveedor
                es lento, luego reinicie Sure para que el entorno persista en cada
                proceso. Si las llamadas de chat normales de IA también expiran, aumenta
                OPENAI_REQUEST_TIMEOUT por separado.
            embedding_probe_failed:
              title: La verificación en vivo de incrustación falló
              message: Sure no pudo crear una prueba breve incrustada a través del
                punto final y el modelo configurados. Verifique EMBEDDING_URI_BASE,
                EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN y los registros del proveedor
                de incorporación. El error se registró en Configuración → Registros
                de depuración y Rails.logger.
            qdrant:
              title: El soporte Qdrant aún no está implementado
              message: El adaptador Qdrant tiene scaffolding, pero actualmente fallan
                las operaciones de carga y búsqueda de documentos. Seleccione OpenAI
                o pgvector para buscar documentos.
            missing_vector_store:
              title: No hay ningún almacén de vectores configurado
              message: Los documentos cargados no se pueden indexar ni buscar hasta
                que se configure un adaptador de almacén de vectores y sus requisitos.
            unavailable_vector_store:
              title: El almacén de vectores seleccionado no está disponible
              message: Verifique los requisitos del adaptador a continuación. Para
                pgvector, la base de datos debe proporcionar la extensión del vector
                o una tabla vector_store_chunks existente.
          llm:
            title: Procesamiento de LLM y PDF
            description: Las comprobaciones en vivo verifican el modelo configurado,
              le solicitan una llamada de función trivial como lo hace el asistente,
              luego ejercitan por separado la extracción de texto y el procesamiento
              de visión/nativo con un PDF sintético de una página que no contiene
              datos del cliente. Los valores de credenciales nunca se muestran.
          vector_store:
            title: Almacén vectorial y búsqueda de documentos
            description: La verificación en vivo consulta el almacén de vectores alojado
              API o prueba la tabla pgvector y crea una incrustación breve sin almacenarla.
