            request_failed: Falló la solicitud al servicio
            unsupported_provider: El proveedor no admite esta comprobación
          worker:
            title: Verificación del worker
            description: Las comprobaciones anteriores se ejecutaron desde este proceso web. La mayor parte del trabajo de IA (respuestas del asistente, procesamiento de PDF, embeddings, categorización automática y detección de comercios) se ejecuta en realidad en un proceso worker de Sidekiq, que puede diferir en acceso a la red, DNS, reglas de proxy o incluso en las credenciales cargadas. Encola una comprobación para verificar la configuración y la conectividad del propio worker.
            verify_button: Verificar configuración del worker
            coverage_notice: Cada comprobación verifica exactamente un proceso worker, el que la saque de la cola. Si hay más de una réplica del worker, un resultado correcto no confirma que todos los workers estén en buen estado; vuelve a encolar la comprobación para muestrear otro.
            empty:
              title: Ningún worker ha informado todavía
              description: Haz clic en "Verificar configuración del worker" para encolar una comprobación asíncrona. El resultado aparecerá aquí cuando un proceso worker la recoja.
            labels:
              process: Proceso worker
              checked_at: Comprobado
              configuration: Configuración
            configuration_statuses:
              match: Coincide con la web
              mismatch: Difiere de la web
            statuses:
              passing: Correcto
              failing: Con fallos
              stale: Desactualizado
            settings_origin:
              title: ¿Qué ajustes requieren reiniciar?
              database_backed: Los ajustes de proveedor, modelo y clave API que se cambian en Ajustes → Autoalojamiento se guardan en la base de datos. rails-settings-cached invalida la caché compartida al escribir, así que tanto la web como el worker obtienen el nuevo valor en la siguiente solicitud o trabajo encolado, sin necesidad de reiniciar.
              env_backed: La configuración de embeddings, y cualquier valor que solo se establezca mediante una variable de entorno, queda fijada al iniciarse cada contenedor. Rails no puede cambiar el entorno de otro contenedor, así que para cambiarlos hay que reiniciar o recrear tanto el servicio web como el del worker; cualquier herramienta de despliegue que solo reinicie uno de ellos (un despliegue parcial, un Secret actualizado sin reiniciar el pod) no aplicará el cambio.
          local_setup:
            title: Configuración local recomendada
            description: Ejecuta el LLM a través de tu endpoint local compatible con OpenAI, almacena los vectores de los documentos en pgvector y apunta los ajustes de embeddings a un endpoint de embeddings compatible con OpenAI. La imagen de PostgreSQL debe incluir la extensión vector, y las dimensiones de los embeddings deben coincidir con el modelo seleccionado.
