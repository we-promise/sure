            request_failed: La solicitud de servicio falló
            unsupported_provider: El proveedor no admite esta comprobación.
          worker:
            title: Verificación del trabajador
            description: Las comprobaciones anteriores se ejecutaron desde este proceso
              web. La mayor parte del trabajo de IA (respuestas del asistente, procesamiento
              PDF, embeddings, categorización automática y detección de comercios)
              en realidad se ejecuta en un proceso de trabajo Sidekiq, que puede diferir
              en el acceso a la red, DNS, reglas de proxy o incluso credenciales cargadas.
              Ponga en cola una verificación para verificar la configuración y conectividad
              propias de un trabajador.
            verify_button: Verificar la configuración del trabajador
            coverage_notice: Cada verificación verifica exactamente un proceso de
              trabajo, cualquiera que lo retire de la cola. Con más de una réplica
              de trabajador, un resultado aprobado no confirma que todos los trabajadores
              estén sanos; vuelva a poner en cola el cheque para probar otro.
            empty:
              title: Ningún trabajador se ha registrado todavía
              description: Haga clic en "Verificar configuración del trabajador" para
                poner en cola una verificación asincrónica. El resultado aparece aquí
                una vez que un proceso de trabajo lo recoge.
            labels:
              process: proceso de trabajo
              checked_at: Comprobado
              configuration: Configuración
            configuration_statuses:
              match: Partidos web
              mismatch: Se diferencia de la web
            statuses:
              passing: Paso
              failing: Defecto
              stale: Duro
            settings_origin:
              title: "¿Qué configuraciones necesitan reiniciar?"
              database_backed: Las configuraciones de proveedor, modelo y clave API
                cambiadas en Configuración → Autoalojamiento se almacenan en la base
                de datos. Rails-settings-cached invalida el caché compartido en escritura,
                por lo que tanto la web como el trabajador resuelven el nuevo valor
                para la siguiente solicitud o trabajo en cola; no es necesario reiniciar.
              env_backed: La configuración de incrustación y cualquier valor establecido
                únicamente a través de una variable de entorno se fija cuando se inicia
                cada contenedor. Rails no puede cambiar el entorno de otro contenedor,
                por lo que cambiarlos requiere reiniciar o recrear tanto los servicios
                web como los de trabajo, y cualquier herramienta de implementación
                que solo reinicie uno de ellos (implementación parcial, un Secret
                actualizado sin un reinicio del pod) no recogerá el cambio.
          local_setup:
            title: Configuración local recomendada
            description: Ejecute LLM a través de su punto final local compatible con
              OpenAI, almacene vectores de documentos en pgvector y apunte la configuración
              de incrustación a un punto final de incrustaciones compatible con OpenAI.
              La imagen PostgreSQL debe incluir la extensión del vector y las dimensiones
              de incrustación deben coincidir con el modelo seleccionado.
