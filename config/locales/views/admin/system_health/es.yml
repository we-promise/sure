            unsupported_provider: El proveedor no admite esta comprobación
            extension_not_enabled: La extensión vector de PostgreSQL no está habilitada
          last_checked: Comprobaciones en vivo completadas hace %{time_ago}. Los resultados se almacenan brevemente en caché.
          llm:
            description: Las comprobaciones en vivo verifican el modelo configurado, le piden una llamada a una función sencilla como hace el asistente y prueban por separado la extracción de texto y el procesamiento visual o nativo con un PDF sintético de una página sin datos de clientes. Nunca se muestran los valores de las credenciales.
            title: LLM y procesamiento de PDF
          loading: Ejecutando comprobaciones en vivo…
          local_setup:
            description: Ejecuta el LLM mediante tu endpoint local compatible con OpenAI, almacena los vectores de documentos en pgvector y dirige la configuración de embeddings a un endpoint de embeddings compatible con OpenAI. La imagen de PostgreSQL debe incluir la extensión vector y las dimensiones de los embeddings deben coincidir con el modelo seleccionado.
            title: Configuración local recomendada
          not_checked_help: Abre directamente la URL de estado de IA o ejecuta las comprobaciones para verificar que los servicios respondan.
          run_checks: Volver a ejecutar comprobaciones
          vector_store:
            description: La comprobación en vivo consulta la API del almacén vectorial alojado o prueba la tabla de pgvector y crea un embedding breve sin almacenarlo.
            title: Almacén vectorial y búsqueda de documentos
