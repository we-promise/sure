          worker:
            title: Verificació del worker
            description: Les comprovacions anteriors s'han executat des d'aquest procés web. La major part del treball d'IA (respostes de l'assistent, processament de PDF, embeddings, categorització automàtica i detecció de comerços) s'executa en realitat en un procés worker de Sidekiq, que pot tenir un accés a la xarxa, un DNS, unes regles de proxy o fins i tot unes credencials carregades diferents. Posa una comprovació a la cua per verificar la configuració i la connectivitat del mateix worker.
            verify_button: Verifica la configuració del worker
            coverage_notice: 'Cada comprovació verifica exactament un procés worker: el que l''agafi de la cua. Amb més d''una rèplica del worker, un resultat correcte no confirma que tots els workers funcionin bé; torna a posar la comprovació a la cua per provar-ne un altre.'
            empty:
              title: Encara no ha respost cap worker
              description: Fes clic a «Verifica la configuració del worker» per posar a la cua una comprovació asíncrona. El resultat apareixerà aquí quan un procés worker l'agafi.
            labels:
              process: Procés worker
              checked_at: Comprovat
              configuration: Configuració
            configuration_statuses:
              match: Coincideix amb el web
              mismatch: Difereix del web
            statuses:
              passing: Correcte
              failing: Amb errors
              stale: Obsolet
            settings_origin:
              title: Quins paràmetres requereixen reiniciar?
              database_backed: Els paràmetres de proveïdor, model i clau API que es canvien a Configuració → Self hosting es desen a la base de dades. rails-settings-cached invalida la memòria cau compartida en escriure, de manera que tant el web com el worker obtenen el valor nou a la següent petició o tasca de la cua, sense necessitat de reiniciar.
              env_backed: La configuració dels embeddings, i qualsevol valor definit només mitjançant una variable d'entorn, queda fixada quan s'inicia cada contenidor. Rails no pot canviar l'entorn d'un altre contenidor, així que per canviar-los cal reiniciar o tornar a crear tant el servei web com el worker; qualsevol eina de desplegament que només en reiniciï un (desplegament parcial, un Secret actualitzat sense reiniciar el pod) no aplicarà el canvi.
          local_setup:
            title: Configuració local recomanada
            description: Executa l'LLM mitjançant el teu endpoint local compatible amb OpenAI, desa els vectors dels documents a pgvector i configura els embeddings amb un endpoint d'embeddings compatible amb OpenAI. La imatge de PostgreSQL ha d'incloure l'extensió vector, i les dimensions dels embeddings han de coincidir amb el model seleccionat.
