---
ca:
  admin:
    system_health:
      push_notification:
        body: Aquesta és una notificació push de prova per al teu compte de Sure.
        title: Notificació de prova de Sure
      push_notifications:
        columns:
          checked_at: Última actualització
          device: Dispositiu
          environment: Entorn d'APNs
          status: Resultat
        device: Dispositiu %{number}
        environments:
          production: Producció
          sandbox: Sandbox
        messages:
          cooldown: Espera 30 segons abans d'enviar una altra prova.
          disabled: L'operador ha desactivat l'enviament de notificacions push.
          enqueue_failed: No s'ha pogut posar la prova a la cua. Comprova Sidekiq
            i actualitza els resultats de sota.
          hosted_only: Les notificacions push només estan disponibles en el mode allotjat.
          ineligible: Només un superadministrador actiu pot enviar una notificació
            de prova.
          no_devices: Activa les notificacions push a l'app de Sure per a iOS per
            a aquest compte per enviar una prova.
          not_configured: Les credencials d'APNs no estan configurades.
          queued: Notificació de prova a la cua. Actualitza els resultats de sota
            per comprovar-ne l'estat.
          ready: Envia una notificació de prova als dispositius iOS activats registrats
            al teu compte.
          storage_unavailable: No s'ha pogut desar la sol·licitud de prova. Comprova
            la configuració de la memòria cau compartida.
        pending: Pendent
        queueing: Posant a la cua…
        refresh: Actualitza els resultats
        requested_at: Última prova sol·licitada el %{time}
        result_help: Que APNs l'accepti no confirma que s'hagi lliurat al dispositiu.
          Actualitza per veure els resultats del worker. Els resultats es conserven
          durant 24 hores.
        results_label: Resultats de la prova
        send_test: Envia una notificació push de prova
        statuses:
          accepted: Acceptada per APNs
          enqueue_failed: No s'ha pogut posar a la cua; comprova Sidekiq
          expired: Ha caducat sense un resultat final
          failed: Ha fallat; consulta els registres de depuració de push
          queued: A la cua
          rejected: Rebutjada per APNs; consulta els registres de depuració de push
          retrying: Reintentant després d'un error temporal
          skipped: 'Omesa: ja no compleix els requisits'
          unregistered: El registre del dispositiu ja no és vàlid
        title: Notificacions push
      show:
        ai:
          adapters:
            openai: Magatzem vectorial allotjat d'OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: L'endpoint configurat no ha superat la comprovació de disponibilitat
                de /v1/vector_stores. La majoria d'endpoints locals i compatibles
                amb OpenAI no implementen aquesta API. El xat i el processament de
                PDF poden funcionar igualment; per a la configuració local habitual,
                fes servir pgvector amb un endpoint d'embeddings separat. L'error
                s'ha registrat a Configuració → Registres de depuració i a Rails.logger.
              title: La comprovació del magatzem vectorial allotjat ha fallat en aquest
                endpoint personalitzat
            embedding_dimensions_mismatch:
              message: L'endpoint d'embeddings ha retornat un vector la longitud del
                qual no coincideix amb EMBEDDING_DIMENSIONS. Defineix EMBEDDING_MODEL
                i EMBEDDING_DIMENSIONS amb la mida de vector documentada del model,
                reinicia Sure perquè l'entorn es mantingui i, després, modifica o
                torna a crear la columna/taula d'embeddings de pgvector i torna a
                generar els embeddings dels documents si les dades existents feien
                servir una altra mida.
              title: Les dimensions de l'embedding no coincideixen
            embedding_probe_failed:
              message: Sure no ha pogut crear un embedding breu de prova amb l'endpoint
                i el model configurats. Comprova EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN i els registres del proveïdor d'embeddings.
                L'error s'ha registrat a Configuració → Registres de depuració i a
                Rails.logger.
              title: La comprovació en directe dels embeddings ha fallat
            embedding_probe_timeout:
              message: L'endpoint d'embeddings no ha respost abans d'AI_HEALTH_PROBE_TIMEOUT.
                Augmenta aquest temps d'espera de la comprovació si el proveïdor és
                lent i reinicia Sure perquè l'entorn es mantingui en tots els processos.
                Si les crides normals al xat d'IA també excedeixen el temps d'espera,
                augmenta OPENAI_REQUEST_TIMEOUT per separat.
              title: La comprovació en directe dels embeddings ha excedit el temps
                d'espera
            function_calling_not_used:
              message: L'endpoint ha acceptat el paràmetre tools, però el model ha
                respost amb text en lloc de cridar l'eina de comprovació. L'assistent
                d'IA no pot llegir dades financeres sense crides a eines, així que
                el xat pot respondre en blanc o amb xifres inventades. És preferible
                un model el proveïdor del qual documenti la compatibilitat amb la
                crida a funcions.
              title: El model ha respost sense cridar l'eina que se li ha demanat
            function_calling_unsupported:
              message: L'endpoint ha respost a una petició de xat simple, però ha
                rebutjat la mateixa petició amb el paràmetre tools. L'assistent d'IA
                llegeix comptes, transaccions i posicions mitjançant crides a funcions,
                així que el xat continuarà fallant (sovint amb un error 404 poc útil)
                fins que facis servir un model que admeti eines. Tria un model el
                proveïdor del qual documenti la compatibilitat amb la crida a funcions.
                L'error s'ha registrat a Configuració → Registres de depuració i a
                Rails.logger.
              title: El model no admet la crida a funcions
            llm_model_not_available:
              message: L'endpoint ha respost, però no ha llistat ni servit el model
                configurat. Tria un model actiu per al proveïdor seleccionat i torna
                a executar les comprovacions. Per a Gemini mitjançant una capa de
                traducció compatible amb OpenAI, fes servir un model admès actualment,
                com ara gemini-2.5-flash.
              title: El model d'IA configurat no està disponible
            llm_probe_failed:
              message: Sure no ha pogut verificar alhora l'endpoint i el model configurats.
                L'error s'ha registrat a Configuració → Registres de depuració i a
                Rails.logger.
              title: La comprovació en directe de l'LLM ha fallat
            missing_vector_store:
              message: Els documents pujats no es poden indexar ni cercar fins que
                no es configuri un adaptador de magatzem vectorial i els seus requisits.
              title: No hi ha cap magatzem vectorial configurat
            pdf_text_extraction_failed:
              message: Sure no ha pogut completar la via d'extracció de text, que
                extreu localment el text incrustat del PDF i l'envia al model configurat.
                No s'ha enviat cap dada de clients. L'error s'ha registrat a Configuració
                → Registres de depuració i a Rails.logger.
              title: La comprovació d'extracció de text amb un PDF sintètic ha fallat
            pdf_vision_processing_failed:
              message: Sure no ha pogut completar la via de PDF com a imatge o document
                natiu amb el model configurat. No s'ha enviat cap dada de clients.
                L'error s'ha registrat a Configuració → Registres de depuració i a
                Rails.logger.
              title: La comprovació de visió/nativa amb un PDF sintètic ha fallat
            pgvector_extension_not_enabled:
              message: L'adaptador pgvector està seleccionat, però PostgreSQL no té
                activada l'extensió vector per a aquesta base de dades. Fes servir
                una imatge de PostgreSQL que inclogui pgvector, activa l'extensió
                com a propietari de la base de dades o superusuari i torna a executar
                les migracions amb VECTOR_STORE_PROVIDER=pgvector.
              title: L'extensió vector de PostgreSQL no està activada
            pgvector_probe_failed:
              message: Sure no ha pogut consultar la taula de fragments de pgvector.
                Comprova els permisos de PostgreSQL, l'extensió vector i la migració
                de vector_store_chunks. L'error s'ha registrat a Configuració → Registres
                de depuració i a Rails.logger.
              title: La comprovació de l'emmagatzematge pgvector ha fallat
            pgvector_table_not_found:
              message: L'extensió pgvector està activada, però no s'ha trobat la taula
                de fragments. Comprova l'estat de les migracions i torna a executar
                la migració del magatzem vectorial amb VECTOR_STORE_PROVIDER=pgvector
                perquè Sure pugui crear vector_store_chunks.
              title: Falta la taula vector_store_chunks
            qdrant:
              message: L'adaptador de Qdrant té l'estructura bàsica, però ara mateix
                les operacions de pujada i cerca de documents fallen. Selecciona OpenAI
                o pgvector per a la cerca de documents.
              title: La compatibilitat amb Qdrant encara no està implementada
            unavailable_vector_store:
              message: Revisa els requisits de l'adaptador de sota. Per a pgvector,
                la base de dades ha de proporcionar l'extensió vector o una taula
                vector_store_chunks existent.
              title: El magatzem vectorial seleccionat no està disponible
            vector_probe_failed:
              message: Sure no ha pogut verificar el magatzem vectorial seleccionat
                ni tots els serveis d'embeddings necessaris. L'error s'ha registrat
                a Configuració → Registres de depuració i a Rails.logger.
              title: La comprovació en directe de la cerca de documents ha fallat
          failure_codes:
            dimensions_mismatch: Les dimensions del vector d'embedding no coincideixen
              amb les configurades
            extension_not_enabled: L'extensió vector de PostgreSQL no està activada
            invalid_response: El servei ha retornat una resposta inesperada
            model_not_available: El proveïdor no ha retornat el model configurat
            no_tool_call: El model ha respost sense cridar l'eina de comprovació
            render_missing_binary: El renderitzador pdftoppm (poppler-utils) no està
              disponible en aquest contenidor
            request_failed: La petició al servei ha fallat
            table_not_found: No s'ha trobat la taula vector_store_chunks
            timeout: El servei no ha respost abans que s'esgotés el temps d'espera
              de la comprovació
            tools_refused: El servei ha respost a la mateixa petició sense eines,
              però l'ha rebutjada amb eines
            unsupported_provider: El proveïdor no admet aquesta comprovació
          function_calling_statuses:
            failing: La comprovació en directe ha fallat
            not_checked: No comprovat
            not_used: Eines acceptades, però el model no n'ha cridat cap
            supported: La crida d'eina en directe ha funcionat
            unavailable: No disponible fins que es configuri un proveïdor d'LLM
            unsupported: No compatible amb el proveïdor/model efectiu
          labels:
            adapter: Adaptador
            adapter_available: Adaptador disponible
            anthropic_credentials: Credencials d'Anthropic
            effective_provider: Proveïdor efectiu
            embedding_dimensions: Dimensions de l'embedding
            embedding_endpoint: Endpoint d'embeddings
            embedding_model: Model d'embeddings
            embedding_probe: Comprovació de l'endpoint d'embeddings
            endpoint: Endpoint
            failure_reason: Motiu de l'error
            function_calling: Crida a funcions (tools)
            function_calling_failure_reason: Motiu de l'error de la crida a funcions
            llm_request_timeout: Temps d'espera de les peticions a l'LLM
            model: Model
            openai_compatible_credentials: Credencials d'API compatible amb OpenAI
            openai_credentials: Credencials d'OpenAI
            pdf_text_extraction: Via d'extracció de text de PDF
            pdf_text_extraction_failure_reason: Motiu de l'error de l'extracció de
              text
            pdf_vision_processing: Via de visió/nativa de PDF
            pdf_vision_processing_failure_reason: Motiu de l'error de visió/nativa
            pgvector_extension: Extensió vector de PostgreSQL
            pgvector_table: Taula de fragments vectorials
            probe_request_timeout: Temps d'espera de la comprovació d'estat
            selected_provider: Proveïdor seleccionat
            storage_probe: Comprovació de l'emmagatzematge pgvector
          last_checked: Comprovacions en directe completades fa %{time_ago}. Els resultats
            es desen breument a la memòria cau.
          llm:
            description: Les comprovacions en directe verifiquen el model configurat,
              li demanen una crida a funció trivial tal com ho fa l'assistent i, per
              separat, proven l'extracció de text i el processament de visió/natiu
              amb un PDF sintètic d'una pàgina sense dades de clients. Els valors
              de les credencials no es mostren mai.
            title: LLM i processament de PDF
          loading: S'estan executant les comprovacions en directe…
          local_setup:
            description: Executa l'LLM mitjançant el teu endpoint local compatible
              amb OpenAI, desa els vectors dels documents a pgvector i configura els
              embeddings amb un endpoint d'embeddings compatible amb OpenAI. La imatge
              de PostgreSQL ha d'incloure l'extensió vector, i les dimensions dels
              embeddings han de coincidir amb el model seleccionat.
            title: Configuració local recomanada
          not_checked_help: Obre directament l'URL d'estat de la IA o executa les
            comprovacions per verificar que el servei respon.
          pdf_statuses:
            failing: La comprovació amb PDF sintètic ha fallat
            not_checked: No comprovat
            supported: Comprovació amb PDF sintètic superada
            unavailable: No disponible fins que es configuri un proveïdor d'LLM
            unsupported: Desactivat o no compatible amb el proveïdor/model efectiu
          probe_statuses:
            failing: La comprovació en directe ha fallat
            not_checked: No comprovat
            not_configured: No configurat
            passing: Comprovació en directe superada
          providers:
            anthropic: Anthropic
            cloudflare: Cloudflare
            custom_openai_compatible: Endpoint personalitzat
            kilo: Kilo
            ollama: Ollama
            openai: OpenAI
            openai_compatible: Compatible amb OpenAI
            openrouter: OpenRouter
            together: Together
          run_checks: Torna a executar les comprovacions
          values:
            available: Disponible
            available_not_enabled: Disponible, no activada
            configured: Configurat
            enabled: Activada
            fallback: "(alternatiu)"
            'no': 'No'
            not_available: No disponible
            not_configured: No configurat
            not_found: No trobada
            not_set: No definit
            'yes': Sí
          vector_statuses:
            failing: La comprovació en directe ha fallat
            missing: No configurat
            not_checked: No comprovat
            not_configured: No configurat
            passing: Comprovacions en directe superades
            scaffolded: Només estructura bàsica
          vector_store:
            description: La comprovació en directe consulta l'API del magatzem vectorial
              allotjat, o prova la taula de pgvector i crea un embedding breu sense
              desar-lo.
            title: Magatzem vectorial i cerca de documents
          worker:
            configuration_statuses:
              match: Coincideix amb el web
              mismatch: Difereix del web
            coverage_notice: 'Cada comprovació verifica exactament un procés worker:
              el que l''agafi de la cua. Amb més d''una rèplica del worker, un resultat
              correcte no confirma que tots els workers funcionin bé; torna a posar
              la comprovació a la cua per provar-ne un altre.'
            description: Les comprovacions anteriors s'han executat des d'aquest procés
              web. La major part del treball d'IA (respostes de l'assistent, processament
              de PDF, embeddings, categorització automàtica i detecció de comerços)
              s'executa en realitat en un procés worker de Sidekiq, que pot tenir
              un accés a la xarxa, un DNS, unes regles de proxy o fins i tot unes
              credencials carregades diferents. Posa una comprovació a la cua per
              verificar la configuració i la connectivitat del mateix worker.
            empty:
              description: Fes clic a «Verifica la configuració del worker» per posar
                a la cua una comprovació asíncrona. El resultat apareixerà aquí quan
                un procés worker l'agafi.
              title: Encara no ha respost cap worker
            labels:
              checked_at: Comprovat
              configuration: Configuració
              process: Procés worker
            settings_origin:
              database_backed: Els paràmetres de proveïdor, model i clau API que es
                canvien a Configuració → Self hosting es desen a la base de dades.
                rails-settings-cached invalida la memòria cau compartida en escriure,
                de manera que tant el web com el worker obtenen el valor nou a la
                següent petició o tasca de la cua, sense necessitat de reiniciar.
              env_backed: La configuració dels embeddings, i qualsevol valor definit
                només mitjançant una variable d'entorn, queda fixada quan s'inicia
                cada contenidor. Rails no pot canviar l'entorn d'un altre contenidor,
                així que per canviar-los cal reiniciar o tornar a crear tant el servei
                web com el worker; qualsevol eina de desplegament que només en reiniciï
                un (desplegament parcial, un Secret actualitzat sense reiniciar el
                pod) no aplicarà el canvi.
              title: Quins paràmetres requereixen reiniciar?
            statuses:
              failing: Amb errors
              passing: Correcte
              stale: Obsolet
            title: Verificació del worker
            verify_button: Verifica la configuració del worker
        alert:
          title: Les tasques en segon pla no s'estan executant
        counters_section_description: Comptadors agregats de Sidekiq de totes les
          cues.
        counters_section_title: Comptadors de tasques
        labels:
          enqueued: A la cua
          failed: Fallides
          last_heartbeat: Últim senyal de vida
          latency: Latència
          max_queue_latency: Antiguitat de la tasca més antiga
          processed_total: Processades (total)
          processes: Processos worker
          queue: Cua
          retries: Reintents
          size: Mida
          status: Estat
        queues_section_description: Mida de cada cua i antiguitat de la tasca més
          antiga. La latència és el nombre de segons que fa que la tasca més antiga
          és a la cua.
        queues_section_title: Cues
        status_section_description: Estat actual del worker en segon pla que executa
          les sincronitzacions, els saldos i els càlculs del patrimoni net.
        status_section_title: Estat de Sidekiq
        tabs:
          ai: Estat de la IA
          background_jobs: Tasques en segon pla
        title: Estat del sistema
        values:
          healthy: Correcte
          never: Mai
          no_queues: No hi ha cap cua registrada. Pot ser que el worker no s'estigui
            executant.
          seconds: "%{seconds} s"
          time_ago: fa %{time_ago}
          unhealthy: Degradat
      verify_worker_ai:
        queued: Comprovació del worker a la cua. Apareixerà a sota quan un procés
          worker l'agafi, normalment en pocs segons.
