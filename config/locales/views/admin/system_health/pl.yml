          vector_store:
            description: >-
              Test na żywo odpytuje hostowane API magazynu wektorowego albo testuje
              tabelę pgvector i tworzy jeden krótki embedding bez zapisywania go.
            title: Magazyn wektorowy i wyszukiwanie dokumentów
          worker:
            configuration_statuses:
              match: Zgodne z web
              mismatch: Różni się od web
            coverage_notice: >-
              Każdy test sprawdza dokładnie jeden proces workera — ten, który go pobierze
              z kolejki. Przy więcej niż jednej replice workera pozytywny wynik nie
              potwierdza, że wszystkie workery działają poprawnie — uruchom test ponownie,
              żeby sprawdzić kolejny.
            description: >-
              Powyższe testy uruchomiono z tego procesu web. Większość pracy AI —
              odpowiedzi asystenta, przetwarzanie PDF, embeddingi, automatyczna kategoryzacja
              i wykrywanie sprzedawcy — działa w rzeczywistości w procesie workera
              Sidekiq, który może różnić się dostępem do sieci, DNS, regułami proxy,
              a nawet wczytanymi poświadczeniami. Uruchom test, żeby zweryfikować
              własną konfigurację i łączność workera.
            empty:
              description: >-
                Kliknij „Zweryfikuj konfigurację workera”, aby dodać do kolejki asynchroniczny
                test. Wynik pojawi się tutaj, gdy proces workera go podejmie.
              title: Żaden worker jeszcze się nie zgłosił
            labels:
              checked_at: Sprawdzono
              configuration: Konfiguracja
              process: Proces workera
            settings_origin:
              database_backed: >-
                Ustawienia dostawcy, modelu i klucza API zmienione w Ustawienia →
                Self-Hosting są zapisywane w bazie danych. rails-settings-cached unieważnia
                współdzielony cache przy zapisie, więc zarówno web, jak i worker odczytują
                nową wartość przy kolejnym żądaniu lub zadaniu z kolejki — restart
                nie jest potrzebny.
              env_backed: >-
                Konfiguracja embeddingów oraz każda wartość ustawiona wyłącznie przez
                zmienną środowiskową jest utrwalana przy starcie każdego kontenera.
                Rails nie może zmienić środowiska innego kontenera, więc zmiana tych
                wartości wymaga zrestartowania lub odtworzenia zarówno usługi web,
                jak i workera — a narzędzia wdrożeniowe restartujące tylko jedną z
                nich (częściowy rollout, zaktualizowany Secret bez restartu poda)
                nie uwzględnią zmiany.
              title: Które ustawienia wymagają restartu?
            statuses:
              failing: Niepowodzenie
              passing: Powodzenie
              stale: Nieaktualne
            title: Weryfikacja workera
            verify_button: Zweryfikuj konfigurację workera
