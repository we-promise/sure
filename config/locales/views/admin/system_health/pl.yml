        tabs:
          ai: Status AI
          background_jobs: Zadania w tle
        title: Kondycja systemu
        values:
          healthy: Sprawny
          never: Nigdy
          no_queues: Brak zarejestrowanych kolejek. Proces roboczy może nie działać.
