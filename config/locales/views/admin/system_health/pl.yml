          last_checked: >-
            Testy na żywo zakończono %{time_ago} temu. Wyniki są krótko przechowywane
            w pamięci podręcznej.
          llm:
            description: >-
              Testy na żywo weryfikują skonfigurowany model, a następnie osobno sprawdzają
              wyodrębnianie tekstu i przetwarzanie wizyjne/natywne na jednostronicowym
              syntetycznym PDF bez danych klienta. Wartości poświadczeń nigdy nie
              są wyświetlane.
            title: Przetwarzanie LLM i PDF
          loading: Trwają testy na żywo…
          local_setup:
            description: >-
              Uruchom LLM przez lokalny endpoint kompatybilny z OpenAI, przechowuj
              wektory dokumentów w pgvector i skieruj ustawienia embeddingów na endpoint
              embeddingów kompatybilny z OpenAI. Obraz PostgreSQL musi zawierać rozszerzenie
              vector, a wymiary embeddingu muszą pasować do wybranego modelu.
            title: Zalecana konfiguracja lokalna
          not_checked_help: >-
            Otwórz bezpośrednio URL statusu AI albo uruchom testy, aby zweryfikować
