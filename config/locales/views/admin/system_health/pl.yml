---
pl:
  admin:
    system_health:
      show:
        ai:
          adapters:
            openai: Hostowany magazyn wektorowy OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: >-
                Skonfigurowany endpoint nie przeszedł testu dostępności /v1/vector_stores.
                Większość lokalnych i kompatybilnych z OpenAI endpointów nie implementuje
                tego API. Czat i przetwarzanie PDF mogą nadal działać. W typowej konfiguracji
                lokalnej użyj pgvector z osobnym endpointem embeddingów. Błąd zapisano
                w Ustawienia → Logi debugowania oraz w Rails.logger.
              title: >-
                Test hostowanego magazynu wektorowego nie powiódł się dla tego niestandardowego
                endpointu
            embedding_dimensions_mismatch:
              message: >-
                Endpoint embeddingów zwrócił wektor, którego długość nie zgadza się
                z EMBEDDING_DIMENSIONS. Ustaw EMBEDDING_MODEL i EMBEDDING_DIMENSIONS
                na udokumentowany rozmiar wektora danego modelu, zrestartuj Sure,
                aby zmienne środowiskowe się utrwaliły, a następnie zmień lub odtwórz
                kolumnę/tabelę embeddingów pgvector i ponownie wygeneruj embeddingi
                dokumentów, jeśli istniejące dane używały innego rozmiaru.
              title: Wymiary embeddingów się nie zgadzają
            embedding_probe_failed:
              message: >-
                Sure nie mógł utworzyć krótkiego testowego embeddingu przez skonfigurowany
                endpoint i model. Sprawdź EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN
                oraz logi dostawcy embeddingów. Błąd zapisano w Ustawienia → Logi
                debugowania oraz w Rails.logger.
              title: Test działania embeddingów nie powiódł się
            embedding_probe_timeout:
              message: >-
                Endpoint embeddingów nie odpowiedział przed upływem AI_HEALTH_PROBE_TIMEOUT.
                Jeśli dostawca jest wolny, zwiększ ten limit czasu testu kondycji,
                a następnie zrestartuj Sure, aby zmienne środowiskowe utrwaliły się
                we wszystkich procesach. Jeśli zwykłe wywołania czatu AI również przekraczają
                limit czasu, zwiększ osobno OPENAI_REQUEST_TIMEOUT.
              title: Test działania embeddingów przekroczył limit czasu
            function_calling_not_used:
              message: >-
                Endpoint zaakceptował parametr tools, ale model odpowiedział tekstem
                zamiast wywołać narzędzie testu kondycji. Asystent AI nie może odczytać
                danych finansowych bez wywołań narzędzi, więc czat może odpowiadać
                pustką albo zmyślonymi liczbami. Wybierz model, którego dostawca dokumentuje
                obsługę wywoływania funkcji.
              title: Model odpowiedział, nie wywołując narzędzia, o które go poproszono
            function_calling_unsupported:
              message: >-
                Endpoint obsłużył zwykłe żądanie czatu, ale odrzucił to samo żądanie
                z parametrem tools. Asystent AI odczytuje konta, transakcje i pozycje
                portfela przez wywołania funkcji, więc czat będzie zawodził — często
                z niezbyt pomocnym błędem 404 — dopóki nie wybierzesz modelu obsługującego
                narzędzia. Wybierz model, którego dostawca dokumentuje obsługę wywoływania
                funkcji. Błąd zapisano w Ustawienia → Logi debugowania oraz w Rails.logger.
              title: Model nie obsługuje wywoływania funkcji
            llm_model_not_available:
              message: >-
                Endpoint odpowiedział, ale nie wymienił ani nie obsłużył skonfigurowanego
                modelu. Wybierz aktywny model dla wybranego dostawcy, a następnie
                uruchom testy ponownie. Dla Gemini przez warstwę zgodną z OpenAI użyj
                aktualnie obsługiwanego modelu, np. gemini-2.5-flash.
              title: Skonfigurowany model AI jest niedostępny
            llm_probe_failed:
              message: >-
                Sure nie mógł zweryfikować skonfigurowanego endpointu ani modelu.
                Błąd zapisano w Ustawienia → Logi debugowania oraz w Rails.logger.
              title: Test na żywo modelu LLM nie powiódł się
            missing_vector_store:
              message: >-
                Przesłanych dokumentów nie można zindeksować ani przeszukać, dopóki
                nie skonfigurujesz adaptera magazynu wektorowego i jego wymagań.
              title: Brak skonfigurowanego magazynu wektorowego
            pdf_text_extraction_failed:
              message: >-
                Sure nie ukończył ścieżki opartej na tekście, która lokalnie wyodrębnia
                tekst z PDF i wysyła go do skonfigurowanego modelu. Żadne dane klienta
                nie zostały wysłane. Błąd zapisano w Ustawienia → Logi debugowania
                oraz w Rails.logger.
              title: Test wyodrębniania tekstu z syntetycznego PDF nie powiódł się
            pdf_vision_processing_failed:
              message: >-
                Sure nie ukończył ścieżki obrazu lub natywnego dokumentu PDF przez
                skonfigurowany model. Żadne dane klienta nie zostały wysłane. Błąd
                zapisano w Ustawienia → Logi debugowania oraz w Rails.logger.
              title: Test wizyjny/natywny syntetycznego PDF nie powiódł się
            pgvector_extension_not_enabled:
              message: >-
                Wybrano adapter pgvector, ale PostgreSQL nie ma włączonego rozszerzenia
                vector dla tej bazy danych. Użyj obrazu PostgreSQL zawierającego pgvector,
                włącz rozszerzenie jako właściciel bazy lub superużytkownik, a następnie
                uruchom ponownie migracje z VECTOR_STORE_PROVIDER=pgvector.
              title: Rozszerzenie vector PostgreSQL nie jest włączone
            pgvector_probe_failed:
              message: >-
                Sure nie mógł odpytać tabeli fragmentów pgvector. Sprawdź uprawnienia
                PostgreSQL, rozszerzenie vector oraz migrację vector_store_chunks.
                Błąd zapisano w Ustawienia → Logi debugowania oraz w Rails.logger.
              title: Test magazynu pgvector nie powiódł się
            pgvector_table_not_found:
              message: >-
                Rozszerzenie pgvector jest włączone, ale nie znaleziono tabeli fragmentów.
                Sprawdź stan migracji, a następnie uruchom ponownie migrację magazynu
                wektorów z VECTOR_STORE_PROVIDER=pgvector, aby Sure mógł utworzyć
                vector_store_chunks.
              title: Brak tabeli vector_store_chunks
            qdrant:
              message: >-
                Adapter Qdrant jest przygotowany szkieletowo, ale przesyłanie i wyszukiwanie
                dokumentów obecnie nie działa. Do wyszukiwania dokumentów wybierz
                OpenAI lub pgvector.
              title: Obsługa Qdrant nie jest jeszcze zaimplementowana
            unavailable_vector_store:
              message: >-
                Sprawdź wymagania adaptera poniżej. Dla pgvector baza danych musi
                udostępniać rozszerzenie vector albo istniejącą tabelę vector_store_chunks.
              title: Wybrany magazyn wektorowy jest niedostępny
            vector_probe_failed:
              message: >-
                Sure nie mógł zweryfikować wybranego magazynu wektorowego ani wymaganych
                usług embeddingów. Błąd zapisano w Ustawienia → Logi debugowania oraz
                w Rails.logger.
              title: Test na żywo wyszukiwania dokumentów nie powiódł się
          failure_codes:
            dimensions_mismatch: Wymiary wektora embeddingu nie zgadzają się ze skonfigurowanymi
              wymiarami
            extension_not_enabled: Rozszerzenie vector w PostgreSQL nie jest włączone
            invalid_response: Usługa zwróciła nieoczekiwaną odpowiedź
            model_not_available: Dostawca nie zwrócił skonfigurowanego modelu
            no_tool_call: Model odpowiedział bez wywołania narzędzia testu kondycji
            render_missing_binary: Renderer pdftoppm (poppler-utils) jest niedostępny
