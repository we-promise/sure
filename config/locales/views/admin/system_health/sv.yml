              process: Workerprocess
              checked_at: Kontrollerad
              configuration: Konfiguration
            configuration_statuses:
              match: Matchar webben
              mismatch: Skiljer sig från webben
            statuses:
              passing: Godkänd
              failing: Misslyckas
              stale: Inaktuell
            settings_origin:
              title: Vilka inställningar kräver omstart?
              database_backed: "Inställningar för leverantör, modell och API-nyckel som ändras i Inställningar → Egen hosting sparas i databasen. rails-settings-cached ogiltigförklarar den delade cachen vid skrivning, så både webb och worker hämtar det nya värdet vid nästa begäran eller köade jobb -- ingen omstart behövs."
              env_backed: "Embedding-konfiguration, och alla värden som bara anges via en miljövariabel, låses när varje container startar. Rails kan inte ändra en annan containers miljö, så för att ändra dessa måste både webb- och workertjänsterna startas om eller återskapas -- och deployverktyg som bara startar om en av dem (partiell utrullning, en uppdaterad Secret utan podomstart) kommer inte att plocka upp ändringen."
          local_setup:
            title: Rekommenderad lokal uppsättning
            description: Kör LLM:en via din lokala OpenAI-kompatibla endpoint, spara dokumentvektorer i pgvector och peka embedding-inställningarna mot en OpenAI-kompatibel embedding-endpoint. PostgreSQL-imagen måste innehålla tillägget vector, och embedding-dimensionerna måste matcha den valda modellen.
