          worker:
            title: Workerverifiering
            description: Kontrollerna ovan kördes från den här webbprocessen. Det mesta AI-arbetet -- assistentsvar, PDF-bearbetning, embeddings, automatisk kategorisering och handlaridentifiering -- körs faktiskt i en Sidekiq-workerprocess, som kan skilja sig i nätverksåtkomst, DNS, proxyregler eller till och med inlästa inloggningsuppgifter. Köa en kontroll för att verifiera en workers egen konfiguration och anslutning.
            verify_button: Verifiera workerkonfiguration
            coverage_notice: Varje kontroll verifierar exakt en workerprocess -- den som plockar upp den från kön. Med fler än en workerreplika bekräftar ett godkänt resultat inte att alla workers är friska; köa kontrollen igen för att testa en annan.
            empty:
              title: Ingen worker har rapporterat än
              description: Klicka på "Verifiera workerkonfiguration" för att köa en asynkron kontroll. Resultatet visas här när en workerprocess plockar upp den.
