          run_checks: Kör kontrollerna igen
          last_checked: "Livekontrollerna slutfördes för %{time_ago} sedan. Resultaten cachas en kort stund."
          not_checked_help: Öppna AI-statusens URL direkt eller kör kontrollerna för att verifiera att tjänsten lever.
          alerts:
            custom_openai:
              title: Kontrollen av hostad vektorlagring misslyckades mot den här anpassade endpointen
              message: Den konfigurerade endpointen klarade inte livekontrollen av /v1/vector_stores. De flesta lokala och OpenAI-kompatibla endpoints implementerar inte det API:et. Chatt och PDF-bearbetning kan ändå fungera; använd pgvector med en separat embedding-endpoint för den vanliga lokala uppsättningen. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            function_calling_unsupported:
              title: Modellen stöder inte funktionsanrop
              message: Endpointen besvarade en vanlig chattbegäran men avvisade samma begäran med parametern tools. AI-assistenten läser konton, transaktioner och innehav via funktionsanrop, så chatten fortsätter att misslyckas – ofta med ett föga hjälpsamt 404 – tills modellen stöder verktyg. Välj en modell vars leverantör dokumenterar stöd för funktionsanrop. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            function_calling_not_used:
              title: Modellen svarade utan att anropa verktyget den ombads anropa
              message: Endpointen accepterade parametern tools, men modellen svarade med text i stället för att anropa hälsokontrollverktyget. AI-assistenten kan inte läsa ekonomisk data utan verktygsanrop, så chatten kan svara med ingenting eller med påhittade siffror. Välj helst en modell vars leverantör dokumenterar stöd för funktionsanrop.
            llm_probe_failed:
              title: Livekontrollen av LLM misslyckades
              message: Sure kunde inte verifiera både den konfigurerade endpointen och modellen. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            llm_model_not_available:
              title: Den konfigurerade AI-modellen är inte tillgänglig
              message: Endpointen svarade, men den listade eller tillhandahöll inte den konfigurerade modellen. Välj en aktiv modell för den valda leverantören och kör sedan kontrollerna igen. För Gemini via ett OpenAI-kompatibelt översättningslager, använd en modell som stöds i dag, till exempel gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Den syntetiska kontrollen av PDF-textextrahering misslyckades
              message: Sure kunde inte slutföra den textbaserade vägen som extraherar inbäddad PDF-text lokalt och skickar den till den konfigurerade modellen. Inga kunddata skickades. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            pdf_vision_processing_failed:
              title: Den syntetiska PDF-kontrollen för vision/native misslyckades
              message: Sure kunde inte slutföra PDF-vägen för bild eller native-dokument via den konfigurerade modellen. Inga kunddata skickades. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            vector_probe_failed:
              title: Livekontrollen av dokumentsökning misslyckades
              message: Sure kunde inte verifiera den valda vektorlagringen och alla nödvändiga embedding-tjänster. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            pgvector_extension_not_enabled:
              title: PostgreSQL-tillägget vector är inte aktiverat
              message: Adaptern pgvector är vald, men PostgreSQL har inte aktiverat tillägget vector för den här databasen. Använd en PostgreSQL-image som innehåller pgvector, aktivera sedan tillägget som databasägare eller superanvändare och kör migreringarna igen med VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Tabellen vector_store_chunks saknas
              message: Tillägget pgvector är aktiverat, men chunk-tabellen hittades inte. Kontrollera migreringsstatus och kör sedan vektorlagringsmigreringen igen med VECTOR_STORE_PROVIDER=pgvector så att Sure kan skapa vector_store_chunks.
            pgvector_probe_failed:
              title: Lagringskontrollen för pgvector misslyckades
              message: Sure kunde inte fråga pgvector-tabellen för chunks. Kontrollera PostgreSQL-behörigheter, tillägget vector och migreringen för vector_store_chunks. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            embedding_dimensions_mismatch:
              title: Embedding-dimensionerna stämmer inte
              message: Embedding-endpointen returnerade en vektor vars längd inte matchar EMBEDDING_DIMENSIONS. Sätt EMBEDDING_MODEL och EMBEDDING_DIMENSIONS till modellens dokumenterade vektorstorlek, starta om Sure så att miljön behålls, ändra eller återskapa sedan pgvector-kolumnen/tabellen för embeddings och gör om embeddings för dokument om befintlig data använde en annan storlek.
            embedding_probe_timeout:
              title: Livekontrollen av embeddings fick timeout
              message: Embedding-endpointen svarade inte innan AI_HEALTH_PROBE_TIMEOUT. Höj timeouten för hälsokontrollen om leverantören är långsam och starta sedan om Sure så att miljön gäller i alla processer. Om vanliga AI-chattanrop också får timeout, höj OPENAI_REQUEST_TIMEOUT separat.
            embedding_probe_failed:
              title: Livekontrollen av embeddings misslyckades
              message: Sure kunde inte skapa en kort test-embedding via den konfigurerade endpointen och modellen. Kontrollera EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN och embedding-leverantörens loggar. Felet registrerades i Inställningar → Felsökningsloggar och Rails.logger.
            qdrant:
              title: Stöd för Qdrant är inte implementerat än
              message: Adaptern för Qdrant finns som stomme, men uppladdning och sökning av dokument misslyckas för närvarande. Välj OpenAI eller pgvector för dokumentsökning.
            missing_vector_store:
              title: Ingen vektorlagring är konfigurerad
              message: Uppladdade dokument kan inte indexeras eller sökas förrän en adapter för vektorlagring och dess krav har konfigurerats.
            unavailable_vector_store:
              title: Den valda vektorlagringen är inte tillgänglig
              message: Kontrollera adapterns krav nedan. För pgvector måste databasen tillhandahålla tillägget vector eller en befintlig tabell vector_store_chunks.
          llm:
            title: LLM och PDF-bearbetning
            description: Livekontrollerna verifierar den konfigurerade modellen, ber den göra ett enkelt funktionsanrop på samma sätt som assistenten gör, och testar sedan separat textextrahering och vision/native-bearbetning med en syntetisk PDF på en sida utan kunddata. Värden för inloggningsuppgifter visas aldrig.
          vector_store:
            title: Vektorlagring och dokumentsökning
            description: Livekontrollen frågar API:et för hostad vektorlagring, eller testar pgvector-tabellen och skapar en kort embedding utan att spara den.
