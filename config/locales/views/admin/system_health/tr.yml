        ai:
          run_checks: Kontrolleri yeniden çalıştır
          last_checked: Canlı kontroller %{time_ago} önce tamamlandı. Sonuçlar kısa süreliğine önbelleğe alınır.
          not_checked_help: Hizmetin çalıştığını doğrulamak için AI durum URL'sini doğrudan açın veya kontrolleri çalıştırın.
          alerts:
            custom_openai:
              title: Barındırılan vektör deposu kontrolü bu özel uç noktada başarısız oldu
              message: Yapılandırılan uç nokta /v1/vector_stores canlılık kontrolünü geçemedi. Yerel ve OpenAI uyumlu uç noktaların çoğu bu API'yi uygulamaz. Sohbet ve PDF işleme yine de çalışabilir; olağan yerel kurulum için pgvector'ı ayrı bir embedding uç noktasıyla kullanın. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            function_calling_unsupported:
              title: Model fonksiyon çağırmayı desteklemiyor
              message: Uç nokta düz bir sohbet isteğini yanıtladı ancak tools parametresini içeren aynı isteği reddetti. AI asistanı hesapları, işlemleri ve varlıkları fonksiyon çağrılarıyla okur; bu nedenle model araçları destekleyen bir model olana kadar sohbet — çoğu zaman yardımcı olmayan bir 404 hatasıyla — başarısız olmaya devam eder. Sağlayıcısı fonksiyon çağırma desteğini belgeleyen bir model seçin. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            function_calling_not_used:
              title: Model, çağırması istenen aracı çağırmadan yanıt verdi
              message: Uç nokta tools parametresini kabul etti, ancak model sağlık kontrolü aracını çağırmak yerine metinle yanıt verdi. AI asistanı araç çağrıları olmadan finansal verileri okuyamaz, bu yüzden sohbet boş yanıt verebilir veya uydurma rakamlar sunabilir. Sağlayıcısı fonksiyon çağırma desteğini belgeleyen bir model tercih edin.
            llm_probe_failed:
              title: LLM canlı kontrolü başarısız oldu
              message: Sure, yapılandırılan uç noktayı ve modeli birlikte doğrulayamadı. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            llm_model_not_available:
              title: Yapılandırılan AI modeli kullanılamıyor
              message: Uç nokta yanıt verdi, ancak yapılandırılan modeli listelemedi veya sunmadı. Seçilen sağlayıcı için aktif bir model seçin, ardından kontrolleri yeniden çalıştırın. OpenAI uyumlu bir çeviri katmanı üzerinden Gemini kullanıyorsanız gemini-2.5-flash gibi şu anda desteklenen bir model kullanın.
            pdf_text_extraction_failed:
              title: Sentetik PDF metin çıkarma kontrolü başarısız oldu
              message: Sure, gömülü PDF metnini yerel olarak çıkarıp yapılandırılan modele gönderen metin öncelikli yolu tamamlayamadı. Hiçbir müşteri verisi gönderilmedi. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            pdf_vision_processing_failed:
              title: Sentetik PDF görsel/yerel işleme kontrolü başarısız oldu
              message: Sure, görüntü veya yerel belge PDF yolunu yapılandırılan model üzerinden tamamlayamadı. Hiçbir müşteri verisi gönderilmedi. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            vector_probe_failed:
              title: Belge arama canlı kontrolü başarısız oldu
              message: Sure, seçilen vektör deposunu ve gerekli tüm embedding hizmetlerini doğrulayamadı. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            pgvector_extension_not_enabled:
              title: PostgreSQL vector uzantısı etkin değil
              message: pgvector adaptörü seçili, ancak PostgreSQL bu veritabanı için vector uzantısını etkinleştirmemiş. pgvector içeren bir PostgreSQL imajı kullanın, ardından uzantıyı veritabanı sahibi veya süper kullanıcı olarak etkinleştirin ve migration'ları VECTOR_STORE_PROVIDER=pgvector ile yeniden çalıştırın.
            pgvector_table_not_found:
              title: vector_store_chunks tablosu eksik
              message: pgvector uzantısı etkin, ancak parça (chunk) tablosu bulunamadı. Migration durumunu kontrol edin, ardından Sure'un vector_store_chunks tablosunu oluşturabilmesi için vektör deposu migration'ını VECTOR_STORE_PROVIDER=pgvector ile yeniden çalıştırın.
            pgvector_probe_failed:
              title: pgvector depolama kontrolü başarısız oldu
              message: Sure, pgvector parça tablosunu sorgulayamadı. PostgreSQL izinlerini, vector uzantısını ve vector_store_chunks migration'ını kontrol edin. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            embedding_dimensions_mismatch:
              title: Embedding boyutları eşleşmiyor
              message: Embedding uç noktası, uzunluğu EMBEDDING_DIMENSIONS ile eşleşmeyen bir vektör döndürdü. EMBEDDING_MODEL ve EMBEDDING_DIMENSIONS değerlerini modelin belgelenmiş vektör boyutuna ayarlayın, ortam değişkenlerinin kalıcı olması için Sure'u yeniden başlatın, ardından pgvector embedding sütununu/tablosunu değiştirin veya yeniden oluşturun ve mevcut veriler farklı bir boyut kullanıyorsa belgeleri yeniden embed edin.
            embedding_probe_timeout:
              title: Embedding canlı kontrolü zaman aşımına uğradı
              message: Embedding uç noktası AI_HEALTH_PROBE_TIMEOUT süresi dolmadan yanıt vermedi. Sağlayıcı yavaşsa bu sağlık kontrolü zaman aşımını artırın, ardından ortam değişkenlerinin her işlemde kalıcı olması için Sure'u yeniden başlatın. Normal AI sohbet çağrıları da zaman aşımına uğruyorsa OPENAI_REQUEST_TIMEOUT değerini ayrıca yükseltin.
            embedding_probe_failed:
              title: Embedding canlı kontrolü başarısız oldu
              message: Sure, yapılandırılan uç nokta ve model üzerinden kısa bir test embedding'i oluşturamadı. EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN değerlerini ve embedding sağlayıcısının günlüklerini kontrol edin. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
            qdrant:
              title: Qdrant desteği henüz uygulanmadı
              message: Qdrant adaptörünün iskeleti hazır, ancak belge yükleme ve arama işlemleri şu anda başarısız oluyor. Belge arama için OpenAI veya pgvector seçin.
            missing_vector_store:
              title: Hiçbir vektör deposu yapılandırılmamış
              message: Bir vektör deposu adaptörü ve gereksinimleri yapılandırılana kadar yüklenen belgeler dizine eklenemez veya aranamaz.
            unavailable_vector_store:
              title: Seçilen vektör deposu kullanılamıyor
              message: Aşağıdaki adaptör gereksinimlerini kontrol edin. pgvector için veritabanı vector uzantısını veya mevcut bir vector_store_chunks tablosunu sağlamalıdır.
          llm:
            title: LLM ve PDF işleme
            description: Canlı kontroller yapılandırılan modeli doğrular, asistanın yaptığı gibi ondan basit bir fonksiyon çağrısı ister, ardından müşteri verisi içermeyen tek sayfalık sentetik bir PDF ile metin çıkarmayı ve görsel/yerel işlemeyi ayrı ayrı sınar. Kimlik bilgisi değerleri asla gösterilmez.
          vector_store:
            title: Vektör deposu ve belge arama
            description: Canlı kontrol, barındırılan vektör deposu API'sini sorgular veya pgvector tablosunu test edip saklamadan kısa bir embedding oluşturur.
