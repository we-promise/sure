---
tr:
  admin:
    system_health:
      push_notification:
        body: Bu, Sure hesabınız için bir test anlık bildirimidir.
        title: Sure test bildirimi
      push_notifications:
        columns:
          checked_at: Son güncelleme
          device: Cihaz
          environment: APNs ortamı
          status: Sonuç
        device: Cihaz %{number}
        environments:
          production: Production
          sandbox: Sandbox
        messages:
          cooldown: Yeni bir test göndermeden önce lütfen 30 saniye bekleyin.
          disabled: Anlık bildirim gönderimi operatör tarafından devre dışı bırakıldı.
          enqueue_failed: Test kuyruğa alınamadı. Sidekiq'i kontrol edin ve aşağıdaki
            sonuçları yenileyin.
          hosted_only: Anlık bildirimler yalnızca barındırılan modda kullanılabilir.
          ineligible: Test bildirimini yalnızca aktif bir süper yönetici gönderebilir.
          no_devices: Test göndermek için bu hesapta Sure iOS uygulamasından anlık
            bildirimleri etkinleştirin.
          not_configured: APNs kimlik bilgileri yapılandırılmamış.
          queued: Test bildirimi kuyruğa alındı. Durumunu görmek için aşağıdaki sonuçları
            yenileyin.
          ready: Hesabınıza kayıtlı, bildirimleri etkin iOS cihazlarına bir test bildirimi
            gönderin.
          storage_unavailable: Test isteği kaydedilemedi. Paylaşılan önbellek yapılandırmasını
            kontrol edin.
        pending: Beklemede
        queueing: Kuyruğa alınıyor…
        refresh: Sonuçları yenile
        requested_at: Son test isteği %{time}
        result_help: APNs tarafından kabul edilmesi, bildirimin cihazınıza ulaştığını
          doğrulamaz. Çalışan sonuçlarını görmek için yenileyin. Sonuçlar 24 saat
          saklanır.
        results_label: Test sonuçları
        send_test: Test anlık bildirimi gönder
        statuses:
          accepted: APNs tarafından kabul edildi
          enqueue_failed: Kuyruğa alınamadı; Sidekiq'i kontrol edin
          expired: Kesin sonuç alınmadan süresi doldu
          failed: Başarısız; push hata ayıklama günlüklerini kontrol edin
          queued: Kuyrukta
          rejected: APNs tarafından reddedildi; push hata ayıklama günlüklerini kontrol
            edin
          retrying: Geçici bir hata nedeniyle yeniden deneniyor
          skipped: 'Atlandı: artık uygun değil'
          unregistered: Cihaz kaydı artık geçerli değil
        title: Anlık bildirimler
      show:
        ai:
          adapters:
            openai: OpenAI barındırılan vektör deposu
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Yapılandırılan uç nokta /v1/vector_stores canlılık kontrolünü
                geçemedi. Yerel ve OpenAI uyumlu uç noktaların çoğu bu API'yi uygulamaz.
                Sohbet ve PDF işleme yine de çalışabilir; olağan yerel kurulum için
                pgvector'ı ayrı bir embedding uç noktasıyla kullanın. Hata, Ayarlar
                → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
              title: Barındırılan vektör deposu kontrolü bu özel uç noktada başarısız
                oldu
            embedding_dimensions_mismatch:
              message: Embedding uç noktası, uzunluğu EMBEDDING_DIMENSIONS ile eşleşmeyen
                bir vektör döndürdü. EMBEDDING_MODEL ve EMBEDDING_DIMENSIONS değerlerini
                modelin belgelenmiş vektör boyutuna ayarlayın, ortam değişkenlerinin
                kalıcı olması için Sure'u yeniden başlatın, ardından pgvector embedding
                sütununu/tablosunu değiştirin veya yeniden oluşturun ve mevcut veriler
                farklı bir boyut kullanıyorsa belgeleri yeniden embed edin.
              title: Embedding boyutları eşleşmiyor
            embedding_probe_failed:
              message: Sure, yapılandırılan uç nokta ve model üzerinden kısa bir test
                embedding'i oluşturamadı. EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN
                değerlerini ve embedding sağlayıcısının günlüklerini kontrol edin.
                Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
              title: Embedding canlı kontrolü başarısız oldu
            embedding_probe_timeout:
              message: Embedding uç noktası AI_HEALTH_PROBE_TIMEOUT süresi dolmadan
                yanıt vermedi. Sağlayıcı yavaşsa bu sağlık kontrolü zaman aşımını
                artırın, ardından ortam değişkenlerinin her işlemde kalıcı olması
                için Sure'u yeniden başlatın. Normal AI sohbet çağrıları da zaman
                aşımına uğruyorsa OPENAI_REQUEST_TIMEOUT değerini ayrıca yükseltin.
              title: Embedding canlı kontrolü zaman aşımına uğradı
            function_calling_not_used:
              message: Uç nokta tools parametresini kabul etti, ancak model sağlık
                kontrolü aracını çağırmak yerine metinle yanıt verdi. AI asistanı
                araç çağrıları olmadan finansal verileri okuyamaz, bu yüzden sohbet
                boş yanıt verebilir veya uydurma rakamlar sunabilir. Sağlayıcısı fonksiyon
                çağırma desteğini belgeleyen bir model tercih edin.
              title: Model, çağırması istenen aracı çağırmadan yanıt verdi
            function_calling_unsupported:
              message: Uç nokta düz bir sohbet isteğini yanıtladı ancak tools parametresini
                içeren aynı isteği reddetti. AI asistanı hesapları, işlemleri ve varlıkları
                fonksiyon çağrılarıyla okur; bu nedenle model araçları destekleyen
                bir model olana kadar sohbet — çoğu zaman yardımcı olmayan bir 404
                hatasıyla — başarısız olmaya devam eder. Sağlayıcısı fonksiyon çağırma
                desteğini belgeleyen bir model seçin. Hata, Ayarlar → Hata ayıklama
                günlükleri ve Rails.logger'a kaydedildi.
              title: Model fonksiyon çağırmayı desteklemiyor
            llm_model_not_available:
              message: Uç nokta yanıt verdi, ancak yapılandırılan modeli listelemedi
                veya sunmadı. Seçilen sağlayıcı için aktif bir model seçin, ardından
                kontrolleri yeniden çalıştırın. OpenAI uyumlu bir çeviri katmanı üzerinden
                Gemini kullanıyorsanız gemini-2.5-flash gibi şu anda desteklenen bir
                model kullanın.
              title: Yapılandırılan AI modeli kullanılamıyor
            llm_probe_failed:
              message: Sure, yapılandırılan uç noktayı ve modeli birlikte doğrulayamadı.
                Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
              title: LLM canlı kontrolü başarısız oldu
            missing_vector_store:
              message: Bir vektör deposu adaptörü ve gereksinimleri yapılandırılana
                kadar yüklenen belgeler dizine eklenemez veya aranamaz.
              title: Hiçbir vektör deposu yapılandırılmamış
            pdf_text_extraction_failed:
              message: Sure, gömülü PDF metnini yerel olarak çıkarıp yapılandırılan
                modele gönderen metin öncelikli yolu tamamlayamadı. Hiçbir müşteri
                verisi gönderilmedi. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a
                kaydedildi.
              title: Sentetik PDF metin çıkarma kontrolü başarısız oldu
            pdf_vision_processing_failed:
              message: Sure, görüntü veya yerel belge PDF yolunu yapılandırılan model
                üzerinden tamamlayamadı. Hiçbir müşteri verisi gönderilmedi. Hata,
                Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
              title: Sentetik PDF görsel/yerel işleme kontrolü başarısız oldu
            pgvector_extension_not_enabled:
              message: pgvector adaptörü seçili, ancak PostgreSQL bu veritabanı için
                vector uzantısını etkinleştirmemiş. pgvector içeren bir PostgreSQL
                imajı kullanın, ardından uzantıyı veritabanı sahibi veya süper kullanıcı
                olarak etkinleştirin ve migration'ları VECTOR_STORE_PROVIDER=pgvector
                ile yeniden çalıştırın.
              title: PostgreSQL vector uzantısı etkin değil
            pgvector_probe_failed:
              message: Sure, pgvector parça tablosunu sorgulayamadı. PostgreSQL izinlerini,
                vector uzantısını ve vector_store_chunks migration'ını kontrol edin.
                Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a kaydedildi.
              title: pgvector depolama kontrolü başarısız oldu
            pgvector_table_not_found:
              message: pgvector uzantısı etkin, ancak parça (chunk) tablosu bulunamadı.
                Migration durumunu kontrol edin, ardından Sure'un vector_store_chunks
                tablosunu oluşturabilmesi için vektör deposu migration'ını VECTOR_STORE_PROVIDER=pgvector
                ile yeniden çalıştırın.
              title: vector_store_chunks tablosu eksik
            qdrant:
              message: Qdrant adaptörünün iskeleti hazır, ancak belge yükleme ve arama
                işlemleri şu anda başarısız oluyor. Belge arama için OpenAI veya pgvector
                seçin.
              title: Qdrant desteği henüz uygulanmadı
            unavailable_vector_store:
              message: Aşağıdaki adaptör gereksinimlerini kontrol edin. pgvector için
                veritabanı vector uzantısını veya mevcut bir vector_store_chunks tablosunu
                sağlamalıdır.
              title: Seçilen vektör deposu kullanılamıyor
            vector_probe_failed:
              message: Sure, seçilen vektör deposunu ve gerekli tüm embedding hizmetlerini
                doğrulayamadı. Hata, Ayarlar → Hata ayıklama günlükleri ve Rails.logger'a
                kaydedildi.
              title: Belge arama canlı kontrolü başarısız oldu
          failure_codes:
            dimensions_mismatch: Embedding vektör boyutları yapılandırılan boyutlarla
              eşleşmiyor
            extension_not_enabled: PostgreSQL vector uzantısı etkin değil
