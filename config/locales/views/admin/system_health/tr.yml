          worker:
            title: Çalışan doğrulaması
            description: Yukarıdaki kontroller bu web işleminden çalıştırıldı. AI işlerinin çoğu -- asistan yanıtları, PDF işleme, embedding'ler, otomatik kategorizasyon ve satıcı tespiti -- aslında bir Sidekiq çalışan işleminde yürütülür; bu işlemin ağ erişimi, DNS, proxy kuralları, hatta yüklenen kimlik bilgileri farklı olabilir. Bir çalışanın kendi yapılandırmasını ve bağlantısını doğrulamak için bir kontrolü kuyruğa alın.
            verify_button: Çalışan yapılandırmasını doğrula
            coverage_notice: Her kontrol yalnızca tek bir çalışan işlemini -- kontrolü kuyruktan alanı -- doğrular. Birden fazla çalışan replikası varsa, başarılı bir sonuç her çalışanın sağlıklı olduğunu doğrulamaz; başka bir örnek almak için kontrolü yeniden kuyruğa alın.
            empty:
              title: Henüz hiçbir çalışan kontrol bildirmedi
              description: Eşzamansız bir kontrolü kuyruğa almak için "Çalışan yapılandırmasını doğrula" düğmesine tıklayın. Sonuç, bir çalışan işlemi onu aldığında burada görünür.
            labels:
              process: Çalışan işlemi
              checked_at: Kontrol zamanı
              configuration: Yapılandırma
            configuration_statuses:
              match: Web ile aynı
              mismatch: Web'den farklı
            statuses:
              passing: Başarılı
              failing: Başarısız
              stale: Güncel değil
            settings_origin:
              title: Hangi ayarlar yeniden başlatma gerektirir?
              database_backed: Ayarlar → Kendi Barındırma bölümünde değiştirilen sağlayıcı, model ve API anahtarı ayarları veritabanında saklanır. rails-settings-cached yazma sırasında paylaşılan önbelleği geçersiz kılar; böylece hem web hem de çalışan bir sonraki istek veya kuyruğa alınan iş için yeni değeri kullanır -- yeniden başlatma gerekmez.
              env_backed: Embedding yapılandırması ve yalnızca bir ortam değişkeniyle ayarlanan her değer, her container başlatıldığında sabitlenir. Rails başka bir container'ın ortamını değiştiremez; bu nedenle bunları değiştirmek hem web hem de çalışan servislerinin yeniden başlatılmasını veya yeniden oluşturulmasını gerektirir -- ve bunlardan yalnızca birini yeniden başlatan dağıtım araçları (kısmi dağıtım, pod yeniden başlatılmadan güncellenen bir Secret) değişikliği almaz.
          local_setup:
            title: Önerilen yerel kurulum
            description: LLM'i yerel OpenAI uyumlu uç noktanız üzerinden çalıştırın, belge vektörlerini pgvector'da saklayın ve embedding ayarlarını OpenAI uyumlu bir embedding uç noktasına yönlendirin. PostgreSQL imajı vector uzantısını içermeli ve embedding boyutları seçilen modelle eşleşmelidir.
