          explicitly_disabled: "SKYLIGHT_ENABLED disabilita esplicitamente il monitoraggio."
          self_hosted_checkout_disabled: "Il pagamento degli abbonamenti e il portale di fatturazione sono disabilitati in modalità self-hosted. I webhook Stripe possono comunque essere configurati; in questo caso non sono richiesti gli ID dei prezzi per il checkout."
          browser_analytics_disabled: "Le statistiche nel browser sono disabilitate in questo ambiente. Questo non disabilita il client server configurato separatamente."
          shared_feedback_configured: "I feedback nella versione self-hosted utilizzano un progetto separato incluso nell'applicazione, abilitato dalla relativa configurazione. Non richiedono una POSTHOG_KEY dell'operatore. La rinuncia nel browser e la disponibilità dell'SDK non vengono controllate."
          shared_feedback_disabled: "Il progetto separato dei feedback self-hosted è disabilitato dalle relative impostazioni o da quelle dell'ambiente. Questo non disabilita le statistiche gestite dall'operatore."
