            missing: Non configurato
          failure_codes:
            model_not_available: Il modello configurato non è stato restituito dal provider
            no_tool_call: Il modello ha risposto senza chiamare lo strumento di controllo
            tools_refused: Il servizio ha gestito la stessa richiesta senza tools e l'ha rifiutata con i tools
            invalid_response: Il servizio ha restituito una risposta inattesa
            dimensions_mismatch: Le dimensioni del vettore di embedding non corrispondono a quelle configurate
            extension_not_enabled: L'estensione vector di PostgreSQL non è abilitata
            table_not_found: La tabella vector_store_chunks non è stata trovata
            render_missing_binary: Il renderer pdftoppm (poppler-utils) non è disponibile in questo container
            timeout: Il servizio non ha risposto entro il timeout del controllo
            request_failed: La richiesta al servizio non è riuscita
            unsupported_provider: Il provider non supporta questo controllo
          worker:
            title: Verifica del worker
            description: I controlli sopra sono stati eseguiti da questo processo web. La maggior parte del lavoro AI (risposte dell'assistente, elaborazione dei PDF, embedding, categorizzazione automatica e rilevamento degli esercenti) viene in realtà eseguita in un processo worker Sidekiq, che può differire per accesso alla rete, DNS, regole del proxy o persino credenziali caricate. Metti in coda un controllo per verificare la configurazione e la connettività del worker stesso.
            verify_button: Verifica configurazione del worker
            coverage_notice: Ogni controllo verifica esattamente un processo worker, quello che lo preleva dalla coda. Con più repliche del worker, un risultato positivo non conferma che tutti i worker siano integri; rimetti in coda il controllo per campionarne un altro.
            empty:
              title: Nessun worker ha ancora risposto
              description: Fai clic su "Verifica configurazione del worker" per mettere in coda un controllo asincrono. Il risultato apparirà qui non appena un processo worker lo prenderà in carico.
            labels:
              process: Processo worker
              checked_at: Verificato
              configuration: Configurazione
            configuration_statuses:
              match: Uguale al web
              mismatch: Diversa dal web
            statuses:
              passing: Superato
              failing: Non riuscito
              stale: Obsoleto
            settings_origin:
              title: Quali impostazioni richiedono un riavvio?
              database_backed: Le impostazioni di provider, modello e chiave API modificate in Impostazioni → Self-Hosting sono salvate nel database. rails-settings-cached invalida la cache condivisa a ogni scrittura, quindi sia il web sia il worker leggono il nuovo valore dalla richiesta o dal job in coda successivi, senza bisogno di riavvii.
              env_backed: La configurazione degli embedding, e qualsiasi valore impostato solo tramite una variabile d'ambiente, viene fissata all'avvio di ciascun container. Rails non può modificare l'ambiente di un altro container, quindi per cambiarli occorre riavviare o ricreare sia il servizio web sia il worker. Qualsiasi strumento di deployment che ne riavvia solo uno (rollout parziale, un Secret aggiornato senza riavviare il pod) non applicherà la modifica.
          local_setup:
            title: Configurazione locale consigliata
            description: Esegui l'LLM tramite il tuo endpoint locale compatibile con OpenAI, salva i vettori dei documenti in pgvector e punta le impostazioni di embedding a un endpoint di embedding compatibile con OpenAI. L'immagine PostgreSQL deve includere l'estensione vector e le dimensioni degli embedding devono corrispondere al modello selezionato.
