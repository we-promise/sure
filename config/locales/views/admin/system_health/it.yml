          worker:
            labels:
              checked_at: Verificato
              configuration: Configurazione
              process: Processo di lavoro
            configuration_statuses:
              match: Corrisponde al processo web
              mismatch: Differisce dal processo web
            coverage_notice: Ogni controllo verifica un solo processo di lavoro, quello
              che lo preleva dalla coda. Con più repliche, un risultato positivo non
              conferma lo stato di tutti i processi; accoda di nuovo il controllo
              per verificarne un altro.
            description: I controlli qui sopra sono stati eseguiti da questo processo
              web. Gran parte del lavoro AI — risposte dell'assistente, elaborazione
              PDF, embedding, classificazione automatica e rilevamento degli esercenti
              — viene eseguita da un processo Sidekiq, che può avere accesso alla
              rete, DNS, regole proxy o persino credenziali caricate differenti. Accoda
              un controllo per verificare configurazione e connettività del processo
              di lavoro.
            empty:
              description: Fai clic su «Verifica configurazione del processo di lavoro»
                per accodare un controllo asincrono. Il risultato appare qui quando
                un processo lo prende in carico.
              title: Nessun processo di lavoro ha ancora risposto
            settings_origin:
              database_backed: Le impostazioni di provider, modello e chiave API modificate
                in Impostazioni → Hosting autonomo vengono salvate nel database. rails-settings-cached
                invalida la cache condivisa alla scrittura, quindi sia il processo
                web sia quello di lavoro useranno il nuovo valore alla richiesta o
                attività successiva, senza riavvio.
              env_backed: La configurazione degli embedding e qualsiasi valore impostato
                solo tramite variabile d'ambiente sono fissati all'avvio di ciascun
                container. Rails non può cambiare l'ambiente di un altro container,
                quindi queste modifiche richiedono il riavvio o la ricreazione sia
                del servizio web sia di quello di lavoro. Gli strumenti di distribuzione
                che ne riavviano solo uno, come un rilascio parziale o un Secret aggiornato
                senza riavvio del pod, non applicheranno la modifica.
              title: Quali impostazioni richiedono un riavvio?
            statuses:
              failing: Non funzionante
              passing: Funzionante
              stale: Non aggiornato
            title: Verifica del processo di lavoro
            verify_button: Verifica configurazione del processo di lavoro
          adapters:
            openai: Archivio vettoriale ospitato da OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: L'endpoint configurato non ha superato il controllo di disponibilità
                di /v1/vector_stores. La maggior parte degli endpoint locali e compatibili
                con OpenAI non implementa questa API. La chat e l'elaborazione PDF
                potrebbero comunque funzionare; per la normale configurazione locale,
                usa pgvector con un endpoint separato per gli embedding. L'errore
                è stato registrato in Impostazioni → Log di debug e in Rails.logger.
              title: Il controllo dell'archivio vettoriale ospitato è fallito su questo
                endpoint personalizzato
            embedding_dimensions_mismatch:
              message: L'endpoint degli embedding ha restituito un vettore la cui
                lunghezza non corrisponde a EMBEDDING_DIMENSIONS. Imposta EMBEDDING_MODEL
                e EMBEDDING_DIMENSIONS secondo la dimensione vettoriale documentata
                del modello, riavvia Sure per applicare l'ambiente, quindi modifica
                o ricrea la colonna/tabella degli embedding pgvector e rigenera gli
                embedding dei documenti se i dati esistenti usavano una dimensione
                diversa.
              title: Le dimensioni degli embedding non corrispondono
            embedding_probe_failed:
              message: Sure non ha potuto creare un breve embedding di prova tramite
                l'endpoint e il modello configurati. Controlla EMBEDDING_URI_BASE,
                EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN e i log del provider degli
                embedding. L'errore è stato registrato in Impostazioni → Log di debug
                e in Rails.logger.
              title: Il controllo in tempo reale degli embedding è fallito
            embedding_probe_timeout:
              message: L'endpoint degli embedding non ha risposto entro AI_HEALTH_PROBE_TIMEOUT.
                Aumenta questo timeout se il provider è lento, poi riavvia Sure per
                applicare l'ambiente a ogni processo. Se anche le normali richieste
                alla chat AI scadono, aumenta separatamente OPENAI_REQUEST_TIMEOUT.
              title: Il controllo in tempo reale degli embedding è scaduto
            function_calling_not_used:
              message: L'endpoint ha accettato il parametro tools, ma il modello ha
                risposto con testo anziché chiamare lo strumento di controllo. L'assistente
                AI non può leggere i dati finanziari senza chiamate agli strumenti,
                quindi la chat potrebbe non rispondere o fornire cifre inventate.
                Preferisci un modello il cui provider documenti il supporto alle chiamate
                di funzione.
              title: Il modello ha risposto senza chiamare lo strumento richiesto
            function_calling_unsupported:
              message: L'endpoint ha servito una richiesta di chat semplice ma ha
                rifiutato la stessa richiesta con il parametro tools. L'assistente
                AI legge conti, transazioni e posizioni tramite chiamate di funzione,
                quindi la chat continuerà a fallire, spesso con un errore 404 poco
                informativo, finché non viene scelto un modello che supporta gli strumenti.
                Scegli un modello il cui provider documenti tale supporto. L'errore
                è stato registrato in Impostazioni → Log di debug e in Rails.logger.
              title: Il modello non supporta le chiamate di funzione
            llm_model_not_available:
              message: L'endpoint ha risposto, ma non ha elencato né servito il modello
                configurato. Scegli un modello attivo per il provider selezionato
                e ripeti i controlli. Per Gemini tramite un livello di compatibilità
                OpenAI, usa un modello attualmente supportato, ad esempio gemini-2.5-flash.
              title: Il modello AI configurato non è disponibile
            llm_probe_failed:
              message: Sure non ha potuto verificare sia l'endpoint sia il modello
                configurati. L'errore è stato registrato in Impostazioni → Log di
                debug e in Rails.logger.
              title: Il controllo in tempo reale del modello LLM è fallito
            missing_vector_store:
              message: I documenti caricati non possono essere indicizzati né cercati
                finché non vengono configurati un adattatore per l'archivio vettoriale
                e i relativi requisiti.
              title: Nessun archivio vettoriale configurato
            pdf_text_extraction_failed:
              message: Sure non ha potuto completare il percorso che estrae localmente
                il testo incorporato nel PDF e lo invia al modello configurato. Non
                sono stati inviati dati dei clienti. L'errore è stato registrato in
                Impostazioni → Log di debug e in Rails.logger.
              title: Il controllo di estrazione del testo dal PDF sintetico è fallito
            pdf_vision_processing_failed:
              message: Sure non ha potuto completare l'elaborazione del PDF come immagini
                o documento nativo tramite il modello configurato. Non sono stati
                inviati dati dei clienti. L'errore è stato registrato in Impostazioni
                → Log di debug e in Rails.logger.
              title: Il controllo visivo/nativo del PDF sintetico è fallito
            pgvector_extension_not_enabled:
              message: È selezionato l'adattatore pgvector, ma PostgreSQL non ha abilitato
                l'estensione vector per questo database. Usa un'immagine PostgreSQL
                che includa pgvector, abilita l'estensione come proprietario del database
                o superutente e riesegui le migrazioni con VECTOR_STORE_PROVIDER=pgvector.
              title: L'estensione vector di PostgreSQL non è abilitata
            pgvector_probe_failed:
              message: Sure non ha potuto interrogare la tabella dei frammenti pgvector.
                Controlla i permessi PostgreSQL, l'estensione vector e la migrazione
                vector_store_chunks. L'errore è stato registrato in Impostazioni →
                Log di debug e in Rails.logger.
              title: Il controllo dell'archivio pgvector è fallito
            pgvector_table_not_found:
              message: L'estensione pgvector è abilitata, ma la tabella dei frammenti
                non è stata trovata. Controlla lo stato delle migrazioni, poi riesegui
                la migrazione dell'archivio vettoriale con VECTOR_STORE_PROVIDER=pgvector
                affinché Sure possa creare vector_store_chunks.
              title: La tabella vector_store_chunks è assente
            qdrant:
              message: 'L''adattatore Qdrant ha solo una struttura preliminare: caricamento
                e ricerca dei documenti al momento non funzionano. Seleziona OpenAI
                o pgvector per la ricerca dei documenti.'
              title: Il supporto Qdrant non è ancora implementato
            unavailable_vector_store:
              message: Controlla i requisiti dell'adattatore qui sotto. Per pgvector,
                il database deve fornire l'estensione vector o una tabella vector_store_chunks
                già esistente.
              title: L'archivio vettoriale selezionato non è disponibile
            vector_probe_failed:
              message: Sure non ha potuto verificare l'archivio vettoriale selezionato
                e tutti i servizi di embedding necessari. L'errore è stato registrato
                in Impostazioni → Log di debug e in Rails.logger.
              title: Il controllo in tempo reale della ricerca documenti è fallito
          failure_codes:
            dimensions_mismatch: Le dimensioni del vettore di embedding non corrispondono
