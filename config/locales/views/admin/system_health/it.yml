        ai:
          run_checks: Esegui di nuovo i controlli
          last_checked: Controlli live completati %{time_ago} fa. I risultati vengono memorizzati in cache per poco tempo.
          not_checked_help: Apri direttamente l'URL dello stato AI o esegui i controlli per verificare che i servizi siano attivi.
          alerts:
            custom_openai:
              title: Il controllo del vector store hosted non è riuscito su questo endpoint personalizzato
              message: L'endpoint configurato non ha superato il controllo di disponibilità /v1/vector_stores. La maggior parte degli endpoint locali e compatibili con OpenAI non implementa questa API. La chat e l'elaborazione dei PDF potrebbero comunque funzionare; per la tipica configurazione locale usa pgvector con un endpoint di embedding separato. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            function_calling_unsupported:
              title: Il modello non supporta il function calling
              message: L'endpoint ha gestito una semplice richiesta di chat ma ha rifiutato la stessa richiesta con il parametro tools. L'assistente AI legge conti, transazioni e posizioni tramite chiamate di funzione, quindi la chat continuerà a fallire (spesso con un 404 poco utile) finché non userai un modello che supporta i tools. Scegli un modello il cui provider documenta il supporto al function calling. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            function_calling_not_used:
              title: Il modello ha risposto senza chiamare lo strumento richiesto
              message: L'endpoint ha accettato il parametro tools, ma il modello ha risposto con del testo invece di chiamare lo strumento di controllo. Senza chiamate agli strumenti l'assistente AI non può leggere i dati finanziari, quindi la chat potrebbe non rispondere o rispondere con cifre inventate. Preferisci un modello il cui provider documenta il supporto al function calling.
            llm_probe_failed:
              title: Il controllo live dell'LLM non è riuscito
              message: Sure non è riuscito a verificare sia l'endpoint sia il modello configurati. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            llm_model_not_available:
              title: Il modello AI configurato non è disponibile
              message: L'endpoint ha risposto, ma non ha elencato né servito il modello configurato. Scegli un modello attivo per il provider selezionato, poi esegui di nuovo i controlli. Per Gemini tramite un livello di traduzione compatibile con OpenAI, usa un modello attualmente supportato come gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Il controllo di estrazione del testo da PDF sintetico non è riuscito
              message: Sure non è riuscito a completare il percorso basato sul testo, che estrae localmente il testo incorporato nel PDF e lo invia al modello configurato. Non è stato inviato alcun dato dei clienti. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            pdf_vision_processing_failed:
              title: Il controllo vision/nativo su PDF sintetico non è riuscito
              message: Sure non è riuscito a completare il percorso PDF tramite immagini o documento nativo con il modello configurato. Non è stato inviato alcun dato dei clienti. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            vector_probe_failed:
              title: Il controllo live della ricerca nei documenti non è riuscito
              message: Sure non è riuscito a verificare il vector store selezionato e tutti i servizi di embedding richiesti. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            pgvector_extension_not_enabled:
              title: L'estensione vector di PostgreSQL non è abilitata
              message: È selezionato l'adapter pgvector, ma PostgreSQL non ha abilitato l'estensione vector per questo database. Usa un'immagine PostgreSQL che includa pgvector, poi abilita l'estensione come proprietario del database o superuser ed esegui di nuovo le migrazioni con VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: La tabella vector_store_chunks è mancante
              message: L'estensione pgvector è abilitata, ma la tabella dei chunk non è stata trovata. Controlla lo stato delle migrazioni, poi esegui di nuovo la migrazione del vector store con VECTOR_STORE_PROVIDER=pgvector in modo che Sure possa creare vector_store_chunks.
            pgvector_probe_failed:
              title: Il controllo dell'archiviazione pgvector non è riuscito
              message: Sure non è riuscito a interrogare la tabella dei chunk pgvector. Controlla i permessi di PostgreSQL, l'estensione vector e la migrazione vector_store_chunks. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            embedding_dimensions_mismatch:
              title: Le dimensioni degli embedding non corrispondono
              message: L'endpoint di embedding ha restituito un vettore la cui lunghezza non corrisponde a EMBEDDING_DIMENSIONS. Imposta EMBEDDING_MODEL ed EMBEDDING_DIMENSIONS sulla dimensione del vettore documentata dal modello, riavvia Sure in modo che l'ambiente venga applicato, poi modifica o ricrea la colonna/tabella di embedding pgvector e rigenera gli embedding dei documenti se i dati esistenti usavano una dimensione diversa.
            embedding_probe_timeout:
              title: Il controllo live degli embedding è andato in timeout
              message: L'endpoint di embedding non ha risposto entro AI_HEALTH_PROBE_TIMEOUT. Aumenta questo timeout del controllo se il provider è lento, poi riavvia Sure in modo che l'ambiente venga applicato in ogni processo. Se vanno in timeout anche le normali chiamate alla chat AI, aumenta separatamente OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Il controllo live degli embedding non è riuscito
              message: Sure non è riuscito a creare un breve embedding di prova tramite l'endpoint e il modello configurati. Controlla EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN e i log del provider di embedding. L'errore è stato registrato in Impostazioni → Log di debug e in Rails.logger.
            qdrant:
              title: Il supporto a Qdrant non è ancora implementato
              message: L'adapter Qdrant è solo predisposto, ma al momento il caricamento e la ricerca dei documenti non funzionano. Seleziona OpenAI o pgvector per la ricerca nei documenti.
            missing_vector_store:
              title: Nessun vector store configurato
              message: I documenti caricati non possono essere indicizzati né cercati finché non vengono configurati un adapter di vector store e i relativi requisiti.
            unavailable_vector_store:
              title: Il vector store selezionato non è disponibile
              message: Controlla i requisiti dell'adapter qui sotto. Per pgvector, il database deve fornire l'estensione vector o una tabella vector_store_chunks esistente.
          llm:
            title: LLM ed elaborazione PDF
            description: I controlli live verificano il modello configurato, gli chiedono una semplice chiamata di funzione come fa l'assistente, poi testano separatamente l'estrazione del testo e l'elaborazione vision/nativa con un PDF sintetico di una pagina che non contiene dati dei clienti. I valori delle credenziali non vengono mai mostrati.
          vector_store:
            title: Vector store e ricerca nei documenti
            description: Il controllo live interroga l'API del vector store hosted, oppure testa la tabella pgvector e crea un breve embedding senza salvarlo.
