      optional_services:
        title: 선택 서비스
        description: 선택적 운영자 통합입니다. 구성되지 않은 서비스는 참고용입니다. 이 검사는 설정만 확인하며, 연결을 테스트하거나
          테스트 이벤트를 보내거나 분석 동의를 변경하지 않습니다. 설정 세부정보를 보려면 서비스를 펼치세요.
        missing_settings: '누락된 설정: %{settings}'
        statuses:
          configured: 구성됨
          not_configured: 구성되지 않음
          incomplete: 불완전한 구성
          disabled: 이 프로세스에서 비활성화됨
          not_checked: 확인되지 않음
        notes:
          environment_disabled: 이 Rails 환경에서는 로드된 통합이 비활성화되었습니다.
          explicitly_disabled: SKYLIGHT_ENABLED는 계측을 명시적으로 비활성화합니다.
          self_hosted_checkout_disabled: 셀프 호스팅 모드에서는 구독 결제와 청구 포털이 비활성화됩니다. Stripe
            웹훅은 계속 구성할 수 있으며, 여기서는 결제 가격 ID가 필요하지 않습니다.
          browser_analytics_disabled: 이 환경에서는 브라우저 분석이 비활성화되어 있습니다. 별도로 구성된 서버 클라이언트는
            비활성화되지 않습니다.
          shared_feedback_configured: 셀프 호스팅 피드백은 별도로 포함된 프로젝트를 사용하며 해당 설정에 따라 활성화됩니다.
            운영자의 POSTHOG_KEY는 필요하지 않습니다. 브라우저의 수집 거부 설정과 SDK 사용 가능 여부는 확인하지 않습니다.
          shared_feedback_disabled: 별도의 셀프 호스팅 피드백 프로젝트가 피드백 또는 환경 설정에 의해 비활성화되었습니다.
            운영자 소유 분석은 비활성화되지 않습니다.
          production_only: 현재 애플리케이션 구성에서는 이 통합이 프로덕션에서만 사용됩니다.
        services:
          langfuse:
            title: Langfuse
            description: 선택적 AI 추적 및 평가 보고입니다. 이 확인 과정에서는 추적이나 평가 요청을 보내지 않습니다.
            guidance: LANGFUSE_PUBLIC_KEY와 LANGFUSE_SECRET_KEY를 함께 설정하세요. LANGFUSE_HOST는
              선택 사항입니다. 이러한 설정을 변경한 후 영향을 받는 서비스를 다시 시작하세요.
          sentry:
            title: Sentry
            description: 선택적 오류 및 성능 보고입니다. 현재 이니셜라이저는 프로덕션에서만 보고를 활성화합니다.
            guidance: SENTRY_DSN을 설정하고 영향을 받는 서비스를 다시 시작하세요. 오류를 캡처하거나 이벤트를 전송하지 않고
              로드된 SDK 구성을 확인합니다.
          skylight:
            title: Skylight
            description: 선택적 애플리케이션 성능 계측. 구성 존재 여부는 에이전트가 실행 중이거나 보고 중인지 확인하지 않습니다.
            guidance: SKYLIGHT_AUTHENTICATION을 설정하고 원하는 Rails 환경에 Skylight가 로드되는지
              확인하세요. SKYLIGHT_ENABLED=false는 계측을 비활성화하며, 이 플래그만으로 gem이 로드되지는 않습니다.
              변경 후 다시 시작하세요.
          stripe:
            title: Stripe
            description: 선택적 구독 청구 및 결제 웹후크. 이 확인은 Stripe 클라이언트를 생성하거나 자격 증명을 확인하거나
              지불 요청을 하지 않습니다.
            guidance: STRIPE_SECRET_KEY와 STRIPE_WEBHOOK_SECRET을 함께 설정합니다. 관리형 구독 결제에도
              STRIPE_MONTHLY_PRICE_ID 및 STRIPE_ANNUAL_PRICE_ID가 필요합니다.
          posthog:
            title: PostHog
            description: 부팅 시 로드된 구성을 사용하는 선택적 운영자 소유 분석입니다. 구성되었다고 해서 사용자가 분석에 동의했다는
              의미는 아닙니다.
            guidance: POSTHOG_KEY와 비어 있지 않은 POSTHOG_HOST를 설정하세요. 기본 호스트를 사용하려면 POSTHOG_HOST를
              설정하지 마세요. 브라우저 분석은 운영 환경에서 사용하거나, 개발 환경에서 POSTHOG_DEVELOPMENT_ENABLED를
              활성화해야 합니다. POSTHOG_FEEDBACK_ENABLED는 운영자 분석이 아니라 별도의 셀프 호스팅 피드백을 제어합니다.
          logtail:
            title: Logtail
            description: 선택 사항인 운영 환경 로그 전달 기능입니다. 설정하지 않으면 애플리케이션은 계속 표준 출력에 로그를
              기록합니다.
            guidance: LOGTAIL_API_KEY 및 LOGTAIL_INGESTING_HOST를 함께 설정하고 영향을 받는 서비스를
              다시 시작합니다. 이 검사에서는 테스트 로그가 생성되지 않습니다.
      configuration:
        description: 이 웹 프로세스에서 확인할 수 있는 설정입니다. 이 검사는 이메일 발송, 제공업체 접속, 파일 업로드·다운로드를
          수행하지 않습니다. '설정됨'은 설정값이 있다는 뜻이며, 실제 발송·제공업체 접근·저장소 접근이 검증되었다는 뜻은 아닙니다.
        statuses:
          configured: 구성됨
          not_configured: 구성되지 않음
          incomplete: 불완전한 구성
          disabled: 사용 안 함
          not_checked: 확인되지 않음
        settings_needed: 검토할 설정
        unknown_provider: 인식할 수 없는 제공업체 선택
        provider_statuses:
          configured: 구성됨
          not_configured: API 키 누락
          invalid: 잘못된 선택
        configure_providers: 자체 호스팅 설정 열기
        storage_backend: '선택한 스토리지: %{backend}'
        storage_backends:
          local: 로컬 디스크
          test: 테스트 디스크
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: S3 호환 스토리지
          google: Google Cloud Storage
          other: 커스텀 또는 인식할 수 없는 백엔드
        checks:
          smtp:
            title: 이메일(SMTP)
            statuses:
              configured: SMTP 설정이 있습니다.
              not_configured: SMTP가 구성되지 않았습니다. 비밀번호 재설정, 초대 및 기타 시스템 이메일은 SMTP를 통해
                보낼 수 없습니다.
              incomplete: 일부 이메일 설정이 누락되었거나 불완전합니다. 시스템 이메일이나 여기에 포함된 링크가 작동하지 않을
                수 있습니다.
              disabled: 실행 중인 메일러 구성에서는 이메일 전달이 비활성화되어 있습니다.
              not_checked: 이 프로세스에서는 개발 미리보기와 같은 SMTP 이외의 전달 방법을 사용합니다. SMTP 배달은 평가되지
                않습니다.
            guidance: 관리 UI에서는 SMTP를 구성할 수 없습니다. 웹 서비스와 작업자 서비스 모두에 대한 이메일 환경 변수를
              설정한 후 둘 다 다시 시작하세요. 인증되지 않은 릴레이의 경우 SMTP_USERNAME 및 SMTP_PASSWORD를 모두
              생략할 수 있습니다.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT(1~65535 사이의 숫자)
              sender: EMAIL_SENDER(기본 sender@sure.local 대체)
              app_domain: APP_DOMAIN(이메일 링크에 사용됨)
              authentication: SMTP_USERNAME 및 SMTP_PASSWORD(둘 다 제공하거나 둘 다 제공하지 않음)
          securities:
            title: 시장 가격
            statuses:
              configured: 활성화된 모든 시장 가격 제공업체에는 구성이 있습니다.
              not_configured: 활성화된 시세 제공업체의 API 키가 없습니다. 해당 제공업체를 통한 종목 자동 검색과 시세
                조회를 사용할 수 없습니다.
              incomplete: 활성화된 시장 시세 제공업체 중 하나 이상의 설정이 누락되었거나 잘못되었습니다. 해당 제공업체에 할당된
                종목의 시세가 업데이트되지 않을 수 있습니다.
              disabled: 활성화된 시세 제공업체가 없습니다. 종목 자동 검색과 시세 조회를 사용할 수 없습니다.
