            description: 로컬 OpenAI 호환 엔드포인트에서 LLM을 실행하고 문서 벡터는 pgvector에 저장하며 임베딩
              설정은 OpenAI 호환 임베딩 엔드포인트를 가리키도록 하세요. PostgreSQL 이미지에는 vector 확장이 포함되어야
              하며 임베딩 차원은 선택한 모델과 일치해야 합니다.
