              not_configured: 사용 가능한 환율 제공업체가 구성되지 않았습니다. 저장된 환율이 누락된 경우 자동 통화 변환을
                사용하지 못할 수 있습니다.
            guidance: 환율 제공업체를 선택하고 자체 호스팅 설정에 필요한 경우 API 키를 추가하거나 배포 환경에서 구성합니다.
              EXCHANGE_RATE_PROVIDER 및 제공업체 API 키 환경 재정의가 우선 적용됩니다.
            issues:
