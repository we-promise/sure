                조회가 실패합니다.
          storage:
            title: 파일 업로드 및 저장
            statuses:
              configured: 저장소 설정이 있습니다. 로컬 디스크에는 클라우드 자격 증명이 필요하지 않습니다.
              not_configured: 선택한 스토리지 백엔드에 일치하는 구성이 없습니다. 파일 업로드가 불가능할 수 있습니다.
              incomplete: 필수 저장소 설정이 누락되었거나 불완전합니다. 파일 업로드 또는 검색이 작동하지 않을 수 있습니다.
              not_checked: 이 백엔드는 외부 자격 증명 검색 또는 맞춤 구성을 사용합니다. 이러한 설정만으로는 액세스 권한을
                결정할 수 없습니다.
            guidance: ACTIVE_STORAGE_SERVICE 및 선택한 백엔드의 배포 설정을 검토하세요. 로컬 디스크에는 웹 및
              작업자 서비스에서 공유하는 영구 저장소가 필요합니다. 백엔드를 변경해도 기존 파일은 마이그레이션되지 않습니다. 마이그레이션을
              별도로 계획하세요.
            issues:
              root: 로컬 저장소 루트
              bucket: 스토리지 버킷
              region: 저장 지역
              credentials: 저장소 액세스 키 및 비밀 키(둘 다 제공하거나 외부 자격 증명 검색 사용)
              endpoint: 스토리지 엔드포인트(및 R2의 경우 CLOUDFLARE_ACCOUNT_ID)
      show:
        title: 시스템 상태
        tabs:
          hosted_usage: 사용량
          background_jobs: 작업
          ai: AI
          configuration: 구성
        alert:
          title: 백그라운드 작업이 실행되고 있지 않습니다.
        status_section_title: Sidekiq 상태
        status_section_description: 동기화, 잔액 및 순자산 계산을 지원하는 백그라운드 작업자의 현재 상태입니다.
        counters_section_title: 작업 카운터
        counters_section_description: 모든 대기열에서 Sidekiq 카운터를 집계합니다.
        queues_section_title: 대기열
        queues_section_description: 대기열별 작업 수와 가장 오래된 작업의 대기 시간입니다. 지연 시간은 가장 오래된
          작업이 기다린 시간(초)입니다.
        labels:
          status: 상태
          processes: 작업자 프로세스
          last_heartbeat: 마지막 상태 신호
          max_queue_latency: 가장 오래된 작업의 대기 시간
          enqueued: 대기열에 추가됨
          retries: 재시도
          failed: 실패
          processed_total: 처리된 합계
          queue: 대기열
          size: 크기
          latency: 대기 시간
        values:
          healthy: 정상
          unhealthy: 저하됨
          time_ago: "%{time_ago} 전"
          never: 없음
          seconds: "%{seconds}초"
          no_queues: 등록된 대기열이 없습니다. 작업자가 실행되고 있지 않을 수 있습니다.
        ai:
          run_checks: 검사를 다시 실행하세요.
          last_checked: 실시간 확인은 %{time_ago} 전에 완료되었습니다. 결과는 잠시 캐시됩니다.
          not_checked_help: AI 상태 URL을 직접 열거나 검사를 실행하여 서비스 활성 상태를 확인하세요.
          loading: 실시간 확인 실행 중…
          alerts:
            custom_openai:
              title: 이 사용자 정의 엔드포인트에서 호스팅된 벡터 저장소 확인에 실패했습니다.
              message: 설정된 엔드포인트가 /v1/vector_stores 응답 검사를 통과하지 못했습니다. 대부분의 로컬 및 OpenAI
                호환 엔드포인트는 해당 API를 구현하지 않습니다. 채팅과 PDF 처리는 계속 작동할 수 있습니다. 일반적인 로컬 구성에서는
                pgvector와 별도의 임베딩 엔드포인트를 사용하세요. 실패 내용은 설정 → 디버그 로그 및 Rails.logger에
                기록되었습니다.
            function_calling_unsupported:
              title: 모델이 함수 호출을 지원하지 않습니다.
              message: 엔드포인트가 일반 채팅 요청에는 응답했지만 tools 매개변수가 포함된 같은 요청은 거부했습니다. AI 어시스턴트는
                함수 호출로 계좌, 거래 및 보유 종목을 읽으므로 도구를 지원하는 모델로 바꾸기 전까지 채팅이 계속 실패하며, 종종 원인을
                알기 어려운 404 오류가 표시됩니다. 제공업체가 함수 호출 지원을 명시한 모델을 선택하세요. 실패 내용은 설정 → 디버그
                로그 및 Rails.logger에 기록되었습니다.
            function_calling_not_used:
              title: 모델이 호출하도록 요청된 도구를 호출하지 않고 응답했습니다.
              message: 엔드포인트는 tools 매개변수를 수락했지만 모델은 상태 확인 도구를 호출하는 대신 텍스트로 응답했습니다.
                AI 비서는 도구 호출 없이는 금융 데이터를 읽을 수 없으므로 채팅은 아무 것도 없거나 조작된 숫자로 응답할 수 있습니다.
                제공업체가 함수 호출 지원을 문서화하는 모델을 선호합니다.
            llm_probe_failed:
              title: LLM 실시간 확인에 실패했습니다.
              message: Sure는 구성된 엔드포인트와 모델을 모두 확인할 수 없습니다. 실패는 설정 → 디버그 로그 및 Rails.logger에
                기록되었습니다.
            llm_model_not_available:
              title: 구성된 AI 모델을 사용할 수 없습니다.
              message: 엔드포인트가 응답했지만 구성된 모델을 나열하거나 제공하지 않았습니다. 선택한 제공업체에 대한 활성 모델을
                선택한 다음 확인을 다시 실행하세요. OpenAI 호환 변환 레이어를 통한 Gemini의 경우 gemini-3.8-flash와
                같이 현재 지원되는 모델을 사용하세요.
            pdf_text_extraction_failed:
              title: 합성 PDF 텍스트 추출 확인에 실패했습니다.
              message: Sure는 내장된 PDF 텍스트를 로컬에서 추출하여 구성된 모델로 보내는 텍스트 우선 경로를 완료할 수 없습니다.
                고객 데이터가 전송되지 않았습니다. 실패는 설정 → 디버그 로그 및 Rails.logger에 기록되었습니다.
            pdf_vision_processing_failed:
              title: 합성 PDF 비전/네이티브 검사에 실패했습니다.
              message: Sure가 설정된 모델을 통한 PDF 이미지 또는 문서 직접 처리 경로를 완료하지 못했습니다. 고객 데이터는
                전송되지 않았습니다. 실패 내용은 설정 → 디버그 로그 및 Rails.logger에 기록되었습니다.
            vector_probe_failed:
              title: 문서 검색 실시간 확인에 실패했습니다.
              message: Sure는 선택한 벡터 저장소와 모든 필수 임베딩 서비스를 확인할 수 없습니다. 실패는 설정 → 디버그 로그
                및 Rails.logger에 기록되었습니다.
            pgvector_extension_not_enabled:
              title: PostgreSQL 벡터 확장이 활성화되지 않았습니다.
              message: pgvector 어댑터가 선택되었지만 이 PostgreSQL 데이터베이스의 vector 확장이 활성화되지
                않았습니다. pgvector가 포함된 PostgreSQL 이미지를 사용하고 데이터베이스 소유자 또는 슈퍼유저로 확장을
                활성화한 다음 VECTOR_STORE_PROVIDER=pgvector를 설정하여 마이그레이션을 다시 실행하세요.
            pgvector_table_not_found:
              title: vector_store_chunks 테이블이 누락되었습니다.
              message: pgvector 확장이 활성화되었지만 청크 테이블을 찾을 수 없습니다. 마이그레이션 상태를 확인한 다음 VECTOR_STORE_PROVIDER=pgvector를
                설정하여 벡터 저장소 마이그레이션을 다시 실행하면 Sure가 vector_store_chunks를 생성할 수 있습니다.
            pgvector_probe_failed:
              title: pgvector 저장소 확인에 실패했습니다.
              message: Sure가 pgvector 청크 테이블을 조회하지 못했습니다. PostgreSQL 권한, vector 확장
                및 vector_store_chunks 마이그레이션을 확인하세요. 실패 내용은 설정 → 디버그 로그 및 Rails.logger에
                기록되었습니다.
            embedding_dimensions_mismatch:
              title: 임베딩 크기가 일치하지 않습니다.
              message: 임베딩 엔드포인트가 반환한 벡터의 길이가 EMBEDDING_DIMENSIONS와 일치하지 않습니다. 모델
                문서에 명시된 벡터 크기에 맞게 EMBEDDING_MODEL과 EMBEDDING_DIMENSIONS를 설정하고 Sure를
                다시 시작하여 환경 설정을 적용하세요. 기존 데이터의 크기가 다르면 pgvector 임베딩 열/테이블을 수정하거나 다시
                만든 후 문서 임베딩을 다시 생성하세요.
            embedding_probe_timeout:
              title: 임베딩 실시간 확인 시간이 초과되었습니다.
              message: AI_HEALTH_PROBE_TIMEOUT 이전에 임베딩 엔드포인트가 응답하지 않았습니다. 제공업체가 느린
                경우 상태 확인 시간 제한을 늘린 다음 Sure를 다시 시작하여 모든 프로세스에서 환경이 유지되도록 하세요. 일반 AI
                채팅 호출도 시간 초과되면 OPENAI_REQUEST_TIMEOUT을 별도로 올리세요.
            embedding_probe_failed:
              title: 임베딩 실시간 확인에 실패했습니다.
              message: Sure는 구성된 엔드포인트 및 모델을 통해 간단한 테스트 임베딩을 생성할 수 없습니다. EMBEDDING_URI_BASE,
                EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN 및 임베딩 제공업체 로그를 확인하세요. 실패는
                설정 → 디버그 로그 및 Rails.logger에 기록되었습니다.
            qdrant:
              title: Qdrant 지원은 아직 구현되지 않았습니다.
              message: Qdrant 어댑터는 기본 구조만 구현되어 있어 현재 문서 업로드와 검색이 실패합니다. 문서 검색에는 OpenAI
                또는 pgvector를 선택하세요.
            missing_vector_store:
              title: 벡터 저장소가 구성되지 않았습니다.
              message: 업로드된 문서는 벡터 저장소 어댑터와 해당 요구 사항이 구성될 때까지 색인화하거나 검색할 수 없습니다.
            unavailable_vector_store:
              title: 선택한 벡터 저장소를 사용할 수 없습니다.
              message: 아래의 어댑터 요구 사항을 확인하세요. pgvector의 경우 데이터베이스에 vector 확장 또는 기존
                vector_store_chunks 테이블이 있어야 합니다.
          llm:
            title: LLM 및 PDF 처리
            description: 실시간 검사는 구성된 모델을 확인하고 보조자가 하는 방식으로 하나의 사소한 기능 호출을 요청한 다음 고객
              데이터가 포함되지 않은 단일 페이지 합성 PDF를 사용하여 텍스트 추출 및 비전/네이티브 처리를 별도로 실행합니다. 자격
