              database_backed: 설정 → 셀프 호스팅에서 변경한 제공업체, 모델 및 API 키 설정은 데이터베이스에 저장됩니다.
                rails-settings-cached는 저장 시 공유 캐시를 무효화하므로 웹과 작업 프로세스 모두 다음 요청이나 대기
                작업에서 새 값을 사용하며, 다시 시작할 필요가 없습니다.
              env_backed: 임베딩 설정과 환경 변수로만 설정되는 값은 각 컨테이너가 시작될 때 고정됩니다. Rails는 다른 컨테이너의
                환경을 변경할 수 없으므로 이를 변경하려면 웹 서비스와 작업 서비스를 모두 다시 시작하거나 다시 만들어야 합니다. 둘
                중 하나만 다시 시작하는 배포 방식(부분 배포, 파드를 다시 시작하지 않은 Secret 업데이트)으로는 변경 사항이 적용되지
                않습니다.
