                нове значення для наступного запиту чи завдання в черзі -- перезапуск
                не потрібен.
              env_backed: Конфігурація ембедингів і будь-яке значення, задане лише
                через змінну середовища, фіксуються під час запуску кожного контейнера.
                Rails не може змінити середовище іншого контейнера, тому для застосування
                змін потрібно перезапустити або заново створити і вебсервіс, і воркер
                -- а інструменти розгортання, які перезапускають лише один із них
                (частковий rollout, оновлений Secret без перезапуску pod), зміну не
                підхоплять.
              title: Які налаштування потребують перезапуску?
