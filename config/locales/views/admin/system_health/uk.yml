---
uk:
  admin:
    system_health:
      push_notification:
        body: Це тестове push-сповіщення для вашого облікового запису Sure.
        title: Тестове сповіщення Sure
      push_notifications:
        columns:
          checked_at: Останнє оновлення
          device: Пристрій
          environment: Середовище APNs
          status: Результат
        device: Пристрій %{number}
        environments:
          production: Production
          sandbox: Sandbox
        messages:
          cooldown: Зачекайте 30 секунд, перш ніж надсилати ще один тест.
          disabled: Оператор вимкнув доставку push-сповіщень.
          enqueue_failed: Не вдалося додати тест у чергу. Перевірте Sidekiq і оновіть
            результати нижче.
          hosted_only: Push-сповіщення доступні лише в хмарній версії.
          ineligible: Лише активний суперадміністратор може надіслати тестове сповіщення.
          no_devices: Увімкніть push-сповіщення в застосунку Sure для iOS для цього
            облікового запису, щоб надіслати тест.
          not_configured: Облікові дані APNs не налаштовано.
          queued: Тестове сповіщення додано в чергу. Оновіть результати нижче, щоб
            перевірити його статус.
          ready: Надішліть тестове сповіщення на ввімкнені пристрої iOS, зареєстровані
            у вашому обліковому записі.
          storage_unavailable: Не вдалося зберегти тестовий запит. Перевірте конфігурацію
            спільного кешу.
        pending: Очікується
        queueing: Додавання в чергу…
        refresh: Оновити результати
        requested_at: Останній тест запитано %{time}
        result_help: Прийняття APNs не підтверджує доставку на ваш пристрій. Оновіть
          сторінку, щоб побачити результати воркера. Результати зберігаються 24 години.
        results_label: Результати тесту
        send_test: Надіслати тестове push-сповіщення
        statuses:
          accepted: Прийнято APNs
          enqueue_failed: Не вдалося додати в чергу; перевірте Sidekiq
          expired: Строк минув без остаточного результату
          failed: Помилка; перевірте журнали налагодження push
          queued: У черзі
          rejected: Відхилено APNs; перевірте журнали налагодження push
          retrying: Повторна спроба після тимчасового збою
          skipped: 'Пропущено: більше не відповідає умовам'
          unregistered: Реєстрація пристрою більше не дійсна
        title: Push-сповіщення
      show:
        ai:
          adapters:
            openai: Хмарне векторне сховище OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Налаштований endpoint не пройшов перевірку працездатності /v1/vector_stores.
                Більшість локальних і OpenAI-сумісних endpoint не реалізують цей API.
                Чат і обробка PDF можуть і далі працювати; для типового локального
                налаштування використовуйте pgvector з окремим endpoint для ембедингів.
                Збій записано в Налаштування → Відладка та Rails.logger.
              title: Перевірка хмарного векторного сховища на цьому власному endpoint
                не пройшла
            embedding_dimensions_mismatch:
              message: Endpoint ембедингів повернув вектор, довжина якого не відповідає
                EMBEDDING_DIMENSIONS. Установіть для EMBEDDING_MODEL і EMBEDDING_DIMENSIONS
                задокументований розмір вектора моделі, перезапустіть Sure, щоб змінні
                середовища застосувалися, потім змініть або створіть заново стовпець/таблицю
                ембедингів pgvector і повторно створіть ембединги документів, якщо
                наявні дані використовували інший розмір.
              title: Розмірність ембедингів не збігається
            embedding_probe_failed:
              message: Sure не вдалося створити короткий тестовий ембединг через налаштований
                endpoint і модель. Перевірте EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN і журнали постачальника ембедингів. Збій записано
                в Налаштування → Відладка та Rails.logger.
              title: Перевірка ембедингів у реальному часі не пройшла
            embedding_probe_timeout:
              message: Endpoint ембедингів не відповів до спливу AI_HEALTH_PROBE_TIMEOUT.
                Якщо постачальник повільний, збільште цей тайм-аут перевірки стану,
                а потім перезапустіть Sure, щоб змінна середовища застосувалася в
                кожному процесі. Якщо звичайні запити до ШІ-чату теж завершуються
                за тайм-аутом, окремо збільште OPENAI_REQUEST_TIMEOUT.
              title: Час очікування перевірки ембедингів у реальному часі вичерпано
            function_calling_not_used:
              message: Endpoint прийняв параметр tools, але модель відповіла текстом
                замість виклику інструмента перевірки стану. Без викликів інструментів
                ШІ-асистент не може читати фінансові дані, тому чат може відповідати
                порожньо або вигаданими цифрами. Краще оберіть модель, для якої постачальник
                документує підтримку виклику функцій.
              title: Модель відповіла, не викликавши інструмент, який її просили викликати
            function_calling_unsupported:
              message: Endpoint обробив звичайний запит чату, але відхилив той самий
                запит із параметром tools. ШІ-асистент читає рахунки, транзакції та
                активи через виклики функцій, тому чат і далі не працюватиме — часто
                з малоінформативною помилкою 404, — доки ви не виберете модель, що
                підтримує tools. Оберіть модель, для якої постачальник документує
                підтримку виклику функцій. Збій записано в Налаштування → Відладка
                та Rails.logger.
              title: Модель не підтримує виклик функцій
            llm_model_not_available:
              message: Endpoint відповів, але не показав і не обслуговує налаштовану
                модель. Виберіть активну модель для вибраного постачальника й запустіть
                перевірки ще раз. Для Gemini через OpenAI-сумісний шар трансляції
                використовуйте модель, що наразі підтримується, наприклад gemini-2.5-flash.
              title: Налаштована модель ШІ недоступна
            llm_probe_failed:
              message: Sure не вдалося перевірити і налаштований endpoint, і модель.
                Збій записано в Налаштування → Відладка та Rails.logger.
              title: Перевірка LLM у реальному часі не пройшла
            missing_vector_store:
              message: Завантажені документи неможливо індексувати або шукати, доки
                не налаштовано адаптер векторного сховища та його вимоги.
              title: Векторне сховище не налаштовано
            pdf_text_extraction_failed:
              message: Sure не вдалося пройти текстовий шлях, який локально вилучає
                вбудований текст PDF і надсилає його налаштованій моделі. Жодних даних
                клієнтів не надіслано. Збій записано в Налаштування → Відладка та
                Rails.logger.
              title: Перевірка вилучення тексту із синтетичного PDF не пройшла
            pdf_vision_processing_failed:
              message: Sure не вдалося пройти шлях обробки PDF як зображення або нативного
                документа через налаштовану модель. Жодних даних клієнтів не надіслано.
                Збій записано в Налаштування → Відладка та Rails.logger.
              title: Перевірка синтетичного PDF через vision/нативну обробку не пройшла
            pgvector_extension_not_enabled:
              message: Вибрано адаптер pgvector, але в PostgreSQL не ввімкнено розширення
                vector для цієї бази даних. Використовуйте образ PostgreSQL із pgvector,
                увімкніть розширення від імені власника бази даних або суперкористувача
                та повторно запустіть міграції з VECTOR_STORE_PROVIDER=pgvector.
              title: Розширення vector для PostgreSQL не ввімкнено
            pgvector_probe_failed:
              message: Sure не вдалося виконати запит до таблиці фрагментів pgvector.
                Перевірте дозволи PostgreSQL, розширення vector і міграцію vector_store_chunks.
                Збій записано в Налаштування → Відладка та Rails.logger.
              title: Перевірка сховища pgvector не пройшла
            pgvector_table_not_found:
              message: Розширення pgvector увімкнено, але таблицю фрагментів не знайдено.
                Перевірте стан міграцій і повторно запустіть міграцію векторного сховища
                з VECTOR_STORE_PROVIDER=pgvector, щоб Sure міг створити vector_store_chunks.
              title: Таблиця vector_store_chunks відсутня
            qdrant:
              message: Для адаптера Qdrant створено лише заготовку, тому завантаження
                документів і пошук зараз не працюють. Виберіть OpenAI або pgvector
                для пошуку документів.
              title: Підтримку Qdrant ще не реалізовано
            unavailable_vector_store:
              message: Перевірте вимоги адаптера нижче. Для pgvector база даних має
                надавати розширення vector або вже містити таблицю vector_store_chunks.
              title: Вибране векторне сховище недоступне
            vector_probe_failed:
              message: Sure не вдалося перевірити вибране векторне сховище та всі
                потрібні сервіси ембедингів. Збій записано в Налаштування → Відладка
                та Rails.logger.
              title: Перевірка пошуку документів у реальному часі не пройшла
          failure_codes:
            dimensions_mismatch: Розмірність вектора ембедингу не відповідає налаштованій
