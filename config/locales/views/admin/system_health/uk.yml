            description: Перевірки вище виконано з цього вебпроцесу. Більшість роботи
              ШІ -- відповіді асистента, обробка PDF, ембединги, автокатегоризація
              та визначення продавців -- насправді виконується в процесі воркера Sidekiq,
              який може відрізнятися доступом до мережі, DNS, правилами проксі або
              навіть завантаженими обліковими даними. Додайте перевірку в чергу, щоб
