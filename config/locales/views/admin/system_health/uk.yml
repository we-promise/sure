        ai:
          run_checks: Запустити перевірки ще раз
          last_checked: Перевірки в реальному часі завершено %{time_ago} тому. Результати ненадовго кешуються.
          not_checked_help: Відкрийте URL стану ШІ напряму або запустіть перевірки, щоб переконатися, що сервіси працюють.
          alerts:
            custom_openai:
              title: Перевірка хмарного векторного сховища на цьому власному endpoint не пройшла
              message: Налаштований endpoint не пройшов перевірку працездатності /v1/vector_stores. Більшість локальних і OpenAI-сумісних endpoint не реалізують цей API. Чат і обробка PDF можуть і далі працювати; для типового локального налаштування використовуйте pgvector з окремим endpoint для ембедингів. Збій записано в Налаштування → Відладка та Rails.logger.
            function_calling_unsupported:
              title: Модель не підтримує виклик функцій
              message: Endpoint обробив звичайний запит чату, але відхилив той самий запит із параметром tools. ШІ-асистент читає рахунки, транзакції та активи через виклики функцій, тому чат і далі не працюватиме — часто з малоінформативною помилкою 404, — доки ви не виберете модель, що підтримує tools. Оберіть модель, для якої постачальник документує підтримку виклику функцій. Збій записано в Налаштування → Відладка та Rails.logger.
            function_calling_not_used:
              title: Модель відповіла, не викликавши інструмент, який її просили викликати
              message: Endpoint прийняв параметр tools, але модель відповіла текстом замість виклику інструмента перевірки стану. Без викликів інструментів ШІ-асистент не може читати фінансові дані, тому чат може відповідати порожньо або вигаданими цифрами. Краще оберіть модель, для якої постачальник документує підтримку виклику функцій.
            llm_probe_failed:
              title: Перевірка LLM у реальному часі не пройшла
              message: Sure не вдалося перевірити і налаштований endpoint, і модель. Збій записано в Налаштування → Відладка та Rails.logger.
            llm_model_not_available:
              title: Налаштована модель ШІ недоступна
              message: Endpoint відповів, але не показав і не обслуговує налаштовану модель. Виберіть активну модель для вибраного постачальника й запустіть перевірки ще раз. Для Gemini через OpenAI-сумісний шар трансляції використовуйте модель, що наразі підтримується, наприклад gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Перевірка вилучення тексту із синтетичного PDF не пройшла
              message: Sure не вдалося пройти текстовий шлях, який локально вилучає вбудований текст PDF і надсилає його налаштованій моделі. Жодних даних клієнтів не надіслано. Збій записано в Налаштування → Відладка та Rails.logger.
            pdf_vision_processing_failed:
              title: Перевірка синтетичного PDF через vision/нативну обробку не пройшла
              message: Sure не вдалося пройти шлях обробки PDF як зображення або нативного документа через налаштовану модель. Жодних даних клієнтів не надіслано. Збій записано в Налаштування → Відладка та Rails.logger.
            vector_probe_failed:
              title: Перевірка пошуку документів у реальному часі не пройшла
              message: Sure не вдалося перевірити вибране векторне сховище та всі потрібні сервіси ембедингів. Збій записано в Налаштування → Відладка та Rails.logger.
            pgvector_extension_not_enabled:
              title: Розширення vector для PostgreSQL не ввімкнено
              message: Вибрано адаптер pgvector, але в PostgreSQL не ввімкнено розширення vector для цієї бази даних. Використовуйте образ PostgreSQL із pgvector, увімкніть розширення від імені власника бази даних або суперкористувача та повторно запустіть міграції з VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Таблиця vector_store_chunks відсутня
              message: Розширення pgvector увімкнено, але таблицю фрагментів не знайдено. Перевірте стан міграцій і повторно запустіть міграцію векторного сховища з VECTOR_STORE_PROVIDER=pgvector, щоб Sure міг створити vector_store_chunks.
            pgvector_probe_failed:
              title: Перевірка сховища pgvector не пройшла
              message: Sure не вдалося виконати запит до таблиці фрагментів pgvector. Перевірте дозволи PostgreSQL, розширення vector і міграцію vector_store_chunks. Збій записано в Налаштування → Відладка та Rails.logger.
            embedding_dimensions_mismatch:
              title: Розмірність ембедингів не збігається
              message: Endpoint ембедингів повернув вектор, довжина якого не відповідає EMBEDDING_DIMENSIONS. Установіть для EMBEDDING_MODEL і EMBEDDING_DIMENSIONS задокументований розмір вектора моделі, перезапустіть Sure, щоб змінні середовища застосувалися, потім змініть або створіть заново стовпець/таблицю ембедингів pgvector і повторно створіть ембединги документів, якщо наявні дані використовували інший розмір.
            embedding_probe_timeout:
              title: Час очікування перевірки ембедингів у реальному часі вичерпано
              message: Endpoint ембедингів не відповів до спливу AI_HEALTH_PROBE_TIMEOUT. Якщо постачальник повільний, збільште цей тайм-аут перевірки стану, а потім перезапустіть Sure, щоб змінна середовища застосувалася в кожному процесі. Якщо звичайні запити до ШІ-чату теж завершуються за тайм-аутом, окремо збільште OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Перевірка ембедингів у реальному часі не пройшла
              message: Sure не вдалося створити короткий тестовий ембединг через налаштований endpoint і модель. Перевірте EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN і журнали постачальника ембедингів. Збій записано в Налаштування → Відладка та Rails.logger.
            qdrant:
              title: Підтримку Qdrant ще не реалізовано
              message: Для адаптера Qdrant створено лише заготовку, тому завантаження документів і пошук зараз не працюють. Виберіть OpenAI або pgvector для пошуку документів.
            missing_vector_store:
              title: Векторне сховище не налаштовано
              message: Завантажені документи неможливо індексувати або шукати, доки не налаштовано адаптер векторного сховища та його вимоги.
            unavailable_vector_store:
              title: Вибране векторне сховище недоступне
              message: Перевірте вимоги адаптера нижче. Для pgvector база даних має надавати розширення vector або вже містити таблицю vector_store_chunks.
          llm:
            title: LLM і обробка PDF
            description: Перевірки в реальному часі перевіряють налаштовану модель, просять її виконати один простий виклик функції так, як це робить асистент, а потім окремо тестують вилучення тексту та vision/нативну обробку на односторінковому синтетичному PDF без даних клієнтів. Значення облікових даних ніколи не показуються.
          vector_store:
            title: Векторне сховище та пошук документів
            description: Перевірка в реальному часі надсилає запит до API хмарного векторного сховища або тестує таблицю pgvector і створює один короткий ембединг, не зберігаючи його.
