            request_failed: Запит до сервісу не вдався
            unsupported_provider: Постачальник не підтримує цю перевірку
          worker:
            title: Перевірка воркера
            description: Перевірки вище виконано з цього вебпроцесу. Більшість роботи ШІ -- відповіді асистента, обробка PDF, ембединги, автокатегоризація та визначення продавців -- насправді виконується в процесі воркера Sidekiq, який може відрізнятися доступом до мережі, DNS, правилами проксі або навіть завантаженими обліковими даними. Додайте перевірку в чергу, щоб перевірити власну конфігурацію та з'єднання воркера.
            verify_button: Перевірити конфігурацію воркера
            coverage_notice: Кожна перевірка перевіряє рівно один процес воркера -- той, що візьме її з черги. Якщо реплік воркера кілька, успішний результат не підтверджує, що справні всі воркери; додайте перевірку в чергу ще раз, щоб перевірити інший.
            empty:
              title: Жоден воркер ще не відзвітував
              description: Натисніть «Перевірити конфігурацію воркера», щоб додати асинхронну перевірку в чергу. Результат з'явиться тут, щойно процес воркера її візьме.
            labels:
              process: Процес воркера
              checked_at: Перевірено
              configuration: Конфігурація
            configuration_statuses:
              match: Збігається з вебпроцесом
              mismatch: Відрізняється від вебпроцесу
            statuses:
              passing: Успішно
              failing: Помилка
              stale: Застаріло
            settings_origin:
              title: Які налаштування потребують перезапуску?
              database_backed: Налаштування постачальника, моделі та API-ключа, змінені в Налаштування → Самостійний хостинг, зберігаються в базі даних. rails-settings-cached скидає спільний кеш під час запису, тому і вебпроцес, і воркер отримують нове значення для наступного запиту чи завдання в черзі -- перезапуск не потрібен.
              env_backed: Конфігурація ембедингів і будь-яке значення, задане лише через змінну середовища, фіксуються під час запуску кожного контейнера. Rails не може змінити середовище іншого контейнера, тому для застосування змін потрібно перезапустити або заново створити і вебсервіс, і воркер -- а інструменти розгортання, які перезапускають лише один із них (частковий rollout, оновлений Secret без перезапуску pod), зміну не підхоплять.
          local_setup:
            title: Рекомендоване локальне налаштування
            description: Запускайте LLM через свій локальний OpenAI-сумісний endpoint, зберігайте вектори документів у pgvector і вкажіть у налаштуваннях ембедингів OpenAI-сумісний endpoint для ембедингів. Образ PostgreSQL має містити розширення vector, а розмірність ембедингів має відповідати вибраній моделі.
