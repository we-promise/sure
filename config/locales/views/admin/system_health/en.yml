          worker:
            configuration_statuses:
              match: Matches web
              mismatch: Differs from web
            coverage_notice: Each check verifies exactly one worker process -- whichever
              one dequeues it. With more than one worker replica, a passing result
              does not confirm every worker is healthy; queue the check again to sample
              another.
            description: The checks above ran from this web process. Most AI work
              -- assistant responses, PDF processing, embeddings, auto-categorization,
              and merchant detection -- actually runs in a Sidekiq worker process,
              which can differ in network access, DNS, proxy rules, or even loaded
              credentials. Queue a check to verify a worker's own configuration and
              connectivity.
            empty:
              description: Click "Verify worker configuration" to queue an asynchronous
                check. The result appears here once a worker process picks it up.
              title: No worker has checked in yet
            labels:
              checked_at: Checked
              configuration: Configuration
              process: Worker process
            settings_origin:
              database_backed: Provider, model, and API-key settings changed in Settings
                → Self-Hosting are stored in the database. rails-settings-cached invalidates
                the shared cache on write, so both web and worker resolve the new
                value for the next request or queued job -- no restart needed.
              env_backed: Embedding configuration, and any value only set through
                an environment variable, is fixed when each container starts. Rails
                cannot change another container's environment, so changing these requires
                restarting or recreating both the web and worker services -- and any
                deployment tooling that only restarts one of them (partial rollout,
                an updated Secret without a pod restart) will not pick up the change.
              title: Which settings need a restart?
            statuses:
              failing: Failing
              passing: Passing
              stale: Stale
            title: Worker verification
            verify_button: Verify worker configuration
