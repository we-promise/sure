          ready: Send a test notification to the enabled iOS devices registered to
            your account.
          storage_unavailable: The test request could not be saved. Check the shared
            cache configuration.
        pending: Pending
        queueing: Queueing…
        refresh: Refresh results
        requested_at: Latest test requested at %{time}
        result_help: APNs acceptance does not confirm delivery to your device. Refresh
          to see worker results. Results are retained for 24 hours.
        results_label: Test results
        send_test: Send test push notification
        statuses:
          accepted: Accepted by APNs
          enqueue_failed: Could not enqueue; check Sidekiq
          expired: Expired without a final result
          failed: Failed; check push debug logs
          queued: Queued
          rejected: Rejected by APNs; check push debug logs
          retrying: Retrying a temporary failure
          skipped: 'Skipped: no longer eligible'
          unregistered: Device registration is no longer valid
        title: Push notifications
      show:
        ai:
          adapters:
            openai: OpenAI hosted vector store
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: The configured endpoint did not pass the /v1/vector_stores
                liveness check. Most local and OpenAI-compatible endpoints do not
                implement that API. Chat and PDF processing may still work; use pgvector
                with a separate embeddings endpoint for the usual local setup. The
                failure was recorded in Settings → Debug logs and Rails.logger.
              title: The hosted vector-store check failed at this custom endpoint
            embedding_dimensions_mismatch:
              message: The embedding endpoint returned a vector whose length does
                not match EMBEDDING_DIMENSIONS. Set EMBEDDING_MODEL and EMBEDDING_DIMENSIONS
                to the model's documented vector size, restart Sure so the environment
                persists, then alter or recreate the pgvector embedding column/table
                and re-embed documents if existing data used a different size.
              title: The embedding dimensions do not match
            embedding_probe_failed:
              message: Sure could not create a short test embedding through the configured
                endpoint and model. Check EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN,
                and the embedding provider logs. The failure was recorded in Settings
                → Debug logs and Rails.logger.
              title: The embedding live check failed
            embedding_probe_timeout:
              message: The embedding endpoint did not answer before AI_HEALTH_PROBE_TIMEOUT.
                Increase that health-check timeout if the provider is slow, then restart
                Sure so the environment persists in every process. If normal AI chat
                calls also time out, raise OPENAI_REQUEST_TIMEOUT separately.
              title: The embedding live check timed out
            function_calling_not_used:
              message: The endpoint accepted the tools parameter, but the model replied
                with text instead of calling the health-check tool. The AI assistant
                cannot read financial data without tool calls, so chat may answer
                with nothing or with invented figures. Prefer a model whose provider
                documents function-calling support.
              title: The model answered without calling the tool it was asked to call
            function_calling_unsupported:
              message: The endpoint served a plain chat request but rejected the same
                request carrying the tools parameter. The AI assistant reads accounts,
                transactions, and holdings through function calls, so chat keeps failing
                — often with an unhelpful 404 — until the model is one that supports
                tools. Pick a model whose provider documents function-calling support.
                The failure was recorded in Settings → Debug logs and Rails.logger.
              title: The model does not support function calling
            llm_model_not_available:
              message: The endpoint answered, but it did not list or serve the configured
                model. Pick an active model for the selected provider, then run the
                checks again. For Gemini through an OpenAI-compatible translation
                layer, use a currently supported model such as gemini-3.8-flash.
              title: The configured AI model is not available
            llm_probe_failed:
              message: Sure could not verify both the configured endpoint and model.
                The failure was recorded in Settings → Debug logs and Rails.logger.
              title: The LLM live check failed
            missing_vector_store:
              message: Uploaded documents cannot be indexed or searched until a vector-store
                adapter and its requirements are configured.
              title: No vector store is configured
            pdf_text_extraction_failed:
              message: Sure could not complete the text-first path that extracts embedded
                PDF text locally and sends it to the configured model. No customer
                data was sent. The failure was recorded in Settings → Debug logs and
                Rails.logger.
              title: The synthetic PDF text-extraction check failed
            pdf_vision_processing_failed:
              message: Sure could not complete the image or native-document PDF path
                through the configured model. No customer data was sent. The failure
                was recorded in Settings → Debug logs and Rails.logger.
              title: The synthetic PDF vision/native check failed
            pgvector_extension_not_enabled:
              message: The pgvector adapter is selected, but PostgreSQL has not enabled
                the vector extension for this database. Use a PostgreSQL image that
                includes pgvector, then enable the extension as a database owner or
                superuser and re-run migrations with VECTOR_STORE_PROVIDER=pgvector.
              title: The PostgreSQL vector extension is not enabled
            pgvector_probe_failed:
              message: Sure could not query the pgvector chunks table. Check PostgreSQL
                permissions, the vector extension, and the vector_store_chunks migration.
                The failure was recorded in Settings → Debug logs and Rails.logger.
              title: The pgvector storage check failed
            pgvector_table_not_found:
              message: The pgvector extension is enabled, but the chunks table was
                not found. Check migration status, then re-run the vector-store migration
                with VECTOR_STORE_PROVIDER=pgvector so Sure can create vector_store_chunks.
              title: The vector_store_chunks table is missing
            qdrant:
              message: The Qdrant adapter is scaffolded, but document upload and search
                operations currently fail. Select OpenAI or pgvector for document
                search.
              title: Qdrant support is not implemented yet
            unavailable_vector_store:
              message: Check the adapter requirements below. For pgvector, the database
                must provide the vector extension or an existing vector_store_chunks
                table.
              title: The selected vector store is unavailable
            vector_probe_failed:
              message: Sure could not verify the selected vector store and every required
                embedding service. The failure was recorded in Settings → Debug logs
                and Rails.logger.
              title: The document-search live check failed
          failure_codes:
            dimensions_mismatch: The embedding vector dimensions do not match the
