---
en:
  admin:
    system_health:
      configuration:
        checks:
          exchange_rates:
            guidance: Choose an exchange-rate provider and add its API key if required
              in self-hosting settings, or configure it in the deployment environment.
              EXCHANGE_RATE_PROVIDER and provider API-key environment overrides take
              precedence.
            issues:
              invalid_provider: The selected exchange-rate provider is not recognized.
                Automatic rate lookups fail until a supported provider is selected.
            statuses:
              configured: The selected exchange-rate provider has configuration.
              not_configured: No usable exchange-rate provider is configured. Automatic
                currency conversion may be unavailable when a stored rate is missing.
            title: Foreign exchange rates
          securities:
            guidance: Choose providers and add any required API keys in self-hosting
              settings, or configure them in the deployment environment. Environment
              overrides take precedence. Public providers do not need an API key.
            statuses:
              configured: All enabled market-price providers have configuration.
              disabled: No market-price provider is enabled. Automatic security searches
                and price lookups are unavailable.
              incomplete: At least one enabled market-price provider has missing configuration
                or an invalid selection. Securities assigned to that provider may
                not receive price updates.
              not_configured: The enabled market-price providers are missing their
                API keys. Automatic security searches and price lookups are unavailable
                through these providers.
            title: Market prices
          smtp:
            guidance: SMTP cannot be configured in the admin UI. Set the email environment
              variables for both the web and worker services, then restart both. SMTP_USERNAME
              and SMTP_PASSWORD can both be omitted for an unauthenticated relay.
            issues:
              address: SMTP_ADDRESS
              app_domain: APP_DOMAIN (used in email links)
              authentication: SMTP_USERNAME and SMTP_PASSWORD (supply both or neither)
              port: SMTP_PORT (a number from 1 to 65535)
              sender: EMAIL_SENDER (replace the default sender@sure.local)
            statuses:
              configured: SMTP settings are present.
              disabled: Email delivery is disabled in the running mailer configuration.
              incomplete: Some email settings are missing or incomplete. System emails
                or the links they contain may not work.
              not_checked: This process uses a delivery method other than SMTP, such
                as a development preview. SMTP delivery is not assessed.
              not_configured: SMTP is not configured. Password resets, invitations,
                and other system emails cannot be sent through SMTP.
            title: Email (SMTP)
          storage:
            guidance: Review ACTIVE_STORAGE_SERVICE and the selected backend's deployment
              settings. Local disk needs persistent storage shared by the web and
              worker services. Changing backends does not migrate existing files;
              plan any migration separately.
            issues:
              bucket: Storage bucket
              credentials: Storage access key and secret key (supply both or use external
                credential discovery)
              endpoint: Storage endpoint (and CLOUDFLARE_ACCOUNT_ID for R2)
              region: Storage region
              root: Local storage root
            statuses:
              configured: Storage settings are present; local disk needs no cloud
                credentials.
              incomplete: Required storage settings are missing or incomplete. File
                uploads or retrieval may not work.
              not_checked: This backend uses external credential discovery or a custom
                configuration. Its access cannot be determined from these settings
                alone.
              not_configured: The selected storage backend has no matching configuration.
                File uploads may be unavailable.
            title: File uploads and storage
        configure_providers: Open self-hosting settings
        description: Configuration visible to this web process. These checks do not
          send emails, contact providers, or upload or download files. Configured
          means settings are present, not that delivery, provider access, or storage
          access has been verified.
        provider_statuses:
          configured: Configured
          invalid: Invalid selection
          not_configured: API key missing
        settings_needed: Settings to review
        statuses:
          configured: Configured
          disabled: Disabled
          incomplete: Incomplete configuration
          not_checked: Not verified
          not_configured: Not configured
        storage_backend: 'Selected storage: %{backend}'
        storage_backends:
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: S3-compatible storage
          google: Google Cloud Storage
          local: Local disk
          other: Custom or unrecognized backend
          test: Test disk
        unknown_provider: Unrecognized provider selection
      hosted_usage:
        cleanup:
          description: 'Matches the existing cleanup scope: a paused or trialing subscription
            ended more than 14 days ago, or no subscription and a household older
            than 45 + 14 days. Showing up to %{limit} households.'
          disabled: Scheduled trial cleanup is disabled outside managed mode. These
            are scope matches only.
          eligibility_help: Recent logins do not prevent a match. Eligibility does
            not confirm deletion; 90 days is archive retention, not the trial-cleanup
            threshold.
          empty: No households match the cleanup scope
          reasons:
            expired_trial_grace_elapsed: Trial ended; 14-day grace elapsed
            no_subscription_grace_elapsed: No subscription; 45 + 14 days elapsed
          title: Cleanup eligibility
        columns:
          cleanup_eligible: Cleanup eligible
          cleanup_reason: Reason
          household: Household ID
          latest_session: Latest retained sign-in
          members: Member accounts
          recent_sessions: Retained sessions created in last 30 days
          recorded_at: Subscription recorded
          retained_sessions: Retained sign-in sessions
          status: Current status
          subscription_rows: Subscription rows
          trial_ends_at: Trial ends
        eligible: Eligible
        limitations: Current tables do not retain full trial, payment or session-activity
          history. Subscription creation can reflect imports. Member accounts are
          not verified unique people. This view changes no household or subscription
          data. Shared-demo resets remove old households and sessions, so visitor
          history cannot be reconstructed.
        limitations_title: What these numbers can tell us
        loading: Loading hosted usage…
        not_eligible: Not eligible
        not_recorded: Not recorded
        snapshot: Read-only database snapshot as of %{time}
        statuses:
          active: Active
          canceled: Canceled
          incomplete: Incomplete
          incomplete_expired: Incomplete, expired
          no_subscription: No subscription
          past_due: Past due
          paused: Paused
          trialing: Trialing
          unknown: Unknown
          unpaid: Unpaid
        summary:
          active_supporter_households_count: Active supporter households (local)
          cleanup_eligible_count: Cleanup-eligible households
          supporter_subscription_count: Stripe-linked subscription rows
          trial_households_count: Trial households (last 30 days)
          trial_members_count: Current trial member accounts
          trials_expiring_soon_count: Trials expiring in next 7 days
        summary_help: Trial totals cover subscriptions recorded in the last 30 days.
          Expiring-trial, cleanup and supporter totals cover all matching current
          rows, without the table limits.
        supporters:
          description: Current local subscription rows with Stripe-shaped customer
            and subscription IDs; the synthetic demo subscription is excluded. Statuses
            do not verify payments received or first-payment dates. No Stripe request
            is made.
          empty: No Stripe-linked subscription rows
          title: Local supporter status
        synthetic_demo: Synthetic demo
        title: Hosted usage
        trials:
          description: Subscriptions recorded since %{date} that retain a trial end
            date, including converted trials. Showing up to %{limit} households.
          empty: No trial households recorded in this window
          sessions_help: Sessions are retained sign-in records for enabled users,
            not currently online users or visits. Signing out deletes a record. The
            latest creation time is not a last-seen time.
          title: Recent trial households
      optional_services:
        description: Optional operator integrations. Unconfigured services are informational.
          These checks inspect settings only; they do not test connectivity, send
          test events, or change analytics consent. Expand a service for setup details.
        missing_settings: 'Missing settings: %{settings}'
        notes:
          browser_analytics_disabled: Browser analytics are disabled for this environment.
            This does not disable the separately configured server client.
          environment_disabled: The loaded integration is disabled for this Rails
            environment.
          explicitly_disabled: SKYLIGHT_ENABLED explicitly disables instrumentation.
          production_only: This integration is used only in production by the application's
            current configuration.
          self_hosted_checkout_disabled: Subscription checkout and the billing portal
            are disabled in self-hosted mode. Stripe webhooks can still be configured;
            checkout price IDs are not required here.
          shared_feedback_configured: Self-hosted feedback has a separate bundled
            project and is enabled by its configuration. It does not require an operator
            POSTHOG_KEY. Browser opt-out and SDK availability are not checked.
          shared_feedback_disabled: The separate self-hosted feedback project is disabled
            by its feedback or environment setting. This does not disable operator-owned
            analytics.
        services:
          langfuse:
            description: Optional AI tracing and evaluation reporting. No traces or
              evaluation requests are sent by this check.
            guidance: Set LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY together. LANGFUSE_HOST
              is optional. Restart the affected services after changing these settings.
            title: Langfuse
          logtail:
            description: Optional production log forwarding. When it is unconfigured,
              the application continues logging to standard output.
            guidance: Set LOGTAIL_API_KEY and LOGTAIL_INGESTING_HOST together and
              restart the affected services. No test log is emitted by this check.
            title: Logtail
          posthog:
            description: Optional operator-owned analytics, using the configuration
              loaded at boot. Configured does not mean that a user has consented to
              analytics.
            guidance: Set POSTHOG_KEY and a nonblank POSTHOG_HOST, or leave the host
              unset to use the default. Browser analytics require production or POSTHOG_DEVELOPMENT_ENABLED
              in development. POSTHOG_FEEDBACK_ENABLED controls separate self-hosted
              feedback, not operator analytics.
            title: PostHog
          sentry:
            description: Optional error and performance reporting. The current initializer
              enables reporting only in production.
            guidance: Set SENTRY_DSN and restart the affected services. This checks
              the loaded SDK configuration without capturing an error or sending an
              event.
            title: Sentry
          skylight:
            description: Optional application performance instrumentation. Configuration
              presence does not confirm that the agent is running or reporting.
            guidance: Set SKYLIGHT_AUTHENTICATION and ensure Skylight is loaded in
              the intended Rails environment. SKYLIGHT_ENABLED=false disables instrumentation;
              the flag alone does not load the gem. Restart after changes.
            title: Skylight
          stripe:
            description: Optional subscription billing and payment webhooks. This
              check does not create a Stripe client, validate credentials, or make
              payment requests.
            guidance: Set STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET together. Managed
              subscription checkout also needs STRIPE_MONTHLY_PRICE_ID and STRIPE_ANNUAL_PRICE_ID.
            title: Stripe
        statuses:
          configured: Configured
          disabled: Disabled in this process
          incomplete: Incomplete configuration
          not_checked: Not verified
          not_configured: Not configured
        title: Optional services
      push_notification:
        body: This is a test push notification for your Sure account.
        title: Sure test notification
