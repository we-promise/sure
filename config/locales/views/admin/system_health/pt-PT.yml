            request_failed: O pedido ao serviço falhou
            unsupported_provider: O serviço não suporta esta verificação
            no_tool_call: O modelo respondeu sem chamar a ferramenta de verificação de estado
            tools_refused: O serviço respondeu ao mesmo pedido sem ferramentas, mas recusou-o com elas
            render_missing_binary: O renderizador pdftoppm (poppler-utils) não está disponível neste contentor
          local_setup:
            title: Configuração local recomendada
            description: Execute a IA através do seu endpoint local compatível com OpenAI, armazene os vetores de documentos em pgvector e aponte as definições de embeddings para um endpoint de embeddings compatível com OpenAI. A imagem PostgreSQL deve incluir a extensão vector e as dimensões dos embeddings devem corresponder ao modelo selecionado.
          function_calling_statuses:
            supported: Chamada de ferramenta em direto bem-sucedida
            unsupported: Não suportado pelo serviço/modelo efetivo
            not_used: Ferramentas aceites, mas o modelo não chamou nenhuma
            failing: Verificação em direto falhou
            not_checked: Não verificado
            unavailable: Indisponível até ser configurado um serviço de LLM
          worker:
            title: Verificação do worker
            description: As verificações acima foram executadas a partir deste processo web. A maior parte do trabalho de IA -- respostas do assistente, processamento de PDF, embeddings, categorização automática e deteção de comerciantes -- é na verdade executada num processo worker do Sidekiq, que pode diferir no acesso à rede, DNS, regras de proxy ou até nas credenciais carregadas. Coloque uma verificação em fila para validar a configuração e a conectividade do próprio worker.
            verify_button: Verificar configuração do worker
            coverage_notice: Cada verificação valida exatamente um processo worker -- aquele que a retirar da fila. Com mais de uma réplica de worker, um resultado positivo não confirma que todos os workers estão operacionais; coloque a verificação novamente em fila para testar outro.
            empty:
              title: Nenhum worker respondeu ainda
              description: Clique em "Verificar configuração do worker" para colocar uma verificação assíncrona em fila. O resultado aparece aqui assim que um processo worker a processar.
            labels:
              process: Processo worker
              checked_at: Verificado
              configuration: Configuração
            configuration_statuses:
              match: Igual à web
              mismatch: Diferente da web
            statuses:
              passing: A passar
              failing: A falhar
              stale: Desatualizado
            settings_origin:
              title: Que definições exigem um reinício?
              database_backed: As definições de serviço, modelo e chave de API alteradas em Definições → Self-Hosting são guardadas na base de dados. O rails-settings-cached invalida a cache partilhada ao escrever, pelo que tanto a web como o worker obtêm o novo valor no pedido seguinte ou na próxima tarefa em fila -- não é necessário reiniciar.
              env_backed: A configuração de embeddings, e qualquer valor definido apenas através de uma variável de ambiente, fica fixa quando cada contentor arranca. O Rails não consegue alterar o ambiente de outro contentor, pelo que alterar estes valores exige reiniciar ou recriar tanto o serviço web como o worker -- e qualquer ferramenta de implementação que reinicie apenas um deles (implementação parcial, um Secret atualizado sem reiniciar o pod) não aplicará a alteração.
      verify_worker_ai:
        queued: Verificação do worker em fila. Aparecerá abaixo assim que um processo worker a processar, normalmente em poucos segundos.
