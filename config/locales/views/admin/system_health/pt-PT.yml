        eligible: Elegível
        not_eligible: Não elegível
        synthetic_demo: Demo sintética
      push_notifications:
        send_test: Enviar notificação de teste
        queueing: A colocar em fila…
        title: Notificações push
        requested_at: Último teste pedido em %{time}
        result_help: >-
          A aceitação pelo APNs não confirma a entrega no dispositivo. Atualize para
          ver os resultados do worker. Os resultados são guardados durante 24 horas.
        results_label: Resultados do teste
        device: Dispositivo %{number}
        pending: Pendente
        refresh: Atualizar resultados
        columns:
