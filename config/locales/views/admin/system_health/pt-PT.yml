            openai_compatible_credentials: Credenciais de API compatíveis com OpenAI
            anthropic_credentials: Credenciais Anthropic
            adapter: Adaptador
            adapter_available: Adaptador disponível
            pgvector_extension: Extensão vector do PostgreSQL
            pgvector_table: Tabela de blocos de vetores
            embedding_model: Modelo de embeddings
            embedding_endpoint: Endpoint de embeddings
            embedding_dimensions: Dimensões dos embeddings
            pdf_text_extraction_failure_reason: Motivo da falha na extração de texto
            pdf_vision_processing_failure_reason: Motivo da falha em visão/nativo
            storage_probe: Verificação do armazenamento pgvector
            embedding_probe: Verificação do endpoint de embeddings
            failure_reason: Motivo da falha
            function_calling: Chamadas de funções (ferramentas)
            function_calling_failure_reason: Motivo da falha na chamada de função
            llm_request_timeout: Tempo limite dos pedidos ao LLM
            probe_request_timeout: Tempo limite dos pedidos de verificação do estado
          providers:
