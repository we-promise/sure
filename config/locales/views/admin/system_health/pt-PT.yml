            openai: Armazenamento de vetores alojado OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          values:
            configured: Configurado
            not_configured: Não configurado
            fallback: "(alternativa)"
            not_set: Não definido
            'yes': Sim
            'no': Não
            enabled: Ativado
            available_not_enabled: Disponível, não ativado
            not_available: Não disponível
            available: Disponível
            not_found: Não encontrado
          pdf_statuses:
            supported: Verificação sintética de PDF passou
            failing: Verificação sintética de PDF falhou
            unsupported: Desativado ou não suportado pelo serviço/modelo efetivo
            not_checked: Não verificado
            unavailable: Indisponível até ser configurado um serviço de AI
          probe_statuses:
            passing: Verificação em direto passou
            failing: Verificação em direto falhou
            not_checked: Não verificado
            not_configured: Não configurado
          vector_statuses:
            passing: Verificações em direto passaram
            failing: Verificação em direto falhou
            not_checked: Não verificado
            not_configured: Não configurado
            scaffolded: Estruturado
            missing: Não configurado
          failure_codes:
            model_not_available: O modelo configurado não foi devolvido pelo serviço
            invalid_response: O serviço devolveu uma resposta inesperada
            dimensions_mismatch: >-
              As dimensões dos vetores de embeddings não correspondem às dimensões
              configuradas
            extension_not_enabled: A extensão vector do PostgreSQL não está ativada
            table_not_found: A tabela vector_store_chunks não foi encontrada
            timeout: O serviço não respondeu antes do tempo limite da verificação
            request_failed: O pedido ao serviço falhou
            unsupported_provider: O serviço não suporta esta verificação
            no_tool_call: O modelo respondeu sem chamar a ferramenta de verificação
            render_missing_binary: O renderizador pdftoppm (poppler-utils) não está
              disponível neste contentor
            tools_refused: >-
              O serviço respondeu ao mesmo pedido sem ferramentas e recusou-o quando
              as incluía
          local_setup:
            title: Configuração local recomendada
            description: >-
              Execute AI através do seu endpoint local compatível com OpenAI, armazene
              os vetores de documentos em pgvector e aponte as definições de embeddings
              para um endpoint de embeddings compatível com OpenAI. A imagem PostgreSQL
              deve incluir a extensão vector e as dimensões dos embeddings devem corresponder
              ao modelo selecionado.
          function_calling_statuses:
            failing: Verificação em direto falhou
            not_checked: Não verificado
            not_used: Ferramentas aceites, mas o modelo não chamou nenhuma
            supported: Chamada de ferramenta em tempo real concluída
            unavailable: Indisponível até ser configurado um fornecedor de LLM
            unsupported: Não compatível com o fornecedor/modelo em uso
          worker:
            configuration_statuses:
              match: Igual à configuração web
              mismatch: Diferente da configuração web
            coverage_notice: >-
              Cada verificação examina exatamente um processo worker: aquele que retirar
              a tarefa da fila. Se houver mais de uma réplica de worker, um resultado
              aprovado não confirma que todos estejam saudáveis; coloque outra verificação
              na fila para testar outro processo.
            description: >-
              As verificações acima foram executadas neste processo web. A maior parte
              do trabalho de IA — respostas do assistente, processamento de PDFs,
              embeddings, categorização automática e identificação de comerciantes
              — é executada num processo worker do Sidekiq, que pode ter acesso à
              rede, DNS, regras de proxy ou até credenciais carregadas diferentes.
              Coloque uma verificação na fila para testar a configuração e a conectividade
              do próprio worker.
            empty:
              description: >-
                Clique em "Verificar configuração do worker" para colocar uma verificação
                assíncrona na fila. O resultado aparecerá aqui quando um processo
                worker executar a tarefa.
              title: Ainda nenhum worker devolveu uma verificação
            labels:
              checked_at: Verificado
              configuration: Configuração
              process: Processo worker
            settings_origin:
              database_backed: >-
                As definições de fornecedor, modelo e chave de API alteradas em Definições
                → Alojamento próprio são guardadas na base de dados. O rails-settings-cached
                invalida a cache partilhada ao escrever, pelo que tanto o processo
                Web como o worker utilizam o novo valor no próximo pedido ou tarefa
                em fila, sem ser necessário reiniciar.
              env_backed: >-
                A configuração de embeddings e os valores definidos apenas por variáveis
                de ambiente são fixados quando cada contentor arranca. O Rails não
                pode alterar o ambiente de outro contentor, pelo que estas alterações
                exigem reiniciar ou recriar os serviços Web e worker. Qualquer ferramenta
                de implementação que reinicie apenas um deles (implementação parcial
                ou atualização de um Secret sem reiniciar o pod) não irá aplicar a
                alteração em todos os processos.
              title: Que definições exigem um reinício?
            statuses:
              failing: Com falha
              passing: Aprovado
              stale: Desatualizado
            title: Verificação do worker
            verify_button: Verificar configuração do worker
      verify_worker_ai:
        queued: >-
          Verificação do worker colocada na fila. Ela aparecerá abaixo quando um processo
          worker executar a tarefa, geralmente em poucos segundos.
