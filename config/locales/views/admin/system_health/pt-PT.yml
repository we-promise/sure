          ready: >-
            Envie uma notificação de teste para os dispositivos iOS ativados e registados
            na sua conta.
          queued: >-
            Notificação de teste em fila. Atualize os resultados abaixo para consultar
            o estado.
          hosted_only: As notificações push estão disponíveis apenas no modo alojado.
          ineligible: Apenas um superadministrador ativo pode enviar uma notificação
            de teste.
          no_devices: >-
            Ative as notificações push na aplicação iOS Sure para esta conta para
            enviar um teste.
          disabled: O operador desativou o envio de notificações push.
          not_configured: As credenciais APNs não estão configuradas.
          cooldown: Aguarde 30 segundos antes de enviar outro teste.
          storage_unavailable: >-
            Não foi possível guardar o pedido de teste. Verifique a configuração da
            cache partilhada.
        statuses:
          queued: Em fila
          accepted: Aceite pelo APNs
          skipped: 'Ignorado: já não é elegível'
          rejected: Rejeitado pelo APNs; consulte os registos push
          unregistered: O registo do dispositivo já não é válido
          retrying: A repetir após um erro temporário
          failed: Falhou; consulte os registos push
          enqueue_failed: Não foi possível colocar em fila; verifique o Sidekiq
          expired: Expirou sem resultado final
      push_notification:
        title: Notificação de teste Sure
        body: Esta é uma notificação push de teste para a sua conta Sure.
      show:
        title: Estado do sistema
        tabs:
          hosted_usage: Utilização alojada
          background_jobs: Tarefas em segundo plano
          ai: Estado da IA
        alert:
          title: As tarefas em segundo plano não estão a ser executadas
        status_section_title: Estado do Sidekiq
