          Estado atual do worker em segundo plano que alimenta as sincronizações,
          os saldos e os cálculos do património líquido.
        counters_section_title: Contadores de tarefas
        counters_section_description: Contadores agregados do Sidekiq em todas as
          filas.
        queues_section_title: Filas
        queues_section_description: >-
          Profundidade por fila e idade da tarefa mais antiga. A latência é o número
          de segundos que a tarefa mais antiga está em espera.
        labels:
          status: Estado
          processes: Processos do worker
          last_heartbeat: Último heartbeat
          max_queue_latency: Idade da tarefa mais antiga
          enqueued: Em fila
          retries: Repetições
          failed: Falhadas
          processed_total: Total processado
          queue: Fila
          size: Tamanho
          latency: Latência
        values:
          healthy: Saudável
          unhealthy: Degradado
          time_ago: há %{time_ago}
          never: Nunca
          seconds: "%{seconds}s"
          no_queues: Não existem filas registadas. O worker pode não estar a ser executado.
        ai:
          run_checks: Executar verificações novamente
          last_checked: >-
            As verificações em direto foram concluídas há %{time_ago}. Os resultados
            ficam em cache por breves instantes.
          not_checked_help: >-
            Abra diretamente o URL de estado da IA ou execute as verificações para
            confirmar que o serviço está operacional.
          loading: A executar as verificações em direto…
          alerts:
            custom_openai:
              title: >-
                A verificação do armazenamento de vetores alojado falhou neste endpoint
                personalizado
              message: >-
                O endpoint configurado não passou na verificação de funcionamento
                /v1/vector_stores. A maioria dos endpoints locais e compatíveis com
                OpenAI não implementa essa API. O chat e o processamento de PDF podem
                continuar a funcionar; para a configuração local habitual, utilize
                pgvector com um endpoint de embeddings separado. A falha foi registada
                em Definições → Registos de depuração e no Rails.logger.
            llm_probe_failed:
              title: A verificação em direto do serviço de AI falhou
              message: >-
                A Sure não conseguiu verificar tanto o endpoint como o modelo configurados.
                A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            pdf_text_extraction_failed:
              title: A verificação sintética de extração de texto de PDF falhou
              message: >-
                A Sure não conseguiu concluir o percurso de extração de texto que
                extrai localmente o texto incorporado no PDF e o envia para o modelo
                configurado. Não foram enviados dados de clientes. A falha foi registada
                em Definições → Registos de depuração e no Rails.logger.
            pdf_vision_processing_failed:
              title: A verificação sintética de visão/nativo de PDF falhou
              message: >-
                A Sure não conseguiu concluir o percurso de imagem ou documento nativo
                em PDF através do modelo configurado. Não foram enviados dados de
                clientes. A falha foi registada em Definições → Registos de depuração
                e no Rails.logger.
            vector_probe_failed:
              title: A verificação em direto da pesquisa de documentos falhou
              message: >-
                A Sure não conseguiu verificar o armazenamento de vetores selecionado
                e todos os serviços de embeddings exigidos. A falha foi registada
                em Definições → Registos de depuração e no Rails.logger.
            qdrant:
              title: O suporte para Qdrant ainda não está implementado
              message: >-
                O adaptador Qdrant está estruturado, mas as operações de carregamento
                e pesquisa de documentos falham atualmente. Selecione OpenAI ou pgvector
                para a pesquisa de documentos.
            missing_vector_store:
              title: Não existe nenhum armazenamento de vetores configurado
              message: >-
                Os documentos carregados não podem ser indexados nem pesquisados até
                serem configurados um adaptador de armazenamento de vetores e os seus
                requisitos.
            unavailable_vector_store:
              title: O armazenamento de vetores selecionado está indisponível
              message: >-
                Verifique os requisitos do adaptador abaixo. Para pgvector, a base
                de dados deve fornecer a extensão vector ou uma tabela vector_store_chunks
                existente.
            embedding_dimensions_mismatch:
              message: >-
                O endpoint de embeddings devolveu um vetor cujo comprimento não corresponde
                a EMBEDDING_DIMENSIONS. Defina EMBEDDING_MODEL e EMBEDDING_DIMENSIONS
                de acordo com o tamanho do vetor documentado para o modelo e reinicie
                o Sure para aplicar as variáveis de ambiente. Depois, altere ou recrie
                a coluna/tabela de embeddings do pgvector e gere novamente os embeddings
                dos documentos se os dados existentes utilizavam outro tamanho.
              title: As dimensões dos embeddings não correspondem
            embedding_probe_failed:
              message: >-
                O Sure não conseguiu criar um embedding curto de teste com o endpoint
                e o modelo configurados. Verifique EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN e os registos do fornecedor de embeddings.
                A falha foi registada em Definições → Registos de depuração e no Rails.logger.
              title: A verificação em tempo real dos embeddings falhou
            embedding_probe_timeout:
              message: >-
                O endpoint de embeddings não respondeu dentro do prazo de AI_HEALTH_PROBE_TIMEOUT.
                Aumente esse tempo limite de verificação se o fornecedor for lento
                e reinicie o Sure para aplicar as variáveis de ambiente em todos os
                processos. Se as chamadas normais do chat com IA também excederem
                o tempo limite, aumente OPENAI_REQUEST_TIMEOUT separadamente.
              title: A verificação em tempo real dos embeddings excedeu o tempo limite
            function_calling_not_used:
              message: >-
                O endpoint aceitou o parâmetro tools, mas o modelo respondeu com texto
                em vez de chamar a ferramenta de verificação. O assistente de IA não
                consegue ler dados financeiros sem chamar ferramentas, por isso o
                chat pode responder sem dados ou com valores inventados. Prefira um
                modelo cujo fornecedor documente o suporte a chamadas de funções.
              title: O modelo respondeu sem chamar a ferramenta pedida
            function_calling_unsupported:
              message: >-
                O endpoint respondeu a um pedido simples de chat, mas rejeitou o mesmo
                pedido com o parâmetro tools. O assistente de IA lê contas, transações
                e posições através de chamadas de funções, pelo que o chat continuará
                a falhar — muitas vezes com um erro 404 pouco esclarecedor — até utilizar
                um modelo com suporte a ferramentas. Escolha um modelo cujo fornecedor
                documente o suporte a chamadas de funções. A falha foi registada em
                Definições → Registos de depuração e em Rails.logger.
              title: O modelo não oferece suporte a chamadas de funções
            llm_model_not_available:
              message: >-
                O endpoint respondeu, mas não listou nem disponibilizou o modelo configurado.
                Escolha um modelo ativo do fornecedor selecionado e execute as verificações
                novamente. Para usar o Gemini por uma camada de compatibilidade com
                a OpenAI, escolha um modelo com suporte atual, como gemini-2.5-flash.
              title: O modelo de IA configurado não está disponível
            pgvector_extension_not_enabled:
              message: >-
                O adaptador pgvector está selecionado, mas a extensão vector não está
                ativada nesta base de dados PostgreSQL. Utilize uma imagem do PostgreSQL
                que inclua o pgvector, ative a extensão como proprietário da base
                de dados ou superutilizador e execute novamente as migrações com VECTOR_STORE_PROVIDER=pgvector.
              title: A extensão vector do PostgreSQL não está ativada
            pgvector_probe_failed:
              message: >-
                O Sure não conseguiu consultar a tabela de trechos do pgvector. Verifique
                as permissões do PostgreSQL, a extensão vector e a migração vector_store_chunks.
                A falha foi registada em Definições → Registos de depuração e no Rails.logger.
              title: A verificação do armazenamento pgvector falhou
            pgvector_table_not_found:
              message: >-
                A extensão pgvector está ativada, mas a tabela de trechos não foi
                encontrada. Verifique o estado das migrações e execute novamente a
                migração do armazenamento de vetores com VECTOR_STORE_PROVIDER=pgvector
                para que o Sure possa criar vector_store_chunks.
              title: A tabela vector_store_chunks está ausente
          llm:
            title: Processamento AI e de PDF
            description: >-
              As verificações em direto confirmam o modelo configurado e, em seguida,
              testam separadamente a extração de texto e o processamento de visão/nativo
              com um PDF sintético de uma página que não contém dados de clientes.
              Os valores das credenciais nunca são apresentados.
          vector_store:
            title: Armazenamento de vetores e pesquisa de documentos
            description: >-
              A verificação em direto consulta a API do armazenamento de vetores alojado,
              ou testa a tabela pgvector e cria um embedding curto sem o armazenar.
          labels:
            selected_provider: Serviço selecionado
            effective_provider: Serviço efetivo
            model: Modelo
            endpoint: Endpoint
            pdf_text_extraction: Percurso de extração de texto de PDF
