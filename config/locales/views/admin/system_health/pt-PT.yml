        ai:
          adapters:
            openai: Armazenamento de vetores alojado OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: O endpoint configurado não passou na verificação de funcionamento
                /v1/vector_stores. A maioria dos endpoints locais e compatíveis com
                OpenAI não implementa essa API. O chat e o processamento de PDF podem
                continuar a funcionar; para a configuração local habitual, utilize
                pgvector com um endpoint de embeddings separado. A falha foi registada
                em Definições → Registos de depuração e no Rails.logger.
              title: A verificação do armazenamento de vetores alojado falhou neste
                endpoint personalizado
            llm_probe_failed:
              message: A Sure não conseguiu verificar tanto o endpoint como o modelo
                configurados. A falha foi registada em Definições → Registos de depuração
                e no Rails.logger.
              title: A verificação em direto do serviço de AI falhou
            missing_vector_store:
              message: Os documentos carregados não podem ser indexados nem pesquisados
                até serem configurados um adaptador de armazenamento de vetores e
                os seus requisitos.
              title: Não existe nenhum armazenamento de vetores configurado
            pdf_text_extraction_failed:
              message: A Sure não conseguiu concluir o percurso de extração de texto
                que extrai localmente o texto incorporado no PDF e o envia para o
                modelo configurado. Não foram enviados dados de clientes. A falha
                foi registada em Definições → Registos de depuração e no Rails.logger.
              title: A verificação sintética de extração de texto de PDF falhou
            pdf_vision_processing_failed:
              message: A Sure não conseguiu concluir o percurso de imagem ou documento
                nativo em PDF através do modelo configurado. Não foram enviados dados
                de clientes. A falha foi registada em Definições → Registos de depuração
                e no Rails.logger.
              title: A verificação sintética de visão/nativo de PDF falhou
            qdrant:
              message: O adaptador Qdrant está estruturado, mas as operações de carregamento
                e pesquisa de documentos falham atualmente. Selecione OpenAI ou pgvector
                para a pesquisa de documentos.
              title: O suporte para Qdrant ainda não está implementado
            unavailable_vector_store:
              message: Verifique os requisitos do adaptador abaixo. Para pgvector,
                a base de dados deve fornecer a extensão vector ou uma tabela vector_store_chunks
                existente.
              title: O armazenamento de vetores selecionado está indisponível
            vector_probe_failed:
              message: A Sure não conseguiu verificar o armazenamento de vetores selecionado
                e todos os serviços de embeddings exigidos. A falha foi registada
                em Definições → Registos de depuração e no Rails.logger.
              title: A verificação em direto da pesquisa de documentos falhou
