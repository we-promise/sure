        ai:
          run_checks: Executar verificações novamente
          last_checked: "As verificações em direto foram concluídas há %{time_ago}. Os resultados ficam em cache por breves instantes."
          not_checked_help: Abra diretamente o URL de estado da IA ou execute as verificações para confirmar que o serviço está operacional.
          alerts:
            custom_openai:
              title: A verificação do armazenamento de vetores alojado falhou neste endpoint personalizado
              message: O endpoint configurado não passou na verificação de funcionamento /v1/vector_stores. A maioria dos endpoints locais e compatíveis com OpenAI não implementa essa API. O chat e o processamento de PDF podem continuar a funcionar; para a configuração local habitual, utilize pgvector com um endpoint de embeddings separado. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            llm_probe_failed:
              title: A verificação em direto do serviço de IA falhou
              message: O Sure não conseguiu verificar tanto o endpoint como o modelo configurados. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            pdf_text_extraction_failed:
              title: A verificação sintética de extração de texto de PDF falhou
              message: O Sure não conseguiu concluir o percurso de extração de texto que extrai localmente o texto incorporado no PDF e o envia para o modelo configurado. Não foram enviados dados de clientes. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            pdf_vision_processing_failed:
              title: A verificação sintética de visão/nativo de PDF falhou
              message: O Sure não conseguiu concluir o percurso de imagem ou documento nativo em PDF através do modelo configurado. Não foram enviados dados de clientes. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            vector_probe_failed:
              title: A verificação em direto da pesquisa de documentos falhou
              message: O Sure não conseguiu verificar o armazenamento de vetores selecionado e todos os serviços de embeddings exigidos. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            qdrant:
              title: O suporte para Qdrant ainda não está implementado
              message: O adaptador Qdrant está estruturado, mas as operações de carregamento e pesquisa de documentos falham atualmente. Selecione OpenAI ou pgvector para a pesquisa de documentos.
            missing_vector_store:
              title: Não existe nenhum armazenamento de vetores configurado
              message: Os documentos carregados não podem ser indexados nem pesquisados até serem configurados um adaptador de armazenamento de vetores e os seus requisitos.
            unavailable_vector_store:
              title: O armazenamento de vetores selecionado está indisponível
              message: Verifique os requisitos do adaptador abaixo. Para pgvector, a base de dados deve fornecer a extensão vector ou uma tabela vector_store_chunks existente.
            function_calling_unsupported:
              title: O modelo não suporta chamadas de funções
              message: O endpoint respondeu a um pedido de chat simples, mas rejeitou o mesmo pedido com o parâmetro tools. O assistente de IA lê contas, transações e posições através de chamadas de funções, pelo que o chat continuará a falhar — muitas vezes com um erro 404 pouco útil — até ser usado um modelo que suporte ferramentas. Escolha um modelo cujo serviço documente o suporte a chamadas de funções. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            function_calling_not_used:
              title: O modelo respondeu sem chamar a ferramenta que lhe foi pedida
              message: O endpoint aceitou o parâmetro tools, mas o modelo respondeu com texto em vez de chamar a ferramenta de verificação de estado. O assistente de IA não consegue ler dados financeiros sem chamadas de ferramentas, pelo que o chat pode não responder nada ou responder com valores inventados. Prefira um modelo cujo serviço documente o suporte a chamadas de funções.
            llm_model_not_available:
              title: O modelo de IA configurado não está disponível
              message: O endpoint respondeu, mas não listou nem serviu o modelo configurado. Escolha um modelo ativo para o serviço selecionado e execute novamente as verificações. Para o Gemini através de uma camada de tradução compatível com OpenAI, utilize um modelo atualmente suportado, como gemini-2.5-flash.
            pgvector_extension_not_enabled:
              title: A extensão vector do PostgreSQL não está ativada
              message: O adaptador pgvector está selecionado, mas o PostgreSQL não ativou a extensão vector para esta base de dados. Utilize uma imagem PostgreSQL que inclua o pgvector, ative a extensão como proprietário da base de dados ou superutilizador e volte a executar as migrações com VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: A tabela vector_store_chunks não existe
              message: A extensão pgvector está ativada, mas a tabela de blocos não foi encontrada. Verifique o estado das migrações e volte a executar a migração do armazenamento de vetores com VECTOR_STORE_PROVIDER=pgvector para que o Sure possa criar a tabela vector_store_chunks.
            pgvector_probe_failed:
              title: A verificação do armazenamento pgvector falhou
              message: O Sure não conseguiu consultar a tabela de blocos do pgvector. Verifique as permissões do PostgreSQL, a extensão vector e a migração vector_store_chunks. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
            embedding_dimensions_mismatch:
              title: As dimensões dos embeddings não correspondem
              message: O endpoint de embeddings devolveu um vetor cujo comprimento não corresponde a EMBEDDING_DIMENSIONS. Defina EMBEDDING_MODEL e EMBEDDING_DIMENSIONS com o tamanho de vetor documentado do modelo, reinicie o Sure para que o ambiente seja aplicado e, em seguida, altere ou recrie a coluna/tabela de embeddings do pgvector e volte a gerar os embeddings dos documentos se os dados existentes usaram um tamanho diferente.
            embedding_probe_timeout:
              title: A verificação em direto dos embeddings excedeu o tempo limite
              message: O endpoint de embeddings não respondeu antes de AI_HEALTH_PROBE_TIMEOUT. Aumente esse tempo limite da verificação de estado se o serviço for lento e reinicie o Sure para que o ambiente seja aplicado em todos os processos. Se as chamadas normais do chat de IA também excederem o tempo limite, aumente OPENAI_REQUEST_TIMEOUT separadamente.
            embedding_probe_failed:
              title: A verificação em direto dos embeddings falhou
              message: O Sure não conseguiu criar um embedding de teste curto através do endpoint e do modelo configurados. Verifique EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN e os registos do serviço de embeddings. A falha foi registada em Definições → Registos de depuração e no Rails.logger.
          llm:
            title: Processamento de IA e de PDF
            description: As verificações em direto confirmam o modelo configurado e, em seguida, testam separadamente a extração de texto e o processamento de visão/nativo com um PDF sintético de uma página que não contém dados de clientes. Os valores das credenciais nunca são apresentados.
          vector_store:
            title: Armazenamento de vetores e pesquisa de documentos
            description: A verificação em direto consulta a API do armazenamento de vetores alojado, ou testa a tabela pgvector e cria um embedding curto sem o armazenar.
