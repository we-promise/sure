          worker:
            title: Verificarea worker-ului
            description: Verificările de mai sus au rulat din acest proces web. Majoritatea operațiunilor AI -- răspunsurile asistentului, procesarea PDF, embedding-urile, categorisirea automată și detectarea comercianților -- rulează de fapt într-un proces worker Sidekiq, care poate diferi prin accesul la rețea, DNS, regulile de proxy sau chiar prin credențialele încărcate. Pune în coadă o verificare pentru a confirma configurația și conectivitatea proprii ale unui worker.
            verify_button: Verifică configurația worker-ului
            coverage_notice: Fiecare verificare testează exact un proces worker -- pe cel care o preia din coadă. Cu mai multe replici de worker, un rezultat reușit nu confirmă că toți worker-ii funcționează; pune din nou verificarea în coadă pentru a testa un alt worker.
            empty:
              title: Niciun worker nu a raportat încă
              description: Apasă „Verifică configurația worker-ului” pentru a pune în coadă o verificare asincronă. Rezultatul apare aici după ce un proces worker o preia.
            labels:
              process: Proces worker
              checked_at: Verificat
              configuration: Configurație
            configuration_statuses:
              match: Identică cu web
              mismatch: Diferită de web
            statuses:
              passing: Reușită
              failing: Eșuată
              stale: Învechită
            settings_origin:
              title: Ce setări necesită o repornire?
              database_backed: Setările de furnizor, model și cheie API modificate în Setări → Găzduire proprie sunt stocate în baza de date. rails-settings-cached invalidează cache-ul partajat la scriere, așa că atât procesul web, cât și worker-ul folosesc noua valoare la următoarea cerere sau sarcină din coadă -- nu este necesară nicio repornire.
              env_backed: Configurația de embedding și orice valoare setată doar printr-o variabilă de mediu sunt fixate la pornirea fiecărui container. Rails nu poate modifica mediul unui alt container, așa că schimbarea acestora necesită repornirea sau recrearea ambelor servicii, web și worker -- iar orice instrument de implementare care repornește doar unul dintre ele (lansare parțială, un Secret actualizat fără repornirea pod-ului) nu va prelua modificarea.
          local_setup:
            title: Configurație locală recomandată
            description: Rulează LLM-ul prin endpoint-ul tău local compatibil cu OpenAI, stochează vectorii documentelor în pgvector și direcționează setările de embedding către un endpoint de embeddings compatibil cu OpenAI. Imaginea PostgreSQL trebuie să includă extensia vector, iar dimensiunile embedding-ului trebuie să corespundă modelului selectat.
