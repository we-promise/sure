            request_failed: Cererea către serviciu a eșuat
            table_not_found: Tabelul vector_store_chunks nu a fost găsit
            timeout: Serviciul nu a răspuns înainte de expirarea verificării
            tools_refused: Serviciul a procesat aceeași cerere fără instrumente și
