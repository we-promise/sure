          worker:
            labels:
              checked_at: Verificat
              configuration: Configurare
              process: Proces de lucru
            configuration_statuses:
              match: Corespunde procesului web
              mismatch: Diferă de procesul web
            coverage_notice: Fiecare verificare testează exact un proces de lucru
              — cel care preia sarcina din coadă. Dacă există mai multe replici, un
              rezultat reușit nu confirmă starea tuturor proceselor; adaugă din nou
              verificarea în coadă pentru a testa alt proces.
            description: Verificările de mai sus au rulat din acest proces web. Majoritatea
              operațiunilor AI — răspunsurile asistentului, procesarea PDF, reprezentările
              vectoriale, clasificarea automată și detectarea comercianților — rulează
              într-un proces Sidekiq, care poate avea alt acces la rețea, DNS, reguli
              proxy sau chiar alte date de autentificare încărcate. Adaugă o verificare
              în coadă pentru a testa configurarea și conectivitatea procesului de
              lucru.
            empty:
              description: Apasă „Verifică configurarea procesului de lucru” pentru
                a adăuga o verificare asincronă în coadă. Rezultatul apare aici după
                ce un proces preia sarcina.
              title: Niciun proces de lucru nu a raportat încă
            settings_origin:
              database_backed: Setările furnizorului, modelului și cheii API modificate
                în Setări → Găzduire proprie sunt stocate în baza de date. rails-settings-cached
                invalidează cache-ul comun la scriere, astfel încât procesul web și
                procesul de lucru folosesc noua valoare la următoarea cerere sau sarcină
                — fără repornire.
              env_backed: Configurarea reprezentărilor vectoriale și orice valoare
                setată exclusiv printr-o variabilă de mediu sunt fixate la pornirea
                fiecărui container. Rails nu poate schimba mediul altui container;
                modificarea necesită repornirea sau recrearea atât a serviciului web,
                cât și a procesului de lucru. Instrumentele de implementare care repornesc
                doar unul (lansare parțială, un Secret actualizat fără repornirea
                podului) nu vor prelua modificarea.
              title: Ce setări necesită repornire?
            statuses:
              failing: Eșuează
              passing: Funcționează
              stale: Învechit
            title: Verificarea procesului de lucru
            verify_button: Verifică configurarea procesului de lucru
          adapters:
            openai: Depozit vectorial găzduit de OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Endpointul configurat nu a trecut verificarea disponibilității
                /v1/vector_stores. Majoritatea endpointurilor locale și compatibile
                OpenAI nu implementează acest API. Conversațiile și procesarea PDF
                pot funcționa în continuare; pentru configurarea locală obișnuită,
                folosește pgvector cu un endpoint separat pentru reprezentări vectoriale.
                Eroarea a fost înregistrată în Setări → Jurnale de depanare și în
                Rails.logger.
              title: Verificarea depozitului vectorial găzduit a eșuat la acest endpoint
                personalizat
            embedding_dimensions_mismatch:
              message: Endpointul pentru reprezentări vectoriale a returnat un vector
                cu lungimea diferită de EMBEDDING_DIMENSIONS. Setează EMBEDDING_MODEL
                și EMBEDDING_DIMENSIONS conform dimensiunii documentate a modelului,
                repornește Sure pentru a păstra mediul configurat, apoi modifică sau
                recreează coloana/tabelul de vectori pgvector și regenerează reprezentările
                documentelor dacă datele existente foloseau altă dimensiune.
              title: Dimensiunile reprezentărilor vectoriale nu corespund
            embedding_probe_failed:
              message: Sure nu a putut genera o reprezentare vectorială scurtă de
                test prin endpointul și modelul configurate. Verifică EMBEDDING_URI_BASE,
                EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN și jurnalele furnizorului
                de reprezentări vectoriale. Eroarea a fost înregistrată în Setări
                → Jurnale de depanare și în Rails.logger.
              title: Verificarea în timp real a reprezentărilor vectoriale a eșuat
            embedding_probe_timeout:
              message: Endpointul pentru reprezentări vectoriale nu a răspuns înainte
                de expirarea AI_HEALTH_PROBE_TIMEOUT. Mărește această limită dacă
                furnizorul este lent, apoi repornește Sure pentru ca mediul configurat
                să fie păstrat în fiecare proces. Dacă expiră și cererile obișnuite
                de conversație AI, mărește separat OPENAI_REQUEST_TIMEOUT.
              title: Verificarea în timp real a reprezentărilor vectoriale a expirat
            function_calling_not_used:
              message: Endpointul a acceptat parametrul tools, dar modelul a răspuns
                cu text în loc să apeleze instrumentul de verificare. Asistentul AI
                nu poate citi date financiare fără apeluri de instrumente, așa că
                poate răspunde fără informații sau cu cifre inventate. Preferă un
                model pentru care furnizorul documentează suportul pentru apelarea
                funcțiilor.
              title: Modelul a răspuns fără să apeleze instrumentul solicitat
            function_calling_unsupported:
              message: Endpointul a procesat o cerere simplă de conversație, dar a
                respins aceeași cerere cu parametrul tools. Asistentul AI citește
                conturi, tranzacții și dețineri prin apeluri de funcții, așa că discuțiile
                continuă să eșueze — adesea cu un mesaj 404 neclar — până la alegerea
                unui model cu suport pentru instrumente. Alege un model pentru care
                furnizorul documentează apelarea funcțiilor. Eroarea a fost înregistrată
                în Setări → Jurnale de depanare și în Rails.logger.
              title: Modelul nu acceptă apelarea funcțiilor
            llm_model_not_available:
              message: Endpointul a răspuns, dar nu a enumerat și nici nu a pus la
                dispoziție modelul configurat. Alege un model activ pentru furnizorul
                selectat, apoi repetă verificările. Pentru Gemini printr-un strat
                de compatibilitate OpenAI, folosește un model acceptat în prezent,
                precum gemini-2.5-flash.
              title: Modelul AI configurat nu este disponibil
            llm_probe_failed:
              message: Sure nu a putut verifica atât endpointul, cât și modelul configurat.
                Eroarea a fost înregistrată în Setări → Jurnale de depanare și în
                Rails.logger.
              title: Verificarea LLM în timp real a eșuat
            missing_vector_store:
              message: Documentele încărcate nu pot fi indexate sau căutate până la
                configurarea unui adaptor de depozit vectorial și a cerințelor sale.
              title: Nu este configurat niciun depozit vectorial
            pdf_text_extraction_failed:
              message: Sure nu a putut finaliza fluxul care extrage mai întâi local
                textul încorporat în PDF și îl trimite modelului configurat. Nu au
                fost trimise date ale clienților. Eroarea a fost înregistrată în Setări
                → Jurnale de depanare și în Rails.logger.
              title: Verificarea extragerii textului din PDF-ul sintetic a eșuat
            pdf_vision_processing_failed:
              message: Sure nu a putut finaliza procesarea PDF ca imagine sau document
                nativ prin modelul configurat. Nu au fost trimise date ale clienților.
                Eroarea a fost înregistrată în Setări → Jurnale de depanare și în
                Rails.logger.
              title: Verificarea vizuală/nativă a PDF-ului sintetic a eșuat
            pgvector_extension_not_enabled:
              message: Adaptorul pgvector este selectat, dar extensia vector nu este
                activată în PostgreSQL pentru această bază de date. Folosește o imagine
                PostgreSQL care include pgvector, activează extensia ca proprietar
                al bazei sau superutilizator, apoi rulează din nou migrările cu VECTOR_STORE_PROVIDER=pgvector.
              title: Extensia vector PostgreSQL nu este activată
            pgvector_probe_failed:
              message: Sure nu a putut interoga tabelul de fragmente pgvector. Verifică
                permisiunile PostgreSQL, extensia vector și migrarea vector_store_chunks.
                Eroarea a fost înregistrată în Setări → Jurnale de depanare și în
                Rails.logger.
              title: Verificarea stocării pgvector a eșuat
            pgvector_table_not_found:
              message: Extensia pgvector este activată, dar tabelul de fragmente nu
                a fost găsit. Verifică starea migrărilor, apoi rulează din nou migrarea
                depozitului vectorial cu VECTOR_STORE_PROVIDER=pgvector, pentru ca
                Sure să poată crea vector_store_chunks.
              title: Lipsește tabelul vector_store_chunks
            qdrant:
              message: Adaptorul Qdrant are structura inițială, însă încărcarea și
                căutarea documentelor eșuează în prezent. Selectează OpenAI sau pgvector
                pentru căutarea documentelor.
              title: Suportul Qdrant nu este încă implementat
            unavailable_vector_store:
              message: Verifică cerințele adaptorului de mai jos. Pentru pgvector,
                baza de date trebuie să ofere extensia vector sau un tabel vector_store_chunks
                existent.
              title: Depozitul vectorial selectat nu este disponibil
            vector_probe_failed:
              message: Sure nu a putut verifica depozitul vectorial selectat și toate
                serviciile necesare pentru reprezentări vectoriale. Eroarea a fost
                înregistrată în Setări → Jurnale de depanare și în Rails.logger.
              title: Verificarea în timp real a căutării documentelor a eșuat
          failure_codes:
            dimensions_mismatch: Dimensiunile vectorului generat nu corespund dimensiunilor
              configurate
            extension_not_enabled: Extensia vector PostgreSQL nu este activată
            invalid_response: Serviciul a returnat un răspuns neașteptat
            model_not_available: Modelul configurat nu a fost returnat de furnizor
