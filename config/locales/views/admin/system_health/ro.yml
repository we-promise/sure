        ai:
          run_checks: Rulează din nou verificările
          last_checked: Verificările live s-au finalizat acum %{time_ago}. Rezultatele sunt păstrate în cache pentru scurt timp.
          not_checked_help: Deschide direct URL-ul de stare AI sau rulează verificările pentru a confirma că serviciile funcționează.
          alerts:
            custom_openai:
              title: Verificarea depozitului vectorial găzduit a eșuat la acest endpoint personalizat
              message: Endpoint-ul configurat nu a trecut verificarea de funcționare /v1/vector_stores. Majoritatea endpoint-urilor locale și compatibile cu OpenAI nu implementează acest API. Chatul și procesarea PDF pot funcționa în continuare; pentru configurația locală obișnuită, folosește pgvector cu un endpoint separat pentru embeddings. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            function_calling_unsupported:
              title: Modelul nu acceptă apelarea de funcții
              message: Endpoint-ul a răspuns la o cerere de chat simplă, dar a respins aceeași cerere când aceasta conținea parametrul tools. Asistentul AI citește conturile, tranzacțiile și deținerile prin apeluri de funcții, așa că chatul va eșua în continuare — adesea cu o eroare 404 neclară — până când folosești un model care acceptă tools. Alege un model al cărui furnizor documentează suportul pentru apelarea de funcții. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            function_calling_not_used:
              title: Modelul a răspuns fără să apeleze instrumentul cerut
              message: Endpoint-ul a acceptat parametrul tools, dar modelul a răspuns cu text în loc să apeleze instrumentul de verificare. Asistentul AI nu poate citi datele financiare fără apeluri de instrumente, așa că chatul poate răspunde gol sau cu cifre inventate. Preferă un model al cărui furnizor documentează suportul pentru apelarea de funcții.
            llm_probe_failed:
              title: Verificarea live a LLM-ului a eșuat
              message: Sure nu a putut verifica atât endpoint-ul configurat, cât și modelul. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            llm_model_not_available:
              title: Modelul AI configurat nu este disponibil
              message: Endpoint-ul a răspuns, dar nu a listat sau nu a servit modelul configurat. Alege un model activ pentru furnizorul selectat, apoi rulează din nou verificările. Pentru Gemini printr-un strat de traducere compatibil cu OpenAI, folosește un model acceptat în prezent, cum ar fi gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Verificarea extragerii textului dintr-un PDF sintetic a eșuat
              message: Sure nu a putut finaliza fluxul bazat pe text, care extrage local textul încorporat în PDF și îl trimite modelului configurat. Nu au fost trimise date ale clienților. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            pdf_vision_processing_failed:
              title: Verificarea vision/nativă cu un PDF sintetic a eșuat
              message: Sure nu a putut finaliza fluxul PDF bazat pe imagine sau pe document nativ prin modelul configurat. Nu au fost trimise date ale clienților. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            vector_probe_failed:
              title: Verificarea live a căutării în documente a eșuat
              message: Sure nu a putut verifica depozitul vectorial selectat și toate serviciile de embedding necesare. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            pgvector_extension_not_enabled:
              title: Extensia vector din PostgreSQL nu este activată
              message: Adaptorul pgvector este selectat, dar extensia vector nu este activată în PostgreSQL pentru această bază de date. Folosește o imagine PostgreSQL care include pgvector, apoi activează extensia ca proprietar al bazei de date sau ca superuser și rulează din nou migrările cu VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Tabelul vector_store_chunks lipsește
              message: Extensia pgvector este activată, dar tabelul de fragmente (chunks) nu a fost găsit. Verifică starea migrărilor, apoi rulează din nou migrarea depozitului vectorial cu VECTOR_STORE_PROVIDER=pgvector, ca Sure să poată crea vector_store_chunks.
            pgvector_probe_failed:
              title: Verificarea stocării pgvector a eșuat
              message: Sure nu a putut interoga tabelul de fragmente pgvector. Verifică permisiunile PostgreSQL, extensia vector și migrarea vector_store_chunks. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            embedding_dimensions_mismatch:
              title: Dimensiunile embedding-ului nu corespund
              message: Endpoint-ul de embedding a returnat un vector a cărui lungime nu corespunde cu EMBEDDING_DIMENSIONS. Setează EMBEDDING_MODEL și EMBEDDING_DIMENSIONS la dimensiunea vectorului documentată pentru model, repornește Sure pentru ca mediul să fie aplicat, apoi modifică sau recreează coloana/tabelul de embedding pgvector și regenerează embedding-urile documentelor dacă datele existente foloseau o altă dimensiune.
            embedding_probe_timeout:
              title: Verificarea live a embedding-ului a depășit timpul limită
              message: Endpoint-ul de embedding nu a răspuns înainte de AI_HEALTH_PROBE_TIMEOUT. Mărește acest timp limită al verificării dacă furnizorul este lent, apoi repornește Sure pentru ca mediul să fie aplicat în fiecare proces. Dacă și apelurile obișnuite de chat AI depășesc timpul limită, mărește separat OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Verificarea live a embedding-ului a eșuat
              message: Sure nu a putut crea un embedding scurt de test prin endpoint-ul și modelul configurate. Verifică EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN și jurnalele furnizorului de embedding. Eroarea a fost înregistrată în Setări → Jurnale de depanare și în Rails.logger.
            qdrant:
              title: Suportul pentru Qdrant nu este încă implementat
              message: Adaptorul Qdrant există doar ca schelet, iar operațiunile de încărcare și căutare a documentelor eșuează în prezent. Selectează OpenAI sau pgvector pentru căutarea în documente.
            missing_vector_store:
              title: Niciun depozit vectorial nu este configurat
              message: Documentele încărcate nu pot fi indexate sau căutate până când nu sunt configurate un adaptor de depozit vectorial și cerințele acestuia.
            unavailable_vector_store:
              title: Depozitul vectorial selectat nu este disponibil
              message: Verifică cerințele adaptorului de mai jos. Pentru pgvector, baza de date trebuie să ofere extensia vector sau un tabel vector_store_chunks existent.
          llm:
            title: LLM și procesare PDF
            description: Verificările live confirmă modelul configurat, îi cer un apel de funcție trivial, așa cum face asistentul, apoi testează separat extragerea textului și procesarea vision/nativă cu un PDF sintetic de o pagină, fără date ale clienților. Valorile credențialelor nu sunt afișate niciodată.
          vector_store:
            title: Depozit vectorial și căutare în documente
            description: Verificarea live interoghează API-ul depozitului vectorial găzduit sau testează tabelul pgvector și creează un embedding scurt, fără a-l stoca.
