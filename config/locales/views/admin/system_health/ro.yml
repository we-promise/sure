            title: LLM și procesarea PDF
          loading: Se execută verificările în timp real…
          local_setup:
            description: Rulează LLM-ul prin endpointul tău local compatibil OpenAI,
              stochează vectorii documentelor în pgvector și configurează reprezentările
              vectoriale către un endpoint compatibil OpenAI. Imaginea PostgreSQL
              trebuie să includă extensia vector, iar dimensiunile trebuie să corespundă
              modelului selectat.
            title: Configurare locală recomandată
          not_checked_help: Deschide direct URL-ul stării AI sau rulează verificările
