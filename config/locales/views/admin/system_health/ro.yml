          run_checks: Rulează din nou verificările
          vector_store:
            description: Verificarea în timp real interoghează API-ul depozitului
              vectorial găzduit sau testează tabelul pgvector și generează o reprezentare
              vectorială scurtă fără a o stoca.
            title: Depozit vectorial și căutarea documentelor
