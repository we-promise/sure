      optional_services:
        title: Optionale Dienste
        description: "Optionale Betreiber-Integrationen. Nicht konfigurierte Dienste sind Hinweise. Diese Prüfungen lesen nur Einstellungen; sie testen keine Verbindungen, senden keine Testereignisse und ändern keine Analytics-Einwilligung. Öffne einen Dienst für Einrichtungshinweise."
        missing_settings: "Fehlende Einstellungen: %{settings}"
        statuses:
