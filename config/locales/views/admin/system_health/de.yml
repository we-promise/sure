---
de:
  admin:
    system_health:
      configuration:
        checks:
          exchange_rates:
            guidance: Wählen Sie einen Wechselkursanbieter und ergänzen Sie bei Bedarf
              dessen API-Schlüssel in den Self-Hosting-Einstellungen oder in der Bereitstellungsumgebung.
              EXCHANGE_RATE_PROVIDER und Umgebungsvariablen für API-Schlüssel haben
              Vorrang.
            issues:
              invalid_provider: Der ausgewählte Wechselkursanbieter wird nicht erkannt.
                Automatische Kursabfragen schlagen fehl, bis ein unterstützter Anbieter
                ausgewählt wird.
            statuses:
              configured: Der ausgewählte Wechselkursanbieter ist konfiguriert.
              not_configured: Kein nutzbarer Wechselkursanbieter ist konfiguriert.
                Automatische Währungsumrechnung ist möglicherweise nicht verfügbar,
                wenn ein gespeicherter Kurs fehlt.
            title: Wechselkurse
          securities:
            guidance: Wählen Sie Anbieter und ergänzen Sie erforderliche API-Schlüssel
              in den Self-Hosting-Einstellungen oder in der Bereitstellungsumgebung.
              Umgebungsvariablen haben Vorrang. Öffentliche Anbieter benötigen keinen
              API-Schlüssel.
            statuses:
              configured: Alle aktivierten Marktpreisanbieter sind konfiguriert.
              disabled: Kein Marktpreisanbieter ist aktiviert. Automatische Wertpapiersuchen
                und Preisabfragen sind nicht verfügbar.
              incomplete: Bei mindestens einem aktivierten Marktpreisanbieter fehlt
                die Konfiguration oder die Auswahl ist ungültig. Zugeordnete Wertpapiere
                erhalten möglicherweise keine Preisaktualisierungen.
              not_configured: Bei den aktivierten Marktpreisanbietern fehlen die API-Schlüssel.
                Automatische Wertpapiersuchen und Preisabfragen sind über diese Anbieter
                nicht verfügbar.
            title: Marktpreise
          smtp:
            guidance: SMTP kann nicht in der Verwaltungsoberfläche konfiguriert werden.
              Setzen Sie die E-Mail-Umgebungsvariablen für den Web- und den Worker-Dienst
              und starten Sie beide neu. Für ein Relay ohne Authentifizierung können
              SMTP_USERNAME und SMTP_PASSWORD beide entfallen.
            issues:
              address: SMTP_ADDRESS
              app_domain: APP_DOMAIN (für Links in E-Mails)
              authentication: SMTP_USERNAME und SMTP_PASSWORD (beide oder keines angeben)
              port: SMTP_PORT (eine Zahl von 1 bis 65535)
              sender: EMAIL_SENDER (den Standard sender@sure.local ersetzen)
            statuses:
              configured: SMTP-Einstellungen sind vorhanden.
              disabled: Der E-Mail-Versand ist in der laufenden Mailer-Konfiguration
                deaktiviert.
              incomplete: Einige E-Mail-Einstellungen fehlen oder sind unvollständig.
                System-E-Mails oder darin enthaltene Links funktionieren möglicherweise
                nicht.
              not_checked: Dieser Prozess verwendet eine andere Versandmethode als
                SMTP, beispielsweise eine Entwicklungsvorschau. Der SMTP-Versand wird
                nicht beurteilt.
              not_configured: SMTP ist nicht konfiguriert. Passwort-Zurücksetzungen,
                Einladungen und andere System-E-Mails können nicht über SMTP versendet
                werden.
            title: E-Mail (SMTP)
          storage:
            guidance: Prüfen Sie ACTIVE_STORAGE_SERVICE und die Bereitstellungseinstellungen
              des gewählten Speichers. Lokaler Speicher muss dauerhaft und für Web-
              und Worker-Dienst gemeinsam verfügbar sein. Ein Speicherwechsel verschiebt
              bestehende Dateien nicht; planen Sie eine Migration gesondert.
            issues:
              bucket: Speicher-Bucket
              credentials: Zugriffsschlüssel und geheimer Schlüssel (beide angeben
                oder externe Zugangsdatenquelle verwenden)
              endpoint: Speicher-Endpunkt (und CLOUDFLARE_ACCOUNT_ID für R2)
              region: Speicherregion
              root: Stammverzeichnis des lokalen Speichers
            statuses:
              configured: Speichereinstellungen sind vorhanden; lokaler Speicher benötigt
                keine Cloud-Zugangsdaten.
              incomplete: Erforderliche Speichereinstellungen fehlen oder sind unvollständig.
                Datei-Uploads oder Abrufe funktionieren möglicherweise nicht.
              not_checked: Dieser Speicher verwendet eine externe Zugangsdatenquelle
                oder eine benutzerdefinierte Konfiguration. Der Zugriff lässt sich
                allein anhand dieser Einstellungen nicht beurteilen.
              not_configured: Für den ausgewählten Speicher ist keine passende Konfiguration
                vorhanden. Datei-Uploads sind möglicherweise nicht verfügbar.
            title: Datei-Uploads und Speicher
        configure_providers: Self-Hosting-Einstellungen öffnen
        description: Die für diesen Web-Prozess sichtbare Konfiguration. Diese Prüfungen
          versenden keine E-Mails, kontaktieren keine Anbieter und laden keine Dateien
          hoch oder herunter. Konfiguriert bedeutet, dass Einstellungen vorhanden
          sind. Zustellung, Anbieterzugriff und Speicherzugriff wurden damit nicht
