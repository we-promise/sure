              message: Hochgeladene Dokumente können erst indexiert und durchsucht werden, wenn ein Vektorspeicher-Adapter und seine Voraussetzungen konfiguriert sind.
            unavailable_vector_store:
              title: Der gewählte Vektorspeicher ist nicht verfügbar
              message: Prüf die Voraussetzungen des Adapters unten. Für pgvector muss die Datenbank die Erweiterung vector oder eine bestehende Tabelle vector_store_chunks bereitstellen.
          llm:
            title: LLM und PDF-Verarbeitung
            description: Die Live-Prüfungen bestätigen das konfigurierte Modell und lassen es einen einfachen Funktionsaufruf ausführen, so wie der Assistent es tut. Danach testen sie getrennt die Textextraktion und die Bild- bzw. native Verarbeitung mit einem einseitigen synthetischen PDF ohne Kundendaten. Zugangsdaten werden nie angezeigt.
