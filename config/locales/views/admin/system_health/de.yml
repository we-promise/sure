              disabled: "Der E-Mail-Versand ist in der laufenden Mailer-Konfiguration deaktiviert."
              not_checked: "Dieser Prozess verwendet eine andere Versandmethode als SMTP, beispielsweise eine Entwicklungsvorschau. Der SMTP-Versand wird nicht beurteilt."
            guidance: "SMTP kann nicht in der Verwaltungsoberfläche konfiguriert werden. Setz die E-Mail-Umgebungsvariablen für den Web- und den Worker-Dienst und starte beide neu. Für ein Relay ohne Authentifizierung können SMTP_USERNAME und SMTP_PASSWORD beide entfallen."
