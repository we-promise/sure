          self_hosted_checkout_disabled: "Abonnement-Checkout und Abrechnungsportal sind im Self-Hosting-Modus deaktiviert. Stripe-Webhooks können weiterhin konfiguriert werden; Checkout-Preis-IDs sind hier nicht erforderlich."
          browser_analytics_disabled: "Browser-Analytics sind für diese Umgebung deaktiviert. Dies deaktiviert den separat konfigurierten Server-Client nicht."
