            title: LLM und PDF-Verarbeitung
          local_setup:
            description: Betreibe das LLM über deinen lokalen OpenAI-kompatiblen Endpunkt, speichere
              Dokumentvektoren in pgvector und richte die Embedding-Einstellungen auf einen
              OpenAI-kompatiblen Embedding-Endpunkt aus. Das PostgreSQL-Image muss die vector-Erweiterung
              enthalten, und die Embedding-Dimensionen müssen zum ausgewählten Modell passen.
            title: Empfohlene lokale Einrichtung
