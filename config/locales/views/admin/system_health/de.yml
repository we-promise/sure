          local_setup:
            title: Empfohlenes lokales Setup
            description: Betreibe das LLM über deinen lokalen OpenAI-kompatiblen Endpunkt, speichere Dokumentvektoren in pgvector und richte die Embedding-Einstellungen auf einen OpenAI-kompatiblen Embeddings-Endpunkt aus. Das PostgreSQL-Image muss die Erweiterung vector enthalten, und die Embedding-Dimensionen müssen zum ausgewählten Modell passen.
