          worker:
            title: Worker-Verifikation
            description: Die obigen Prüfungen wurden in diesem Web-Prozess ausgeführt. Die meisten KI-Aufgaben – Antworten des Assistenten, PDF-Verarbeitung, Embeddings, automatische Kategorisierung und Händlererkennung – laufen jedoch in einem Sidekiq-Worker-Prozess. Dessen Netzwerkzugriff, DNS, Proxy-Regeln oder geladene Zugangsdaten können abweichen. Stelle eine Prüfung in die Warteschlange, um die Konfiguration und Erreichbarkeit aus Sicht eines Workers zu prüfen.
            verify_button: Worker-Konfiguration prüfen
            coverage_notice: Jede Prüfung erfasst genau einen Worker-Prozess – denjenigen, der sie aus der Warteschlange übernimmt. Bei mehreren Worker-Replikaten bestätigt ein erfolgreiches Ergebnis nicht, dass alle Worker funktionsfähig sind. Stelle die Prüfung erneut in die Warteschlange, um eine weitere Stichprobe zu erhalten.
            empty:
              title: Bisher hat kein Worker ein Prüfergebnis gemeldet
              description: Klicke auf „Worker-Konfiguration prüfen“, um eine asynchrone Prüfung in die Warteschlange zu stellen. Das Ergebnis erscheint hier, sobald ein Worker-Prozess die Prüfung übernimmt.
            labels:
              process: Worker-Prozess
              checked_at: Geprüft
              configuration: Konfiguration
            configuration_statuses:
              match: Entspricht dem Web-Prozess
              mismatch: Weicht vom Web-Prozess ab
            statuses:
              passing: Erfolgreich
              failing: Fehlgeschlagen
              stale: Veraltet
            settings_origin:
              title: Welche Einstellungen erfordern einen Neustart?
              database_backed: Änderungen an Anbieter, Modell und API-Schlüssel unter Einstellungen → Self-Hosting werden in der Datenbank gespeichert. rails-settings-cached verwirft beim Speichern den gemeinsamen Cache. Web- und Worker-Prozess verwenden daher bei der nächsten Anfrage oder Aufgabe den neuen Wert – kein Neustart erforderlich.
              env_backed: Die Embedding-Konfiguration und alle ausschließlich über Umgebungsvariablen gesetzten Werte werden beim Start des jeweiligen Containers festgelegt. Rails kann die Umgebung eines anderen Containers nicht ändern. Nach solchen Änderungen müssen daher sowohl der Web- als auch der Worker-Dienst neu gestartet oder neu erstellt werden. Wenn die Bereitstellung nur einen der Dienste neu startet oder ein Secret ohne Pod-Neustart aktualisiert, wird die Änderung nicht überall übernommen.
          run_checks: Prüfungen erneut ausführen
          last_checked: Live-Prüfungen vor %{time_ago} abgeschlossen. Die Ergebnisse werden kurz zwischengespeichert.
          not_checked_help: Öffne die KI-Status-URL direkt oder führe die Prüfungen aus, um die Erreichbarkeit der Dienste zu verifizieren.
          alerts:
            custom_openai:
              title: Die Prüfung des gehosteten Vector Stores ist an diesem benutzerdefinierten Endpunkt fehlgeschlagen
              message: Der konfigurierte Endpunkt hat die Erreichbarkeitsprüfung über /v1/vector_stores nicht bestanden. Die meisten lokalen und OpenAI-kompatiblen Endpunkte implementieren diese API nicht. Chat und PDF-Verarbeitung können trotzdem funktionieren; für das übliche lokale Setup verwendest du pgvector mit einem separaten Embeddings-Endpunkt. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            function_calling_unsupported:
              title: Das Modell unterstützt kein Function Calling
              message: Der Endpunkt hat eine einfache Chat-Anfrage beantwortet, dieselbe Anfrage mit dem Parameter tools jedoch abgelehnt. Der KI-Assistent liest Konten, Transaktionen und Bestände über Funktionsaufrufe. Der Chat schlägt daher weiter fehl – oft mit einem wenig hilfreichen 404 –, bis ein Modell verwendet wird, das Tools unterstützt. Wähle ein Modell, dessen Anbieter Function Calling ausdrücklich unterstützt. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            function_calling_not_used:
              title: Das Modell hat geantwortet, ohne das angeforderte Tool aufzurufen
              message: Der Endpunkt hat den Parameter tools akzeptiert, aber das Modell hat mit Text geantwortet, statt das Health-Check-Tool aufzurufen. Ohne Tool-Aufrufe kann der KI-Assistent keine Finanzdaten lesen, sodass der Chat womöglich gar nicht oder mit erfundenen Zahlen antwortet. Wähle besser ein Modell, dessen Anbieter Function Calling ausdrücklich unterstützt.
            llm_probe_failed:
              title: Die LLM-Live-Prüfung ist fehlgeschlagen
              message: Sure konnte nicht sowohl den konfigurierten Endpunkt als auch das Modell verifizieren. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            llm_model_not_available:
              title: Das konfigurierte KI-Modell ist nicht verfügbar
              message: Der Endpunkt hat geantwortet, das konfigurierte Modell aber weder aufgelistet noch bereitgestellt. Wähle ein aktives Modell für den ausgewählten Anbieter und führe die Prüfungen dann erneut aus. Für Gemini über eine OpenAI-kompatible Übersetzungsschicht verwendest du ein aktuell unterstütztes Modell wie gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Die synthetische PDF-Prüfung der Textextraktion ist fehlgeschlagen
              message: Sure konnte den Text-first-Pfad nicht abschließen, der eingebetteten PDF-Text lokal extrahiert und an das konfigurierte Modell sendet. Es wurden keine Kundendaten gesendet. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            pdf_vision_processing_failed:
              title: Die synthetische PDF-Prüfung für Vision/native Verarbeitung ist fehlgeschlagen
              message: Sure konnte den PDF-Pfad über Bilder bzw. native Dokumentverarbeitung mit dem konfigurierten Modell nicht abschließen. Es wurden keine Kundendaten gesendet. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            vector_probe_failed:
              title: Die Live-Prüfung der Dokumentsuche ist fehlgeschlagen
              message: Sure konnte den ausgewählten Vector Store und alle erforderlichen Embedding-Dienste nicht verifizieren. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            pgvector_extension_not_enabled:
              title: Die PostgreSQL-Erweiterung vector ist nicht aktiviert
              message: Der pgvector-Adapter ist ausgewählt, aber PostgreSQL hat die Erweiterung vector für diese Datenbank nicht aktiviert. Verwende ein PostgreSQL-Image, das pgvector enthält, aktiviere die Erweiterung als Datenbankbesitzer oder Superuser und führe die Migrationen mit VECTOR_STORE_PROVIDER=pgvector erneut aus.
            pgvector_table_not_found:
              title: Die Tabelle vector_store_chunks fehlt
              message: Die Erweiterung pgvector ist aktiviert, aber die Chunk-Tabelle wurde nicht gefunden. Prüfe den Migrationsstatus und führe die Vector-Store-Migration mit VECTOR_STORE_PROVIDER=pgvector erneut aus, damit Sure vector_store_chunks anlegen kann.
            pgvector_probe_failed:
              title: Die pgvector-Speicherprüfung ist fehlgeschlagen
              message: Sure konnte die pgvector-Chunk-Tabelle nicht abfragen. Prüfe die PostgreSQL-Berechtigungen, die Erweiterung vector und die Migration für vector_store_chunks. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            embedding_dimensions_mismatch:
              title: Die Embedding-Dimensionen stimmen nicht überein
              message: Der Embedding-Endpunkt hat einen Vektor zurückgegeben, dessen Länge nicht zu EMBEDDING_DIMENSIONS passt. Setze EMBEDDING_MODEL und EMBEDDING_DIMENSIONS auf die dokumentierte Vektorgröße des Modells und starte Sure neu, damit die Umgebung übernommen wird. Passe danach die pgvector-Embedding-Spalte bzw. -Tabelle an oder erstelle sie neu, und bette Dokumente erneut ein, falls vorhandene Daten eine andere Größe verwendet haben.
            embedding_probe_timeout:
              title: Bei der Embedding-Live-Prüfung ist eine Zeitüberschreitung aufgetreten
              message: Der Embedding-Endpunkt hat nicht innerhalb von AI_HEALTH_PROBE_TIMEOUT geantwortet. Erhöhe dieses Zeitlimit für die Prüfung, wenn der Anbieter langsam ist, und starte Sure dann neu, damit die Umgebung in jedem Prozess übernommen wird. Wenn auch normale KI-Chat-Aufrufe in eine Zeitüberschreitung laufen, erhöhe zusätzlich OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Die Embedding-Live-Prüfung ist fehlgeschlagen
              message: Sure konnte über den konfigurierten Endpunkt und das Modell kein kurzes Test-Embedding erstellen. Prüfe EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN und die Logs des Embedding-Anbieters. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            qdrant:
              title: Qdrant wird noch nicht unterstützt
              message: Für den Qdrant-Adapter gibt es bisher nur ein Grundgerüst; Dokument-Upload und Suche schlagen derzeit fehl. Wähle OpenAI oder pgvector für die Dokumentsuche.
            missing_vector_store:
              title: Es ist kein Vector Store konfiguriert
              message: Hochgeladene Dokumente können erst indexiert und durchsucht werden, wenn ein Vector-Store-Adapter und seine Voraussetzungen konfiguriert sind.
            unavailable_vector_store:
              title: Der ausgewählte Vector Store ist nicht verfügbar
              message: Prüfe die Voraussetzungen des Adapters unten. Für pgvector muss die Datenbank die Erweiterung vector oder eine vorhandene Tabelle vector_store_chunks bereitstellen.
          llm:
            title: LLM und PDF-Verarbeitung
            description: Die Live-Prüfungen verifizieren das konfigurierte Modell, lassen es wie der Assistent einen einfachen Funktionsaufruf ausführen und testen anschließend separat die Textextraktion sowie die Vision-/native Verarbeitung mit einem einseitigen synthetischen PDF ohne Kundendaten. Zugangsdaten werden nie angezeigt.
          vector_store:
            title: Vector Store und Dokumentsuche
            description: Die Live-Prüfung fragt die API des gehosteten Vector Stores ab oder testet die pgvector-Tabelle und erstellt ein kurzes Embedding, ohne es zu speichern.
