          worker:
            title: Worker-Verifikation
            description: Die obigen Prüfungen wurden in diesem Web-Prozess ausgeführt. Die meisten KI-Aufgaben – Antworten des Assistenten, PDF-Verarbeitung, Embeddings, automatische Kategorisierung und Händlererkennung – laufen jedoch in einem Sidekiq-Worker-Prozess. Dessen Netzwerkzugriff, DNS, Proxy-Regeln oder geladene Zugangsdaten können abweichen. Stelle eine Prüfung in die Warteschlange, um die Konfiguration und Erreichbarkeit aus Sicht eines Workers zu prüfen.
            verify_button: Worker-Konfiguration prüfen
            coverage_notice: Jede Prüfung erfasst genau einen Worker-Prozess – denjenigen, der sie aus der Warteschlange übernimmt. Bei mehreren Worker-Replikaten bestätigt ein erfolgreiches Ergebnis nicht, dass alle Worker funktionsfähig sind. Stelle die Prüfung erneut in die Warteschlange, um eine weitere Stichprobe zu erhalten.
            empty:
              title: Bisher hat kein Worker ein Prüfergebnis gemeldet
              description: Klicke auf „Worker-Konfiguration prüfen“, um eine asynchrone Prüfung in die Warteschlange zu stellen. Das Ergebnis erscheint hier, sobald ein Worker-Prozess die Prüfung übernimmt.
            labels:
              process: Worker-Prozess
              checked_at: Geprüft
              configuration: Konfiguration
            configuration_statuses:
              match: Entspricht dem Web-Prozess
              mismatch: Weicht vom Web-Prozess ab
            statuses:
              passing: Erfolgreich
              failing: Fehlgeschlagen
              stale: Veraltet
            settings_origin:
              title: Welche Einstellungen erfordern einen Neustart?
              database_backed: Änderungen an Anbieter, Modell und API-Schlüssel unter Einstellungen → Self-Hosting werden in der Datenbank gespeichert. rails-settings-cached verwirft beim Speichern den gemeinsamen Cache. Web- und Worker-Prozess verwenden daher bei der nächsten Anfrage oder Aufgabe den neuen Wert – kein Neustart erforderlich.
              env_backed: Die Embedding-Konfiguration und alle ausschließlich über Umgebungsvariablen gesetzten Werte werden beim Start des jeweiligen Containers festgelegt. Rails kann die Umgebung eines anderen Containers nicht ändern. Nach solchen Änderungen müssen daher sowohl der Web- als auch der Worker-Dienst neu gestartet oder neu erstellt werden. Wenn die Bereitstellung nur einen der Dienste neu startet oder ein Secret ohne Pod-Neustart aktualisiert, wird die Änderung nicht überall übernommen.
          adapters:
            openai: Von OpenAI gehosteter Vektorspeicher
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Der konfigurierte Endpunkt hat die Erreichbarkeitsprüfung von /v1/vector_stores
                nicht bestanden. Die meisten lokalen und OpenAI-kompatiblen Endpunkte implementieren
                diese API nicht. Chat und PDF-Verarbeitung können trotzdem funktionieren. Für
                eine übliche lokale Einrichtung verwende pgvector mit einem separaten Embedding-Endpunkt.
                Der Fehler wurde unter Einstellungen → Debug-Protokolle und in Rails.logger
                aufgezeichnet.
              title: Die Prüfung des gehosteten Vektorspeichers ist an diesem benutzerdefinierten
                Endpunkt fehlgeschlagen
            embedding_dimensions_mismatch:
              message: Der Embedding-Endpunkt hat einen Vektor zurückgegeben, dessen Länge nicht
                EMBEDDING_DIMENSIONS entspricht. Stelle EMBEDDING_MODEL und EMBEDDING_DIMENSIONS
                auf das Modell und seine dokumentierte Vektorgröße ein. Starte Sure neu, damit
                die Umgebungsvariablen übernommen werden. Passe anschließend die pgvector-Embedding-Spalte
                oder -Tabelle an oder erstelle sie neu und berechne die Dokument-Embeddings
                erneut, falls bestehende Daten eine andere Größe verwenden.
              title: Die Embedding-Dimensionen stimmen nicht überein
            embedding_probe_failed:
              message: Sure konnte mit dem konfigurierten Endpunkt und Modell kein kurzes Test-Embedding
                erstellen. Prüfe EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN
                und die Protokolle des Embedding-Anbieters. Der Fehler wurde unter Einstellungen
                → Debug-Protokolle und in Rails.logger aufgezeichnet.
              title: Die Live-Prüfung der Embeddings ist fehlgeschlagen
            embedding_probe_timeout:
              message: Der Embedding-Endpunkt hat nicht innerhalb von AI_HEALTH_PROBE_TIMEOUT
                geantwortet. Erhöhe dieses Zeitlimit bei einem langsamen Anbieter und starte
                Sure neu, damit alle Prozesse die Umgebungsvariablen übernehmen. Falls auch
                normale KI-Chatanfragen das Zeitlimit überschreiten, erhöhe OPENAI_REQUEST_TIMEOUT
                separat.
              title: Zeitüberschreitung bei der Live-Prüfung der Embeddings
            function_calling_not_used:
              message: Der Endpunkt hat den Parameter tools akzeptiert, aber das Modell antwortete
                mit Text, statt das Prüfwerkzeug aufzurufen. Ohne Werkzeugaufrufe kann der KI-Assistent
                keine Finanzdaten lesen. Der Chat liefert daher möglicherweise keine Antwort
                oder erfundene Zahlen. Bevorzuge ein Modell, dessen Anbieter Funktionsaufrufe
                ausdrücklich unterstützt.
              title: Das Modell hat geantwortet, ohne das angeforderte Werkzeug aufzurufen
            function_calling_unsupported:
              message: Der Endpunkt hat eine einfache Chatanfrage verarbeitet, dieselbe Anfrage
                mit dem Parameter tools aber abgelehnt. Der KI-Assistent liest Konten, Transaktionen
                und Bestände über Funktionsaufrufe. Der Chat schlägt daher weiter fehl – oft
                mit einer wenig hilfreichen 404-Meldung –, bis ein Modell mit Werkzeugunterstützung
                gewählt wird. Wähle ein Modell, dessen Anbieter Funktionsaufrufe ausdrücklich
                unterstützt. Der Fehler wurde unter Einstellungen → Debug-Protokolle und in
                Rails.logger aufgezeichnet.
              title: Das Modell unterstützt keine Funktionsaufrufe
            llm_model_not_available:
              message: Der Endpunkt hat geantwortet, das konfigurierte Modell aber weder aufgelistet
                noch bereitgestellt. Wähle ein aktives Modell des ausgewählten Anbieters und
                führe die Prüfungen erneut aus. Verwende für Gemini über eine OpenAI-kompatible
                Übersetzungsschicht ein aktuell unterstütztes Modell wie gemini-2.5-flash.
              title: Das konfigurierte KI-Modell ist nicht verfügbar
            llm_probe_failed:
              message: Sure konnte den konfigurierten Endpunkt und das Modell nicht gemeinsam
                überprüfen. Der Fehler wurde unter Einstellungen → Debug-Protokolle und in Rails.logger
                aufgezeichnet.
              title: Die Live-Prüfung des LLM ist fehlgeschlagen
            missing_vector_store:
              message: Hochgeladene Dokumente können erst indexiert und durchsucht werden, wenn
                ein Vektorspeicheradapter und seine Voraussetzungen konfiguriert sind.
              title: Kein Vektorspeicher konfiguriert
            pdf_text_extraction_failed:
              message: Sure konnte den textbasierten Verarbeitungsweg nicht abschließen, der
                eingebetteten PDF-Text lokal extrahiert und an das konfigurierte Modell sendet.
                Es wurden keine Kundendaten übertragen. Der Fehler wurde unter Einstellungen
                → Debug-Protokolle und in Rails.logger aufgezeichnet.
              title: Die Prüfung der Textextraktion mit einer synthetischen PDF ist fehlgeschlagen
            pdf_vision_processing_failed:
              message: Sure konnte den bildbasierten oder nativen PDF-Verarbeitungsweg mit dem
                konfigurierten Modell nicht abschließen. Es wurden keine Kundendaten übertragen.
                Der Fehler wurde unter Einstellungen → Debug-Protokolle und in Rails.logger
                aufgezeichnet.
              title: Die Prüfung der bildbasierten/nativen Verarbeitung einer synthetischen
                PDF ist fehlgeschlagen
            pgvector_extension_not_enabled:
              message: Der pgvector-Adapter ist ausgewählt, aber die vector-Erweiterung ist
                in dieser PostgreSQL-Datenbank nicht aktiviert. Verwende ein PostgreSQL-Image
                mit pgvector, aktiviere die Erweiterung als Datenbankeigentümer oder Superuser
                und führe die Migrationen mit VECTOR_STORE_PROVIDER=pgvector erneut aus.
              title: Die PostgreSQL-Erweiterung vector ist nicht aktiviert
            pgvector_probe_failed:
              message: Sure konnte die pgvector-Chunk-Tabelle nicht abfragen. Prüfe die PostgreSQL-Berechtigungen,
                die vector-Erweiterung und die Migration vector_store_chunks. Der Fehler wurde
                unter Einstellungen → Debug-Protokolle und in Rails.logger aufgezeichnet.
              title: Die pgvector-Speicherprüfung ist fehlgeschlagen
            pgvector_table_not_found:
              message: Die pgvector-Erweiterung ist aktiviert, aber die Chunk-Tabelle wurde
                nicht gefunden. Prüfe den Migrationsstatus und führe die Vektorspeichermigration
                mit VECTOR_STORE_PROVIDER=pgvector erneut aus, damit Sure vector_store_chunks
                erstellen kann.
              title: Die Tabelle vector_store_chunks fehlt
            qdrant:
              message: Das Grundgerüst des Qdrant-Adapters ist vorhanden, aber Dokument-Uploads
                und Suchvorgänge schlagen derzeit fehl. Wähle OpenAI oder pgvector für die Dokumentensuche.
              title: Qdrant-Unterstützung ist noch nicht implementiert
            unavailable_vector_store:
              message: Prüfe unten die Voraussetzungen des Adapters. Für pgvector muss die Datenbank
                die vector-Erweiterung oder eine vorhandene Tabelle vector_store_chunks bereitstellen.
              title: Der ausgewählte Vektorspeicher ist nicht verfügbar
            vector_probe_failed:
              message: Sure konnte den ausgewählten Vektorspeicher und alle erforderlichen Embedding-Dienste
                nicht überprüfen. Der Fehler wurde unter Einstellungen → Debug-Protokolle und
                in Rails.logger aufgezeichnet.
              title: Die Live-Prüfung der Dokumentensuche ist fehlgeschlagen
          function_calling_statuses:
            failing: Live-Prüfung fehlgeschlagen
            not_checked: Nicht geprüft
            not_used: Werkzeuge akzeptiert, aber vom Modell nicht aufgerufen
