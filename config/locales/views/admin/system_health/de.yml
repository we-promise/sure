          no_queues: Es sind keine Warteschlangen registriert. Möglicherweise läuft der Worker nicht.
        ai:
          run_checks: Prüfungen erneut ausführen
          last_checked: "Live-Prüfungen vor %{time_ago} abgeschlossen. Die Ergebnisse werden kurz zwischengespeichert."
          not_checked_help: Öffne die KI-Status-URL direkt oder führ die Prüfungen aus, um die Erreichbarkeit der Dienste zu bestätigen.
          loading: "Live-Prüfungen laufen…"
          alerts:
            custom_openai:
              title: Die Prüfung des gehosteten Vektorspeichers ist an diesem benutzerdefinierten Endpunkt fehlgeschlagen
              message: Der konfigurierte Endpunkt hat die Erreichbarkeitsprüfung über /v1/vector_stores nicht bestanden. Die meisten lokalen und OpenAI-kompatiblen Endpunkte bieten diese API nicht an. Chat und PDF-Verarbeitung funktionieren möglicherweise trotzdem. Für das übliche lokale Setup nutzt du pgvector mit einem separaten Embedding-Endpunkt. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            function_calling_unsupported:
              title: Das Modell unterstützt keine Funktionsaufrufe
              message: Der Endpunkt hat eine einfache Chat-Anfrage beantwortet, dieselbe Anfrage mit dem Parameter tools aber abgelehnt. Der KI-Assistent liest Konten, Transaktionen und Bestände über Funktionsaufrufe. Der Chat schlägt deshalb weiter fehl – oft mit einem wenig hilfreichen 404 –, bis ein Modell gewählt ist, das Werkzeuge unterstützt. Wähl ein Modell, für das der Anbieter Funktionsaufrufe dokumentiert. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            function_calling_not_used:
              title: Das Modell hat geantwortet, ohne das angeforderte Werkzeug aufzurufen
              message: Der Endpunkt hat den Parameter tools akzeptiert, aber das Modell hat mit Text geantwortet, statt das Prüfwerkzeug aufzurufen. Ohne Werkzeugaufrufe kann der KI-Assistent keine Finanzdaten lesen. Der Chat antwortet dann womöglich gar nicht oder mit erfundenen Zahlen. Wähl besser ein Modell, für das der Anbieter Funktionsaufrufe dokumentiert.
            llm_probe_failed:
              title: Die Live-Prüfung des LLM ist fehlgeschlagen
              message: Sure konnte nicht bestätigen, dass sowohl der konfigurierte Endpunkt als auch das Modell funktionieren. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            llm_model_not_available:
              title: Das konfigurierte KI-Modell ist nicht verfügbar
              message: Der Endpunkt hat geantwortet, das konfigurierte Modell aber weder aufgeführt noch bereitgestellt. Wähl ein aktives Modell des gewählten Anbieters und führ die Prüfungen erneut aus. Für Gemini über eine OpenAI-kompatible Übersetzungsschicht nutzt du ein aktuell unterstütztes Modell wie gemini-3.8-flash.
            pdf_text_extraction_failed:
              title: Die Prüfung der Textextraktion mit einem synthetischen PDF ist fehlgeschlagen
              message: 'Sure konnte den textbasierten Weg nicht abschließen: eingebetteten PDF-Text lokal extrahieren und an das konfigurierte Modell senden. Es wurden keine Kundendaten gesendet. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.'
            pdf_vision_processing_failed:
              title: Die Prüfung der Bild- bzw. nativen PDF-Verarbeitung mit einem synthetischen PDF ist fehlgeschlagen
              message: Sure konnte den Weg über Bilder oder die native Dokumentverarbeitung des konfigurierten Modells nicht abschließen. Es wurden keine Kundendaten gesendet. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            vector_probe_failed:
              title: Die Live-Prüfung der Dokumentsuche ist fehlgeschlagen
              message: Sure konnte nicht bestätigen, dass der gewählte Vektorspeicher und alle erforderlichen Embedding-Dienste funktionieren. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            pgvector_extension_not_enabled:
              title: Die PostgreSQL-Erweiterung vector ist nicht aktiviert
              message: Der pgvector-Adapter ist ausgewählt, aber PostgreSQL hat die Erweiterung vector für diese Datenbank nicht aktiviert. Nutz ein PostgreSQL-Image mit pgvector, aktiviere die Erweiterung als Datenbankbesitzer oder Superuser und führ die Migrationen mit VECTOR_STORE_PROVIDER=pgvector erneut aus.
            pgvector_table_not_found:
              title: Die Tabelle vector_store_chunks fehlt
              message: Die Erweiterung pgvector ist aktiviert, aber die Chunk-Tabelle wurde nicht gefunden. Prüf den Migrationsstatus und führ die Vektorspeicher-Migration mit VECTOR_STORE_PROVIDER=pgvector erneut aus, damit Sure vector_store_chunks anlegen kann.
            pgvector_probe_failed:
              title: Die Prüfung des pgvector-Speichers ist fehlgeschlagen
              message: Sure konnte die pgvector-Chunk-Tabelle nicht abfragen. Prüf die PostgreSQL-Berechtigungen, die Erweiterung vector und die Migration für vector_store_chunks. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            embedding_dimensions_mismatch:
              title: Die Embedding-Dimensionen stimmen nicht überein
              message: Der Embedding-Endpunkt hat einen Vektor geliefert, dessen Länge nicht zu EMBEDDING_DIMENSIONS passt. Setz EMBEDDING_MODEL und EMBEDDING_DIMENSIONS auf die dokumentierte Vektorgröße des Modells und starte Sure neu, damit die Umgebung übernommen wird. Passe danach die pgvector-Embedding-Spalte bzw. -Tabelle an oder leg sie neu an. Falls vorhandene Daten eine andere Größe verwenden, erstelle die Embeddings der Dokumente neu.
            embedding_probe_timeout:
              title: Die Live-Prüfung der Embeddings hat das Zeitlimit überschritten
              message: Der Embedding-Endpunkt hat nicht vor Ablauf von AI_HEALTH_PROBE_TIMEOUT geantwortet. Erhöh dieses Zeitlimit für die Prüfung, wenn der Anbieter langsam ist, und starte Sure neu, damit die Umgebung in jedem Prozess übernommen wird. Wenn auch normale KI-Chat-Aufrufe in ein Zeitlimit laufen, erhöh zusätzlich OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Die Live-Prüfung der Embeddings ist fehlgeschlagen
              message: Sure konnte über den konfigurierten Endpunkt und das Modell kein kurzes Test-Embedding erstellen. Prüf EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN und die Logs des Embedding-Anbieters. Der Fehler wurde unter Einstellungen → Debug und in Rails.logger protokolliert.
            qdrant:
              title: Qdrant wird noch nicht unterstützt
              message: Der Qdrant-Adapter ist als Gerüst angelegt, aber Hochladen und Suchen von Dokumenten schlagen derzeit fehl. Wähl OpenAI oder pgvector für die Dokumentsuche.
            missing_vector_store:
