          shared_feedback_disabled: "Das separate Self-Hosting-Feedback-Projekt ist durch seine Feedback- oder Umgebungseinstellung deaktiviert. Eigene Betreiber-Analytics werden dadurch nicht deaktiviert."
          production_only: "Diese Integration wird von der aktuellen Anwendungskonfiguration nur in Produktion verwendet."
        services:
          langfuse:
            title: Langfuse
            description: "Optionales KI-Tracing und Evaluierungsberichte. Diese Prüfung sendet keine Traces oder Evaluierungsanfragen."
            guidance: "Setz LANGFUSE_PUBLIC_KEY und LANGFUSE_SECRET_KEY gemeinsam. LANGFUSE_HOST ist optional. Starte betroffene Dienste nach Änderungen neu."
          sentry:
            title: Sentry
            description: "Optionale Fehler- und Leistungsberichte. Der aktuelle Initializer aktiviert Berichte nur in Produktion."
            guidance: "Setz SENTRY_DSN und starte betroffene Dienste neu. Die geladene SDK-Konfiguration wird geprüft, ohne Fehler zu erfassen oder Ereignisse zu senden."
          skylight:
            title: Skylight
            description: "Optionale Instrumentierung der Anwendungsleistung. Vorhandene Einstellungen bestätigen nicht, dass der Agent läuft oder Berichte sendet."
            guidance: "Setz SKYLIGHT_AUTHENTICATION und stell sicher, dass Skylight in der vorgesehenen Rails-Umgebung geladen ist. SKYLIGHT_ENABLED=false deaktiviert die Instrumentierung; das Flag allein lädt das Gem nicht. Starte nach Änderungen neu."
          stripe:
            title: Stripe
            description: "Optionale Abonnementabrechnung und Zahlungs-Webhooks. Diese Prüfung erstellt keinen Stripe-Client, validiert keine Zugangsdaten und stellt keine Zahlungsanfragen."
            guidance: "Setz STRIPE_SECRET_KEY und STRIPE_WEBHOOK_SECRET gemeinsam. Der verwaltete Abonnement-Checkout benötigt zusätzlich STRIPE_MONTHLY_PRICE_ID und STRIPE_ANNUAL_PRICE_ID."
          posthog:
            title: PostHog
            description: "Optionale betreibereigene Analytics mit der beim Start geladenen Konfiguration. Konfiguriert bedeutet nicht, dass ein Benutzer Analytics zugestimmt hat."
            guidance: "Setz POSTHOG_KEY und einen nicht leeren POSTHOG_HOST oder lass den Host für den Standardwert ungesetzt. Browser-Analytics benötigen Produktion oder POSTHOG_DEVELOPMENT_ENABLED in Entwicklung. POSTHOG_FEEDBACK_ENABLED steuert separates Self-Hosting-Feedback, nicht Betreiber-Analytics."
          logtail:
            title: Logtail
            description: "Optionale Weiterleitung von Produktionslogs. Ohne Konfiguration protokolliert die Anwendung weiterhin über die Standardausgabe."
            guidance: "Setz LOGTAIL_API_KEY und LOGTAIL_INGESTING_HOST gemeinsam und starte betroffene Dienste neu. Diese Prüfung erzeugt keinen Test-Logeintrag."
