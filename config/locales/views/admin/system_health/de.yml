                Aufgabe den neuen Wert – kein Neustart erforderlich.
              env_backed: Die Embedding-Konfiguration und alle ausschließlich über
                Umgebungsvariablen gesetzten Werte werden beim Start des jeweiligen
                Containers festgelegt. Rails kann die Umgebung eines anderen Containers
                nicht ändern. Nach solchen Änderungen müssen daher sowohl der Web-
                als auch der Worker-Dienst neu gestartet oder neu erstellt werden.
