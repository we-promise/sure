              port: SMTP_PORT (eine Zahl von 1 bis 65535)
              sender: EMAIL_SENDER (den Standard sender@sure.local ersetzen)
              app_domain: APP_DOMAIN (für Links in E-Mails)
              authentication: SMTP_USERNAME und SMTP_PASSWORD (beide oder keines angeben)
          securities:
            title: Marktpreise
            statuses:
              configured: "Alle aktivierten Marktpreisanbieter sind konfiguriert."
              not_configured: "Bei den aktivierten Marktpreisanbietern fehlen die API-Schlüssel. Automatische Wertpapiersuchen und Preisabfragen sind über diese Anbieter nicht verfügbar."
              incomplete: "Bei mindestens einem aktivierten Marktpreisanbieter fehlt die Konfiguration oder die Auswahl ist ungültig. Zugeordnete Wertpapiere erhalten möglicherweise keine Preisaktualisierungen."
              disabled: "Kein Marktpreisanbieter ist aktiviert. Automatische Wertpapiersuchen und Preisabfragen sind nicht verfügbar."
            guidance: "Wähle Anbieter und ergänze erforderliche API-Schlüssel in den Self-Hosting-Einstellungen oder in der Bereitstellungsumgebung. Umgebungsvariablen haben Vorrang. Öffentliche Anbieter benötigen keinen API-Schlüssel."
          exchange_rates:
            title: Wechselkurse
            statuses:
              configured: "Der ausgewählte Wechselkursanbieter ist konfiguriert."
              not_configured: "Kein nutzbarer Wechselkursanbieter ist konfiguriert. Automatische Währungsumrechnung ist möglicherweise nicht verfügbar, wenn ein gespeicherter Kurs fehlt."
            guidance: "Wähle einen Wechselkursanbieter und ergänze bei Bedarf dessen API-Schlüssel in den Self-Hosting-Einstellungen oder in der Bereitstellungsumgebung. EXCHANGE_RATE_PROVIDER und Umgebungsvariablen für API-Schlüssel haben Vorrang."
            issues:
              invalid_provider: "Der ausgewählte Wechselkursanbieter wird nicht erkannt. Automatische Kursabfragen schlagen fehl, bis ein unterstützter Anbieter ausgewählt wird."
          storage:
            title: Datei-Uploads und Speicher
            statuses:
              configured: "Speichereinstellungen sind vorhanden; lokaler Speicher benötigt keine Cloud-Zugangsdaten."
              not_configured: "Für den ausgewählten Speicher ist keine passende Konfiguration vorhanden. Datei-Uploads sind möglicherweise nicht verfügbar."
              incomplete: "Erforderliche Speichereinstellungen fehlen oder sind unvollständig. Datei-Uploads oder Abrufe funktionieren möglicherweise nicht."
              not_checked: "Dieser Speicher verwendet eine externe Zugangsdatenquelle oder eine benutzerdefinierte Konfiguration. Der Zugriff lässt sich allein anhand dieser Einstellungen nicht beurteilen."
            guidance: "Prüf ACTIVE_STORAGE_SERVICE und die Bereitstellungseinstellungen des gewählten Speichers. Lokaler Speicher muss dauerhaft und für Web- und Worker-Dienst gemeinsam verfügbar sein. Ein Speicherwechsel verschiebt bestehende Dateien nicht; plane eine Migration gesondert."
            issues:
              root: Stammverzeichnis des lokalen Speichers
              bucket: Speicher-Bucket
              region: Speicherregion
              credentials: Zugriffsschlüssel und geheimer Schlüssel (beide angeben oder externe Zugangsdatenquelle verwenden)
              endpoint: Speicher-Endpunkt (und CLOUDFLARE_ACCOUNT_ID für R2)
