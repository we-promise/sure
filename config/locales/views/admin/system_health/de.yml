      optional_services:
        description: Optionale Betreiber-Integrationen. Nicht konfigurierte Dienste
          sind Hinweise. Diese Prüfungen lesen nur Einstellungen; sie testen keine
          Verbindungen, senden keine Testereignisse und ändern keine Analytics-Einwilligung.
          Öffnen Sie einen Dienst für Einrichtungshinweise.
        missing_settings: 'Fehlende Einstellungen: %{settings}'
        notes:
          browser_analytics_disabled: Browser-Analytics sind für diese Umgebung deaktiviert.
            Dies deaktiviert den separat konfigurierten Server-Client nicht.
          environment_disabled: Die geladene Integration ist für diese Rails-Umgebung
            deaktiviert.
          explicitly_disabled: SKYLIGHT_ENABLED deaktiviert die Instrumentierung ausdrücklich.
          production_only: Diese Integration wird von der aktuellen Anwendungskonfiguration
            nur in Produktion verwendet.
          self_hosted_checkout_disabled: Abonnement-Checkout und Abrechnungsportal
            sind im Self-Hosting-Modus deaktiviert. Stripe-Webhooks können weiterhin
            konfiguriert werden; Checkout-Preis-IDs sind hier nicht erforderlich.
          shared_feedback_configured: Self-Hosting-Feedback hat ein separates mitgeliefertes
            Projekt und ist laut Konfiguration aktiviert. Ein eigener POSTHOG_KEY
            ist nicht erforderlich. Browser-Opt-out und SDK-Verfügbarkeit werden nicht
            überprüft.
          shared_feedback_disabled: Das separate Self-Hosting-Feedback-Projekt ist
            durch seine Feedback- oder Umgebungseinstellung deaktiviert. Eigene Betreiber-Analytics
            werden dadurch nicht deaktiviert.
        services:
          langfuse:
            description: Optionales KI-Tracing und Evaluierungsberichte. Diese Prüfung
              sendet keine Traces oder Evaluierungsanfragen.
            guidance: Setzen Sie LANGFUSE_PUBLIC_KEY und LANGFUSE_SECRET_KEY gemeinsam.
              LANGFUSE_HOST ist optional. Starten Sie betroffene Dienste nach Änderungen
              neu.
            title: Langfuse
          logtail:
            description: Optionale Weiterleitung von Produktionslogs. Ohne Konfiguration
              protokolliert die Anwendung weiterhin über die Standardausgabe.
            guidance: Setzen Sie LOGTAIL_API_KEY und LOGTAIL_INGESTING_HOST gemeinsam
              und starten Sie betroffene Dienste neu. Diese Prüfung erzeugt keinen
              Test-Logeintrag.
            title: Logtail
          posthog:
            description: Optionale betreibereigene Analytics mit der beim Start geladenen
              Konfiguration. Konfiguriert bedeutet nicht, dass ein Benutzer Analytics
              zugestimmt hat.
            guidance: Setzen Sie POSTHOG_KEY und einen nicht leeren POSTHOG_HOST oder
              lassen Sie den Host für den Standardwert ungesetzt. Browser-Analytics
              benötigen Produktion oder POSTHOG_DEVELOPMENT_ENABLED in Entwicklung.
              POSTHOG_FEEDBACK_ENABLED steuert separates Self-Hosting-Feedback, nicht
              Betreiber-Analytics.
            title: PostHog
          sentry:
            description: Optionale Fehler- und Leistungsberichte. Der aktuelle Initializer
              aktiviert Berichte nur in Produktion.
            guidance: Setzen Sie SENTRY_DSN und starten Sie betroffene Dienste neu.
              Die geladene SDK-Konfiguration wird geprüft, ohne Fehler zu erfassen
              oder Ereignisse zu senden.
            title: Sentry
          skylight:
            description: Optionale Instrumentierung der Anwendungsleistung. Vorhandene
              Einstellungen bestätigen nicht, dass der Agent läuft oder Berichte sendet.
            guidance: Setzen Sie SKYLIGHT_AUTHENTICATION und stellen Sie sicher, dass
              Skylight in der vorgesehenen Rails-Umgebung geladen ist. SKYLIGHT_ENABLED=false
              deaktiviert die Instrumentierung; das Flag allein lädt das Gem nicht.
              Starten Sie nach Änderungen neu.
            title: Skylight
          stripe:
            description: Optionale Abonnementabrechnung und Zahlungs-Webhooks. Diese
              Prüfung erstellt keinen Stripe-Client, validiert keine Zugangsdaten
              und stellt keine Zahlungsanfragen.
            guidance: Setzen Sie STRIPE_SECRET_KEY und STRIPE_WEBHOOK_SECRET gemeinsam.
              Der verwaltete Abonnement-Checkout benötigt zusätzlich STRIPE_MONTHLY_PRICE_ID
              und STRIPE_ANNUAL_PRICE_ID.
            title: Stripe
