            Jelenlegi helyi előfizetési rekordok Stripe-formátumú ügyfél- és előfizetés-azonosítókkal;
            a mesterséges demó-előfizetés nélkül. Az állapotok nem igazolják a fizetések beérkezését vagy
            az első fizetés időpontját. Nem történik Stripe-lekérdezés.
