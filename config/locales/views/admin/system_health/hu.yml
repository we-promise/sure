          not_checked_help: Nyisd meg közvetlenül az AI-állapot URL-jét, vagy futtasd az ellenőrzéseket a szolgáltatás elérhetőségének ellenőrzéséhez.
          alerts:
            custom_openai:
              title: A hosztolt vektortár-ellenőrzés sikertelen ennél az egyéni végpontnál
              message: 'A beállított végpont nem ment át a /v1/vector_stores elérhetőségi ellenőrzésen. A legtöbb helyi és OpenAI-kompatibilis végpont nem valósítja meg ezt az API-t. A csevegés és a PDF-feldolgozás ettől még működhet; a szokásos helyi beállításhoz használj pgvectort külön embedding végponttal. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            function_calling_unsupported:
              title: A modell nem támogatja a függvényhívást
              message: 'A végpont kiszolgált egy egyszerű csevegési kérést, de elutasította ugyanazt a kérést a tools paraméterrel. Az AI-asszisztens függvényhívásokkal olvassa a számlákat, tranzakciókat és a portfóliót, ezért a csevegés addig hibára fut – gyakran egy semmitmondó 404-es hibával –, amíg nem olyan modellt használsz, amely támogatja az eszközöket. Válassz olyan modellt, amelynek szolgáltatója dokumentáltan támogatja a függvényhívást. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            function_calling_not_used:
              title: A modell anélkül válaszolt, hogy meghívta volna a kért eszközt
              message: A végpont elfogadta a tools paramétert, de a modell szöveggel válaszolt ahelyett, hogy meghívta volna az állapotellenőrző eszközt. Eszközhívások nélkül az AI-asszisztens nem tudja olvasni a pénzügyi adatokat, így a csevegés üres választ vagy kitalált számokat adhat. Lehetőleg olyan modellt válassz, amelynek szolgáltatója dokumentáltan támogatja a függvényhívást.
            llm_probe_failed:
              title: Az LLM élő ellenőrzése sikertelen
              message: 'A Sure nem tudta ellenőrizni a beállított végpontot és a modellt. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            llm_model_not_available:
              title: A beállított AI-modell nem érhető el
              message: A végpont válaszolt, de nem listázta és nem szolgálta ki a beállított modellt. Válassz egy aktív modellt a kiválasztott szolgáltatóhoz, majd futtasd újra az ellenőrzéseket. Ha a Geminit OpenAI-kompatibilis fordítórétegen keresztül használod, válassz egy jelenleg támogatott modellt, például a gemini-2.5-flash-t.
            pdf_text_extraction_failed:
              title: A szintetikus PDF szövegkinyerési ellenőrzése sikertelen
              message: 'A Sure nem tudta végigvinni a szövegalapú folyamatot, amely helyben kinyeri a PDF beágyazott szövegét, és elküldi a beállított modellnek. Ügyféladat nem került elküldésre. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            pdf_vision_processing_failed:
              title: A szintetikus PDF képi/natív ellenőrzése sikertelen
              message: 'A Sure nem tudta végigvinni a képi vagy natív dokumentumos PDF-feldolgozást a beállított modellel. Ügyféladat nem került elküldésre. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            vector_probe_failed:
              title: A dokumentumkeresés élő ellenőrzése sikertelen
              message: 'A Sure nem tudta ellenőrizni a kiválasztott vektortárat és az összes szükséges embedding szolgáltatást. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            pgvector_extension_not_enabled:
              title: A PostgreSQL vector bővítmény nincs engedélyezve
              message: A pgvector adapter van kiválasztva, de a PostgreSQL-ben nincs engedélyezve a vector bővítmény ehhez az adatbázishoz. Használj pgvectort tartalmazó PostgreSQL-képet, majd engedélyezd a bővítményt adatbázis-tulajdonosként vagy superuserként, és futtasd újra a migrációkat a VECTOR_STORE_PROVIDER=pgvector beállítással.
            pgvector_table_not_found:
              title: A vector_store_chunks tábla hiányzik
              message: A pgvector bővítmény engedélyezve van, de a chunks tábla nem található. Ellenőrizd a migrációk állapotát, majd futtasd újra a vektortár-migrációt a VECTOR_STORE_PROVIDER=pgvector beállítással, hogy a Sure létrehozhassa a vector_store_chunks táblát.
            pgvector_probe_failed:
              title: A pgvector tárolási ellenőrzése sikertelen
              message: 'A Sure nem tudta lekérdezni a pgvector chunks táblát. Ellenőrizd a PostgreSQL-jogosultságokat, a vector bővítményt és a vector_store_chunks migrációt. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            embedding_dimensions_mismatch:
              title: Az embedding dimenziói nem egyeznek
              message: Az embedding végpont olyan vektort adott vissza, amelynek hossza nem egyezik az EMBEDDING_DIMENSIONS értékével. Állítsd az EMBEDDING_MODEL és az EMBEDDING_DIMENSIONS értékét a modell dokumentált vektorméretére, indítsd újra a Sure-t, hogy a környezet érvényesüljön, majd módosítsd vagy hozd létre újra a pgvector embedding oszlopát/tábláját, és készítsd el újra a dokumentumok embeddingjeit, ha a meglévő adatok más méretet használtak.
            embedding_probe_timeout:
              title: Az embedding élő ellenőrzése túllépte az időkorlátot
              message: Az embedding végpont nem válaszolt az AI_HEALTH_PROBE_TIMEOUT lejárta előtt. Ha a szolgáltató lassú, növeld ezt az állapotellenőrzési időkorlátot, majd indítsd újra a Sure-t, hogy a környezet minden folyamatban érvényesüljön. Ha a normál AI-csevegési hívások is túllépik az időkorlátot, külön emeld meg az OPENAI_REQUEST_TIMEOUT értékét.
            embedding_probe_failed:
              title: Az embedding élő ellenőrzése sikertelen
              message: 'A Sure nem tudott rövid teszt embeddinget létrehozni a beállított végponttal és modellel. Ellenőrizd az EMBEDDING_URI_BASE, EMBEDDING_MODEL és EMBEDDING_ACCESS_TOKEN értékét, valamint az embedding szolgáltató naplóit. A hiba rögzítve lett itt: Beállítások → Hibakeresési naplók, és a Rails.logger naplóban.'
            qdrant:
              title: A Qdrant támogatása még nincs megvalósítva
              message: A Qdrant adapter váza elkészült, de a dokumentumfeltöltés és -keresés jelenleg sikertelen. Dokumentumkereséshez válaszd az OpenAI-t vagy a pgvectort.
            missing_vector_store:
              title: Nincs beállított vektortár
              message: A feltöltött dokumentumok addig nem indexelhetők és nem kereshetők, amíg be nem állítasz egy vektortár-adaptert és annak követelményeit.
            unavailable_vector_store:
              title: A kiválasztott vektortár nem érhető el
              message: Ellenőrizd az alábbi adapterkövetelményeket. pgvector esetén az adatbázisnak biztosítania kell a vector bővítményt vagy egy meglévő vector_store_chunks táblát.
          llm:
            title: LLM és PDF-feldolgozás
            description: Az élő ellenőrzések ellenőrzik a beállított modellt, egy egyszerű függvényhívást kérnek tőle úgy, ahogy az asszisztens teszi, majd külön tesztelik a szövegkinyerést és a képi/natív feldolgozást egy egyoldalas, ügyféladatot nem tartalmazó szintetikus PDF-fel. A hitelesítő adatok értékei soha nem jelennek meg.
          vector_store:
            title: Vektortár és dokumentumkeresés
            description: Az élő ellenőrzés lekérdezi a hosztolt vektortár API-t, vagy teszteli a pgvector táblát, és létrehoz egy rövid embeddinget anélkül, hogy eltárolná.
