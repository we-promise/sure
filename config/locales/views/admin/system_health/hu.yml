          worker:
            title: Háttérfolyamat ellenőrzése
            description: A fenti ellenőrzések ebből a webes folyamatból futottak. Az AI-feladatok többsége – asszisztensválaszok, PDF-feldolgozás, embeddingek, automatikus kategorizálás és kereskedőfelismerés – valójában egy Sidekiq háttérfolyamatban fut, amelynek hálózati hozzáférése, DNS-e, proxyszabályai vagy akár betöltött hitelesítő adatai is eltérhetnek. Állíts sorba egy ellenőrzést, hogy egy háttérfolyamat saját konfigurációját és kapcsolódását ellenőrizd.
            verify_button: Háttérfolyamat konfigurációjának ellenőrzése
            coverage_notice: Minden ellenőrzés pontosan egy háttérfolyamatot ellenőriz – azt, amelyik kiveszi a sorból. Több háttérfolyamat-replika esetén egy sikeres eredmény nem igazolja, hogy minden háttérfolyamat egészséges; egy másik mintavételéhez állítsd újra sorba az ellenőrzést.
            empty:
              title: Még egyetlen háttérfolyamat sem jelentkezett
              description: Kattints a „Háttérfolyamat konfigurációjának ellenőrzése” gombra egy aszinkron ellenőrzés sorba állításához. Az eredmény itt jelenik meg, amint egy háttérfolyamat felveszi.
            labels:
              process: Háttérfolyamat
              checked_at: Ellenőrizve
              configuration: Konfiguráció
            configuration_statuses:
              match: Egyezik a webessel
              mismatch: Eltér a webestől
            statuses:
              passing: Sikeres
              failing: Sikertelen
              stale: Elavult
            settings_origin:
              title: Mely beállításokhoz kell újraindítás?
              database_backed: A Beállítások → Saját üzemeltetés oldalon módosított szolgáltató-, modell- és API-kulcs-beállítások az adatbázisban tárolódnak. A rails-settings-cached íráskor érvényteleníti a megosztott gyorsítótárat, így a webes és a háttérfolyamat is az új értéket használja a következő kérésnél vagy sorba állított feladatnál – nincs szükség újraindításra.
              env_backed: Az embedding konfiguráció és minden olyan érték, amely csak környezeti változóval van megadva, az egyes konténerek indulásakor rögzül. A Rails nem tudja módosítani egy másik konténer környezetét, ezért ezek módosításához a webes és a háttérszolgáltatást is újra kell indítani vagy létrehozni – és az olyan telepítési eszközök, amelyek csak az egyiket indítják újra (részleges bevezetés, pod-újraindítás nélkül frissített Secret), nem veszik át a változást.
          local_setup:
            title: Javasolt helyi beállítás
            description: Futtasd az LLM-et a helyi OpenAI-kompatibilis végponton keresztül, tárold a dokumentumvektorokat pgvectorban, és állítsd az embedding beállításokat egy OpenAI-kompatibilis embedding végpontra. A PostgreSQL-képnek tartalmaznia kell a vector bővítményt, és az embedding dimenzióinak egyezniük kell a kiválasztott modellel.
