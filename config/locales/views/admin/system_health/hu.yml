              Az élő ellenőrzés lekérdezi az üzemeltetett vektortár API-ját, vagy teszteli a pgvector
              táblát, és tárolás nélkül létrehoz egy rövid beágyazást.
            title: Vektortár és dokumentumkeresés
          worker:
            configuration_statuses:
              match: Egyezik a webfolyamattal
              mismatch: Eltér a webfolyamattól
            coverage_notice: >-
              Minden ellenőrzés pontosan egy feldolgozófolyamatot vizsgál: azt, amelyik kiveszi a feladatot
              a sorból. Több feldolgozópéldány esetén a sikeres eredmény nem igazolja mindegyik állapotát;
              állítsd újra sorba az ellenőrzést egy másik mintavételhez.
            description: >-
              A fenti ellenőrzések ebből a webfolyamatból futottak. A legtöbb MI-feladat — asszisztensválaszok,
              PDF-feldolgozás, beágyazások, automatikus kategorizálás és kereskedőfelismerés — valójában
              Sidekiq-feldolgozóban fut. Ennek hálózati hozzáférése, DNS-e, proxyszabályai vagy betöltött
              hitelesítő adatai eltérhetnek. Állíts sorba egy ellenőrzést a feldolgozó saját beállításainak
              és kapcsolatainak vizsgálatához.
            empty:
              description: >-
                Kattints a „Feldolgozó beállításainak ellenőrzése” gombra az aszinkron ellenőrzés sorba
                állításához. Az eredmény itt jelenik meg, miután egy feldolgozó felveszi a feladatot.
              title: Még nem jelentkezett be feldolgozó
            labels:
              checked_at: Ellenőrizve
              configuration: Konfiguráció
              process: Feldolgozófolyamat
            settings_origin:
              database_backed: >-
                A Beállítások → Saját üzemeltetés alatt módosított szolgáltató-, modell- és API-kulcs-beállításokat
                az adatbázis tárolja. A rails-settings-cached íráskor érvényteleníti a megosztott gyorsítótárat,
                így a web- és feldolgozófolyamat is az új értéket használja a következő kéréshez vagy
                sorba állított feladathoz; nincs szükség újraindításra.
              env_backed: >-
                A beágyazási konfiguráció és minden kizárólag környezeti változóval megadott érték a konténer
                indulásakor rögzül. A Rails nem módosíthatja egy másik konténer környezetét, ezért ezek
                változtatásakor a web- és feldolgozószolgáltatást is újra kell indítani vagy létre kell
                hozni. A csak egyik szolgáltatást újraindító telepítés — például részleges frissítés vagy
                pod-újraindítás nélküli Secret-módosítás — nem érvényesíti mindenhol a változást.
              title: Mely beállításokhoz kell újraindítás?
