      show:
        ai:
          adapters:
            openai: OpenAI által üzemeltetett vektortár
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: >-
                A beállított végpont nem teljesítette a /v1/vector_stores elérhetőségi ellenőrzést. A
                legtöbb helyi és OpenAI-kompatibilis végpont nem valósítja meg ezt az API-t. A csevegés
                és a PDF-feldolgozás ettől még működhet; a szokásos helyi beállításhoz használj pgvector-t
                külön beágyazási végponttal. A hiba a Beállítások → Hibakeresési naplók alatt és a Rails.logger
                naplójában is rögzítve lett.
              title: Az egyéni végponton sikertelen volt az üzemeltetett vektortár ellenőrzése
            embedding_dimensions_mismatch:
              message: >-
                A beágyazási végpont olyan vektort adott vissza, amelynek hossza nem egyezik az EMBEDDING_DIMENSIONS
                értékével. Állítsd be az EMBEDDING_MODEL és EMBEDDING_DIMENSIONS értékét a modell dokumentált
                vektorméretének megfelelően, majd indítsd újra a Sure-t a környezet érvényesítéséhez.
                Ezután módosítsd vagy hozd létre újra a pgvector beágyazási oszlopát/tábláját, és ha a
                meglévő adatok más méretet használtak, készítsd el újra a dokumentumok beágyazását.
              title: A beágyazási dimenziók nem egyeznek
            embedding_probe_failed:
              message: >-
                A Sure nem tudott rövid tesztbeágyazást létrehozni a beállított végponttal és modellel.
                Ellenőrizd az EMBEDDING_URI_BASE, EMBEDDING_MODEL és EMBEDDING_ACCESS_TOKEN értékét, valamint
                a beágyazási szolgáltató naplóit. A hiba a Beállítások → Hibakeresési naplók alatt és
                a Rails.logger naplójában is rögzítve lett.
              title: A beágyazási szolgáltatás élő ellenőrzése sikertelen
            embedding_probe_timeout:
              message: >-
                A beágyazási végpont nem válaszolt az AI_HEALTH_PROBE_TIMEOUT időkorláton belül. Lassú
                szolgáltató esetén növeld ezt az időkorlátot, majd indítsd újra a Sure-t, hogy a környezet
                minden folyamatban érvényesüljön. Ha a szokásos MI-csevegési kérések is időtúllépésbe
                ütköznek, külön növeld az OPENAI_REQUEST_TIMEOUT értékét.
              title: A beágyazási szolgáltatás élő ellenőrzése túllépte az időkorlátot
            function_calling_not_used:
              message: >-
                A végpont elfogadta a tools paramétert, de a modell szöveggel válaszolt az állapotellenőrző
                eszköz meghívása helyett. Az MI-asszisztens eszközhívások nélkül nem tud pénzügyi adatokat
                olvasni, így üres válaszokat vagy kitalált számokat adhat. Olyan modellt válassz, amelynek
                szolgáltatója dokumentálja a függvényhívás támogatását.
              title: A modell a kért eszköz meghívása nélkül válaszolt
            function_calling_unsupported:
              message: >-
                A végpont kiszolgált egy egyszerű csevegési kérést, de a tools paraméterrel ellátott azonos
                kérést elutasította. Az MI-asszisztens függvényhívásokkal olvassa a számlákat, tranzakciókat
                és pozíciókat, így a csevegés továbbra is hibázik — gyakran nem informatív 404-es hibával
                —, amíg nem eszközöket támogató modellt használsz. Válassz olyan modellt, amelynél a szolgáltató
                dokumentálja a függvényhívást. A hiba a Beállítások → Hibakeresési naplók alatt és a Rails.logger
                naplójában is rögzítve lett.
              title: A modell nem támogatja a függvényhívást
            llm_model_not_available:
              message: >-
                A végpont válaszolt, de a beállított modellt nem sorolta fel és nem szolgálta ki. Válassz
                aktív modellt a kiválasztott szolgáltatónál, majd futtasd újra az ellenőrzéseket. Ha a
                Geminit OpenAI-kompatibilis átalakító rétegen keresztül használod, válassz jelenleg támogatott
                modellt, például gemini-2.5-flash-t.
              title: A beállított MI-modell nem érhető el
            llm_probe_failed:
              message: >-
                A Sure nem tudta igazolni a beállított végpont és modell együttes működését. A hiba a
                Beállítások → Hibakeresési naplók alatt és a Rails.logger naplójában is rögzítve lett.
              title: Az LLM élő ellenőrzése sikertelen
            missing_vector_store:
              message: >-
                A feltöltött dokumentumok nem indexelhetők és kereshetők, amíg nincs beállítva vektortár-adapter
                és annak minden előfeltétele.
              title: Nincs vektortár beállítva
            pdf_text_extraction_failed:
              message: >-
                A Sure nem tudta végrehajtani azt a feldolgozási útvonalat, amely helyben kinyeri a PDF
                beágyazott szövegét, majd elküldi a beállított modellnek. Nem küldött ügyféladatot. A
                hiba a Beállítások → Hibakeresési naplók alatt és a Rails.logger naplójában is rögzítve
                lett.
              title: A mesterséges PDF szövegkinyerési ellenőrzése sikertelen
            pdf_vision_processing_failed:
              message: >-
                A Sure nem tudta végrehajtani a képalapú vagy natív dokumentumos PDF-feldolgozást a beállított
                modellel. Nem küldött ügyféladatot. A hiba a Beállítások → Hibakeresési naplók alatt és
                a Rails.logger naplójában is rögzítve lett.
              title: A mesterséges PDF képfelismerési/natív ellenőrzése sikertelen
            pgvector_extension_not_enabled:
              message: >-
                A pgvector adapter van kiválasztva, de a PostgreSQL vector bővítménye nincs engedélyezve
                ebben az adatbázisban. Használj pgvector-t tartalmazó PostgreSQL-képfájlt, majd adatbázis-tulajdonosként
                vagy szuperfelhasználóként engedélyezd a bővítményt, és futtasd újra a migrációkat VECTOR_STORE_PROVIDER=pgvector
                beállítással.
              title: A PostgreSQL vector bővítménye nincs engedélyezve
            pgvector_probe_failed:
              message: >-
                A Sure nem tudta lekérdezni a pgvector szövegrészlettábláját. Ellenőrizd a PostgreSQL-jogosultságokat,
                a vector bővítményt és a vector_store_chunks migrációt. A hiba a Beállítások → Hibakeresési
                naplók alatt és a Rails.logger naplójában is rögzítve lett.
              title: A pgvector-tároló ellenőrzése sikertelen
            pgvector_table_not_found:
              message: >-
                A pgvector bővítmény engedélyezve van, de a szövegrészlettábla nem található. Ellenőrizd
                a migrációk állapotát, majd futtasd újra a vektortár migrációját VECTOR_STORE_PROVIDER=pgvector
                beállítással, hogy a Sure létrehozhassa a vector_store_chunks táblát.
              title: Hiányzik a vector_store_chunks tábla
            qdrant:
              message: >-
                A Qdrant adapter váza elkészült, de a dokumentumfeltöltés és a keresés jelenleg hibázik.
                Dokumentumkereséshez válassz OpenAI-t vagy pgvector-t.
              title: A Qdrant támogatása még nincs megvalósítva
            unavailable_vector_store:
              message: >-
                Ellenőrizd alább az adapter előfeltételeit. pgvector esetén az adatbázisnak biztosítania
                kell a vector bővítményt vagy egy meglévő vector_store_chunks táblát.
              title: A kiválasztott vektortár nem érhető el
            vector_probe_failed:
              message: >-
                A Sure nem tudta ellenőrizni a kiválasztott vektortárat és az összes szükséges beágyazási
                szolgáltatást. A hiba a Beállítások → Hibakeresési naplók alatt és a Rails.logger naplójában
                is rögzítve lett.
              title: A dokumentumkeresés élő ellenőrzése sikertelen
          failure_codes:
            dimensions_mismatch: A beágyazási vektor dimenziói nem egyeznek a beállított értékkel
