          worker:
            title: Verifikasi worker
            description: Pemeriksaan di atas berjalan dari proses web ini. Sebagian besar pekerjaan AI -- respons asisten, pemrosesan PDF, embedding, kategorisasi otomatis, dan deteksi merchant -- sebenarnya berjalan di proses worker Sidekiq, yang dapat berbeda dalam akses jaringan, DNS, aturan proxy, atau bahkan kredensial yang dimuat. Antrekan pemeriksaan untuk memverifikasi konfigurasi dan konektivitas worker sendiri.
            verify_button: Verifikasi konfigurasi worker
            coverage_notice: Setiap pemeriksaan memverifikasi tepat satu proses worker -- mana saja yang mengambilnya dari antrean. Dengan lebih dari satu replika worker, hasil lulus tidak memastikan setiap worker sehat; antrekan pemeriksaan lagi untuk mengambil sampel lain.
