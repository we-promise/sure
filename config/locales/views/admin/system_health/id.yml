        ai:
          run_checks: Jalankan pemeriksaan lagi
          last_checked: "Pemeriksaan langsung selesai %{time_ago} lalu. Hasil di-cache sebentar."
          not_checked_help: Buka URL status AI secara langsung atau jalankan pemeriksaan untuk memverifikasi keaktifan layanan.
          loading: "Menjalankan pemeriksaan langsung…"
          alerts:
            custom_openai:
              title: Pemeriksaan vector-store terkelola gagal di endpoint kustom ini
              message: Endpoint yang dikonfigurasi tidak lolos pemeriksaan keaktifan /v1/vector_stores. Sebagian besar endpoint lokal dan kompatibel OpenAI tidak mengimplementasikan API tersebut. Obrolan dan pemrosesan PDF mungkin tetap berfungsi; gunakan pgvector dengan endpoint embeddings terpisah untuk pengaturan lokal standar. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            function_calling_unsupported:
              title: Model tidak mendukung pemanggilan fungsi
              message: Endpoint melayani permintaan obrolan biasa tetapi menolak permintaan yang sama saat membawa parameter tools. Asisten AI membaca rekening, transaksi, dan kepemilikan melalui pemanggilan fungsi, sehingga obrolan terus gagal — sering kali dengan 404 yang tidak informatif — hingga modelnya mendukung tools. Pilih model yang didokumentasikan penyedianya mendukung function calling. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            function_calling_not_used:
              title: Model menjawab tanpa memanggil alat yang diminta
              message: Endpoint menerima parameter tools, tetapi model membalas dengan teks alih-alih memanggil alat pemeriksaan kesehatan. Asisten AI tidak dapat membaca data keuangan tanpa pemanggilan alat, sehingga obrolan mungkin menjawab kosong atau dengan angka karangan. Utamakan model yang didokumentasikan penyedianya mendukung function calling.
            llm_probe_failed:
              title: Pemeriksaan langsung LLM gagal
              message: Sure tidak dapat memverifikasi endpoint dan model yang dikonfigurasi. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            llm_model_not_available:
              title: Model AI yang dikonfigurasi tidak tersedia
              message: Endpoint merespons, tetapi tidak mencantumkan atau melayani model yang dikonfigurasi. Pilih model aktif untuk penyedia yang dipilih, lalu jalankan pemeriksaan lagi. Untuk Gemini melalui lapisan translasi kompatibel OpenAI, gunakan model yang didukung saat ini seperti gemini-3.8-flash.
            pdf_text_extraction_failed:
              title: Pemeriksaan ekstraksi teks PDF sintetis gagal
              message: Sure tidak dapat menyelesaikan jalur berbasis teks yang mengekstrak teks PDF tertanam secara lokal dan mengirimkannya ke model yang dikonfigurasi. Tidak ada data pelanggan yang dikirim. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            pdf_vision_processing_failed:
              title: Pemeriksaan visi/nativ PDF sintetis gagal
              message: Sure tidak dapat menyelesaikan jalur gambar atau dokumen nativ PDF melalui model yang dikonfigurasi. Tidak ada data pelanggan yang dikirim. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            vector_probe_failed:
              title: Pemeriksaan langsung pencarian dokumen gagal
              message: Sure tidak dapat memverifikasi vector store yang dipilih dan setiap layanan embedding yang diperlukan. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            pgvector_extension_not_enabled:
              title: Ekstensi vektor PostgreSQL belum diaktifkan
              message: Adaptor pgvector dipilih, tetapi PostgreSQL belum mengaktifkan ekstensi vector untuk basis data ini. Gunakan image PostgreSQL yang menyertakan pgvector, lalu aktifkan ekstensi sebagai pemilik basis data atau superuser dan jalankan ulang migrasi dengan VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Tabel vector_store_chunks tidak ditemukan
              message: Ekstensi pgvector diaktifkan, tetapi tabel chunks tidak ditemukan. Periksa status migrasi, lalu jalankan ulang migrasi vector-store dengan VECTOR_STORE_PROVIDER=pgvector agar Sure dapat membuat vector_store_chunks.
            pgvector_probe_failed:
              title: Pemeriksaan penyimpanan pgvector gagal
              message: Sure tidak dapat melakukan kueri pada tabel chunks pgvector. Periksa izin PostgreSQL, ekstensi vector, dan migrasi vector_store_chunks. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            embedding_dimensions_mismatch:
              title: Dimensi embedding tidak cocok
              message: Endpoint embedding mengembalikan vektor yang panjangnya tidak cocok dengan EMBEDDING_DIMENSIONS. Atur EMBEDDING_MODEL dan EMBEDDING_DIMENSIONS ke ukuran vektor yang didokumentasikan model, mulai ulang Sure agar lingkungan bertahan, lalu ubah atau buat ulang kolom/tabel embedding pgvector dan embed ulang dokumen jika data yang ada menggunakan ukuran berbeda.
            embedding_probe_timeout:
              title: Pemeriksaan langsung embedding habis waktu
              message: Endpoint embedding tidak merespons sebelum AI_HEALTH_PROBE_TIMEOUT. Naikkan batas waktu pemeriksaan kesehatan tersebut jika penyedia lambat, lalu mulai ulang Sure agar lingkungan bertahan di setiap proses. Jika panggilan obrolan AI normal juga habis waktu, naikkan OPENAI_REQUEST_TIMEOUT secara terpisah.
            embedding_probe_failed:
              title: Pemeriksaan langsung embedding gagal
              message: Sure tidak dapat membuat embedding uji singkat melalui endpoint dan model yang dikonfigurasi. Periksa EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN, dan log penyedia embedding. Kegagalan dicatat di Pengaturan → Log debug dan Rails.logger.
            qdrant:
              title: Dukungan Qdrant belum diimplementasikan
              message: Adaptor Qdrant sudah disiapkan kerangkanya, tetapi operasi unggah dan pencarian dokumen saat ini gagal. Pilih OpenAI atau pgvector untuk pencarian dokumen.
            missing_vector_store:
              title: Tidak ada vector store yang dikonfigurasi
              message: Dokumen yang diunggah tidak dapat diindeks atau dicari hingga adaptor vector-store beserta persyaratannya dikonfigurasi.
            unavailable_vector_store:
              title: Vector store yang dipilih tidak tersedia
