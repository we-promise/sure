            settings_origin:
              title: Pengaturan mana yang memerlukan mulai ulang?
              database_backed: "Pengaturan penyedia, model, dan kunci API yang diubah di Pengaturan → Self-Hosting disimpan di basis data. rails-settings-cached membatalkan cache bersama saat penulisan, sehingga web dan worker langsung menggunakan nilai baru untuk permintaan atau pekerjaan antrean berikutnya -- tanpa perlu mulai ulang."
              env_backed: "Konfigurasi embedding, dan nilai apa pun yang hanya diatur melalui variabel lingkungan, bersifat tetap saat setiap kontainer dimulai. Rails tidak dapat mengubah lingkungan kontainer lain, sehingga mengubahnya memerlukan mulai ulang atau pembuatan ulang layanan web dan worker -- dan alat deployment yang hanya memulai ulang salah satunya (rollout parsial, Secret yang diperbarui tanpa mulai ulang pod) tidak akan mengambil perubahan tersebut."
          local_setup:
            title: Pengaturan lokal yang disarankan
            description: Jalankan LLM melalui endpoint kompatibel OpenAI lokal Anda, simpan vektor dokumen di pgvector, dan arahkan pengaturan embedding ke endpoint embeddings yang kompatibel OpenAI. Image PostgreSQL harus menyertakan ekstensi vector, dan dimensi embedding harus cocok dengan model yang dipilih.
