            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: 配置的端点未通过 /v1/vector_stores 可用性检查。大多数本地端点及兼容 OpenAI 的端点没有实现此
                API。聊天和 PDF 处理可能仍然可用；常见的本地部署方式是使用 pgvector，并配置独立的嵌入端点。失败信息已记录在“设置
                → 调试日志”和 Rails.logger 中。
              title: 此自定义端点的托管向量存储检查失败
            embedding_dimensions_mismatch:
              message: 嵌入端点返回的向量长度与 EMBEDDING_DIMENSIONS 不一致。请根据模型文档中的向量维数设置 EMBEDDING_MODEL
                和 EMBEDDING_DIMENSIONS，然后重启 Sure 以确保环境配置生效。若现有数据使用了不同的维数，还需修改或重建 pgvector
                的嵌入列或表，并重新生成文档嵌入。
              title: 嵌入维数不匹配
            embedding_probe_failed:
              message: Sure 无法通过配置的端点和模型生成简短的测试嵌入。请检查 EMBEDDING_URI_BASE、EMBEDDING_MODEL、EMBEDDING_ACCESS_TOKEN
                及嵌入服务商日志。失败信息已记录在“设置 → 调试日志”和 Rails.logger 中。
              title: 嵌入服务在线检查失败
            embedding_probe_timeout:
              message: 嵌入端点未在 AI_HEALTH_PROBE_TIMEOUT 指定的时限内响应。如果服务商响应较慢，请增加此健康检查超时时间，然后重启
                Sure，确保所有进程应用该环境配置。如果常规 AI 聊天请求也超时，请另行增大 OPENAI_REQUEST_TIMEOUT。
              title: 嵌入服务在线检查超时
            function_calling_not_used:
              message: 端点接受了 tools 参数，但模型回复了文本，没有调用健康检查工具。AI 助手必须调用工具才能读取财务数据，因此聊天可能没有答案，或给出编造的数字。建议选择服务商文档明确支持函数调用的模型。
              title: 模型未按要求调用工具，而是直接作答
            function_calling_unsupported:
              message: 端点能够处理普通聊天请求，却拒绝了附带 tools 参数的相同请求。AI 助手通过函数调用读取账户、交易和持仓，因此在改用支持工具的模型前，聊天会持续失败，且常常只返回没有具体说明的
                404 错误。请选择服务商文档明确支持函数调用的模型。失败信息已记录在“设置 → 调试日志”和 Rails.logger 中。
              title: 此模型不支持函数调用
            llm_model_not_available:
              message: 端点已响应，但没有列出或提供所配置的模型。请选择当前服务商可用的模型，然后重新检查。如果通过兼容 OpenAI 的转换层使用
                Gemini，请选择目前受支持的模型，例如 gemini-2.5-flash。
              title: 配置的 AI 模型不可用
            llm_probe_failed:
              message: Sure 无法同时验证所配置的端点和模型。失败信息已记录在“设置 → 调试日志”和 Rails.logger 中。
              title: 大语言模型在线检查失败
            missing_vector_store:
              message: 配置向量存储适配器并满足其要求后，才能为上传的文档建立索引和执行搜索。
              title: 尚未配置向量存储
            pdf_text_extraction_failed:
              message: Sure 未能完成文本优先处理流程：在本地提取 PDF 内嵌文本，再将其发送给配置的模型。没有发送客户数据。失败信息已记录在“设置
                → 调试日志”和 Rails.logger 中。
              title: 合成 PDF 文本提取检查失败
            pdf_vision_processing_failed:
              message: Sure 未能通过配置的模型完成 PDF 图像处理或原生文档处理流程。没有发送客户数据。失败信息已记录在“设置 → 调试日志”和
                Rails.logger 中。
              title: 合成 PDF 视觉／原生处理检查失败
            pgvector_extension_not_enabled:
              message: 已选择 pgvector 适配器，但 PostgreSQL 尚未为此数据库启用 vector 扩展。请使用包含 pgvector
                的 PostgreSQL 镜像，以数据库所有者或超级用户身份启用扩展，然后在 VECTOR_STORE_PROVIDER=pgvector
                的配置下重新运行迁移。
              title: PostgreSQL vector 扩展未启用
            pgvector_probe_failed:
              message: Sure 无法查询 pgvector 的文本块表。请检查 PostgreSQL 权限、vector 扩展和 vector_store_chunks
                迁移。失败信息已记录在“设置 → 调试日志”和 Rails.logger 中。
              title: pgvector 存储检查失败
            pgvector_table_not_found:
              message: pgvector 扩展已启用，但未找到文本块表。请检查迁移状态，然后在 VECTOR_STORE_PROVIDER=pgvector
                的配置下重新运行向量存储迁移，以便 Sure 创建 vector_store_chunks。
              title: 缺少 vector_store_chunks 表
            qdrant:
              message: Qdrant 适配器目前只有基础框架，文档上传和搜索操作尚无法使用。请使用 OpenAI 或 pgvector 进行文档搜索。
              title: Qdrant 支持尚未实现
            unavailable_vector_store:
              message: 请检查下方的适配器要求。使用 pgvector 时，数据库必须提供 vector 扩展或已有的 vector_store_chunks
                表。
              title: 所选向量存储不可用
            vector_probe_failed:
              message: Sure 无法验证所选向量存储及其所需的全部嵌入服务。失败信息已记录在“设置 → 调试日志”和 Rails.logger
                中。
              title: 文档搜索在线检查失败
          failure_codes:
