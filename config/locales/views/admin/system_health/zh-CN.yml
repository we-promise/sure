        ai:
          run_checks: 重新运行检查
          last_checked: 实时检查已于 %{time_ago}前完成。结果会短暂缓存。
          not_checked_help: 直接打开 AI 状态 URL 或运行检查，以验证服务是否可用。
          alerts:
            custom_openai:
              title: 此自定义端点上的托管向量存储检查失败
              message: 所配置的端点未通过 /v1/vector_stores 可用性检查。大多数本地及 OpenAI 兼容端点都未实现该 API。聊天和 PDF 处理可能仍然可用；常见的本地部署方式是使用 pgvector 并搭配单独的 embeddings 端点。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            function_calling_unsupported:
              title: 该模型不支持函数调用
              message: 该端点可以处理普通聊天请求，但拒绝了携带 tools 参数的同一请求。AI 助手通过函数调用读取账户、交易和持仓，因此在换用支持工具的模型之前，聊天会持续失败（常常只返回一个无用的 404）。请选择其提供商明确说明支持函数调用的模型。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            function_calling_not_used:
              title: 模型未调用要求它调用的工具就直接作答
              message: 该端点接受了 tools 参数，但模型直接以文本回复，而没有调用健康检查工具。AI 助手无法在不调用工具的情况下读取财务数据，因此聊天可能返回空内容或编造的数字。建议选择其提供商明确说明支持函数调用的模型。
            llm_probe_failed:
              title: LLM 实时检查失败
              message: Sure 无法同时验证所配置的端点和模型。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            llm_model_not_available:
              title: 所配置的 AI 模型不可用
              message: 端点有响应，但未列出或提供所配置的模型。请为所选提供商选择一个可用的模型，然后重新运行检查。如果通过 OpenAI 兼容的转换层使用 Gemini，请使用当前受支持的模型，例如 gemini-2.5-flash。
            pdf_text_extraction_failed:
              title: 合成 PDF 文本提取检查失败
              message: Sure 无法完成文本优先路径，即在本地提取 PDF 内嵌文本并发送给所配置的模型。未发送任何客户数据。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            pdf_vision_processing_failed:
              title: 合成 PDF 视觉/原生检查失败
              message: Sure 无法通过所配置的模型完成图像或原生文档 PDF 路径。未发送任何客户数据。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            vector_probe_failed:
              title: 文档搜索实时检查失败
              message: Sure 无法验证所选的向量存储及所有必需的 embedding 服务。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            pgvector_extension_not_enabled:
              title: 未启用 PostgreSQL vector 扩展
              message: 已选择 pgvector 适配器，但 PostgreSQL 尚未为此数据库启用 vector 扩展。请使用包含 pgvector 的 PostgreSQL 镜像，然后以数据库所有者或超级用户身份启用该扩展，并在设置 VECTOR_STORE_PROVIDER=pgvector 后重新运行迁移。
            pgvector_table_not_found:
              title: 缺少 vector_store_chunks 表
              message: pgvector 扩展已启用，但未找到分块表。请检查迁移状态，然后在设置 VECTOR_STORE_PROVIDER=pgvector 后重新运行向量存储迁移，以便 Sure 创建 vector_store_chunks。
            pgvector_probe_failed:
              title: pgvector 存储检查失败
              message: Sure 无法查询 pgvector 分块表。请检查 PostgreSQL 权限、vector 扩展以及 vector_store_chunks 迁移。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            embedding_dimensions_mismatch:
              title: Embedding 维度不匹配
              message: Embedding 端点返回的向量长度与 EMBEDDING_DIMENSIONS 不一致。请将 EMBEDDING_MODEL 和 EMBEDDING_DIMENSIONS 设置为该模型文档中的向量维度，重启 Sure 使环境变量生效；如果现有数据使用了不同的维度，还需修改或重建 pgvector embedding 列/表，并重新为文档生成 embedding。
            embedding_probe_timeout:
              title: Embedding 实时检查超时
              message: Embedding 端点未在 AI_HEALTH_PROBE_TIMEOUT 之前响应。如果提供商响应较慢，请调高该健康检查超时，然后重启 Sure，使环境变量在每个进程中生效。如果普通的 AI 聊天调用也超时，请另行调高 OPENAI_REQUEST_TIMEOUT。
            embedding_probe_failed:
              title: Embedding 实时检查失败
              message: Sure 无法通过所配置的端点和模型生成一个简短的测试 embedding。请检查 EMBEDDING_URI_BASE、EMBEDDING_MODEL、EMBEDDING_ACCESS_TOKEN 以及 embedding 提供商的日志。此失败已记录在“设置 → 调试日志”和 Rails.logger 中。
            qdrant:
              title: 尚未实现 Qdrant 支持
              message: Qdrant 适配器目前只有框架，文档上传和搜索操作都会失败。请为文档搜索选择 OpenAI 或 pgvector。
            missing_vector_store:
              title: 未配置向量存储
              message: 在配置向量存储适配器及其所需条件之前，已上传的文档无法被索引或搜索。
            unavailable_vector_store:
              title: 所选向量存储不可用
              message: 请检查下方的适配器要求。对于 pgvector，数据库必须提供 vector 扩展或已有 vector_store_chunks 表。
          llm:
            title: LLM 与 PDF 处理
            description: 实时检查会验证所配置的模型，像助手一样让它执行一次简单的函数调用，然后分别使用一个不含客户数据的单页合成 PDF 测试文本提取和视觉/原生处理。凭据值绝不会显示。
          vector_store:
