              env_backed: "嵌入配置以及仅通过环境变量设置的任何值，在每个容器启动时即固定。Rails 无法更改另一个容器的环境变量，因此更改这些配置需要重启或重建 Web 和 Worker 两个服务；任何仅重启其中一个服务的部署工具（例如部分滚动更新、仅更新 Secret 而未重启 Pod）都不会应用更改。"
