          worker:
            title: Worker 验证
            description: 以上检查是在当前 Web 进程中运行的。而大部分 AI 工作（助手回复、PDF 处理、embedding、自动分类和商户识别）实际上都在 Sidekiq worker 进程中运行，其网络访问、DNS、代理规则甚至加载的凭据都可能不同。将检查加入队列，即可验证 worker 自身的配置和连通性。
            verify_button: 验证 worker 配置
            coverage_notice: 每次检查只验证一个 worker 进程，即取出该任务的那个进程。如果有多个 worker 副本，检查通过并不代表所有 worker 都正常；可再次将检查加入队列以抽检另一个。
            empty:
              title: 尚无 worker 回报结果
              description: 点击“验证 worker 配置”即可将一次异步检查加入队列。worker 进程接手后，结果将显示在这里。
            labels:
              process: Worker 进程
              checked_at: 检查时间
              configuration: 配置
            configuration_statuses:
              match: 与 Web 一致
              mismatch: 与 Web 不一致
            statuses:
              passing: 通过
              failing: 未通过
              stale: 已过时
            settings_origin:
              title: 哪些设置需要重启？
              database_backed: 在“设置 → 自托管”中修改的提供商、模型和 API 密钥设置存储在数据库中。rails-settings-cached 会在写入时使共享缓存失效，因此 Web 和 worker 都会在下一个请求或下一个排队任务中读取到新值，无需重启。
              env_backed: Embedding 配置以及任何只通过环境变量设置的值，都在每个容器启动时固定。Rails 无法修改其他容器的环境，因此更改这些值需要重启或重建 Web 和 worker 两个服务；只重启其中一个的部署工具（部分发布、更新了 Secret 却没有重启 pod）都不会使更改生效。
          local_setup:
            title: 推荐的本地部署方式
            description: 通过本地的 OpenAI 兼容端点运行 LLM，将文档向量存储在 pgvector 中，并将 embedding 设置指向一个 OpenAI 兼容的 embeddings 端点。PostgreSQL 镜像必须包含 vector 扩展，且 embedding 维度必须与所选模型一致。
