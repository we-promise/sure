          not_checked_help: 直接打开 AI 状态 URL 或运行检查以验证服务可用性。
          loading: "正在运行实时检查…"
          alerts:
            custom_openai:
              title: 此自定义端点未通过托管向量存储检查
              message: 配置的端点未通过 /v1/vector_stores 存活检查。大多数本地及 OpenAI 兼容端点未实现该 API。聊天和 PDF 处理仍可能正常；对于常见本地部署，请配合独立嵌入端点使用 pgvector。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            function_calling_unsupported:
              title: 该模型不支持函数调用（Function Calling）
              message: 该端点可以处理普通聊天请求，但拒绝了携带 tools 参数的相同请求。AI 助手通过函数调用读取账户、交易和持仓数据，因此聊天会持续失败（通常返回无用的 404），直到更换为支持工具调用的模型。请选择提供商文档标明支持函数调用的模型。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            function_calling_not_used:
              title: 模型直接回复而未调用要求调用的工具
              message: 端点接受了 tools 参数，但模型返回了纯文本，而未调用健康检查工具。没有工具调用，AI 助手就无法读取财务数据，聊天可能会无响应或编造数字。请优先选择提供商文档标明支持函数调用的模型。
            llm_probe_failed:
              title: LLM 实时检查失败
              message: Sure 无法同时验证所配置的端点和模型。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            llm_model_not_available:
              title: 配置的 AI 模型不可用
              message: 端点已响应，但未列出或提供所配置的模型。请为所选提供商挑选一个活跃模型，然后重新运行检查。若通过 OpenAI 兼容转换层使用 Gemini，请使用当前受支持的模型，例如 gemini-3.8-flash。
            pdf_text_extraction_failed:
              title: 合成 PDF 文本提取检查失败
              message: Sure 无法完成在本地提取内嵌 PDF 文本并发送给所配置模型的文本优先路径。未发送任何客户数据。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            pdf_vision_processing_failed:
              title: 合成 PDF 视觉/原生文档检查失败
              message: Sure 无法通过所配置模型完成图像或原生文档 PDF 路径。未发送任何客户数据。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            vector_probe_failed:
              title: 文档检索实时检查失败
              message: Sure 无法验证所选的向量存储及所有必需的嵌入服务。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            pgvector_extension_not_enabled:
              title: 未启用 PostgreSQL vector 扩展
              message: 已选择 pgvector 适配器，但 PostgreSQL 尚未为此数据库启用 vector 扩展。请使用包含 pgvector 的 PostgreSQL 镜像，以数据库所有者或超级用户身份启用该扩展，然后携带 VECTOR_STORE_PROVIDER=pgvector 重新运行数据库迁移。
            pgvector_table_not_found:
              title: 缺少 vector_store_chunks 数据表
              message: 已启用 pgvector 扩展，但未找到 chunks 表。请检查迁移状态，然后携带 VECTOR_STORE_PROVIDER=pgvector 重新运行向量存储迁移，以便 Sure 创建 vector_store_chunks。
            pgvector_probe_failed:
              title: pgvector 存储检查失败
              message: Sure 无法查询 pgvector chunks 表。请检查 PostgreSQL 权限、vector 扩展以及 vector_store_chunks 迁移。失败详情已记录到“设置 → 调试日志”和 Rails.logger。
            embedding_dimensions_mismatch:
              title: 嵌入向量维度不匹配
              message: 嵌入端点返回的向量长度与 EMBEDDING_DIMENSIONS 不匹配。请将 EMBEDDING_MODEL 和 EMBEDDING_DIMENSIONS 设为模型文档规定的向量维度，重启 Sure 使环境变量生效；若现有数据使用了不同维度，请修改或重建 pgvector 嵌入列/表并重新嵌入文档。
            embedding_probe_timeout:
              title: 嵌入实时检查超时
              message: 嵌入端点未在 AI_HEALTH_PROBE_TIMEOUT 内响应。如果提供商响应较慢，请增大该健康检查超时时间，然后重启 Sure 以确保环境变量在所有进程中生效。如果常规 AI 聊天请求也超时，请单独调高 OPENAI_REQUEST_TIMEOUT。
            embedding_probe_failed:
              title: 嵌入实时检查失败
