          last_checked: Проверки выполнены %{time_ago} назад. Результаты ненадолго кешируются.
          not_checked_help: Откройте URL статуса ИИ напрямую или запустите проверки, чтобы убедиться в доступности сервисов.
          alerts:
            custom_openai:
              title: Проверка облачного векторного хранилища на этом пользовательском эндпоинте не пройдена
              message: Настроенный эндпоинт не прошёл проверку доступности /v1/vector_stores. Большинство локальных и OpenAI-совместимых эндпоинтов не реализуют этот API. Чат и обработка PDF при этом могут работать; для типичной локальной установки используйте pgvector с отдельным эндпоинтом эмбеддингов. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            function_calling_unsupported:
              title: Модель не поддерживает вызов функций
              message: Эндпоинт обработал обычный запрос чата, но отклонил тот же запрос с параметром tools. ИИ-ассистент читает счета, операции и активы через вызовы функций, поэтому чат будет выдавать ошибки — часто неинформативную 404 — пока не будет выбрана модель с поддержкой инструментов. Выберите модель, провайдер которой документирует поддержку вызова функций. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            function_calling_not_used:
              title: Модель ответила, не вызвав запрошенный инструмент
              message: Эндпоинт принял параметр tools, но модель ответила текстом вместо вызова инструмента проверки. Без вызова инструментов ИИ-ассистент не может читать финансовые данные, поэтому чат может ничего не ответить или привести выдуманные цифры. Лучше выбрать модель, провайдер которой документирует поддержку вызова функций.
            llm_probe_failed:
              title: Проверка LLM не пройдена
              message: Sure не удалось проверить настроенные эндпоинт и модель. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            llm_model_not_available:
              title: Настроенная модель ИИ недоступна
              message: Эндпоинт ответил, но не указал настроенную модель в списке или не обслужил её. Выберите активную модель выбранного провайдера и запустите проверки снова. Для Gemini через OpenAI-совместимый слой трансляции используйте поддерживаемую сейчас модель, например gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Проверка извлечения текста из синтетического PDF не пройдена
              message: 'Sure не удалось выполнить текстовый путь обработки: локально извлечь встроенный текст PDF и отправить его настроенной модели. Данные клиентов не отправлялись. Ошибка записана в Настройки → Журналы отладки и Rails.logger.'
            pdf_vision_processing_failed:
              title: Проверка синтетического PDF через vision/нативную обработку не пройдена
              message: Sure не удалось обработать PDF как изображение или нативный документ через настроенную модель. Данные клиентов не отправлялись. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            vector_probe_failed:
              title: Проверка поиска по документам не пройдена
              message: Sure не удалось проверить выбранное векторное хранилище и все необходимые сервисы эмбеддингов. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            pgvector_extension_not_enabled:
              title: Расширение vector в PostgreSQL не включено
              message: Выбран адаптер pgvector, но в PostgreSQL не включено расширение vector для этой базы данных. Используйте образ PostgreSQL с pgvector, затем включите расширение от имени владельца базы данных или суперпользователя и повторно запустите миграции с VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Таблица vector_store_chunks отсутствует
              message: Расширение pgvector включено, но таблица фрагментов не найдена. Проверьте статус миграций, затем повторно запустите миграцию векторного хранилища с VECTOR_STORE_PROVIDER=pgvector, чтобы Sure мог создать vector_store_chunks.
            pgvector_probe_failed:
              title: Проверка хранилища pgvector не пройдена
              message: Sure не удалось выполнить запрос к таблице фрагментов pgvector. Проверьте права доступа PostgreSQL, расширение vector и миграцию vector_store_chunks. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            embedding_dimensions_mismatch:
              title: Размерность эмбеддингов не совпадает
              message: Эндпоинт эмбеддингов вернул вектор, длина которого не совпадает с EMBEDDING_DIMENSIONS. Укажите в EMBEDDING_MODEL и EMBEDDING_DIMENSIONS размер вектора, заявленный для модели, перезапустите Sure, чтобы переменные окружения применились, затем измените или пересоздайте столбец/таблицу эмбеддингов pgvector и заново создайте эмбеддинги документов, если существующие данные использовали другой размер.
            embedding_probe_timeout:
              title: Истекло время проверки эмбеддингов
              message: Эндпоинт эмбеддингов не ответил за время AI_HEALTH_PROBE_TIMEOUT. Увеличьте этот тайм-аут проверки, если провайдер работает медленно, затем перезапустите Sure, чтобы переменные окружения применились во всех процессах. Если обычные запросы к ИИ-чату тоже превышают тайм-аут, отдельно увеличьте OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Проверка эмбеддингов не пройдена
              message: Sure не удалось создать короткий тестовый эмбеддинг через настроенные эндпоинт и модель. Проверьте EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN и журналы провайдера эмбеддингов. Ошибка записана в Настройки → Журналы отладки и Rails.logger.
            qdrant:
              title: Поддержка Qdrant пока не реализована
              message: 'Для адаптера Qdrant есть только заготовка: загрузка документов и поиск сейчас не работают. Для поиска по документам выберите OpenAI или pgvector.'
            missing_vector_store:
              title: Векторное хранилище не настроено
              message: Загруженные документы нельзя проиндексировать и искать, пока не настроен адаптер векторного хранилища и его требования.
            unavailable_vector_store:
              title: Выбранное векторное хранилище недоступно
              message: Проверьте требования адаптера ниже. Для pgvector база данных должна предоставлять расширение vector или уже содержать таблицу vector_store_chunks.
          llm:
            title: LLM и обработка PDF
            description: Проверки подтверждают настроенную модель, просят её выполнить один простой вызов функции, как это делает ассистент, а затем отдельно проверяют извлечение текста и vision/нативную обработку на одностраничном синтетическом PDF без данных клиентов. Значения учётных данных никогда не отображаются.
          vector_store:
            title: Векторное хранилище и поиск по документам
            description: Проверка обращается к API облачного векторного хранилища либо проверяет таблицу pgvector и создаёт один короткий эмбеддинг, не сохраняя его.
