              match: Совпадает с веб-процессом
              mismatch: Отличается от веб-процесса
            coverage_notice: Каждая проверка проверяет ровно один процесс воркера
              — тот, который забрал её из очереди. Если реплик воркера несколько,
              успешный результат не подтверждает, что исправны все воркеры; поставьте
              проверку в очередь ещё раз, чтобы проверить другой.
            description: Проверки выше выполнены из этого веб-процесса. Большая часть
              работы ИИ — ответы ассистента, обработка PDF, эмбеддинги, автокатегоризация
              и определение продавцов — на самом деле выполняется в процессе воркера
              Sidekiq, у которого могут отличаться сетевой доступ, DNS, правила прокси
              и даже загруженные учётные данные. Поставьте проверку в очередь, чтобы
              проверить собственную конфигурацию и подключение воркера.
            empty:
              description: Нажмите «Проверить конфигурацию воркера», чтобы поставить
                асинхронную проверку в очередь. Результат появится здесь, как только
                её возьмёт процесс воркера.
              title: Ни один воркер ещё не отчитался
            labels:
              checked_at: Проверено
              configuration: Конфигурация
              process: Процесс воркера
            settings_origin:
              database_backed: Настройки провайдера, модели и API-ключа, изменённые
                в Настройки → Самостоятельный хостинг, хранятся в базе данных. rails-settings-cached
                сбрасывает общий кеш при записи, поэтому и веб-процесс, и воркер получают
                новое значение для следующего запроса или задачи в очереди — перезапуск
                не нужен.
              env_backed: Конфигурация эмбеддингов и любые значения, заданные только
                через переменную окружения, фиксируются при запуске каждого контейнера.
                Rails не может изменить окружение другого контейнера, поэтому для
                их изменения нужно перезапустить или пересоздать и веб-сервис, и сервис
                воркера — а инструменты развёртывания, которые перезапускают только
                один из них (частичное развёртывание, обновлённый Secret без перезапуска
                pod), изменение не применят.
              title: Какие настройки требуют перезапуска?
            statuses:
