          not_configured: Учётные данные APNs не настроены.
          queued: Тестовое уведомление поставлено в очередь. Обновите результаты ниже,
            чтобы проверить его статус.
          ready: Отправьте тестовое уведомление на включённые устройства iOS, зарегистрированные
            в вашем аккаунте.
          storage_unavailable: Не удалось сохранить запрос на тест. Проверьте конфигурацию
            общего кеша.
        pending: Ожидание
        queueing: Постановка в очередь…
        refresh: Обновить результаты
        requested_at: 'Последний тест запрошен: %{time}'
        result_help: Принятие APNs не подтверждает доставку на ваше устройство. Обновите
          страницу, чтобы увидеть результаты воркера. Результаты хранятся 24 часа.
        results_label: Результаты теста
        send_test: Отправить тестовое push-уведомление
        statuses:
          accepted: Принято APNs
          enqueue_failed: Не удалось поставить в очередь; проверьте Sidekiq
          expired: Истекло без окончательного результата
          failed: Ошибка; проверьте журналы отладки push
          queued: В очереди
          rejected: Отклонено APNs; проверьте журналы отладки push
          retrying: Повтор после временного сбоя
          skipped: 'Пропущено: устройство больше не подходит'
