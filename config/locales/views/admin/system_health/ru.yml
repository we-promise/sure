          worker:
            title: Проверка воркера
            description: Проверки выше выполнены из этого веб-процесса. Большая часть работы ИИ — ответы ассистента, обработка
              PDF, эмбеддинги, автокатегоризация и определение продавцов — на самом деле выполняется в процессе воркера Sidekiq,
              у которого могут отличаться сетевой доступ, DNS, правила прокси и даже загруженные учётные данные. Поставьте
              проверку в очередь, чтобы проверить собственную конфигурацию и подключение воркера.
            verify_button: Проверить конфигурацию воркера
            coverage_notice: Каждая проверка проверяет ровно один процесс воркера — тот, который забрал её из очереди. Если
              реплик воркера несколько, успешный результат не подтверждает, что исправны все воркеры; поставьте проверку в
              очередь ещё раз, чтобы проверить другой.
            empty:
              title: Ни один воркер ещё не отчитался
              description: Нажмите «Проверить конфигурацию воркера», чтобы поставить асинхронную проверку в очередь. Результат
                появится здесь, как только её возьмёт процесс воркера.
            labels:
              process: Процесс воркера
              checked_at: Проверено
              configuration: Конфигурация
            configuration_statuses:
              match: Совпадает с веб-процессом
              mismatch: Отличается от веб-процесса
            statuses:
              passing: Пройдена
              failing: Не пройдена
              stale: Устарела
            settings_origin:
              title: Какие настройки требуют перезапуска?
              database_backed: Настройки провайдера, модели и API-ключа, изменённые в Настройки → Самостоятельный хостинг,
                хранятся в базе данных. rails-settings-cached сбрасывает общий кеш при записи, поэтому и веб-процесс, и воркер
                получают новое значение для следующего запроса или задачи в очереди — перезапуск не нужен.
              env_backed: Конфигурация эмбеддингов и любые значения, заданные только через переменную окружения, фиксируются
                при запуске каждого контейнера. Rails не может изменить окружение другого контейнера, поэтому для их изменения
                нужно перезапустить или пересоздать и веб-сервис, и сервис воркера — а инструменты развёртывания, которые
                перезапускают только один из них (частичное развёртывание, обновлённый Secret без перезапуска pod), не подхватят
                эти изменения.
          local_setup:
            title: Рекомендуемая локальная установка
            description: Запускайте LLM через локальный OpenAI-совместимый эндпоинт, храните векторы документов в pgvector
              и укажите в настройках эмбеддингов OpenAI-совместимый эндпоинт эмбеддингов. Образ PostgreSQL должен включать
              расширение vector, а размерность эмбеддингов должна соответствовать выбранной модели.
      configuration:
        description: Конфигурация, доступная этому веб-процессу. Эти проверки не отправляют письма, не обращаются к провайдерам
          и не загружают и не скачивают файлы. Статус «Настроено» означает лишь наличие параметров, а не проверенную доставку,
          доступ к провайдерам или хранилищу.
        checks:
          exchange_rates:
            guidance: Выберите провайдера обменных курсов и добавьте его API-ключ, если он нужен, в настройках самостоятельного
              хостинга или настройте его в среде развёртывания. Переопределения EXCHANGE_RATE_PROVIDER и API-ключей провайдеров
              через переменные окружения имеют приоритет.
            issues:
              invalid_provider: Выбранный провайдер обменных курсов не распознан. Автоматическое получение курсов не работает,
                пока не выбран поддерживаемый провайдер.
            statuses:
              configured: Настройки выбранного провайдера обменных курсов указаны.
              not_configured: Не настроен пригодный провайдер обменных курсов. Автоматическая конвертация валют может быть
                недоступна, если сохранённого курса нет.
            title: Обменные курсы
          securities:
            guidance: Выберите провайдеров и добавьте нужные API-ключи в настройках самостоятельного хостинга или настройте
              их в среде развёртывания. Переопределения через переменные окружения имеют приоритет. Для публичных провайдеров
              API-ключ не нужен.
            statuses:
              configured: Все включённые провайдеры рыночных цен настроены.
              disabled: Ни один провайдер рыночных цен не включён. Автоматический поиск ценных бумаг и получение цен недоступны.
              incomplete: Хотя бы у одного включённого провайдера рыночных цен не хватает настроек или выбран недопустимый
                вариант. Ценные бумаги, назначенные этому провайдеру, могут не получать обновления цен.
              not_configured: У включённых провайдеров рыночных цен отсутствуют API-ключи. Автоматический поиск ценных бумаг
                и получение цен через этих провайдеров недоступны.
            title: Рыночные цены
          smtp:
            guidance: SMTP нельзя настроить в интерфейсе администратора. Задайте переменные окружения для почты и в веб-сервисе,
              и в сервисе воркера, затем перезапустите оба. SMTP_USERNAME и SMTP_PASSWORD можно оба не указывать для ретранслятора
              без аутентификации.
            issues:
              address: SMTP_ADDRESS
              app_domain: APP_DOMAIN (используется в ссылках писем)
              authentication: SMTP_USERNAME и SMTP_PASSWORD (укажите оба или ни один)
              port: SMTP_PORT (число от 1 до 65535)
              sender: EMAIL_SENDER (замените отправителя по умолчанию sender@sure.local)
            statuses:
              configured: Настройки SMTP указаны.
              disabled: Отправка почты отключена в текущей конфигурации почтового отправителя.
              incomplete: Некоторые настройки почты отсутствуют или неполны. Системные письма или ссылки в них могут не работать.
              not_checked: Этот процесс использует другой способ доставки вместо SMTP, например предпросмотр для разработки.
                Доставка SMTP не оценивается.
              not_configured: SMTP не настроен. Через SMTP нельзя отправить сброс пароля, приглашения и другие системные письма.
            title: Почта (SMTP)
          storage:
            guidance: Проверьте ACTIVE_STORAGE_SERVICE и настройки развёртывания выбранного хранилища. Локальному диску нужно
              постоянное хранилище, общее для веб-сервиса и сервиса воркера. Смена хранилища не переносит существующие файлы;
              спланируйте миграцию отдельно.
            issues:
              bucket: Бакет хранилища
              credentials: Ключ доступа и секретный ключ хранилища (укажите оба или используйте внешний поиск учётных данных)
              endpoint: Эндпоинт хранилища (и CLOUDFLARE_ACCOUNT_ID для R2)
              region: Регион хранилища
              root: Корневая папка локального хранилища
            statuses:
              configured: Настройки хранилища указаны; локальному диску не нужны облачные учётные данные.
              incomplete: Не хватает обязательных настроек хранилища. Загрузка или получение файлов могут не работать.
              not_checked: Этот бэкенд использует внешнее обнаружение учётных данных или особую конфигурацию. По одним этим
                настройкам нельзя определить доступ к нему.
              not_configured: Для выбранного бэкенда хранилища нет подходящей конфигурации. Загрузка файлов может быть недоступна.
            title: Загрузка и хранение файлов
