      show:
        ai:
          adapters:
            openai: Облачное векторное хранилище OpenAI
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Настроенный эндпоинт не прошёл проверку доступности /v1/vector_stores.
                Большинство локальных и OpenAI-совместимых эндпоинтов не реализуют
                этот API. Чат и обработка PDF при этом могут работать; для типичной
                локальной установки используйте pgvector с отдельным эндпоинтом эмбеддингов.
                Ошибка записана в Настройки → Журналы отладки и Rails.logger.
              title: Проверка облачного векторного хранилища на этом пользовательском
                эндпоинте не пройдена
            embedding_dimensions_mismatch:
              message: Эндпоинт эмбеддингов вернул вектор, длина которого не совпадает
                с EMBEDDING_DIMENSIONS. Укажите в EMBEDDING_MODEL и EMBEDDING_DIMENSIONS
                размер вектора, заявленный для модели, перезапустите Sure, чтобы переменные
                окружения применились, затем измените или пересоздайте столбец/таблицу
                эмбеддингов pgvector и заново создайте эмбеддинги документов, если
                существующие данные использовали другой размер.
              title: Размерность эмбеддингов не совпадает
            embedding_probe_failed:
              message: Sure не удалось создать короткий тестовый эмбеддинг через настроенные
                эндпоинт и модель. Проверьте EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN и журналы провайдера эмбеддингов. Ошибка записана
                в Настройки → Журналы отладки и Rails.logger.
              title: Проверка эмбеддингов не пройдена
            embedding_probe_timeout:
              message: Эндпоинт эмбеддингов не ответил за время AI_HEALTH_PROBE_TIMEOUT.
                Увеличьте этот тайм-аут проверки, если провайдер работает медленно,
                затем перезапустите Sure, чтобы переменные окружения применились во
                всех процессах. Если обычные запросы к ИИ-чату тоже превышают тайм-аут,
                отдельно увеличьте OPENAI_REQUEST_TIMEOUT.
              title: Истекло время проверки эмбеддингов
            function_calling_not_used:
              message: Эндпоинт принял параметр tools, но модель ответила текстом
                вместо вызова инструмента проверки. Без вызова инструментов ИИ-ассистент
                не может читать финансовые данные, поэтому чат может ничего не ответить
                или привести выдуманные цифры. Лучше выбрать модель, провайдер которой
                документирует поддержку вызова функций.
              title: Модель ответила, не вызвав запрошенный инструмент
            function_calling_unsupported:
              message: Эндпоинт обработал обычный запрос чата, но отклонил тот же
                запрос с параметром tools. ИИ-ассистент читает счета, операции и активы
                через вызовы функций, поэтому чат будет выдавать ошибки — часто неинформативную
                404 — пока не будет выбрана модель с поддержкой инструментов. Выберите
                модель, провайдер которой документирует поддержку вызова функций.
                Ошибка записана в Настройки → Журналы отладки и Rails.logger.
              title: Модель не поддерживает вызов функций
            llm_model_not_available:
              message: Эндпоинт ответил, но не указал настроенную модель в списке
                или не обслужил её. Выберите активную модель выбранного провайдера
                и запустите проверки снова. Для Gemini через OpenAI-совместимый слой
                трансляции используйте поддерживаемую сейчас модель, например gemini-2.5-flash.
              title: Настроенная модель ИИ недоступна
            llm_probe_failed:
              message: Sure не удалось проверить настроенные эндпоинт и модель. Ошибка
                записана в Настройки → Журналы отладки и Rails.logger.
              title: Проверка LLM не пройдена
            missing_vector_store:
              message: Загруженные документы нельзя проиндексировать и искать, пока
                не настроен адаптер векторного хранилища и его требования.
              title: Векторное хранилище не настроено
            pdf_text_extraction_failed:
              message: 'Sure не удалось выполнить текстовый путь обработки: локально
                извлечь встроенный текст PDF и отправить его настроенной модели. Данные
                клиентов не отправлялись. Ошибка записана в Настройки → Журналы отладки
                и Rails.logger.'
              title: Проверка извлечения текста из синтетического PDF не пройдена
            pdf_vision_processing_failed:
              message: Sure не удалось обработать PDF как изображение или нативный
                документ через настроенную модель. Данные клиентов не отправлялись.
                Ошибка записана в Настройки → Журналы отладки и Rails.logger.
              title: Проверка синтетического PDF через vision/нативную обработку не
                пройдена
            pgvector_extension_not_enabled:
              message: Выбран адаптер pgvector, но в PostgreSQL не включено расширение
                vector для этой базы данных. Используйте образ PostgreSQL с pgvector,
                затем включите расширение от имени владельца базы данных или суперпользователя
                и повторно запустите миграции с VECTOR_STORE_PROVIDER=pgvector.
              title: Расширение vector в PostgreSQL не включено
            pgvector_probe_failed:
              message: Sure не удалось выполнить запрос к таблице фрагментов pgvector.
                Проверьте права доступа PostgreSQL, расширение vector и миграцию vector_store_chunks.
                Ошибка записана в Настройки → Журналы отладки и Rails.logger.
              title: Проверка хранилища pgvector не пройдена
            pgvector_table_not_found:
              message: Расширение pgvector включено, но таблица фрагментов не найдена.
                Проверьте статус миграций, затем повторно запустите миграцию векторного
                хранилища с VECTOR_STORE_PROVIDER=pgvector, чтобы Sure мог создать
                vector_store_chunks.
              title: Таблица vector_store_chunks отсутствует
            qdrant:
              message: 'Для адаптера Qdrant есть только заготовка: загрузка документов
                и поиск сейчас не работают. Для поиска по документам выберите OpenAI
                или pgvector.'
              title: Поддержка Qdrant пока не реализована
            unavailable_vector_store:
              message: Проверьте требования адаптера ниже. Для pgvector база данных
                должна предоставлять расширение vector или уже содержать таблицу vector_store_chunks.
              title: Выбранное векторное хранилище недоступно
            vector_probe_failed:
              message: Sure не удалось проверить выбранное векторное хранилище и все
                необходимые сервисы эмбеддингов. Ошибка записана в Настройки → Журналы
                отладки и Rails.logger.
              title: Проверка поиска по документам не пройдена
          failure_codes:
            dimensions_mismatch: Размерность вектора эмбеддинга не совпадает с настроенной
