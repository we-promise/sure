          sandbox: Sandbox
        messages:
          cooldown: Подождите 30 секунд перед отправкой следующего теста.
          disabled: Отправка push-уведомлений отключена оператором.
          enqueue_failed: Не удалось поставить тест в очередь. Проверьте Sidekiq и
