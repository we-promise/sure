      optional_services:
        title: Дополнительные сервисы
        description: Необязательные интеграции оператора. Ненастроенные сервисы показаны для справки. Эти проверки изучают
          только настройки; они не проверяют соединение, не отправляют тестовые события и не меняют согласие на аналитику.
          Разверните сервис, чтобы увидеть настройку.
        missing_settings: 'Не хватает настроек: %{settings}'
        notes:
          browser_analytics_disabled: Браузерная аналитика отключена для этой среды. Это не отключает отдельно настроенный
            серверный клиент.
          environment_disabled: Загруженная интеграция отключена для этой среды Rails.
          explicitly_disabled: SKYLIGHT_ENABLED явно отключает инструментирование.
          production_only: По текущей конфигурации приложения эта интеграция используется только в production.
          self_hosted_checkout_disabled: Оформление подписки и портал биллинга отключены в режиме самостоятельного хостинга.
            Вебхуки Stripe всё ещё можно настроить; идентификаторы цен для оформления здесь не нужны.
          shared_feedback_configured: Самостоятельно развёрнутая обратная связь использует отдельный включённый проект из
            поставки. Для него не нужен POSTHOG_KEY оператора. Отказ в браузере и доступность SDK не проверяются.
          shared_feedback_disabled: Отдельный проект обратной связи для самостоятельного хостинга отключён его настройкой
            обратной связи или среды. Это не отключает аналитику оператора.
        services:
          langfuse:
            description: Необязательная трассировка ИИ и отчёты об оценке. Эта проверка не отправляет трассировки или запросы
              оценки.
            guidance: Укажите LANGFUSE_PUBLIC_KEY и LANGFUSE_SECRET_KEY вместе. LANGFUSE_HOST необязателен. После изменения
              настроек перезапустите затронутые сервисы.
            title: Langfuse
          logtail:
            description: Необязательная отправка production-логов. Если сервис не настроен, приложение продолжает писать в
              стандартный вывод.
            guidance: Укажите LOGTAIL_API_KEY и LOGTAIL_INGESTING_HOST вместе и перезапустите затронутые сервисы. Эта проверка
              не создаёт тестовую запись в журнале.
            title: Logtail
          posthog:
            description: Необязательная аналитика оператора с конфигурацией, загруженной при запуске. Настройка не означает,
              что пользователь дал согласие на аналитику.
            guidance: Укажите POSTHOG_KEY и непустой POSTHOG_HOST либо не указывайте хост для значения по умолчанию. Браузерная
              аналитика требует production или POSTHOG_DEVELOPMENT_ENABLED в development. POSTHOG_FEEDBACK_ENABLED управляет
              отдельной обратной связью самостоятельного хостинга, а не аналитикой оператора.
            title: PostHog
          sentry:
            description: Необязательные отчёты об ошибках и производительности. Текущий инициализатор включает отчёты только
              в production.
            guidance: Укажите SENTRY_DSN и перезапустите затронутые сервисы. Проверяется загруженная конфигурация SDK без
              захвата ошибки и отправки события.
            title: Sentry
          skylight:
            description: Необязательное инструментирование производительности приложения. Наличие конфигурации не подтверждает,
              что агент работает или отправляет данные.
            guidance: Укажите SKYLIGHT_AUTHENTICATION и убедитесь, что Skylight загружен в нужной среде Rails. SKYLIGHT_ENABLED=false
              отключает инструментирование; одна эта переменная не загружает гем. После изменений перезапустите сервисы.
            title: Skylight
          stripe:
            description: Необязательные платежи по подписке и вебхуки платежей. Эта проверка не создаёт клиента Stripe, не
              проверяет учётные данные и не отправляет платёжные запросы.
            guidance: Укажите STRIPE_SECRET_KEY и STRIPE_WEBHOOK_SECRET вместе. Для управляемого оформления подписки также
              нужны STRIPE_MONTHLY_PRICE_ID и STRIPE_ANNUAL_PRICE_ID.
            title: Stripe
