          worker:
            title: Xác minh worker
            description: Các kiểm tra ở trên chạy từ tiến trình web này. Phần lớn công việc AI -- phản hồi của trợ lý, xử lý PDF, embedding, tự động phân loại và nhận diện người bán -- thực ra chạy trong tiến trình worker Sidekiq, vốn có thể khác về truy cập mạng, DNS, quy tắc proxy, thậm chí cả thông tin xác thực được nạp. Hãy đưa một bài kiểm tra vào hàng đợi để xác minh cấu hình và kết nối của chính worker.
            verify_button: Xác minh cấu hình worker
            coverage_notice: Mỗi lần kiểm tra chỉ xác minh đúng một tiến trình worker -- tiến trình nào lấy nó ra khỏi hàng đợi. Nếu có nhiều bản sao worker, một kết quả đạt không có nghĩa là mọi worker đều ổn; hãy đưa kiểm tra vào hàng đợi lần nữa để lấy mẫu worker khác.
            empty:
              title: Chưa có worker nào báo cáo
              description: Nhấn “Xác minh cấu hình worker” để đưa một bài kiểm tra bất đồng bộ vào hàng đợi. Kết quả sẽ xuất hiện ở đây khi một tiến trình worker nhận xử lý.
            labels:
              process: Tiến trình worker
              checked_at: Đã kiểm tra
              configuration: Cấu hình
            configuration_statuses:
              match: Khớp với web
              mismatch: Khác với web
            statuses:
              passing: Đạt
              failing: Thất bại
              stale: Đã cũ
            settings_origin:
              title: Những cài đặt nào cần khởi động lại?
              database_backed: Các cài đặt nhà cung cấp, mô hình và khóa API được thay đổi trong Cài đặt → Tự lưu trữ được lưu trong cơ sở dữ liệu. rails-settings-cached sẽ làm mất hiệu lực bộ nhớ đệm dùng chung khi ghi, nên cả web và worker đều nhận giá trị mới cho yêu cầu hoặc tác vụ tiếp theo -- không cần khởi động lại.
              env_backed: Cấu hình embedding và mọi giá trị chỉ được đặt qua biến môi trường sẽ cố định khi từng container khởi động. Rails không thể thay đổi môi trường của container khác, nên muốn thay đổi các giá trị này phải khởi động lại hoặc tạo lại cả dịch vụ web và worker -- công cụ triển khai nào chỉ khởi động lại một trong hai (triển khai từng phần, Secret được cập nhật mà không khởi động lại pod) sẽ không nhận thay đổi.
          local_setup:
            title: Cách thiết lập cục bộ được khuyến nghị
            description: Chạy LLM qua endpoint cục bộ tương thích OpenAI, lưu vector tài liệu trong pgvector và trỏ cài đặt embedding đến một endpoint embedding tương thích OpenAI. Image PostgreSQL phải có tiện ích mở rộng vector, và số chiều embedding phải khớp với mô hình đã chọn.
