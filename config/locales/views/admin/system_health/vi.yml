      show:
        ai:
          adapters:
            openai: Kho vector do OpenAI lưu trữ
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Điểm cuối đã cấu hình không vượt qua kiểm tra hoạt động /v1/vector_stores.
                Phần lớn điểm cuối cục bộ và tương thích OpenAI không triển khai API
                này. Trò chuyện và xử lý PDF có thể vẫn hoạt động; với thiết lập cục
                bộ thông thường, hãy dùng pgvector cùng một điểm cuối embedding riêng.
                Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Kiểm tra kho vector lưu trữ thất bại tại điểm cuối tùy chỉnh
                này
            embedding_dimensions_mismatch:
              message: Điểm cuối embedding trả về vector có độ dài không khớp EMBEDDING_DIMENSIONS.
                Đặt EMBEDDING_MODEL và EMBEDDING_DIMENSIONS theo kích thước vector
                được tài liệu mô hình quy định, khởi động lại Sure để áp dụng môi
                trường, rồi sửa hoặc tạo lại cột/bảng embedding pgvector và tạo lại
                embedding tài liệu nếu dữ liệu cũ dùng kích thước khác.
              title: Số chiều embedding không khớp
            embedding_probe_failed:
              message: Sure không thể tạo embedding thử nghiệm ngắn qua điểm cuối
                và mô hình đã cấu hình. Kiểm tra EMBEDDING_URI_BASE, EMBEDDING_MODEL,
                EMBEDDING_ACCESS_TOKEN và nhật ký nhà cung cấp embedding. Lỗi đã được
                ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Kiểm tra hoạt động embedding thất bại
            embedding_probe_timeout:
              message: Điểm cuối embedding không trả lời trước thời hạn AI_HEALTH_PROBE_TIMEOUT.
                Tăng thời gian chờ kiểm tra nếu nhà cung cấp chậm, rồi khởi động lại
                Sure để mọi tiến trình nhận cấu hình môi trường. Nếu các cuộc gọi
                trò chuyện AI thông thường cũng hết thời gian chờ, hãy tăng riêng
                OPENAI_REQUEST_TIMEOUT.
              title: Kiểm tra hoạt động embedding hết thời gian chờ
            function_calling_not_used:
              message: Điểm cuối chấp nhận tham số tools, nhưng mô hình trả lời bằng
                văn bản thay vì gọi công cụ kiểm tra. Trợ lý AI không thể đọc dữ liệu
                tài chính nếu không gọi công cụ, nên có thể trả lời trống hoặc đưa
                ra số liệu bịa đặt. Hãy ưu tiên mô hình được nhà cung cấp xác nhận
                hỗ trợ gọi hàm.
              title: Mô hình trả lời mà không gọi công cụ được yêu cầu
            function_calling_unsupported:
              message: Điểm cuối phục vụ yêu cầu trò chuyện thông thường nhưng từ
                chối cùng yêu cầu khi có tham số tools. Trợ lý AI đọc tài khoản, giao
                dịch và khoản nắm giữ qua các lệnh gọi hàm, nên trò chuyện sẽ tiếp
                tục lỗi — thường là lỗi 404 không rõ nguyên nhân — cho đến khi chọn
                mô hình hỗ trợ công cụ. Chọn mô hình được nhà cung cấp xác nhận hỗ
                trợ gọi hàm. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Mô hình không hỗ trợ gọi hàm
            llm_model_not_available:
              message: Điểm cuối đã trả lời nhưng không liệt kê hoặc phục vụ mô hình
                đã cấu hình. Chọn mô hình đang hoạt động của nhà cung cấp rồi kiểm
                tra lại. Với Gemini qua lớp chuyển đổi tương thích OpenAI, hãy dùng
                mô hình hiện được hỗ trợ như gemini-2.5-flash.
              title: Mô hình AI đã cấu hình không khả dụng
            llm_probe_failed:
              message: Sure không thể xác minh cả điểm cuối và mô hình đã cấu hình.
                Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Kiểm tra hoạt động LLM thất bại
            missing_vector_store:
              message: Không thể lập chỉ mục hoặc tìm kiếm tài liệu đã tải lên cho
                đến khi cấu hình bộ điều hợp kho vector và các yêu cầu của nó.
              title: Chưa cấu hình kho vector
            pdf_text_extraction_failed:
              message: 'Sure không thể hoàn tất quy trình ưu tiên văn bản: trích xuất
                văn bản nhúng trong PDF cục bộ rồi gửi đến mô hình đã cấu hình. Không
                gửi dữ liệu khách hàng. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi
                và Rails.logger.'
              title: Kiểm tra trích xuất văn bản PDF giả lập thất bại
            pdf_vision_processing_failed:
              message: Sure không thể hoàn tất quy trình xử lý PDF bằng hình ảnh hoặc
                tài liệu gốc qua mô hình đã cấu hình. Không gửi dữ liệu khách hàng.
                Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Kiểm tra PDF giả lập bằng hình ảnh/tài liệu gốc thất bại
            pgvector_extension_not_enabled:
              message: Đã chọn bộ điều hợp pgvector nhưng PostgreSQL chưa bật phần
                mở rộng vector cho cơ sở dữ liệu này. Dùng ảnh PostgreSQL có pgvector,
                bật phần mở rộng bằng chủ sở hữu cơ sở dữ liệu hoặc siêu người dùng,
                rồi chạy lại migration với VECTOR_STORE_PROVIDER=pgvector.
              title: Chưa bật phần mở rộng vector của PostgreSQL
            pgvector_probe_failed:
              message: Sure không thể truy vấn bảng đoạn dữ liệu pgvector. Kiểm tra
                quyền PostgreSQL, phần mở rộng vector và migration vector_store_chunks.
                Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Kiểm tra lưu trữ pgvector thất bại
            pgvector_table_not_found:
              message: Phần mở rộng pgvector đã bật nhưng không tìm thấy bảng đoạn
                dữ liệu. Kiểm tra trạng thái migration, rồi chạy lại migration kho
                vector với VECTOR_STORE_PROVIDER=pgvector để Sure tạo vector_store_chunks.
              title: Thiếu bảng vector_store_chunks
            qdrant:
              message: Bộ điều hợp Qdrant mới có khung triển khai, nhưng tải lên và
                tìm kiếm tài liệu hiện vẫn thất bại. Chọn OpenAI hoặc pgvector để
                tìm kiếm tài liệu.
              title: Chưa triển khai hỗ trợ Qdrant
            unavailable_vector_store:
              message: Kiểm tra các yêu cầu của bộ điều hợp bên dưới. Với pgvector,
                cơ sở dữ liệu phải có phần mở rộng vector hoặc bảng vector_store_chunks
                sẵn có.
              title: Kho vector đã chọn không khả dụng
            vector_probe_failed:
              message: Sure không thể xác minh kho vector đã chọn và mọi dịch vụ embedding
                cần thiết. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
              title: Kiểm tra hoạt động tìm kiếm tài liệu thất bại
          failure_codes:
            dimensions_mismatch: Số chiều vector embedding không khớp số chiều đã
              cấu hình
            extension_not_enabled: Chưa bật phần mở rộng vector của PostgreSQL
