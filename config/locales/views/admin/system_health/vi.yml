          last_checked: Kiểm tra trực tiếp hoàn tất %{time_ago} trước. Kết quả được lưu đệm trong thời gian ngắn.
          not_checked_help: Mở trực tiếp URL trạng thái AI hoặc chạy kiểm tra để xác minh dịch vụ đang hoạt động.
          alerts:
            custom_openai:
              title: Kiểm tra kho vector được lưu trữ đã thất bại tại endpoint tùy chỉnh này
              message: Endpoint đã cấu hình không vượt qua kiểm tra hoạt động /v1/vector_stores. Hầu hết endpoint cục bộ và endpoint tương thích OpenAI không triển khai API đó. Trò chuyện và xử lý PDF có thể vẫn hoạt động; với cách thiết lập cục bộ thông thường, hãy dùng pgvector cùng một endpoint embedding riêng. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            function_calling_unsupported:
              title: Mô hình không hỗ trợ gọi hàm (function calling)
              message: Endpoint xử lý được yêu cầu trò chuyện thông thường nhưng từ chối cùng yêu cầu đó khi có tham số tools. Trợ lý AI đọc tài khoản, giao dịch và danh mục nắm giữ thông qua gọi hàm, nên trò chuyện sẽ tiếp tục lỗi — thường là lỗi 404 khó hiểu — cho đến khi bạn dùng mô hình hỗ trợ tools. Hãy chọn mô hình mà nhà cung cấp có ghi rõ hỗ trợ gọi hàm. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            function_calling_not_used:
              title: Mô hình đã trả lời mà không gọi công cụ được yêu cầu
              message: Endpoint chấp nhận tham số tools nhưng mô hình trả lời bằng văn bản thay vì gọi công cụ kiểm tra tình trạng. Trợ lý AI không thể đọc dữ liệu tài chính nếu không gọi công cụ, nên trò chuyện có thể không trả lời gì hoặc đưa ra số liệu bịa đặt. Nên chọn mô hình mà nhà cung cấp có ghi rõ hỗ trợ gọi hàm.
            llm_probe_failed:
              title: Kiểm tra trực tiếp LLM thất bại
              message: Sure không thể xác minh được cả endpoint và mô hình đã cấu hình. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            llm_model_not_available:
              title: Mô hình AI đã cấu hình không khả dụng
              message: Endpoint có phản hồi nhưng không liệt kê hoặc không phục vụ mô hình đã cấu hình. Hãy chọn một mô hình đang hoạt động của nhà cung cấp đã chọn rồi chạy lại kiểm tra. Với Gemini qua lớp chuyển đổi tương thích OpenAI, hãy dùng mô hình hiện được hỗ trợ như gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Kiểm tra trích xuất văn bản PDF tổng hợp thất bại
              message: Sure không thể hoàn tất luồng ưu tiên văn bản, vốn trích xuất văn bản nhúng trong PDF tại chỗ rồi gửi cho mô hình đã cấu hình. Không có dữ liệu khách hàng nào được gửi đi. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            pdf_vision_processing_failed:
              title: Kiểm tra PDF tổng hợp bằng thị giác/tài liệu gốc thất bại
              message: Sure không thể hoàn tất luồng xử lý PDF dạng hình ảnh hoặc tài liệu gốc qua mô hình đã cấu hình. Không có dữ liệu khách hàng nào được gửi đi. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            vector_probe_failed:
              title: Kiểm tra trực tiếp tìm kiếm tài liệu thất bại
              message: Sure không thể xác minh kho vector đã chọn và mọi dịch vụ embedding cần thiết. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            pgvector_extension_not_enabled:
              title: Tiện ích mở rộng vector của PostgreSQL chưa được bật
              message: Adapter pgvector đã được chọn nhưng PostgreSQL chưa bật tiện ích mở rộng vector cho cơ sở dữ liệu này. Hãy dùng image PostgreSQL có sẵn pgvector, sau đó bật tiện ích mở rộng với quyền chủ sở hữu cơ sở dữ liệu hoặc superuser và chạy lại migration với VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Thiếu bảng vector_store_chunks
              message: Tiện ích mở rộng pgvector đã được bật nhưng không tìm thấy bảng chunks. Hãy kiểm tra trạng thái migration, sau đó chạy lại migration kho vector với VECTOR_STORE_PROVIDER=pgvector để Sure có thể tạo vector_store_chunks.
            pgvector_probe_failed:
              title: Kiểm tra lưu trữ pgvector thất bại
              message: Sure không thể truy vấn bảng chunks của pgvector. Hãy kiểm tra quyền PostgreSQL, tiện ích mở rộng vector và migration vector_store_chunks. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            embedding_dimensions_mismatch:
              title: Số chiều embedding không khớp
              message: Endpoint embedding trả về vector có độ dài không khớp với EMBEDDING_DIMENSIONS. Hãy đặt EMBEDDING_MODEL và EMBEDDING_DIMENSIONS theo kích thước vector được ghi trong tài liệu của mô hình, khởi động lại Sure để biến môi trường có hiệu lực, sau đó sửa hoặc tạo lại cột/bảng embedding của pgvector và embedding lại tài liệu nếu dữ liệu hiện có dùng kích thước khác.
            embedding_probe_timeout:
              title: Kiểm tra trực tiếp embedding đã hết thời gian chờ
              message: Endpoint embedding không phản hồi trước AI_HEALTH_PROBE_TIMEOUT. Hãy tăng thời gian chờ kiểm tra tình trạng này nếu nhà cung cấp chậm, sau đó khởi động lại Sure để biến môi trường có hiệu lực trong mọi tiến trình. Nếu các lệnh gọi trò chuyện AI thông thường cũng hết thời gian chờ, hãy tăng riêng OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Kiểm tra trực tiếp embedding thất bại
              message: Sure không thể tạo một embedding thử nghiệm ngắn qua endpoint và mô hình đã cấu hình. Hãy kiểm tra EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN và nhật ký của nhà cung cấp embedding. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            qdrant:
              title: Chưa hỗ trợ Qdrant
              message: Adapter Qdrant mới chỉ có khung sườn, các thao tác tải lên và tìm kiếm tài liệu hiện đều thất bại. Hãy chọn OpenAI hoặc pgvector cho tìm kiếm tài liệu.
            missing_vector_store:
              title: Chưa cấu hình kho vector
              message: Tài liệu đã tải lên không thể được lập chỉ mục hoặc tìm kiếm cho đến khi một adapter kho vector và các yêu cầu của nó được cấu hình.
            unavailable_vector_store:
              title: Kho vector đã chọn không khả dụng
              message: Hãy kiểm tra các yêu cầu của adapter bên dưới. Với pgvector, cơ sở dữ liệu phải có tiện ích mở rộng vector hoặc có sẵn bảng vector_store_chunks.
          llm:
            title: LLM và xử lý PDF
            description: Các kiểm tra trực tiếp xác minh mô hình đã cấu hình, yêu cầu mô hình thực hiện một lệnh gọi hàm đơn giản giống như trợ lý, rồi kiểm tra riêng việc trích xuất văn bản và xử lý thị giác/tài liệu gốc bằng một PDF tổng hợp một trang không chứa dữ liệu khách hàng. Giá trị thông tin xác thực không bao giờ được hiển thị.
          vector_store:
            title: Kho vector và tìm kiếm tài liệu
            description: Kiểm tra trực tiếp sẽ truy vấn API kho vector được lưu trữ, hoặc kiểm tra bảng pgvector và tạo một embedding ngắn mà không lưu lại.
