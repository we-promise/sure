nl:
  admin:
    system_health:
      configuration:
        checks:
          exchange_rates:
            guidance: Kies een wisselkoersprovider en voeg indien nodig de API-sleutel
              toe in de zelfhostinginstellingen, of configureer deze in de deploymentomgeving.
              EXCHANGE_RATE_PROVIDER en provider-API-sleutels uit omgevingsvariabelen
              gaan voor.
            issues:
              invalid_provider: De geselecteerde wisselkoersprovider wordt niet herkend.
                Het automatisch opvragen van koersen mislukt totdat een ondersteunde
                provider is geselecteerd.
            statuses:
              configured: De geselecteerde wisselkoersprovider is geconfigureerd.
              not_configured: Er is geen bruikbare wisselkoersprovider geconfigureerd.
                Automatische valutaomrekening is mogelijk niet beschikbaar wanneer
                een opgeslagen koers ontbreekt.
            title: Wisselkoersen
          securities:
            guidance: Kies providers en voeg eventueel vereiste API-sleutels toe in
              de zelfhostinginstellingen, of configureer ze in de deploymentomgeving.
              Instellingen uit omgevingsvariabelen gaan voor. Openbare providers hebben
              geen API-sleutel nodig.
            statuses:
              configured: Alle ingeschakelde providers van marktkoersen zijn geconfigureerd.
              disabled: Er is geen provider van marktkoersen ingeschakeld. Automatisch
                zoeken naar effecten en opvragen van koersen zijn niet beschikbaar.
              incomplete: Bij ten minste één ingeschakelde provider van marktkoersen
                ontbreekt configuratie of is de selectie ongeldig. Effecten die aan
                die provider zijn toegewezen, krijgen mogelijk geen koersupdates.
              not_configured: De API-sleutels van de ingeschakelde providers van marktkoersen
                ontbreken. Automatisch zoeken naar effecten en opvragen van koersen
                zijn via deze providers niet beschikbaar.
            title: Marktkoersen
          smtp:
            guidance: SMTP kan niet in de beheerdersinterface worden geconfigureerd.
              Stel de e-mailomgevingsvariabelen in voor zowel de web- als de workerdienst
              en herstart beide. SMTP_USERNAME en SMTP_PASSWORD kunnen allebei worden
              weggelaten voor een relay zonder authenticatie.
            issues:
              address: SMTP_ADDRESS
              app_domain: APP_DOMAIN (gebruikt in e-maillinks)
              authentication: SMTP_USERNAME en SMTP_PASSWORD (geef beide of geen van
                beide op)
              port: SMTP_PORT (een getal van 1 tot 65535)
              sender: EMAIL_SENDER (vervang de standaardafzender sender@sure.local)
            statuses:
              configured: SMTP-instellingen zijn aanwezig.
              disabled: E-mailbezorging is uitgeschakeld in de actieve mailerconfiguratie.
              incomplete: Sommige e-mailinstellingen ontbreken of zijn onvolledig.
                Systeem-e-mails of de links daarin werken mogelijk niet.
              not_checked: Dit proces gebruikt een andere bezorgmethode dan SMTP,
                zoals een voorbeeldweergave in development. SMTP-bezorging wordt niet
                beoordeeld.
              not_configured: SMTP is niet geconfigureerd. Wachtwoordherstel, uitnodigingen
                en andere systeem-e-mails kunnen niet via SMTP worden verstuurd.
            title: E-mail (SMTP)
          storage:
            guidance: Controleer ACTIVE_STORAGE_SERVICE en de deploymentinstellingen
              van de geselecteerde backend. Lokale schijf vereist persistente opslag
              die door de web- en workerdiensten wordt gedeeld. Wisselen van backend
              migreert bestaande bestanden niet; plan een eventuele migratie apart.
            issues:
              bucket: Opslagbucket
              credentials: Toegangssleutel en geheime sleutel voor opslag (geef beide
                op of gebruik externe detectie van inloggegevens)
              endpoint: Opslagendpoint (en CLOUDFLARE_ACCOUNT_ID voor R2)
              region: Opslagregio
              root: Hoofdmap lokale opslag
            statuses:
              configured: Opslaginstellingen zijn aanwezig; lokale schijf heeft geen
                cloudinloggegevens nodig.
              incomplete: Vereiste opslaginstellingen ontbreken of zijn onvolledig.
                Bestandsuploads of het ophalen van bestanden werken mogelijk niet.
              not_checked: Deze backend gebruikt externe detectie van inloggegevens
                of een aangepaste configuratie. De toegang kan niet alleen op basis
                van deze instellingen worden bepaald.
              not_configured: De geselecteerde opslagbackend heeft geen bijbehorende
                configuratie. Bestandsuploads zijn mogelijk niet beschikbaar.
            title: Bestandsuploads en opslag
