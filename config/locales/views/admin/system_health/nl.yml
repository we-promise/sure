          worker:
            title: Workerverificatie
            description: De controles hierboven zijn uitgevoerd vanuit dit webproces. Het meeste AI-werk (antwoorden van de assistent, pdf-verwerking, embeddings, automatische categorisering en handelaarherkenning) draait echter in een Sidekiq-workerproces, dat kan verschillen in netwerktoegang, DNS, proxyregels of zelfs geladen inloggegevens. Plaats een controle in de wachtrij om de eigen configuratie en connectiviteit van een worker te verifiëren.
            verify_button: Workerconfiguratie verifiëren
            coverage_notice: Elke controle verifieert precies één workerproces, namelijk het proces dat de controle uit de wachtrij haalt. Met meer dan één workerreplica bevestigt een geslaagd resultaat niet dat elke worker gezond is; plaats de controle opnieuw in de wachtrij om een andere te testen.
            empty:
              title: Er heeft zich nog geen worker gemeld
              description: Klik op "Workerconfiguratie verifiëren" om een asynchrone controle in de wachtrij te plaatsen. Het resultaat verschijnt hier zodra een workerproces de controle oppakt.
            labels:
              process: Workerproces
              checked_at: Gecontroleerd
              configuration: Configuratie
            configuration_statuses:
              match: Gelijk aan web
              mismatch: Wijkt af van web
            statuses:
              passing: Geslaagd
              failing: Mislukt
              stale: Verouderd
            settings_origin:
              title: Welke instellingen vereisen een herstart?
              database_backed: Instellingen voor provider, model en API-sleutel die in Instellingen → Zelfhosting worden gewijzigd, worden in de database opgeslagen. rails-settings-cached maakt de gedeelde cache bij het schrijven ongeldig, zodat zowel web als worker de nieuwe waarde gebruiken voor het volgende verzoek of de volgende taak in de wachtrij. Een herstart is niet nodig.
              env_backed: De embeddingconfiguratie, en elke waarde die alleen via een omgevingsvariabele is ingesteld, ligt vast zodra een container start. Rails kan de omgeving van een andere container niet wijzigen, dus voor wijzigingen moeten zowel de web- als de workerservice worden herstart of opnieuw aangemaakt. Deploymenttools die maar één ervan herstarten (gedeeltelijke uitrol, een bijgewerkt Secret zonder herstart van de pod) nemen de wijziging niet over.
          local_setup:
            title: Aanbevolen lokale opzet
            description: Laat het LLM draaien via uw lokale OpenAI-compatibele endpoint, sla documentvectoren op in pgvector en laat de embeddinginstellingen verwijzen naar een OpenAI-compatibel endpoint voor embeddings. Het PostgreSQL-image moet de vector-extensie bevatten en de embeddingdimensies moeten overeenkomen met het geselecteerde model.
