      optional_services:
        description: Optionele integraties voor de beheerder van de server. Niet-geconfigureerde
          diensten zijn informatief. Deze controles bekijken alleen instellingen;
          ze testen geen verbinding, versturen geen testgebeurtenissen en wijzigen
          geen toestemming voor analytics. Klap een dienst uit voor configuratiedetails.
        missing_settings: 'Ontbrekende instellingen: %{settings}'
        notes:
          browser_analytics_disabled: Browseranalytics zijn uitgeschakeld voor deze
            omgeving. Dit schakelt de afzonderlijk geconfigureerde serverclient niet
            uit.
          environment_disabled: De geladen integratie is uitgeschakeld voor deze Rails-omgeving.
          explicitly_disabled: SKYLIGHT_ENABLED schakelt instrumentatie expliciet
            uit.
          production_only: Deze integratie wordt volgens de huidige configuratie van
            de applicatie alleen in productie gebruikt.
          self_hosted_checkout_disabled: Afrekenen voor abonnementen en het factureringsportaal
            zijn uitgeschakeld in de zelfgehoste modus. Stripe-webhooks kunnen nog
            steeds worden geconfigureerd; prijs-ID's voor het afrekenen zijn hier
            niet vereist.
          shared_feedback_configured: Feedback voor zelfgehoste installaties heeft
            een apart meegeleverd project en wordt ingeschakeld via de eigen configuratie.
            Hiervoor is geen POSTHOG_KEY van de beheerder nodig. Afmelden in de browser
            en de beschikbaarheid van de SDK worden niet gecontroleerd.
          shared_feedback_disabled: Het aparte feedbackproject voor zelfgehoste installaties
            is uitgeschakeld via de feedback- of omgevingsinstelling. Dit schakelt
            de analytics van de beheerder niet uit.
        services:
          langfuse:
            description: Optionele AI-tracing en rapportage van evaluaties. Deze controle
              verstuurt geen traces of evaluatieverzoeken.
            guidance: Stel LANGFUSE_PUBLIC_KEY en LANGFUSE_SECRET_KEY samen in. LANGFUSE_HOST
              is optioneel. Herstart de betrokken diensten nadat u deze instellingen
              heeft gewijzigd.
            title: Langfuse
          logtail:
            description: Optioneel doorsturen van productielogs. Als dit niet is geconfigureerd,
              blijft de applicatie loggen naar standaarduitvoer.
            guidance: Stel LOGTAIL_API_KEY en LOGTAIL_INGESTING_HOST samen in en herstart
              de betrokken diensten. Deze controle verstuurt geen testlog.
            title: Logtail
          posthog:
            description: Optionele analytics van de beheerder, met de configuratie
              die bij het opstarten is geladen. Geconfigureerd betekent niet dat een
              gebruiker toestemming heeft gegeven voor analytics.
            guidance: Stel POSTHOG_KEY en een niet-lege POSTHOG_HOST in, of laat de
              host leeg om de standaardwaarde te gebruiken. Browseranalytics vereisen
              productie of POSTHOG_DEVELOPMENT_ENABLED in development. POSTHOG_FEEDBACK_ENABLED
              bepaalt de aparte feedback voor zelfgehoste installaties, niet de analytics
              van de beheerder.
            title: PostHog
          sentry:
            description: Optionele rapportage van fouten en prestaties. De huidige
              initializer schakelt rapportage alleen in productie in.
            guidance: Stel SENTRY_DSN in en herstart de betrokken diensten. Dit controleert
              de geladen SDK-configuratie zonder een fout vast te leggen of een gebeurtenis
              te versturen.
            title: Sentry
          skylight:
            description: Optionele prestatie-instrumentatie van de applicatie. Een
              aanwezige configuratie bevestigt niet dat de agent actief is of rapporteert.
            guidance: Stel SKYLIGHT_AUTHENTICATION in en zorg ervoor dat Skylight
              in de bedoelde Rails-omgeving wordt geladen. SKYLIGHT_ENABLED=false
              schakelt instrumentatie uit; de vlag alleen laadt de gem niet. Herstart
              na wijzigingen.
            title: Skylight
          stripe:
            description: Optionele abonnementsfacturering en betalingswebhooks. Deze
              controle maakt geen Stripe-client aan, valideert geen inloggegevens
              en doet geen betalingsverzoeken.
            guidance: Stel STRIPE_SECRET_KEY en STRIPE_WEBHOOK_SECRET samen in. Beheerd
              afrekenen voor abonnementen vereist ook STRIPE_MONTHLY_PRICE_ID en STRIPE_ANNUAL_PRICE_ID.
            title: Stripe
        statuses:
          configured: Geconfigureerd
          disabled: Uitgeschakeld in dit proces
          incomplete: Onvolledige configuratie
          not_checked: Niet geverifieerd
          not_configured: Niet geconfigureerd
