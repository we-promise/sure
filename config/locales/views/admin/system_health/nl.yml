        ai:
          run_checks: Controles opnieuw uitvoeren
          last_checked: Livecontroles %{time_ago} geleden voltooid. Resultaten worden kort in de cache bewaard.
          not_checked_help: Open de AI-status-URL rechtstreeks of voer de controles uit om te verifiëren dat de services actief zijn.
          alerts:
            custom_openai:
              title: De controle van de gehoste vectoropslag is mislukt op dit aangepaste endpoint
              message: Het geconfigureerde endpoint heeft de livenesscontrole van /v1/vector_stores niet doorstaan. De meeste lokale en OpenAI-compatibele endpoints implementeren die API niet. Chat en pdf-verwerking kunnen nog steeds werken; gebruik voor de gebruikelijke lokale opzet pgvector met een apart endpoint voor embeddings. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            function_calling_unsupported:
              title: Het model ondersteunt geen function calling
              message: Het endpoint verwerkte een gewoon chatverzoek, maar weigerde hetzelfde verzoek met de parameter tools. De AI-assistent leest accounts, transacties en posities via function calls, dus de chat blijft mislukken (vaak met een nietszeggende 404) totdat het model tools ondersteunt. Kies een model waarvan de provider ondersteuning voor function calling documenteert. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            function_calling_not_used:
              title: Het model antwoordde zonder de gevraagde tool aan te roepen
              message: Het endpoint accepteerde de parameter tools, maar het model antwoordde met tekst in plaats van de health-check-tool aan te roepen. Zonder tool calls kan de AI-assistent geen financiële gegevens lezen, dus de chat kan leeg antwoorden of verzonnen cijfers geven. Kies bij voorkeur een model waarvan de provider ondersteuning voor function calling documenteert.
            llm_probe_failed:
              title: De livecontrole van het LLM is mislukt
              message: Sure kon het geconfigureerde endpoint en model niet allebei verifiëren. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            llm_model_not_available:
              title: Het geconfigureerde AI-model is niet beschikbaar
              message: Het endpoint antwoordde, maar vermeldde of leverde het geconfigureerde model niet. Kies een actief model voor de geselecteerde provider en voer de controles opnieuw uit. Gebruik voor Gemini via een OpenAI-compatibele vertaallaag een momenteel ondersteund model, zoals gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: De synthetische controle van pdf-tekstextractie is mislukt
              message: Sure kon de tekst-eerst-route niet voltooien, waarbij ingesloten pdf-tekst lokaal wordt geëxtraheerd en naar het geconfigureerde model wordt gestuurd. Er zijn geen klantgegevens verzonden. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            pdf_vision_processing_failed:
              title: De synthetische pdf-controle (vision/native) is mislukt
              message: Sure kon de pdf-route via afbeeldingen of native documenten niet voltooien met het geconfigureerde model. Er zijn geen klantgegevens verzonden. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            vector_probe_failed:
              title: De livecontrole van het zoeken in documenten is mislukt
              message: Sure kon de geselecteerde vectoropslag en alle vereiste embeddingservices niet verifiëren. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            pgvector_extension_not_enabled:
              title: De vector-extensie van PostgreSQL is niet ingeschakeld
              message: De pgvector-adapter is geselecteerd, maar PostgreSQL heeft de vector-extensie niet ingeschakeld voor deze database. Gebruik een PostgreSQL-image met pgvector, schakel de extensie in als database-eigenaar of superuser en voer de migraties opnieuw uit met VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: De tabel vector_store_chunks ontbreekt
              message: De pgvector-extensie is ingeschakeld, maar de chunks-tabel is niet gevonden. Controleer de migratiestatus en voer de vectoropslagmigratie opnieuw uit met VECTOR_STORE_PROVIDER=pgvector, zodat Sure vector_store_chunks kan aanmaken.
            pgvector_probe_failed:
              title: De pgvector-opslagcontrole is mislukt
              message: Sure kon de pgvector-chunks-tabel niet bevragen. Controleer de PostgreSQL-rechten, de vector-extensie en de migratie van vector_store_chunks. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            embedding_dimensions_mismatch:
              title: De embeddingdimensies komen niet overeen
              message: Het embedding-endpoint gaf een vector terug waarvan de lengte niet overeenkomt met EMBEDDING_DIMENSIONS. Stel EMBEDDING_MODEL en EMBEDDING_DIMENSIONS in op de gedocumenteerde vectorgrootte van het model, herstart Sure zodat de omgeving behouden blijft, en pas daarna de pgvector-embeddingkolom/-tabel aan of maak deze opnieuw aan. Maak de embeddings van documenten opnieuw aan als bestaande gegevens een andere grootte gebruikten.
            embedding_probe_timeout:
              title: Er is een time-out opgetreden bij de livecontrole van embeddings
              message: Het embedding-endpoint antwoordde niet binnen AI_HEALTH_PROBE_TIMEOUT. Verhoog die time-out voor de health check als de provider traag is en herstart Sure zodat de omgeving in elk proces behouden blijft. Als ook gewone AI-chataanroepen een time-out geven, verhoog dan apart OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: De livecontrole van embeddings is mislukt
              message: Sure kon via het geconfigureerde endpoint en model geen korte test-embedding aanmaken. Controleer EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN en de logs van de embeddingprovider. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger.
            qdrant:
              title: Ondersteuning voor Qdrant is nog niet geïmplementeerd
              message: De Qdrant-adapter is alleen als basisopzet aanwezig; uploaden en zoeken van documenten mislukt op dit moment. Selecteer OpenAI of pgvector voor het zoeken in documenten.
            missing_vector_store:
              title: Er is geen vectoropslag geconfigureerd
              message: Geüploade documenten kunnen niet worden geïndexeerd of doorzocht totdat een vectoropslagadapter en de bijbehorende vereisten zijn geconfigureerd.
            unavailable_vector_store:
              title: De geselecteerde vectoropslag is niet beschikbaar
              message: Controleer hieronder de vereisten van de adapter. Voor pgvector moet de database de vector-extensie of een bestaande tabel vector_store_chunks bieden.
          llm:
            title: LLM en pdf-verwerking
            description: De livecontroles verifiëren het geconfigureerde model, laten het één eenvoudige function call uitvoeren zoals de assistent dat doet, en testen daarna apart tekstextractie en vision/native-verwerking met een synthetische pdf van één pagina zonder klantgegevens. Waarden van inloggegevens worden nooit getoond.
          vector_store:
            title: Vectoropslag en zoeken in documenten
            description: De livecontrole bevraagt de API van de gehoste vectoropslag, of test de pgvector-tabel en maakt één korte embedding aan zonder die op te slaan.
