            custom_openai:
              title: "De controle van de gehoste vectorstore is mislukt op dit aangepaste endpoint"
              message: "Het geconfigureerde endpoint heeft de liveness-controle van /v1/vector_stores niet doorstaan. De meeste lokale en OpenAI-compatibele endpoints implementeren die API niet. Chat en PDF-verwerking werken mogelijk nog wel; gebruik pgvector met een apart embeddings-endpoint voor de gebruikelijke lokale opzet. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            function_calling_unsupported:
              title: "Het model ondersteunt geen function calling"
              message: "Het endpoint verwerkte een gewoon chatverzoek, maar weigerde hetzelfde verzoek met de parameter tools. De AI-assistent leest accounts, transacties en posities via function calls, dus de chat blijft mislukken — vaak met een weinig behulpzame 404 — totdat u een model gebruikt dat tools ondersteunt. Kies een model waarvan de provider ondersteuning voor function calling documenteert. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            function_calling_not_used:
              title: "Het model antwoordde zonder de gevraagde tool aan te roepen"
              message: "Het endpoint accepteerde de parameter tools, maar het model antwoordde met tekst in plaats van de health-check-tool aan te roepen. De AI-assistent kan zonder tool calls geen financiële gegevens lezen, dus de chat antwoordt mogelijk met niets of met verzonnen cijfers. Kies bij voorkeur een model waarvan de provider ondersteuning voor function calling documenteert."
            llm_probe_failed:
              title: "De live controle van het LLM is mislukt"
              message: "Sure kon het geconfigureerde endpoint en model niet allebei verifiëren. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            llm_model_not_available:
              title: "Het geconfigureerde AI-model is niet beschikbaar"
              message: "Het endpoint antwoordde, maar vermeldde of leverde het geconfigureerde model niet. Kies een actief model voor de geselecteerde provider en voer de controles opnieuw uit. Gebruik voor Gemini via een OpenAI-compatibele vertaallaag een momenteel ondersteund model, zoals gemini-3.8-flash."
            pdf_text_extraction_failed:
              title: "De synthetische controle van PDF-tekstextractie is mislukt"
              message: "Sure kon het tekstgerichte pad niet voltooien, dat ingesloten PDF-tekst lokaal extraheert en naar het geconfigureerde model stuurt. Er zijn geen klantgegevens verstuurd. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            pdf_vision_processing_failed:
              title: "De synthetische PDF-controle voor vision/native is mislukt"
              message: "Sure kon het PDF-pad voor afbeeldingen of native documenten niet voltooien via het geconfigureerde model. Er zijn geen klantgegevens verstuurd. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            vector_probe_failed:
              title: "De live controle van zoeken in documenten is mislukt"
              message: "Sure kon de geselecteerde vectorstore en alle vereiste embeddingdiensten niet verifiëren. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            pgvector_extension_not_enabled:
              title: "De PostgreSQL-extensie vector is niet ingeschakeld"
              message: "De pgvector-adapter is geselecteerd, maar PostgreSQL heeft de extensie vector niet ingeschakeld voor deze database. Gebruik een PostgreSQL-image met pgvector, schakel de extensie in als database-eigenaar of superuser en voer de migraties opnieuw uit met VECTOR_STORE_PROVIDER=pgvector."
            pgvector_table_not_found:
              title: "De tabel vector_store_chunks ontbreekt"
              message: "De pgvector-extensie is ingeschakeld, maar de chunks-tabel is niet gevonden. Controleer de migratiestatus en voer de vectorstore-migratie opnieuw uit met VECTOR_STORE_PROVIDER=pgvector, zodat Sure vector_store_chunks kan aanmaken."
            pgvector_probe_failed:
              title: "De opslagcontrole van pgvector is mislukt"
              message: "Sure kon de chunks-tabel van pgvector niet bevragen. Controleer de PostgreSQL-rechten, de extensie vector en de migratie van vector_store_chunks. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            embedding_dimensions_mismatch:
              title: "De embeddingdimensies komen niet overeen"
              message: "Het embedding-endpoint gaf een vector terug waarvan de lengte niet overeenkomt met EMBEDDING_DIMENSIONS. Stel EMBEDDING_MODEL en EMBEDDING_DIMENSIONS in op de gedocumenteerde vectorgrootte van het model, herstart Sure zodat de omgeving behouden blijft, en wijzig of maak vervolgens de pgvector-embeddingkolom/-tabel opnieuw aan en maak opnieuw embeddings van documenten als bestaande gegevens een andere grootte gebruikten."
            embedding_probe_timeout:
              title: "Er is een time-out opgetreden bij de live controle van embeddings"
              message: "Het embedding-endpoint antwoordde niet binnen AI_HEALTH_PROBE_TIMEOUT. Verhoog die time-out voor de health-check als de provider traag is en herstart Sure zodat de omgeving in elk proces behouden blijft. Als gewone AI-chataanroepen ook een time-out krijgen, verhoog dan apart OPENAI_REQUEST_TIMEOUT."
            embedding_probe_failed:
              title: "De live controle van embeddings is mislukt"
              message: "Sure kon geen korte testembedding maken via het geconfigureerde endpoint en model. Controleer EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN en de logs van de embeddingprovider. De fout is vastgelegd in Instellingen → Debuglogs en Rails.logger."
            qdrant:
              title: "Ondersteuning voor Qdrant is nog niet geïmplementeerd"
              message: "De Qdrant-adapter is opgezet, maar uploaden van en zoeken in documenten mislukken momenteel. Selecteer OpenAI of pgvector voor zoeken in documenten."
            missing_vector_store:
              title: "Er is geen vectorstore geconfigureerd"
              message: "Geüploade documenten kunnen niet worden geïndexeerd of doorzocht totdat een vectorstore-adapter en de bijbehorende vereisten zijn geconfigureerd."
            unavailable_vector_store:
              title: "De geselecteerde vectorstore is niet beschikbaar"
              message: "Controleer de adaptervereisten hieronder. Voor pgvector moet de database de extensie vector of een bestaande tabel vector_store_chunks bieden."
