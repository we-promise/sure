              passing: "Geslaagd"
              failing: "Mislukt"
              stale: "Verouderd"
            settings_origin:
              title: "Welke instellingen vereisen een herstart?"
              database_backed: "Instellingen voor provider, model en API-sleutel die in Instellingen → Zelfhosting worden gewijzigd, worden in de database opgeslagen. rails-settings-cached maakt de gedeelde cache bij het schrijven ongeldig, zodat zowel web als worker de nieuwe waarde gebruiken voor het volgende verzoek of de volgende job in de wachtrij -- een herstart is niet nodig."
              env_backed: "De embeddingconfiguratie, en elke waarde die alleen via een omgevingsvariabele is ingesteld, ligt vast wanneer elke container start. Rails kan de omgeving van een andere container niet wijzigen, dus voor het wijzigen hiervan moeten zowel de web- als de workerdienst opnieuw worden gestart of aangemaakt -- en deploymenttooling die maar één van beide herstart (gedeeltelijke uitrol, een bijgewerkt Secret zonder herstart van de pod) neemt de wijziging niet over."
          local_setup:
            title: "Aanbevolen lokale opzet"
            description: "Laat het LLM draaien via uw lokale OpenAI-compatibele endpoint, sla documentvectoren op in pgvector en laat de embeddinginstellingen verwijzen naar een OpenAI-compatibel embeddings-endpoint. De PostgreSQL-image moet de extensie vector bevatten, en de embeddingdimensies moeten overeenkomen met het geselecteerde model."
