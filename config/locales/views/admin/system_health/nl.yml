          worker:
            statuses:
              stale: Verouderd
              failing: Niet in orde
              passing: In orde
            configuration_statuses:
              match: Komt overeen met webproces
              mismatch: Verschilt van webproces
            coverage_notice: 'Elke controle verifieert precies één workerproces: het proces dat de taak uit de wachtrij haalt. Bij meerdere workerreplica''s bevestigt een geslaagd resultaat niet dat alle workers goed werken. Plaats de controle opnieuw in de wachtrij om een ander proces te bemonsteren.'
            description: De bovenstaande controles zijn vanuit dit webproces uitgevoerd. Het meeste AI-werk, zoals assistentantwoorden, PDF-verwerking, embeddings, automatische categorisatie en handelaarsherkenning, draait in een Sidekiq-workerproces. Dat kan afwijken in netwerktoegang, DNS, proxyregels of zelfs geladen toegangsgegevens. Plaats een controle in de wachtrij om de eigen configuratie en verbindingen van een worker te verifiëren.
            empty:
              description: Klik op ‘Workerconfiguratie verifiëren’ om een asynchrone controle in de wachtrij te plaatsen. Het resultaat verschijnt hier zodra een workerproces de taak oppakt.
              title: Nog geen worker heeft zich gemeld
            labels:
              checked_at: Gecontroleerd
              configuration: Configuratie
              process: Workerproces
            settings_origin:
              database_backed: Aanbieder-, model- en API-sleutelinstellingen die via Instellingen → Zelf hosten worden gewijzigd, worden in de database opgeslagen. rails-settings-cached maakt de gedeelde cache ongeldig bij het schrijven. Daardoor gebruiken zowel web als worker de nieuwe waarde bij het volgende verzoek of de volgende taak; opnieuw starten is niet nodig.
              env_backed: Embeddingconfiguratie en alle waarden die uitsluitend via omgevingsvariabelen zijn ingesteld, staan vast bij het starten van elke container. Rails kan de omgeving van een andere container niet wijzigen. Aanpassingen vereisen daarom het opnieuw starten of aanmaken van zowel web- als workerservices. Implementatietools die maar één ervan herstarten, zoals een gedeeltelijke uitrol of een bijgewerkt Secret zonder podherstart, nemen de wijziging niet over.
              title: Welke instellingen vereisen een herstart?
            title: Workercontrole
            verify_button: Workerconfiguratie verifiëren
          adapters:
            openai: Door OpenAI gehoste vectoropslag
            pgvector: pgvector
            qdrant: Qdrant
          alerts:
            custom_openai:
              message: Het ingestelde eindpunt is niet geslaagd voor de bereikbaarheidscontrole van /v1/vector_stores. De meeste lokale en OpenAI-compatibele eindpunten implementeren die API niet. Chat en PDF-verwerking kunnen nog wel werken; gebruik voor een gebruikelijke lokale opzet pgvector met een apart embedding-eindpunt. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De controle van gehoste vectoropslag is mislukt bij dit aangepaste eindpunt
            embedding_dimensions_mismatch:
              message: Het embedding-eindpunt leverde een vector waarvan de lengte niet overeenkomt met EMBEDDING_DIMENSIONS. Stel EMBEDDING_MODEL en EMBEDDING_DIMENSIONS in volgens de gedocumenteerde vectorgrootte van het model en start Sure opnieuw zodat de omgeving wordt toegepast. Pas daarna de pgvector-embeddingkolom of -tabel aan of maak deze opnieuw aan, en genereer embeddings opnieuw als bestaande gegevens een andere grootte gebruiken.
              title: De embeddingdimensies komen niet overeen
            embedding_probe_failed:
              message: Sure kon via het ingestelde eindpunt en model geen korte testembedding maken. Controleer EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN en de logboeken van de embedding-aanbieder. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De livecontrole van embeddings is mislukt
            embedding_probe_timeout:
              message: Het embedding-eindpunt antwoordde niet binnen AI_HEALTH_PROBE_TIMEOUT. Verhoog deze controletime-out als de aanbieder traag is en start Sure opnieuw zodat de omgeving in elk proces wordt toegepast. Als gewone AI-chatverzoeken ook verlopen, verhoog dan OPENAI_REQUEST_TIMEOUT afzonderlijk.
              title: De livecontrole van embeddings heeft de tijdslimiet overschreden
            function_calling_not_used:
              message: Het eindpunt accepteerde de parameter tools, maar het model antwoordde met tekst in plaats van de controletool aan te roepen. De AI-assistent kan zonder toolaanroepen geen financiële gegevens lezen, waardoor de chat mogelijk niets of verzonnen cijfers teruggeeft. Kies bij voorkeur een model waarvan de aanbieder ondersteuning voor functieaanroepen documenteert.
              title: Het model antwoordde zonder de gevraagde tool aan te roepen
            function_calling_unsupported:
              message: Het eindpunt verwerkte een gewoon chatverzoek, maar weigerde hetzelfde verzoek met de parameter tools. De AI-assistent leest rekeningen, transacties en posities via functieaanroepen. De chat blijft daarom mislukken, vaak met een onduidelijke 404, totdat een model met toolondersteuning wordt gekozen. Kies een model waarvan de aanbieder functieaanroepen ondersteunt. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: Het model ondersteunt geen functieaanroepen
            llm_model_not_available:
              message: Het eindpunt antwoordde, maar bood het ingestelde model niet aan of kon het niet uitvoeren. Kies een actief model voor de geselecteerde aanbieder en voer de controles opnieuw uit. Gebruik voor Gemini via een OpenAI-compatibele vertaallaag een momenteel ondersteund model, zoals gemini-2.5-flash.
              title: Het ingestelde AI-model is niet beschikbaar
            llm_probe_failed:
              message: Sure kon het ingestelde eindpunt en model niet beide verifiëren. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De livecontrole van het LLM is mislukt
            missing_vector_store:
              message: Geüploade documenten kunnen pas worden geïndexeerd of doorzocht wanneer een vectoropslagadapter en de benodigde voorzieningen zijn ingesteld.
              title: Geen vectoropslag ingesteld
            pdf_text_extraction_failed:
              message: Sure kon het traject niet voltooien dat ingebedde PDF-tekst lokaal extraheert en naar het ingestelde model stuurt. Er zijn geen klantgegevens verstuurd. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De test van PDF-tekstextractie met kunstmatige gegevens is mislukt
            pdf_vision_processing_failed:
              message: Sure kon de PDF-verwerking via afbeeldingen of native documenten niet voltooien met het ingestelde model. Er zijn geen klantgegevens verstuurd. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De PDF-test voor beeld/native verwerking met kunstmatige gegevens is mislukt
            pgvector_extension_not_enabled:
              message: De pgvector-adapter is geselecteerd, maar de vector-extensie is in PostgreSQL niet ingeschakeld voor deze database. Gebruik een PostgreSQL-image met pgvector, schakel de extensie in als database-eigenaar of supergebruiker en voer de migraties opnieuw uit met VECTOR_STORE_PROVIDER=pgvector.
              title: De PostgreSQL-vector-extensie is niet ingeschakeld
            pgvector_probe_failed:
              message: Sure kon de pgvector-tabel met tekstfragmenten niet raadplegen. Controleer de PostgreSQL-rechten, de vector-extensie en de migratie vector_store_chunks. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De pgvector-opslagcontrole is mislukt
            pgvector_table_not_found:
              message: De pgvector-extensie is ingeschakeld, maar de tabel met tekstfragmenten is niet gevonden. Controleer de migratiestatus en voer de vectoropslagmigratie opnieuw uit met VECTOR_STORE_PROVIDER=pgvector, zodat Sure vector_store_chunks kan aanmaken.
              title: De tabel vector_store_chunks ontbreekt
            qdrant:
              message: De basis van de Qdrant-adapter is aanwezig, maar documenten uploaden en doorzoeken werkt nog niet. Kies OpenAI of pgvector voor documentzoekopdrachten.
              title: Qdrant-ondersteuning is nog niet geïmplementeerd
            unavailable_vector_store:
              message: Controleer hieronder de adaptervereisten. Voor pgvector moet de database de vector-extensie of een bestaande tabel vector_store_chunks bieden.
              title: De geselecteerde vectoropslag is niet beschikbaar
            vector_probe_failed:
              message: Sure kon de geselecteerde vectoropslag en alle benodigde embeddingdiensten niet verifiëren. De fout is vastgelegd in Instellingen → Foutopsporingslogboeken en Rails.logger.
              title: De livecontrole van documentzoeken is mislukt
