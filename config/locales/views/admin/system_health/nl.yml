          worker:
            title: "Workerverificatie"
            description: "De controles hierboven zijn uitgevoerd vanuit dit webproces. Het meeste AI-werk -- antwoorden van de assistent, PDF-verwerking, embeddings, automatisch categoriseren en het herkennen van handelaren -- draait in werkelijkheid in een Sidekiq-workerproces, dat kan verschillen in netwerktoegang, DNS, proxyregels of zelfs geladen inloggegevens. Plaats een controle in de wachtrij om de eigen configuratie en connectiviteit van een worker te verifiëren."
            verify_button: "Workerconfiguratie verifiëren"
            coverage_notice: "Elke controle verifieert precies één workerproces -- het proces dat de controle uit de wachtrij haalt. Met meer dan één workerreplica bevestigt een geslaagd resultaat niet dat elke worker gezond is; plaats de controle opnieuw in de wachtrij om een andere te testen."
            empty:
              title: "Er heeft zich nog geen worker gemeld"
              description: "Klik op \"Workerconfiguratie verifiëren\" om een asynchrone controle in de wachtrij te plaatsen. Het resultaat verschijnt hier zodra een workerproces de controle oppakt."
