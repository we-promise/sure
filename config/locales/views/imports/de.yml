        one: An 1 Tag hat ein Konto, in das du importierst, bereits einen Kontostand, der von Monarch abweicht. Dein vorhandener Wert bleibt erhalten.
        other: "An %{count} Tagen haben Konten, in die du importierst, bereits Kontostände, die von Monarch abweichen. Deine vorhandenen Werte bleiben erhalten."
      monarch_overlap_title: Vorhandene Transaktionen im selben Zeitraum
      monarch_overlap_description:
        one: 1 vorhandene Transaktion liegt im Monarch-Zeitraum eines Kontos, in das du importierst, und passt zu keiner Monarch-Transaktion. Sie bleibt erhalten und zählt zum Kontostand.
        other: "%{count} vorhandene Transaktionen liegen im Monarch-Zeitraum von Konten, in die du importierst, und passen zu keiner Monarch-Transaktion. Sie bleiben erhalten und zählen zum Kontostand."
      monarch_duplicates_title: Transaktionen, die schon in Sure sind, werden übersprungen
      monarch_duplicates_description:
        one: 1 Monarch-Transaktion ist bereits im Zielkonto – aus einem früheren Import oder mit gleichem Datum und Betrag – und wird daher übersprungen.
        other: "%{count} Monarch-Transaktionen sind bereits in ihren Zielkonten – aus einem früheren Import oder mit gleichem Datum und Betrag – und werden daher übersprungen."
      monarch_kept_title: Einige Anfangssalden sind so geblieben, wie du sie geändert hast
      monarch_kept_description: "Beim Rückgängigmachen des Imports wurde der Anfangssaldo von %{names} nicht wiederhergestellt, weil er nach dem Import geändert wurde. Prüf ihn, bevor du erneut importierst."
      monarch_opening_title: Anfangssalden werden verschoben
      monarch_opening_description:
        one: Der Anfangssaldo von 1 vorhandenen Konto rückt an den Beginn seines Monarch-Verlaufs. Wenn du den Import rückgängig machst, wird er zurückgesetzt.
        other: "Die Anfangssalden von %{count} vorhandenen Konten rücken an den Beginn ihres Monarch-Verlaufs. Wenn du den Import rückgängig machst, werden sie zurückgesetzt."
      title: Importdaten bestätigen
      summary_item_label: Eintrag
      summary_count_label: Anzahl
      empty_summary: In dieser Datei wurden keine importierbaren Datensätze gefunden. Sie ist möglicherweise leer, oder die Zeilen entsprechen nicht dem erwarteten Exportformat (jede Zeile sollte ein JSON-Objekt mit den Schlüsseln „type“ und „data“ und unterstützten Typen sein).
      publish_import: Import veröffentlichen
      back_to_imports: Zurück zu Importen
      missing_merchant_warning_title: In diesem Export fehlen einige Händler
      missing_merchant_warning_description:
        one: 1 Händlerverweis in dieser Datei zeigt auf einen Händler, der nicht enthalten ist. Das kann bei Exporten passieren, die erstellt wurden, bevor vom Anbieter zugewiesene Händler in Sure-Exporte aufgenommen wurden. Du kannst diesen Import trotzdem übernehmen – der betroffene Eintrag wird dann ohne Händler importiert, und du kannst ihn nachträglich zuordnen.
        other: "%{count} Händlerverweise in dieser Datei zeigen auf Händler, die nicht enthalten sind. Das kann bei Exporten passieren, die erstellt wurden, bevor vom Anbieter zugewiesene Händler in Sure-Exporte aufgenommen wurden. Du kannst diesen Import trotzdem übernehmen – die betroffenen Einträge werden dann ohne Händler importiert, und du kannst sie nachträglich zuordnen."
      skipped_recurring_description:
        one: 1 wiederkehrende Transaktion hat keinen Namen und ihr Händler fehlt, daher wird sie übersprungen. Automatisch erkannte wiederkehrende Transaktionen werden nach dem Import neu aufgebaut.
        other: "%{count} wiederkehrende Transaktionen haben keinen Namen und ihre Händler fehlen, daher werden sie übersprungen. Automatisch erkannte wiederkehrende Transaktionen werden nach dem Import neu aufgebaut."
      reused_taxonomy_notice_title: Einige Kategorien, Tags oder Händler gibt es schon
      reused_taxonomy_notice_description:
        one: 1 Kategorie, Tag oder Händler aus dieser Datei gibt es in deinem Konto bereits (zum Beispiel aus den Standardkategorien der Einrichtung). Der Eintrag wird wiederverwendet und mit den Daten aus dieser Datei aktualisiert, statt ein Duplikat anzulegen.
        other: "%{count} Kategorien, Tags oder Händler aus dieser Datei gibt es in deinem Konto bereits (zum Beispiel aus den Standardkategorien der Einrichtung). Sie werden wiederverwendet und mit den Daten aus dieser Datei aktualisiert, statt Duplikate anzulegen."
      provider_merchant_diff_title: Einige Händler gibt es schon mit anderen Angaben
      provider_merchant_diff_description:
        one: 1 Händler aus dieser Datei gibt es bereits mit anderen Angaben. Der vorhandene Händler bleibt erhalten, die Werte aus dieser Datei werden nicht übernommen.
        other: "%{count} Händler aus dieser Datei gibt es bereits mit anderen Angaben. Die vorhandenen Händler bleiben erhalten, die Werte aus dieser Datei werden nicht übernommen."
