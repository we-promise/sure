    new:
      title: Conectar SimpleFin
      setup_token: Token de configuração
      setup_token_placeholder: cole seu token de configuração do SimpleFin
      connect: Conectar
      cancel: Cancelar
    create:
      success: >-
        Conexão com SimpleFin adicionada com sucesso! Suas contas aparecerão em breve
        enquanto sincronizam em segundo plano.
      errors:
        blank_token: Por favor, insira um token de configuração do SimpleFin.
        invalid_token: >-
          Token de configuração inválido. Verifique se você copiou o token completo
          do SimpleFin Bridge.
        token_compromised: >-
          O token de configuração pode estar comprometido, expirado ou já ter sido
          usado. Por favor, crie um novo.
        create_failed: 'Falha ao conectar: %{message}'
        unexpected: Ocorreu um erro inesperado. Tente novamente ou contate o suporte.
    destroy:
      success: A conexão com SimpleFin será removida
    update:
      success: >-
        Conexão com SimpleFin atualizada com sucesso! Suas contas estão sendo reconectadas.
      errors:
        blank_token: Por favor, insira um token de configuração do SimpleFin.
        invalid_token: >-
          Token de configuração inválido. Verifique se você copiou o token completo
