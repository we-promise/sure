      no_accounts_title: Nenhuma conta encontrada
      provider_name: Plaid
      requires_update: Reconectar
      status: Última sincronização há %{timestamp}
      status_never: Requer sincronização de dados
      syncing: Sincronizando...
      update: Atualizar
