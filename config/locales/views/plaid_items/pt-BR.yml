      title: "Vincular %{account_name} ao Plaid"
      description: Selecione uma conta do Plaid para vincular à sua conta existente
      cancel: Cancelar
      link_account: Vincular conta
    link_existing_account:
      invalid_account: Conta do Plaid selecionada inválida
      already_linked: Esta conta do Plaid já está vinculada
      success: Conta vinculada ao Plaid com sucesso
