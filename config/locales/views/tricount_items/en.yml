      step_1: In Tricount, open the tricount and tap Share, then copy its link.
      step_2: Paste the link below (one per line to add several) and save.
      step_3: Once it syncs, choose which member you are on the Accounts page.
      how_it_works: Each tricount becomes a cash account whose balance is what the group owes you (negative when you owe the group). Your share of each expense is your spending; what you paid shows as a
        transfer, so Sure can pair it with the card payment in your bank account.
      unofficial_api: "Tricount has no public API: Sure reads tricounts the way the Tricount app does, and only reads. Anyone with a tricount's link can view and edit it, so Sure stores links encrypted."
