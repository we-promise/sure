        dashboard_two_column_description: Display dashboard widgets in two columns on large screens, with per-widget width and height controls in each widget's header. When off, widgets stack in a single column.
        dashboard_account_groups_title: Start expanded by default
        dashboard_account_groups_description: These account sections will start expanded on the dashboard and in the account sidebar. You can still collapse them manually at any time.
        split_grouped_title: Group split transactions
        split_grouped_description: Show split transactions grouped under their parent in the transaction list. When off, split children appear as individual rows.
        auto_generate_transaction_names_title: Auto-generate transaction names
        auto_generate_transaction_names_description: When a manually entered transaction's name is left blank, fill it in from the selected category and merchant (e.g. "Entertainment - Netflix"). A name is still required if neither is selected. Applies to the whole family, and only affects new transactions.
        account_lists_title: Account lists
        account_lists_subtitle: Choose how accounts are grouped in the sidebar and on the dashboard
