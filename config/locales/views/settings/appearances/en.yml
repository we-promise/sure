        account_grouping_primary_dashboard_label: First level on the dashboard
        account_grouping_sidebar_label: Second level in the sidebar
        account_grouping_dashboard_label: Second level on the dashboard
        account_grouping_none: None
        custom_account_group_label_label: Name of the custom group field
        account_lists_hint: Assets and debts always stay apart. Within them, accounts are grouped by the first field and, optionally, split again by the second; totals add up across account types. Accounts without a value are listed under "Not set". The custom group is a free-text field in the account details.
