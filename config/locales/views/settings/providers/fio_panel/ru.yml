ru:
  settings:
    providers:
      taglines:
        fio: Синхронизируйте счёт Fio banka с помощью API-токена только для чтения.
      fio_panel:
        step_1_html: Войдите в интернет-банк %{link} и откройте Настройки → API.
        step_2: Создайте токен с доступом только для чтения («Sledování účtu»). Для этого требуется строгая авторизация; токен действует до 180 дней.
        step_3: Вставьте токен ниже и сохраните. Один токен даёт доступ к одному счёту, поэтому добавьте отдельное подключение для каждого счёта Fio.
