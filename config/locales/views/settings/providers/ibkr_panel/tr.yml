        steps:
          step_1: IBKR Client Portal'ınızda "Performance & Reports" > "Flex Queries"
            bölümüne gidin.
          step_2: Yeni bir sorgu oluşturmak için "Activity Flex Query" bölümündeki
            "+" simgesine tıklayın.
          step_3: Sorgunuza bir ad verin (ör. "Sure Sync"), ardından aşağıdaki Flex
            Query ayrıntılarını inceleyin ve listelenen bölümleri, alanları ve yapılandırma
            seçeneklerini etkinleştirin.
          step_4: Sorguyu kaydedin, "Query ID"nizi not edin, ardından bir erişim Token'ı
            oluşturmak için "Flex Web Service Configuration" bölümündeki dişli simgesini
            kullanın.
          step_5: Sorgu ID'nizi ve Token'ınızı aşağıya yapıştırın, yapılandırmayı
            kaydedin, ardından keşfedilen IBKR hesaplarını bağlamak için Hesaplar'a
            gidin.
