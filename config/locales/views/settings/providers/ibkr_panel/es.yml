---
es:
  settings:
    providers:
      taglines:
        ibkr: Sincroniza cuentas de inversión de Interactive Brokers mediante importaciones de Flex Query.
      ibkr_panel:
        steps:
          step_1: En tu Client Portal de IBKR, ve a "Performance & Reports" > "Flex Queries".
          step_2: Haz clic en el icono "+" de la sección "Activity Flex Query" para crear una nueva consulta.
          step_3: Ponle un nombre a tu consulta (p. ej. "Sure Sync"), luego revisa los detalles de la Flex Query más abajo y activa las secciones, campos y opciones de configuración indicados.
          step_4: Guarda la consulta, anota tu "Query ID" y usa el icono del engranaje en la sección "Flex Web Service Configuration" para generar un token de acceso.
          step_5: Pega tu Query ID y tu token abajo, guarda la configuración y luego ve a Cuentas para vincular las cuentas de IBKR detectadas.
