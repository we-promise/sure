        steps:
          step_1: В вашем клиентском портале IBKR перейдите в "Performance & Reports"
            > "Flex Queries".
          step_2: Нажмите на значок "+" в разделе "Activity Flex Query", чтобы создать
            новый запрос.
          step_3: Назовите ваш запрос (например, "Sure Sync"), затем просмотрите детали
            Flex Query ниже и включите перечисленные разделы, поля и параметры конфигурации.
          step_4: Сохраните запрос, запомните ваш "Query ID", затем используйте значок
            шестерёнки в разделе "Flex Web Service Configuration", чтобы сгенерировать
            токен доступа.
          step_5: Вставьте ваш Query ID и токен ниже, сохраните конфигурацию, затем
            перейдите в Счета, чтобы связать обнаруженные счета IBKR.
