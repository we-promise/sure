        ibkr: "Synchroniseer Interactive Brokers-beleggingsaccounts via Flex Query-imports."
      ibkr_panel:
        steps:
          step_1: "Ga in uw IBKR Client Portal naar \"Performance & Reports\" > \"Flex Queries\"."
          step_2: "Klik op het \"+\"-pictogram in het onderdeel \"Activity Flex Query\" om een nieuwe query aan te maken."
          step_3: "Geef uw query een naam (bijv. \"Sure Sync\"), bekijk hieronder de Flex Query-details en schakel de vermelde secties, velden en configuratieopties in."
          step_4: "Sla de query op, noteer uw \"Query ID\" en gebruik daarna het tandwielpictogram in het onderdeel \"Flex Web Service Configuration\" om een toegangstoken (Token) te genereren."
          step_5: "Plak hieronder uw Query ID en Token, sla de configuratie op en ga daarna naar Accounts om gevonden IBKR-accounts te koppelen."
