        steps:
          step_1: Öffne im IBKR Client Portal „Performance & Reports“ > „Flex Queries“.
          step_2: Klick im Bereich „Activity Flex Query“ auf das Plus-Symbol, um eine neue Abfrage anzulegen.
          step_3: Gib deiner Abfrage einen Namen (etwa „Sure Sync“), sieh dir dann unten die Details zur Flex Query an und aktivier die aufgeführten Abschnitte, Felder und Optionen.
          step_4: Speichere die Abfrage, notier dir die „Query ID“ und erzeug über das Zahnrad im Bereich „Flex Web Service Configuration“ einen Zugriffstoken.
          step_5: Füg Query ID und Token unten ein, speichere die Konfiguration und geh dann zu den Konten, um die gefundenen IBKR-Konten zu verknüpfen.
