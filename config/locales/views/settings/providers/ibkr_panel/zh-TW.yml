---
zh-TW:
  settings:
    providers:
      taglines:
        ibkr: 透過 Flex Query 匯入同步 Interactive Brokers 的投資帳戶。
      ibkr_panel:
        steps:
          step_1: 在您的 IBKR Client Portal 中，前往「Performance & Reports」>「Flex Queries」。
          step_2: 點選「Activity Flex Query」區塊中的「+」圖示，建立一個新查詢。
          step_3: 為查詢命名（例如「Sure Sync」），然後對照下方的 Flex Query 明細，啟用列出的區塊、欄位與設定選項。
          step_4: 儲存查詢並記下您的「Query ID」，再用「Flex Web Service Configuration」區塊中的齒輪圖示產生 Access Token。
          step_5: 將您的 Query ID 與 Token 貼到下方，儲存設定後前往「帳戶」連結已偵測到的 IBKR 帳戶。
