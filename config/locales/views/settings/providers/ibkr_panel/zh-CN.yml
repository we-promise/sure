---
zh-CN:
  settings:
    providers:
      taglines:
        ibkr: 通过 Flex Query 导入同步盈透证券投资账户。
      ibkr_panel:
        steps:
          step_1: 在您的 IBKR Client Portal 中，前往“Performance & Reports” > “Flex Queries”。
          step_2: 在“Activity Flex Query”区域点击“+”图标创建一个新查询。
          step_3: 为查询命名（例如“Sure Sync”），然后查看下方的 Flex Query 详情并启用列出的部分、字段和配置选项。
          step_4: 保存查询，记下您的“Query ID”，然后使用“Flex Web Service Configuration”区域中的齿轮图标生成访问 Token。
          step_5: 将您的 Query ID 和 Token 粘贴到下方，保存配置，然后前往账户以链接发现的 IBKR 账户。
