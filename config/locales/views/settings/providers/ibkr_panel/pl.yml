        steps:
          step_1: W IBKR Client Portal przejdź do "Performance & Reports" > "Flex
            Queries".
          step_2: Kliknij ikonę "+" w sekcji "Activity Flex Query", aby utworzyć nowe
            zapytanie.
          step_3: Nadaj zapytaniu nazwę (np. "Sure Sync"), a następnie sprawdź poniższe
            szczegóły Flex Query i włącz wymienione sekcje, pola oraz opcje konfiguracji.
          step_4: Zapisz zapytanie, zanotuj swój "Query ID", a następnie użyj ikony
            koła zębatego w sekcji "Flex Web Service Configuration", aby wygenerować
            Token dostępu.
          step_5: Wklej swój Query ID i Token poniżej, zapisz konfigurację, a następnie
            przejdź do Kont, aby połączyć wykryte konta IBKR.
