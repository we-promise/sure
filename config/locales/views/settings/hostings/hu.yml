        agent_id_label: Ügynökazonosító (nem kötelező)
        agent_id_placeholder: main (alapértelmezett)
        agent_id_help: >-
          Egy adott ügynökre irányít, ha a szolgáltató több ügynököt üzemeltet. Hagyd üresen az alapértelmezetthez.
