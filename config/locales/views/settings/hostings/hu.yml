        uri_base_placeholder: https://api.openai.com/v1 (alapértelmezett)
        model_label: Modell (nem kötelező)
        model_placeholder: gpt-4.1 (alapértelmezett)
        json_mode_label: JSON mód
        json_mode_auto: Automatikus (ajánlott)
        json_mode_strict: Szigorú (gondolkodó modellekhez a legjobb)
        json_mode_none: Nincs (standard modellekhez a legjobb)
        json_mode_json_object: JSON objektum
        json_mode_help: >-
          A szigorú mód a legjobb a gondolkodó modellekhez (qwen-thinking, deepseek-reasoner). A nincs
          mód a legjobb a standard modellekhez (llama, mistral, gpt-oss).
        budget_heading: Tokenköltségkeret
        budget_description: >-
          Minden LLM-hívásra vonatkozik – csevegési előzmények, automatikus kategorizálás, kereskedő-felismerés
          és PDF-feldolgozás. Az alapértelmezések konzervatívak a kis kontextusablakú helyi modellekhez.
          Emeld meg a felhőalapú, nagyobb kontextusablakú modellekhez.
        context_window_label: Kontextusablak (nem kötelező)
        context_window_help: >-
          Az összes token, amelyet a modell elfogad. Alapértelmezett: 2048 – emeld 8192+-ra felhőalapú
          OpenAI vagy nagy kontextusú helyi modelleknél.
        max_response_tokens_label: Maximális válasz-tokenek (nem kötelező)
        max_response_tokens_help: >-
          A modell válaszához fenntartott tokenek. Alapértelmezett: 512. Csökkentsd, ha több helyet szeretnél
          a hosszabb előzményeknek.
        max_items_per_call_label: Maximális elemek kötegenként (nem kötelező)
        max_items_per_call_help: >-
          Felső korlát az automatikus kategorizálási / kereskedő-felismerési kötegeknél. Alapértelmezett:
          25. A nagyobb kötegek automatikusan felosztódnak a kontextusablakba féréshez.
        title: OpenAI
        ai_response_timeout_help: >-
          Alapértelmezés: 90. Csak a csevegés teljes válaszkörét felügyelő időkorlátra érvényes, ezért
          így méretezd: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × kérési időkorlát, plusz az eszközök
          futási és sorban állási ideje. Az AI_RESPONSE_TIMEOUT felülírja ezt a mezőt.
        ai_response_timeout_label: Válasz időkorlátja másodpercben (nem kötelező)
        model_function_calling_help: >-
          Az MI-asszisztens függvényhívásokkal olvassa az adataidat, ezért olyan modellt válassz, amelynél
          a szolgáltató dokumentálja az eszközök/függvényhívás támogatását. Enélkül a csevegés nehezen
          értelmezhető szolgáltatói hibával leáll.
        model_function_calling_link: A beállított modell ellenőrzése
        openai_request_timeout_help: >-
          Alapértelmezés: 60. Minden OpenAI-kompatibilis HTTP-kérésre érvényes, beleértve az automatikus
          kategorizálást, kereskedőfelismerést, csevegést, PDF-feldolgozást és vektortárhívásokat. Az
          OPENAI_REQUEST_TIMEOUT felülírja ezt a mezőt.
        openai_request_timeout_label: Kérés időkorlátja másodpercben (nem kötelező)
        timeout_description: >-
          Meghatározza, mennyi ideig futhatnak az OpenAI-kompatibilis modellhívások, mielőtt a Sure megszakítja
          őket. Lassú hardveren futó helyi modell esetén növeld az értékeket.
        timeout_heading: Időkorlátok
