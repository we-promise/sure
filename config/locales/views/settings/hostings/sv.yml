        description: Ange API-nyckeln från Twelve Data
        env_configured_message: Konfigurerad via miljövariabeln TWELVE_DATA_API_KEY.
        label: API-nyckel
        placeholder: Ange din API-nyckel här
        show_details: "(visa detaljer)"
        step_1_html: 'Besök <a href="https://twelvedata.com/register" target="_blank" rel="noopener noreferrer" class="underline">twelvedata.com</a> och skapa ett kostnadsfritt Twelve Data Developer-konto.'
        step_2_html: 'Gå till sidan <a href="https://twelvedata.com/account/api-keys" target="_blank" rel="noopener noreferrer" class="underline">API Keys</a>.'
        step_3: Visa din hemliga nyckel och klistra in den nedan.
        plan: "%{plan}-plan"
