        description: Masukkan token akses dan secara opsional konfigurasikan penyedia kustom yang kompatibel dengan OpenAI
        env_configured_message: Berhasil dikonfigurasi melalui variabel lingkungan.
        access_token_label: Token Akses
        access_token_placeholder: Masukkan token akses Anda di sini
        uri_base_label: URL Dasar API (Opsional)
        uri_base_placeholder: "https://api.openai.com/v1 (bawaan)"
        uri_base_local_help: "Untuk model di komputer Anda sendiri, masukkan endpoint yang kompatibel dengan OpenAI, misalnya Ollama di http://localhost:11434/v1, atau http://ollama:11434/v1 jika Sure dan Ollama berjalan sebagai layanan Docker Compose."
        model_label: Model (Opsional)
        model_placeholder: "gpt-4.1 (bawaan)"
        model_function_calling_help: "Asisten AI membaca data Anda melalui pemanggilan fungsi, jadi pilih model yang didokumentasikan penyedia Anda mendukung tools/function calling. Model tanpa fitur ini akan gagal pada obrolan dengan pesan kesalahan penyedia yang tidak jelas."
        model_function_calling_link: Periksa model yang dikonfigurasi
        model_required_help: "Wajib saat Anda mengatur URL dasar API: masukkan nama model yang digunakan server Anda, seperti llama3.1 untuk Ollama."
        json_mode_label: Mode JSON
        json_mode_auto: Otomatis (disarankan)
        json_mode_strict: Ketat (terbaik untuk model thinking)
        json_mode_none: Tidak ada (terbaik untuk model standar)
        json_mode_json_object: Objek JSON
        json_mode_help: "Mode Ketat paling cocok untuk model thinking (qwen-thinking, deepseek-reasoner). Mode Tidak ada paling cocok untuk model standar (llama, mistral, gpt-oss)."
        budget_heading: Anggaran Token
        budget_description: Berlaku untuk panggilan yang kompatibel dengan OpenAI (obrolan, kategorisasi otomatis, deteksi merchant, dan pemrosesan PDF). Nilai bawaan dibuat konservatif untuk model lokal berjendela konteks kecil. Naikkan untuk model cloud dengan jendela konteks lebih besar.
        context_window_label: Jendela Konteks (Opsional)
        context_window_help: "Total token yang akan diterima model. Bawaan: 2048 — naikkan ke 8192+ untuk OpenAI cloud atau model lokal berjendela konteks besar."
        max_response_tokens_label: Token Respons Maks. (Opsional)
        max_response_tokens_help: "Token yang dicadangkan untuk balasan model. Bawaan: 512. Turunkan untuk memberi lebih banyak ruang bagi riwayat yang lebih panjang."
        timeout_heading: Batas Waktu
        timeout_description: Mengatur berapa lama panggilan model yang kompatibel dengan OpenAI boleh berjalan sebelum Sure berhenti menunggu. Naikkan nilai ini jika Anda menjalankan model lokal pada perangkat keras yang lambat.
        openai_request_timeout_label: Batas Waktu Permintaan dalam Detik (Opsional)
        openai_request_timeout_help: "Bawaan: 60. Berlaku untuk setiap permintaan HTTP yang kompatibel dengan OpenAI, termasuk kategorisasi otomatis, deteksi merchant, obrolan, pemrosesan PDF, dan panggilan vector-store. OPENAI_REQUEST_TIMEOUT menimpa kolom ini."
        ai_response_timeout_label: Batas Waktu Respons dalam Detik (Opsional)
        ai_response_timeout_help: "Bawaan: 90. Hanya berlaku untuk watchdog seluruh giliran obrolan, jadi hitung ukurannya sebagai penjumlahan: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × batas waktu permintaan, ditambah waktu eksekusi alat dan antrean. AI_RESPONSE_TIMEOUT menimpa kolom ini."
        ai_health_probe_timeout_label: Batas Waktu Pemeriksaan Kesehatan dalam Detik (Opsional)
        ai_health_probe_timeout_help: "Bawaan: 5. Hanya berlaku untuk pemeriksaan AI langsung di bawah Pengaturan → Kesehatan sistem, bukan untuk panggilan AI nyata. Naikkan jika pemeriksaan PDF melaporkan batas waktu habis dengan model cloud. AI_HEALTH_PROBE_TIMEOUT menimpa kolom ini."
