        env_configured_message: Pemilihan provider dinonaktifkan karena environment variable sudah diset. Untuk mengaktifkannya di sini, hapus environment variable tersebut dari konfigurasi Anda.
        twelve_data_hint: membutuhkan API key, 800 kredit/hari
        yahoo_finance_hint: gratis, tanpa API key
