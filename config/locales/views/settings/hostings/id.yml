            - Sure mendeteksi agen yang tersedia dari /v1/models setelah endpoint dan token disimpan.
            - Layanan eksternal memilih model di balik setiap agen; Sure hanya memilih rute agen.
            - Kesalahan autentikasi, endpoint, atau agen dikembalikan oleh layanan eksternal. Periksa log layanan tersebut jika permintaan gagal.
