        data_retention_proxied: Deskripsi transaksi, jumlah, dan nama kategori Anda dikirim ke %{host}, yang meneruskannya ke TypeSafe. Tinjau kebijakan retensi kedua penyedia sebelum mengaktifkan ini pada data nyata.
