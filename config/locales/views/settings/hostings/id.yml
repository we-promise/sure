        binance_public_hint: gratis, tanpa API key -- hanya kripto (BTC, ETH, dll.)
        moex_public_hint: gratis, tanpa API key -- saham, reksa dana & obligasi Rusia (MOEX), termasuk FX RUB
        tinkoff_invest_hint: membutuhkan token read-only -- harga saham/reksa dana/obligasi Rusia + logo merek
