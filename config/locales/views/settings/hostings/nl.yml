        timeout_description: Bepaalt hoe lang OpenAI-compatibele modelcalls mogen duren voordat Sure opgeeft. Verhoog deze waarden als u een lokaal model op trage hardware draait.
        openai_request_timeout_label: Time-out per verzoek in seconden (optioneel)
        openai_request_timeout_help: 'Standaard: 60. Geldt voor elk OpenAI-compatibel HTTP-verzoek, waaronder automatisch categoriseren, handelaren detecteren, chat, pdf-verwerking en vectoropslagcalls. OPENAI_REQUEST_TIMEOUT overschrijft dit veld.'
        ai_response_timeout_label: Time-out voor antwoord in seconden (optioneel)
        ai_response_timeout_help: 'Standaard: 90. Geldt alleen voor de watchdog van een volledige chatbeurt, dus stel deze in als som: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × time-out per verzoek, plus de tijd voor het uitvoeren van tools en de wachtrij. AI_RESPONSE_TIMEOUT overschrijft dit veld.'
