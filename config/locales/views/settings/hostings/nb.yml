        ai_response_timeout_label: Tidsavbrudd for svar i sekunder (valgfritt)
        ai_response_timeout_help: 'Standard: 90. Gjelder bare vakthunden for en hel chatrunde, så sett den som en sum: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × tidsavbrudd for forespørsel, pluss tid til verktøykjøring og kø. AI_RESPONSE_TIMEOUT overstyrer dette feltet.'
