      llm_provider_selector:
        title: AI-leverandør
        description: Velg hvilken LLM som driver AI-chatten. Batchoperasjoner (kategorisering av transaksjoner, forhandlergjenkjenning og PDF-behandling) bruker foreløpig alltid OpenAI.
        env_configured_message: Konfigurert via miljøvariabelen LLM_PROVIDER.
        provider_label: Aktiv LLM-leverandør
        provider_openai: OpenAI
        provider_anthropic: Anthropic (Claude)
        provider_help: Bytte av leverandør gjelder fra neste chat. Konfigurer påloggingsinformasjonen til den aktive leverandøren nedenfor.
        not_configured_hint: Legg til en API-nøkkel for %{provider} nedenfor for å aktivere den.
        data_retention_heading: Databehandling
        data_retention: API-inndata brukes som standard ikke til å trene modeller; leverandørenes API-er lagrer data i ca. 30 dager for misbruksovervåking. Egendefinerte eller selvhostede endepunkter følger dine egne retningslinjer.
        max_items_per_call_label: "Maks antall elementer per batch (valgfritt)"
        max_items_per_call_help: "Øvre grense for batcher med automatisk kategorisering og forhandlergjenkjenning. Standard: 25. Med OpenAI-kompatible leverandører deles større batcher automatisk opp så de passer i kontekstvinduet."
