        type_builtin: Innebygd (direkte LLM)
        type_external: Ekstern (ekstern agent)
        external_status: Endepunkt for ekstern assistent
        external_configured: Konfigurert
        external_not_configured: Ikke konfigurert. Skriv inn URL og token nedenfor, eller sett miljøvariablene EXTERNAL_ASSISTANT_URL og EXTERNAL_ASSISTANT_TOKEN.
