        model_help: Brukes til chat og PDF-behandling. Batchoperasjoner (kategorisering, forhandlergjenkjenning) bruker Haiku som standard av kostnadshensyn.
      openai_settings:
        description: Skriv inn tilgangstokenet, og konfigurer eventuelt en egendefinert OpenAI-kompatibel leverandør
        env_configured_message: Konfigurert via miljøvariabler.
        access_token_label: Tilgangstoken
        access_token_placeholder: Skriv inn tilgangstokenet her
        uri_base_label: API-basis-URL (valgfritt)
        uri_base_placeholder: https://api.openai.com/v1 (standard)
        model_label: Modell (valgfritt)
        model_placeholder: gpt-4.1 (standard)
        model_function_calling_help: AI-assistenten leser dataene dine via funksjonskall, så velg en modell som leverandøren dokumenterer at støtter verktøy/funksjonskall. Modeller uten dette får chatten til å feile med en uklar feilmelding fra leverandøren.
        model_function_calling_link: Sjekk den konfigurerte modellen
        json_mode_label: JSON-modus
        json_mode_auto: Auto (anbefalt)
        json_mode_strict: Streng (best for resonneringsmodeller)
        json_mode_none: Ingen (best for standardmodeller)
        json_mode_json_object: JSON Object
        json_mode_help: Streng modus fungerer best med resonneringsmodeller (qwen-thinking, deepseek-reasoner). Ingen fungerer best med standardmodeller (llama, mistral, gpt-oss).
        budget_heading: Tokengrenser
        budget_description: Gjelder OpenAI-kompatible kall (chat, automatisk kategorisering, forhandlergjenkjenning og PDF-behandling). Standardverdiene er forsiktige, tilpasset lokale modeller med lite kontekstvindu. Øk dem for skymodeller med større kontekstvinduer.
        context_window_label: Kontekstvindu (valgfritt)
        context_window_help: 'Totalt antall tokens modellen tar imot. Standard: 2048 – øk til 8192+ for OpenAI i skyen eller lokale modeller med stort kontekstvindu.'
        max_response_tokens_label: Maks svartokens (valgfritt)
        max_response_tokens_help: 'Tokens som reserveres til modellens svar. Standard: 512. Senk for å gi plass til lengre historikk.'
        timeout_heading: Tidsavbrudd
        timeout_description: Styrer hvor lenge kall til OpenAI-kompatible modeller kan pågå før Sure gir opp. Øk disse hvis du kjører en lokal modell på treg maskinvare.
        openai_request_timeout_label: Tidsavbrudd for forespørsel i sekunder (valgfritt)
        openai_request_timeout_help: 'Standard: 60. Gjelder hver OpenAI-kompatible HTTP-forespørsel, inkludert automatisk kategorisering, forhandlergjenkjenning, chat, PDF-behandling og kall til vektorlageret. OPENAI_REQUEST_TIMEOUT overstyrer dette feltet.'
        ai_response_timeout_label: Tidsavbrudd for svar i sekunder (valgfritt)
        ai_response_timeout_help: 'Standard: 90. Gjelder bare vakthunden for en hel chatrunde, så sett den som en sum: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × tidsavbrudd for forespørsel, pluss tid til verktøykjøring og kø. AI_RESPONSE_TIMEOUT overstyrer dette feltet.'
        title: OpenAI
        uri_base_local_help: "For en modell på din egen maskin skriver du inn det OpenAI-kompatible endepunktet, for eksempel http://localhost:11434/v1 for Ollama, eller http://ollama:11434/v1 når Sure og Ollama kjører som Docker Compose-tjenester."
        model_required_help: "Påkrevd når du angir en API-basis-URL: skriv inn modellnavnet serveren din bruker, for eksempel llama3.1 for Ollama."
        ai_health_probe_timeout_label: "Tidsavbrudd for statussjekk i sekunder (valgfritt)"
        ai_health_probe_timeout_help: "Standard: 5. Gjelder bare de direkte AI-sjekkene under Innstillinger → Systemstatus, aldri ekte AI-kall. Øk verdien hvis PDF-sjekkene melder tidsavbrudd med en skymodell. AI_HEALTH_PROBE_TIMEOUT overstyrer dette feltet."
