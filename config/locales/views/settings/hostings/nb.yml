      assistant_settings:
        title: AI-assistent
        description: "Velg hvordan chat-assistenten svarer. Innebygd bruker den konfigurerte LLM-leverandøren direkte. Ekstern delegerer til en ekstern AI-agent som kan kalle tilbake til Sures finansverktøy via MCP. Ingen i appen fjerner chatten i appen og lar MCP være tilgjengelig for dine egne agenter."
