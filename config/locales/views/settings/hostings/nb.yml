        url_help: Den fullstendige URL-en til agentens API-endepunkt. Du får den fra agentleverandøren din.
        token_label: API-token
        token_placeholder: Skriv inn tokenet fra agentleverandøren din
        token_help: Autentiseringstokenet fra den eksterne agenten. Det sendes som et Bearer-token med hver forespørsel.
        agent_id_label: Agent-ID (valgfritt)
        agent_id_placeholder: main (standard)
        agent_id_help: Sender til en bestemt agent når leverandøren har flere. La stå tomt for standardagenten.
        disconnect_title: Ekstern tilkobling
        disconnect_description: Fjern tilkoblingen til den eksterne assistenten og bytt tilbake til den innebygde assistenten.
        disconnect_button: Koble fra
        confirm_disconnect:
          title: Koble fra ekstern assistent?
          body: Dette fjerner lagret URL, token og agent-ID, og bytter til den innebygde assistenten. Du kan koble til igjen senere ved å skrive inn ny påloggingsinformasjon.
        type_mcp_only: "Ingen i appen (koble til din egen agent via MCP)"
        mcp_only_help: "Assistenten i appen er slått av for alle i denne husholdningen. AI-snarveiene under Regninger og «Utforsk med AI» på innsikt slutter også å virke. MCP og kategorisering i bakgrunnen er fortsatt tilgjengelig. Koble til eksterne agenter under Innstillinger > MCP."
        agent_discovery_configure_first: "Lagre en gyldig endepunkt-URL og et API-token for å hente tilgjengelige agenter."
        external_agent_required: "Velg en ekstern agent før du lagrer."
        external_agent_invalid: "Velg en agent som det konfigurerte endepunktet returnerer."
        external_agent_reselect: "Endepunktet er endret, og agenten du valgte før, er ikke tilgjengelig der. Velg en agent fra det nye endepunktet."
        agent_discovery_error: "Kunne ikke hente agenter: %{error}"
        external_info:
          title: "Konfigurasjon av ekstern AI"
          items:
            - "Skriv inn hele den OpenAI-kompatible endepunkt-URL-en, som slutter på /v1/chat/completions."
            - "Sure finner tilgjengelige agenter via /v1/models når endepunktet og tokenet er lagret."
            - "Den eksterne tjenesten velger modellen bak hver agent. Sure velger bare agentruten."
            - "Feil med autentisering, endepunkt eller agent kommer fra den eksterne tjenesten. Sjekk loggene der hvis en forespørsel mislykkes."
      brand_fetch_settings:
