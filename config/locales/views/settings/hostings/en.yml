        select_demo_family: Select a disposable demo family first.
        success: Settings updated
      yahoo_finance_settings:
        description: Yahoo Finance provides free access to stock prices, exchange
          rates, and financial data without requiring an API key.
        rate_limited_message: No action is required. Sure will avoid additional health
          checks for 30 minutes. Price and exchange-rate operations continue independently.
        rate_limited_title: Yahoo Finance rate limit reached.
        status_healthy: Yahoo Finance is active and working.
        status_rate_limited: Yahoo Finance is temporarily rate limiting requests.
        status_unavailable: Yahoo Finance is currently unavailable.
        status_unknown: Yahoo Finance status is being checked.
        title: Yahoo Finance
        unavailable_message: Yahoo Finance could not be reached or returned an unexpected
