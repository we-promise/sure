---
en:
  settings:
    hostings:
      alpha_vantage_settings:
        description: Enter the API key from Alpha Vantage. Supports EU ETFs on London
          Stock Exchange, XETRA, and other exchanges.
        env_configured_message: Successfully configured through the ALPHA_VANTAGE_API_KEY
          environment variable.
        label: API Key
        no_health_check_note: Connection health check is unavailable for this provider
          due to the strict rate limit.
        placeholder: Enter your Alpha Vantage API key here
        rate_limit_warning: Alpha Vantage free tier is limited to 25 API calls per
          day. Best used as a supplementary provider for EU ETFs not available from
          other providers.
        show_details: "(show details)"
        step_1_html: Visit <a href="https://www.alphavantage.co/support/#api-key"
          target="_blank" rel="noopener noreferrer" class="underline">alphavantage.co</a>
          and claim your free API key.
        step_2: Copy the API key and paste it below.
        title: Alpha Vantage
      anthropic_settings:
        access_token_label: API Key
        access_token_placeholder: Enter your Anthropic API key
        base_url_label: Base URL (Optional)
        base_url_placeholder: https://api.anthropic.com (default)
        description: Enter your Anthropic API key. Optionally point Base URL at AWS
          Bedrock or GCP Vertex.
        env_configured_message: Successfully configured through environment variables.
        model_help: Used for chat and PDF processing. Batch operations (categorize,
          merchant detection) default to Haiku for cost.
        model_label: Default Model (Optional)
        model_placeholder: claude-sonnet-4-6 (default)
        title: Anthropic (Claude)
      assistant_settings:
        agent_discovery_configure_first: Save a valid endpoint URL and API token to
          load available agents.
        agent_discovery_error: 'Could not load agents: %{error}'
        agent_id_help: Sure loads this list from the endpoint's /v1/models response.
          The selected agent controls routing; its underlying model is managed by
          the external service.
        agent_id_label: Agent (Required)
        agent_id_placeholder: main (default)
        confirm_disconnect:
          body: This will remove the saved URL, token, and agent ID, and switch to
            the builtin assistant. You can reconnect later by entering new credentials.
          title: Disconnect external assistant?
        description: Choose how the chat assistant responds. Builtin uses your configured
          LLM provider directly. External delegates to a remote AI agent that can
          call back to Sure's financial tools via MCP. None in app removes the in-app
          chat and keeps MCP available for your own agents.
        disconnect_button: Disconnect
        disconnect_description: Remove the external assistant connection and switch
          back to the builtin assistant.
        disconnect_title: External connection
        env_configured_external: Successfully configured through environment variables.
        env_notice: Assistant type is locked to '%{type}' via ASSISTANT_TYPE environment
          variable.
        external_agent_invalid: Select an agent returned by the configured endpoint.
        external_agent_required: Select an external agent before saving.
        external_agent_reselect: The endpoint changed and the previously selected
          agent is not available there. Select an agent from the new endpoint.
        external_configured: Configured
        external_info:
          items:
          - Enter the full OpenAI-compatible endpoint URL ending in /v1/chat/completions.
          - Sure discovers available agents from /v1/models after the endpoint and
            token are saved.
          - The external service chooses the model behind each agent; Sure only selects
            the agent route.
          - Authentication, endpoint, or agent errors are returned by the external
            service. Check its logs when a request fails.
          title: External AI configuration
        external_not_configured: Not configured. Enter the URL and token below, or
          set EXTERNAL_ASSISTANT_URL and EXTERNAL_ASSISTANT_TOKEN environment variables.
        external_status: External assistant endpoint
        mcp_only_help: The in-app assistant is off for everyone in this household.
          Bills AI shortcuts and AI-written insight text also stop. MCP and background
          categorization stay available; connect external agents in Settings > MCP.
        title: AI Assistant
        token_help: The authentication token provided by your external agent. This
          is sent as a Bearer token with each request.
        token_label: API Token
        token_placeholder: Enter the token from your agent provider
        type_builtin: Builtin (direct LLM)
        type_external: External (remote agent)
        type_label: Assistant type
        type_mcp_only: None in app (connect your own agent via MCP)
        url_help: The full URL to your agent's API endpoint. Your agent provider will
          give you this.
        url_label: Endpoint URL
        url_placeholder: https://your-agent-host/v1/chat
      brand_fetch_settings:
        description: Enter the Client ID provided by Brandfetch
        env_configured_message: You have successfully configured your Brandfetch Client
          ID through the BRAND_FETCH_CLIENT_ID environment variable.
        high_res_description: When enabled, logos will be retrieved at 120x120 resolution
          instead of 40x40. This provides sharper images on high-DPI displays.
        high_res_label: Enable high-resolution logos
        label: Client ID
        placeholder: Enter your Client ID here
        setup_step_1_html: Visit <a href="https://brandfetch.com/developers" target="_blank"
          rel="noopener noreferrer" class="underline">brandfetch.com</a> and create
          a free Brandfetch Developer account.
        setup_step_2_html: Go to the <a href="https://developers.brandfetch.com/dashboard/logo-api"
          target="_blank" rel="noopener noreferrer" class="underline">Logo API</a>
          page.
        setup_step_3: Tap the eye icon under the "Your Client ID" section to reveal
          your Client ID and paste it below.
        show_details: "(show details)"
        title: Brandfetch Settings
      categorization_provider_selector:
        confidence_threshold_env_notice: Locked by the CATEGORIZATION_CONFIDENCE_THRESHOLD
          environment variable.
        confidence_threshold_help: Below this confidence the category is not applied
          and the transaction is left uncategorized, so a later run can try again.
          Nothing is discarded. Set to 0 to apply every answer.
        confidence_threshold_label: Minimum confidence (0–1)
        data_retention_direct: Transaction descriptions, amounts and your category
          names are sent to TypeSafe to be categorized. Review their retention policy
          before enabling this on real data.
        data_retention_heading: Data sharing
        data_retention_proxied: Transaction descriptions, amounts and your category
          names are sent to %{host}, which forwards them to TypeSafe. Review both
          providers' retention policies before enabling this on real data.
        description: Choose which provider categorizes transactions. This is separate
          from the AI provider above, which handles chat and PDF processing.
        env_notice: Set to %{type} through environment variables.
        jev_configured: Jev API key configured.
        jev_not_configured: Jev is selected but has no API key configured. Categorization
          keeps using the AI provider until you add one below.
        preview_pill: Preview
        provider_help: The AI provider reads a batch of transactions and writes back
          category names. Jev picks from your category list and returns a calibrated
          confidence for each transaction.
        provider_jev: Jev (TypeSafe)
        provider_label: Categorization provider
        provider_llm: AI provider (OpenAI or Anthropic)
        shadow_rate_env_notice: Locked by the CATEGORIZATION_SHADOW_RATE environment
          variable.
        shadow_rate_help: Runs the provider you did NOT select alongside the one you
          did, recording where they disagree without changing any category. This doubles
          the API spend on every categorization run it samples. Set to 0 to turn it
          off.
        shadow_rate_label: Shadow comparison rate (0–1)
        title: Transaction Categorization
      categorization_shadow_results:
        shadow_disagreement_confidence: "(confidence %{confidence})"
        shadow_disagreement_row: "%{applied_provider} chose %{applied_category}; %{shadow_provider}
          chose %{shadow_category}."
        shadow_disagreements_heading: Most recent disagreements
        shadow_no_category: no category
        shadow_no_disagreements: The two providers agreed on every sampled transaction.
        shadow_results_empty: No comparisons recorded yet. Set a shadow comparison
          rate above 0 and run categorization to collect some.
        shadow_results_heading: Shadow comparison
        shadow_results_summary: "%{agreement}%% agreement across %{count} sampled
          transactions."
      chimnie_settings:
        description: Enter your Chimnie API key to value UK residential properties
          by their UPRN. Create a free key at dashboard.chimnie.com (sign-up requires
          a business or custom-domain email address; Gmail, Outlook and similar addresses
          are not accepted). UPRN valuations are free and refreshed monthly; Sure
          caps them at 1,000 requests per month, which you can change with the CHIMNIE_MAX_REQUESTS_PER_MONTH
          environment variable.
        env_configured_message: Successfully configured through the CHIMNIE_API_KEY
          environment variable.
        label: API Key
        placeholder: Enter your Chimnie API key here
        title: Chimnie
        usage: "%{used} of %{limit} monthly requests used"
      clear_cache:
        cache_cleared: Data cache has been cleared. This may take a few moments to
          complete.
      demo_refresh_settings:
        description: Automatically refresh only the selected demo family. All its
          data and logins will be removed. Other families are untouched. Requires
          a running worker with at least 2 GiB RAM. First create a disposable demo
          family using the demo generator, then select it here. Do not choose a real
          user's family.
        enabled_label: Enable daily demo family refresh
        family_label: Disposable demo family
        none: No demo family selected
        save_family: Save demo family
      disconnect_external_assistant:
        external_assistant_disconnected: External assistant disconnected
      ensure_admin:
        not_authorized: You are not authorized to perform this action
      ensure_super_admin_for_onboarding:
        not_authorized: You are not authorized to perform this action
      eodhd_settings:
        description: Enter the API token provided by EODHD. Supports EU ETFs on LSE,
          XETRA, and other international exchanges.
        env_configured_message: Successfully configured through the EODHD_API_KEY
          environment variable.
        label: API Token
        placeholder: Enter your EODHD API token here
        rate_limit_warning: EODHD free tier is limited to 20 API calls per day. Best
          used as a supplementary provider for EU ETFs not available from other providers.
        show_details: "(show details)"
        step_1_html: Visit <a href="https://eodhd.com/register" target="_blank" rel="noopener
          noreferrer" class="underline">eodhd.com</a> and create a free account.
        step_2_html: Go to your <a href="https://eodhd.com/cp/dashboard" target="_blank"
          rel="noopener noreferrer" class="underline">Dashboard</a> to find your API
          token.
        step_3: Copy your API token and paste it below.
        title: EODHD
      invite_code_settings:
        default_family_description: Put new users on this family/group only if they
          have no invitation.
        default_family_none: None (create new family)
        default_family_title: Default family for new users
        description: Control how new people sign up for your instance of %{product}.
        email_confirmation_description: When enabled, users must confirm their email
          address when changing it.
        email_confirmation_title: Require email confirmation
        generate_tokens: Generate new code
        generated_tokens: Generated codes
        states:
          closed: Closed
          invite_only: Invite-only
          open: Open
        title: Onboarding
      jev_settings:
        api_key_label: API Key
        api_key_placeholder: Enter your TypeSafe API key
        endpoint_label: Endpoint (Optional)
        endpoint_placeholder: https://api.typesafe.ai/v1/systemone (default)
        env_configured_message: Successfully configured through environment variables.
        model_help: Defaults to TypeSafe directly. To reach Jev through OpenRouter
          instead, set the endpoint to https://openrouter.ai/api/alpha/decisions and
          the model to ~typesafe/jev-latest.
        model_label: Model (Optional)
        model_placeholder: jev-latest (default)
      llm_provider_selector:
        data_retention: API inputs are not used to train models by default; the providers'
          hosted APIs retain data for ~30 days for trust & safety. Custom or self-hosted
          endpoints follow your own policy.
        data_retention_heading: Data handling
        description: Choose which LLM powers AI chat, merchant detection and PDF processing.
          Transaction categorization is configured separately below.
        env_configured_message: Successfully configured through the LLM_PROVIDER environment
          variable.
        max_items_per_call_help: 'Upper bound for auto-categorize / merchant detection
          batches. Default: 25. With OpenAI-compatible providers, larger batches are
          auto-sliced to fit the context window.'
        max_items_per_call_label: Max Items Per Batch (Optional)
        not_configured_hint: Add a %{provider} API key below to activate it.
        provider_anthropic: Anthropic (Claude)
        provider_help: Switching providers takes effect on the next chat. Configure
          the active provider's credentials below.
        provider_label: Active LLM provider
        provider_openai: OpenAI
        title: AI Provider
      mansa_settings:
        description: Enter the API key from Mansa API. Supports 20 African stock exchanges,
          including NGX (Nigerian Exchange), JSE, NSE (Kenya), GSE (Ghana) and BRVM
          -- several of which no other provider here covers.
        env_configured_message: Successfully configured through the MANSA_API_KEY
          environment variable.
        label: API Key
        placeholder: Enter your Mansa API key here
        rate_limit_warning: Mansa's free tier is limited to 100 API calls per day,
          and only exposes current quotes -- historical prices require a paid plan.
        show_details: "(show details)"
        step_1_html: Visit <a href="https://mansaapi.com" target="_blank" rel="noopener
          noreferrer" class="underline">mansaapi.com</a> and claim your free API key
          -- no card required.
        step_2: Copy your API key and paste it below.
        title: Mansa
      not_authorized: You are not authorized to perform this action
      openai_settings:
        access_token_label: Access Token
        access_token_placeholder: Enter your access token here
        ai_health_probe_timeout_help: 'Default: 5. Applies only to the live AI checks
          under Settings → System health, never to real AI calls. Raise it if the
          PDF checks report a timeout with a cloud model. AI_HEALTH_PROBE_TIMEOUT
          overrides this field.'
        ai_health_probe_timeout_label: Health Check Timeout in Seconds (Optional)
        ai_response_timeout_help: 'Default: 90. Applies only to chat''s whole-turn
          watchdog, so size it as a sum: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS)
          × request timeout, plus tool execution and queue time. AI_RESPONSE_TIMEOUT
          overrides this field.'
        ai_response_timeout_label: Response Timeout in Seconds (Optional)
        budget_description: Applies to OpenAI-compatible calls (chat, auto-categorization,
          merchant detection, and PDF processing). Defaults are conservative for small-context
          local models. Raise for cloud models with larger context windows.
        budget_heading: Token Budget
        context_window_help: 'Total tokens the model will accept. Default: 2048 —
          raise to 8192+ for cloud OpenAI or large-context local models.'
        context_window_label: Context Window (Optional)
        description: Enter the access token and optionally configure a custom OpenAI-compatible
          provider
        env_configured_message: Successfully configured through environment variables.
        json_mode_auto: Auto (recommended)
        json_mode_help: Strict mode works best with thinking models (qwen-thinking,
          deepseek-reasoner). None mode works best with standard models (llama, mistral,
          gpt-oss).
        json_mode_json_object: JSON Object
        json_mode_label: JSON Mode
        json_mode_none: None (best for standard models)
        json_mode_strict: Strict (best for thinking models)
        max_response_tokens_help: 'Tokens reserved for the model''s reply. Default:
          512. Lower to free up room for longer history.'
        max_response_tokens_label: Max Response Tokens (Optional)
        model_function_calling_help: The AI assistant reads your data through function
          calls, so pick a model your provider documents as supporting tools/function
          calling. Models without it fail chat with an opaque provider error.
        model_function_calling_link: Check the configured model
        model_label: Model (Optional)
        model_placeholder: gpt-4.1 (default)
        model_required_help: 'Required when you set an API base URL: enter the model
          name your server uses, such as llama3.1 for Ollama.'
        openai_request_timeout_help: 'Default: 60. Applies to each OpenAI-compatible
          HTTP request, including auto-categorization, merchant detection, chat, PDF
          processing, and vector-store calls. OPENAI_REQUEST_TIMEOUT overrides this
          field.'
        openai_request_timeout_label: Request Timeout in Seconds (Optional)
        timeout_description: Controls how long OpenAI-compatible model calls may run
          before Sure gives up. Raise these if you run a local model on slow hardware.
        timeout_heading: Timeouts
        title: OpenAI
        uri_base_label: API Base URL (Optional)
        uri_base_local_help: For a model on your own machine, enter its OpenAI-compatible
          endpoint, for example Ollama at http://localhost:11434/v1, or http://ollama:11434/v1
          when Sure and Ollama run as Docker Compose services.
        uri_base_placeholder: https://api.openai.com/v1 (default)
      provider_selection:
        binance_public_hint: free, no API key -- crypto only (BTC, ETH, etc.)
        env_configured_message: Provider selection is disabled because environment
          variables are set. To enable selection here, remove these environment variables
          from your configuration.
        exchange_rate_description: Select a single provider for fetching currency
          exchange rates.
        exchange_rate_provider_label: Exchange Rate Provider
        exchange_rate_title: Exchange Rate Provider
        mfapi_hint: free, no API key -- Indian mutual funds only
        moex_public_hint: free, no API key -- Russian stocks, funds & bonds (MOEX),
          incl. RUB FX
        providers:
          alpha_vantage: Alpha Vantage
          binance_public: Binance
          eodhd: EODHD
          frankfurter: Frankfurter
          mansa: Mansa
          mfapi: MFAPI.in
          moex_public: MOEX
          tiingo: Tiingo
          tinkoff_invest: T-Invest (T-Bank)
          twelve_data: Twelve Data
          yahoo_finance: Yahoo Finance
        requires_api_key: requires API key
        requires_api_key_alpha_vantage: requires API key, 25 calls/day limit
        requires_api_key_eodhd: requires API key, 20 calls/day limit
        requires_api_key_mansa: requires API key, 100 calls/day free tier -- African
          exchanges (NGX, JSE, NSE, GSE, BRVM and more)
        securities_description: Enable one or more providers for fetching stock, ETF,
          and mutual fund prices. When searching, all enabled providers are queried
          and results are merged.
        securities_title: Securities Providers
        tinkoff_invest_hint: requires read-only token -- Russian stocks/funds/bonds
          prices + brand logos
        twelve_data_hint: requires API key, 800 credits/day
        yahoo_finance_hint: free, no API key needed
      realie_settings:
        description: Enter your Realie API key to look up US property details and
          value estimates when adding a property. The free tier is limited to 25 API
          requests per month, shared between property lookups and daily valuation
          refreshes. On a paid plan, raise the cap with the REALIE_MAX_REQUESTS_PER_MONTH
          environment variable.
        env_configured_message: Successfully configured through the REALIE_API_KEY
          environment variable.
        label: API Key
        placeholder: Enter your Realie API key here
        title: Realie
        usage: "%{used} of %{limit} monthly requests used"
      rentcast_settings:
        description: Enter your RentCast API key to look up US property details and
          value estimates when adding a property. The free tier is limited to 50 API
          requests per month, shared between property lookups and daily valuation
          refreshes. On a paid plan, raise the cap with the RENTCAST_MAX_REQUESTS_PER_MONTH
          environment variable.
        env_configured_message: Successfully configured through the RENTCAST_API_KEY
          environment variable.
        label: API Key
        placeholder: Enter your RentCast API key here
        title: RentCast
        usage: "%{used} of %{limit} monthly requests used"
      show:
        ai_assistant: AI Assistant
        clear_cache: Clear data cache
        clear_cache_warning: Clearing the data cache will remove all exchange rates,
          security prices, account balances, and other data. This will not delete
          accounts, transactions, categories, or other user-owned data.
        confirm_clear_cache:
          body: Are you sure you want to clear the data cache? This will remove all
            exchange rates, security prices, account balances, and other data. This
            action cannot be undone.
          title: Clear data cache?
        danger_zone: Danger Zone
        demo_refresh: Demo data refresh
        financial_data_providers: Financial Data Providers
        general: General Settings
        instance_settings_restricted: Provider credentials, the shared AI connection
          and sync settings apply to every family on this instance, so only a super
          admin can change them. Which assistant your family uses is still set per
          family. Someone with access to the server can promote a user to super admin;
          the Docker self-hosting guide shows the command in its upgrade notes.
        invites: Invite Codes
        property_valuation_providers: Property Valuation Providers
        sync_settings: Sync Settings
        title: Self-Hosting
      sync_auto_sync_scheduler!:
        scheduler_sync_failed: Settings saved, but failed to update the sync schedule.
          Please try again or check the server logs.
      sync_settings:
        auto_sync_description: When enabled, all accounts will be automatically synced
          daily at the specified time.
        auto_sync_label: Enable automatic sync
        auto_sync_time_description: Specify the time of day when automatic sync should
          occur.
        auto_sync_time_label: Sync time (HH:MM)
        env_configured_message: This setting is disabled because a provider environment
          variable (SIMPLEFIN_INCLUDE_PENDING or PLAID_INCLUDE_PENDING) is set. Remove
          it to enable this setting.
        include_pending_description: When enabled, pending (uncleared) transactions
          will be imported and automatically reconciled when they post. Disable if
          your bank provides unreliable pending data.
        include_pending_label: Include pending transactions
        market_data_sync_description: When enabled, security prices are imported automatically
          once a day (Monday-Friday) at the specified time.
        market_data_sync_label: Enable daily market data import
        market_data_sync_time_description: Specify the time of day when the daily
          security price import should run — e.g. shortly after your primary exchange
          closes.
        market_data_sync_time_label: Market data import time (HH:MM)
      tiingo_settings:
        description: Enter the API token provided by Tiingo. Free tier supports 50
          unique symbols per hour with 30+ years of historical data.
        env_configured_message: Successfully configured through the TIINGO_API_KEY
          environment variable.
        label: API Token
        placeholder: Enter your Tiingo API token here
        show_details: "(show details)"
        step_1_html: Visit <a href="https://www.tiingo.com" target="_blank" rel="noopener
          noreferrer" class="underline">tiingo.com</a> and create a free account.
        step_2_html: Go to the <a href="https://www.tiingo.com/account/api/token"
          target="_blank" rel="noopener noreferrer" class="underline">API Token</a>
          page.
        step_3: Copy your API token and paste it below.
        title: Tiingo
      tinkoff_invest_settings:
        description: Enter a read-only T-Invest API token. Used to fetch brand logos
          for securities (incl. funds and bonds, even when MOEX prices them) and,
          when enabled above, prices for Russian instruments.
        env_configured_message: Successfully configured through the TINKOFF_INVEST_API_KEY
          environment variable.
        label: API Token
        moex_only_notice: Not enabled for prices above — T-Invest is used to fetch
          brand logos for all your securities whenever a token is configured, independent
          of the checkbox above.
        placeholder: Enter your T-Invest API token here
        show_details: "(show details)"
        step_1: Open T-Bank investments, then Settings, then API tokens (requires
          an open T-Bank brokerage account).
        step_2: Create a token with read-only access.
        step_3: Copy the token and paste it below.
        title: T-Invest (T-Bank)
      twelve_data_settings:
        api_calls_used: "%{used} / %{limit} API daily calls used (%{percentage})"
        description: Enter the API key provided by Twelve Data
        env_configured_message: Successfully configured through the TWELVE_DATA_API_KEY
          environment variable.
        label: API Key
        placeholder: Enter your API key here
        plan: "%{plan} plan"
        plan_upgrade_warning_description: The following tickers in your portfolio
          cannot sync prices with your current Twelve Data plan.
        plan_upgrade_warning_title: Some tickers require a paid plan
        requires_plan: requires %{plan} plan
        show_details: "(show details)"
        step_1_html: Visit <a href="https://twelvedata.com/register" target="_blank"
          rel="noopener noreferrer" class="underline">twelvedata.com</a> and create
          a free Twelve Data Developer account.
        step_2_html: Go to the <a href="https://twelvedata.com/account/api-keys" target="_blank"
          rel="noopener noreferrer" class="underline">API Keys</a> page.
        step_3: Reveal your Secret Key and paste it below.
        title: Twelve Data
        view_pricing: View Twelve Data pricing
      update:
        anthropic_model_required_for_base_url: Anthropic Model is required when a
          custom Base URL is set.
        failure: Invalid setting value
        invalid_anthropic_base_url: Anthropic Base URL must be an http(s) URL.
        invalid_categorization_rate: "%{field} must be a number between 0 and 1."
