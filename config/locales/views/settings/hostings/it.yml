        max_items_per_call_label: Elementi massimi per batch (facoltativo)
        max_items_per_call_help: 'Limite superiore per batch di auto-categorizzazione/rilevamento
          commercianti. Predefinito: 25. I batch più grandi vengono suddivisi automaticamente
          per adattarsi alla finestra di contesto.'
        title: OpenAI
        ai_response_timeout_help: 'Predefinito: 90. Si applica solo al controllo del
          tempo totale di un turno di chat; calcolalo come somma: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS)
          × timeout delle richieste, più il tempo di esecuzione degli strumenti e
          di attesa in coda. AI_RESPONSE_TIMEOUT prevale su questo campo.'
        ai_response_timeout_label: Timeout della risposta in secondi (facoltativo)
        model_function_calling_help: 'L''assistente AI legge i tuoi dati tramite chiamate
