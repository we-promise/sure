            dell’endpoint e del token.
          - Il servizio esterno sceglie il modello di ciascun agente; Sure seleziona
            solo il percorso dell’agente.
          - Gli errori di autenticazione, endpoint o agente vengono restituiti dal
            servizio esterno. Controlla i suoi log quando una richiesta fallisce.
