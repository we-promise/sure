          valori predefiniti sono conservativi per i modelli locali a contesto ridotto.
          Aumenta per i modelli cloud con finestre di contesto più grandi.
        context_window_label: Finestra di contesto (facoltativo)
        context_window_help: 'Token totali che il modello accetterà. Predefinito:
