          a strumenti/chiamate di funzione. I modelli che non lo supportano fanno
          fallire la chat con un errore poco chiaro del provider.'
        model_function_calling_link: Verifica il modello configurato
        openai_request_timeout_help: 'Predefinito: 60. Si applica a ogni richiesta
          HTTP compatibile con OpenAI, incluse classificazione automatica, rilevamento
          esercenti, chat, elaborazione PDF e chiamate all''archivio vettoriale. OPENAI_REQUEST_TIMEOUT
          prevale su questo campo.'
        openai_request_timeout_label: Timeout delle richieste in secondi (facoltativo)
        timeout_description: Determina quanto possono durare le chiamate ai modelli
          compatibili con OpenAI prima che Sure rinunci. Aumenta questi valori se
          esegui un modello locale su hardware lento.
        timeout_heading: Timeout
