---
es:
  settings:
    hostings:
      invite_code_settings:
        description: Controla cómo se registran nuevas personas en tu instancia de %{product}.
        email_confirmation_description: Cuando está habilitado, los usuarios deben confirmar su dirección de correo electrónico al cambiarla o registrarse.
        email_confirmation_title: Requerir confirmación de correo electrónico
        default_family_title: Familia predeterminada para nuevos usuarios
        default_family_description: Asigna a los nuevos usuarios a esta familia/grupo solo si no tienen invitación.
        default_family_none: Ninguna (crear familia nueva)
        generate_tokens: Generar nuevo código
        generated_tokens: Códigos generados
        title: Incorporación
        states:
          open: Abierto
          closed: Cerrado
          invite_only: Solo con invitación
      demo_refresh_settings:
        description: Restablece automáticamente solo la familia de demostración seleccionada. Se eliminarán todos sus datos e inicios de sesión. Las demás familias no se tocan. Necesita un worker en ejecución con al menos 2 GiB de RAM. Crea primero una familia de demostración desechable con el generador de demostración y selecciónala aquí. No elijas la familia de un usuario real.
        none: Ninguna familia de demostración seleccionada
        family_label: Familia de demostración desechable
        save_family: Guardar familia de demostración
        enabled_label: Restablecer cada día la familia de demostración
      show:
        demo_refresh: Restablecimiento de datos de demostración
        general: Configuración General
        ai_assistant: Asistente de IA
        financial_data_providers: Proveedores de Datos Financieros
        property_valuation_providers: Proveedores de valoración de propiedades
        sync_settings: Ajustes de Sincronización
        invites: Códigos de Invitación
        title: Autoalojamiento
        danger_zone: Zona de Peligro
        instance_settings_restricted: Las credenciales de proveedores, la conexión de IA compartida y la configuración de sincronización se aplican a todas las familias de esta instancia, así que solo un superadministrador puede cambiarlas. El asistente que usa tu familia se sigue eligiendo por familia. Alguien con acceso al servidor puede convertir a un usuario en superadministrador; la guía de autoalojamiento con Docker muestra el comando en sus notas de actualización.
        clear_cache: Limpiar caché de datos
        clear_cache_warning: Limpiar la caché de datos eliminará todos los tipos de cambio, precios de valores, saldos de cuentas y otros datos temporales. Esto no eliminará cuentas, transacciones, categorías ni otros datos del usuario.
        confirm_clear_cache:
          title: ¿Limpiar caché de datos?
          body: ¿Estás seguro de que deseas limpiar la caché de datos? Se eliminarán tipos de cambio, precios y saldos históricos. Esta acción no se puede deshacer.
        reset_market_data: Restablecer los datos de mercado de todas las familias
        reset_market_data_warning: Elimina los tipos de cambio y los precios de valores que tus proveedores pueden volver a cargar, los vuelve a importar y después sincroniza todas las cuentas. Los totales en moneda extranjera pueden aparecer sin convertir hasta que termine la importación.
        confirm_reset_market_data:
          title: "¿Restablecer los datos de mercado de todas las familias?"
          body: Esto elimina los tipos de cambio y los precios de valores que tus proveedores pueden volver a cargar, para todas las familias de esta instancia, y los vuelve a importar. Hasta que termine la importación, los importes en moneda extranjera pueden aparecer sin convertir. Esta acción no se puede deshacer.
      provider_selection:
        exchange_rate_title: Proveedor de tipos de cambio
        exchange_rate_description: Selecciona un único proveedor para obtener los tipos de cambio de divisas.
        exchange_rate_provider_label: Proveedor de tipos de cambio
        securities_title: Proveedores de valores
        securities_description: Activa uno o más proveedores para obtener precios de acciones, ETF y fondos de inversión. Al buscar, se consultan todos los proveedores activos y se combinan los resultados.
        env_configured_message: La selección de proveedor está desactivada porque las variables de entorno (EXCHANGE_RATE_PROVIDER o SECURITIES_PROVIDER) están definidas. Para habilitar la selección aquí, elimina dichas variables de tu configuración.
        twelve_data_hint: requiere clave API, 800 créditos/día
        yahoo_finance_hint: gratis, sin clave API
        requires_api_key: requiere clave API
        requires_api_key_eodhd: requiere clave API, límite de 20 llamadas/día
        requires_api_key_alpha_vantage: requiere clave API, límite de 25 llamadas/día
        mfapi_hint: gratis, sin clave API — solo fondos de inversión indios
        binance_public_hint: gratis, sin clave API — solo cripto (BTC, ETH, etc.)
        moex_public_hint: gratis, sin clave API — acciones, fondos y bonos rusos (MOEX), incl. cambio RUB
        tinkoff_invest_hint: requiere token de solo lectura — precios de acciones/fondos/bonos rusos + logotipos de marcas
        requires_api_key_mansa: requiere clave API, plan gratuito de 100 llamadas/día; bolsas africanas (NGX, JSE, NSE, GSE, BRVM y más)
        providers:
          twelve_data: Twelve Data
          yahoo_finance: Yahoo Finance
          tiingo: Tiingo
          eodhd: EODHD
          alpha_vantage: Alpha Vantage
          mfapi: MFAPI.in
          binance_public: Binance
          moex_public: MOEX
          tinkoff_invest: T-Invest (T-Bank)
          frankfurter: Frankfurter
          mansa: Mansa
        title: Selección de Proveedores
        description: Elige qué servicio usar para obtener tipos de cambio y precios de acciones. Yahoo Finance es gratuito y no requiere clave API. Twelve Data requiere una clave API (gratuita disponible) pero ofrece mayor cobertura de datos.
        securities_provider_label: Proveedor de valores (Precios de acciones)
      assistant_settings:
        title: Asistente de IA
        description: Elige cómo responde el asistente del chat. "Integrado" utiliza directamente tu proveedor de LLM configurado. "Externo" delega en un agente remoto que puede interactuar con las herramientas financieras de Sure mediante MCP. "Ninguno en la app" quita el chat de la app y mantiene MCP disponible para tus propios agentes.
        type_label: Tipo de asistente
        type_builtin: Integrado (LLM directo)
        type_external: Externo (agente remoto)
        type_mcp_only: Ninguno en la app (conecta tu propio agente por MCP)
        mcp_only_help: El asistente de la app queda desactivado para todo el hogar. También dejan de funcionar los atajos de IA de los recibos y "Profundizar con IA" en los insights. MCP y la categorización en segundo plano siguen disponibles; conecta agentes externos en Ajustes > MCP.
        external_status: Punto de conexión del asistente externo
        external_configured: Configurado
        external_not_configured: No configurado. Introduce la URL y el token a continuación, o define las variables de entorno EXTERNAL_ASSISTANT_URL y EXTERNAL_ASSISTANT_TOKEN.
        env_notice: El tipo de asistente está fijado en '%{type}' mediante la variable de entorno ASSISTANT_TYPE.
        env_configured_external: Configurado correctamente mediante variables de entorno.
        url_label: URL del punto de conexión (Endpoint)
        url_placeholder: https://tu-agente-host/v1/chat
        url_help: La URL completa del punto de conexión de la API de tu agente. Tu proveedor de agentes te facilitará esta dirección.
        token_label: Token de API
        token_placeholder: Introduce el token de tu proveedor de agentes
        token_help: El token de autenticación proporcionado por tu agente externo. Se envía como un token Bearer en cada solicitud.
        agent_id_label: ID del Agente (Opcional)
        agent_id_placeholder: main (por defecto)
        agent_id_help: Dirige las peticiones a un agente específico si el proveedor aloja varios. Déjalo en blanco para el predeterminado.
        agent_discovery_configure_first: Guarda una URL de endpoint válida y un token de API para cargar los agentes disponibles.
        external_agent_required: Selecciona un agente externo antes de guardar.
        external_agent_invalid: Selecciona un agente devuelto por el endpoint configurado.
        external_agent_reselect: El endpoint ha cambiado y el agente seleccionado ya no está disponible en él. Selecciona un agente del nuevo endpoint.
        agent_discovery_error: 'No se han podido cargar los agentes: %{error}'
        external_info:
          title: Configuración de IA externa
          items:
          - Introduce la URL completa del endpoint compatible con OpenAI, terminada en /v1/chat/completions.
          - Sure descubre los agentes disponibles desde /v1/models una vez guardados el endpoint y el token.
          - El servicio externo elige el modelo que hay detrás de cada agente; Sure solo selecciona la ruta del agente.
          - Los errores de autenticación, de endpoint o de agente los devuelve el servicio externo. Revisa sus registros cuando falle una petición.
        disconnect_title: Conexión externa
        disconnect_description: Elimina la conexión del asistente externo y vuelve al asistente integrado.
        disconnect_button: Desconectar
        confirm_disconnect:
          title: ¿Desconectar asistente externo?
          body: Esto eliminará la URL guardada, el token y el ID del agente, y cambiará al asistente integrado. Podrás volver a conectarlo más tarde introduciendo nuevas credenciales.
      brand_fetch_settings:
        description: Introduce el ID de Cliente proporcionado por Brandfetch
        env_configured_message: Has configurado correctamente tu Client ID de Brandfetch mediante la variable de entorno BRAND_FETCH_CLIENT_ID.
        show_details: (ver detalles)
        setup_step_1_html: Visita <a href="https://brandfetch.com/developers" target="_blank" rel="noopener noreferrer" class="underline">brandfetch.com</a> y crea una cuenta gratuita de desarrollador de Brandfetch.
        setup_step_2_html: Ve a la página <a href="https://developers.brandfetch.com/dashboard/logo-api" target="_blank" rel="noopener noreferrer" class="underline">Logo API</a>.
        setup_step_3: Pulsa el icono del ojo en la sección "Your Client ID" para revelar tu Client ID y pégalo abajo.
        label: ID de Cliente
        placeholder: Introduce tu ID de Cliente aquí
        title: Configuración de Brandfetch
        high_res_label: Activar logotipos de alta resolución
        high_res_description: Cuando está habilitado, los logotipos se obtendrán a una resolución de 120x120 en lugar de 40x40. Esto ofrece imágenes más nítidas en pantallas de alta densidad de píxeles (DPI).
      llm_provider_selector:
        title: Proveedor de IA
        description: Elige qué LLM impulsa el chat de IA. Las operaciones por lotes (categorización de transacciones, detección de comercios y procesamiento de PDF) actualmente siempre usan OpenAI.
        env_configured_message: Configurado correctamente mediante la variable de entorno LLM_PROVIDER.
        provider_label: Proveedor LLM activo
        provider_openai: OpenAI
        provider_anthropic: Anthropic (Claude)
        provider_help: El cambio de proveedor surte efecto en el siguiente chat. Configura abajo las credenciales del proveedor activo.
        not_configured_hint: Añade abajo una clave API de %{provider} para activarlo.
        data_retention_heading: Tratamiento de los datos
        data_retention: Por defecto, las entradas a la API no se usan para entrenar modelos; las API alojadas de los proveedores conservan los datos ~30 días por motivos de confianza y seguridad. Los endpoints personalizados o autoalojados siguen tu propia política.
        max_items_per_call_label: Elementos máximos por lote (opcional)
        max_items_per_call_help: "Límite superior para los lotes de categorización automática / detección de comercios. Predeterminado: 25. Con proveedores compatibles con OpenAI, los lotes más grandes se dividen automáticamente para caber en la ventana de contexto."
      anthropic_settings:
        title: Anthropic (Claude)
        description: Introduce tu clave API de Anthropic. Opcionalmente, apunta la URL base a AWS Bedrock o GCP Vertex.
        env_configured_message: Configurado correctamente mediante variables de entorno.
        access_token_label: Clave API
        access_token_placeholder: Introduce tu clave API de Anthropic
        base_url_label: URL base (opcional)
        base_url_placeholder: https://api.anthropic.com (predeterminada)
        model_label: Modelo predeterminado (opcional)
        model_placeholder: claude-sonnet-4-6 (predeterminado)
        model_help: Se usa para el chat y el procesamiento de PDF. Las operaciones por lotes (categorización, detección de comercios) usan Haiku por defecto para reducir costes.
      categorization_provider_selector:
        title: Categorización de transacciones
        preview_pill: Vista previa
        description: Elige qué proveedor categoriza las transacciones. Es independiente del proveedor de IA de arriba, que se encarga del chat y del procesamiento de PDF.
        env_notice: Fijado en %{type} mediante variables de entorno.
        provider_label: Proveedor de categorización
        provider_llm: Proveedor de IA (OpenAI o Anthropic)
        provider_jev: Jev (TypeSafe)
        provider_help: El proveedor de IA lee un lote de transacciones y devuelve nombres de categoría. Jev elige de tu lista de categorías y devuelve una confianza calibrada para cada transacción.
        jev_configured: Clave API de Jev configurada.
        jev_not_configured: Jev está seleccionado pero no tiene clave API. La categorización sigue usando el proveedor de IA hasta que añadas una abajo.
        data_retention_heading: Datos compartidos
        data_retention_direct: Las descripciones e importes de las transacciones y los nombres de tus categorías se envían a TypeSafe para categorizarlos. Revisa su política de retención antes de activarlo con datos reales.
        data_retention_proxied: Las descripciones e importes de las transacciones y los nombres de tus categorías se envían a %{host}, que los reenvía a TypeSafe. Revisa las políticas de retención de ambos proveedores antes de activarlo con datos reales.
        confidence_threshold_label: Confianza mínima (0–1)
        confidence_threshold_help: Por debajo de esta confianza no se aplica la categoría y la transacción queda sin categorizar, para que una ejecución posterior lo vuelva a intentar. No se descarta nada. Pon 0 para aplicar todas las respuestas.
        confidence_threshold_env_notice: Bloqueado por la variable de entorno CATEGORIZATION_CONFIDENCE_THRESHOLD.
        shadow_rate_label: Tasa de comparación en la sombra (0–1)
        shadow_rate_help: Ejecuta el proveedor que NO has seleccionado junto al que sí, y registra en qué discrepan sin cambiar ninguna categoría. Duplica el gasto de API en cada categorización que muestrea. Pon 0 para desactivarlo.
        shadow_rate_env_notice: Bloqueado por la variable de entorno CATEGORIZATION_SHADOW_RATE.
      categorization_shadow_results:
        shadow_results_heading: Comparación en la sombra
        shadow_results_empty: Aún no hay comparaciones registradas. Pon una tasa de comparación en la sombra mayor que 0 y ejecuta la categorización para obtener algunas.
        shadow_results_summary: "%{agreement}%% de coincidencia en %{count} transacciones muestreadas."
        shadow_disagreements_heading: Discrepancias más recientes
        shadow_disagreement_row: "%{applied_provider} eligió %{applied_category}; %{shadow_provider} eligió %{shadow_category}."
        shadow_disagreement_confidence: "(confianza %{confidence})"
        shadow_no_disagreements: Los dos proveedores coincidieron en todas las transacciones muestreadas.
        shadow_no_category: sin categoría
      jev_settings:
        env_configured_message: Configurado correctamente mediante variables de entorno.
        api_key_label: Clave API
        api_key_placeholder: Introduce tu clave API de TypeSafe
        endpoint_label: Endpoint (opcional)
        endpoint_placeholder: https://api.typesafe.ai/v1/systemone (por defecto)
        model_label: Modelo (opcional)
        model_placeholder: jev-latest (por defecto)
        model_help: Por defecto se conecta directamente a TypeSafe. Para llegar a Jev a través de OpenRouter, pon como endpoint https://openrouter.ai/api/alpha/decisions y como modelo ~typesafe/jev-latest.
      openai_settings:
        description: Introduce el token de acceso y, opcionalmente, configura un proveedor compatible con OpenAI personalizado
        env_configured_message: Configurado con éxito a través de variables de entorno.
        access_token_label: Token de Acceso
        access_token_placeholder: Introduce tu token de acceso aquí
        uri_base_label: URL Base de la API (Opcional)
        uri_base_placeholder: https://api.openai.com/v1 (por defecto)
        uri_base_local_help: "Para un modelo en tu propio equipo, introduce su endpoint compatible con OpenAI, por ejemplo Ollama en http://localhost:11434/v1, o http://ollama:11434/v1 si Sure y Ollama se ejecutan como servicios de Docker Compose."
        model_label: Modelo (Opcional)
        model_placeholder: gpt-4.1 (por defecto)
        model_function_calling_help: El asistente de IA lee tus datos mediante llamadas a funciones, así que elige un modelo que tu proveedor indique compatible con tools/function calling. Con un modelo sin esa función, el chat falla con un error opaco del proveedor.
        model_function_calling_link: Comprobar el modelo configurado
        model_required_help: "Obligatorio cuando defines una URL base de la API: introduce el nombre del modelo que usa tu servidor, como llama3.1 para Ollama."
        json_mode_label: Modo JSON
        json_mode_auto: Automático (recomendado)
        json_mode_strict: Estricto (mejor para modelos "thinking")
        json_mode_none: Ninguno (mejor para modelos estándar)
        json_mode_json_object: Objeto JSON
        json_mode_help: El modo Estricto funciona mejor con modelos de razonamiento (qwen-thinking, deepseek-reasoner). El modo Ninguno funciona mejor con modelos estándar (llama, mistral, gpt-oss).
        budget_heading: Presupuesto de tokens
        budget_description: Se aplica a las llamadas compatibles con OpenAI (chat, categorización automática, detección de comercios y procesamiento de PDF). Los valores predeterminados son conservadores para modelos locales de contexto pequeño. Auméntalos para modelos en la nube con ventanas de contexto mayores.
        context_window_label: Ventana de contexto (opcional)
        context_window_help: 'Total de tokens que aceptará el modelo. Predeterminado: 2048 — súbelo a 8192 o más para OpenAI en la nube o modelos locales de contexto grande.'
        max_response_tokens_label: Tokens máximos de respuesta (opcional)
        max_response_tokens_help: 'Tokens reservados para la respuesta del modelo. Predeterminado: 512. Bájalo para dejar sitio a un historial más largo.'
        timeout_heading: Tiempos de espera
        timeout_description: Controla cuánto tiempo pueden ejecutarse las llamadas a modelos compatibles con OpenAI antes de que Sure las cancele. Auméntalos si ejecutas un modelo local en hardware lento.
        openai_request_timeout_label: Tiempo de espera de solicitud en segundos (opcional)
        openai_request_timeout_help: "Predeterminado: 60. Se aplica a cada solicitud HTTP compatible con OpenAI, incluida la categorización automática, la detección de comercios, el chat, el procesamiento de PDF y las llamadas al almacén vectorial. OPENAI_REQUEST_TIMEOUT sobrescribe este campo."
        ai_response_timeout_label: Tiempo de espera de respuesta en segundos (opcional)
        ai_response_timeout_help: "Predeterminado: 90. Solo se aplica al monitor de turno completo del chat, así que dimensiona este valor como una suma: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × tiempo de espera de solicitud, más el tiempo de ejecución de herramientas y cola. AI_RESPONSE_TIMEOUT sobrescribe este campo."
        ai_health_probe_timeout_label: Tiempo de espera de la comprobación en segundos (opcional)
        ai_health_probe_timeout_help: 'Por defecto: 5. Solo se aplica a las comprobaciones de IA en vivo de Ajustes → Estado del sistema, nunca a las llamadas reales a la IA. Súbelo si las comprobaciones de PDF dan un tiempo de espera agotado con un modelo en la nube. AI_HEALTH_PROBE_TIMEOUT tiene prioridad sobre este campo.'
        title: OpenAI
      yahoo_finance_settings:
        title: Yahoo Finance
        description: Yahoo Finance proporciona acceso gratuito a precios de acciones, tipos de cambio y datos financieros sin necesidad de una clave API.
        status_healthy: Yahoo Finance está activo y funcionando.
        status_rate_limited: Yahoo Finance está limitando temporalmente las solicitudes.
        rate_limited_title: Se alcanzó el límite de solicitudes de Yahoo Finance.
        rate_limited_message: No es necesario realizar ninguna acción. Sure evitará comprobaciones de estado adicionales durante 30 minutos. Las operaciones de precios y tipos de cambio continuarán de forma independiente.
        status_unavailable: Yahoo Finance no está disponible en este momento.
        unavailable_title: No se pudo verificar Yahoo Finance.
        unavailable_message: No se pudo contactar con Yahoo Finance o se recibió una respuesta inesperada. Comprueba tu conexión a internet e inténtalo de nuevo más tarde.
        status_unknown: Se está comprobando el estado de Yahoo Finance.
      rentcast_settings:
        title: RentCast
        description: Introduce tu clave API de RentCast para consultar detalles de propiedades de EE. UU. y estimaciones de valor al añadir una propiedad. El nivel gratuito está limitado a 50 solicitudes API al mes, compartidas entre búsquedas de propiedades y actualizaciones diarias de valoración. En un plan de pago, aumenta el límite con la variable de entorno RENTCAST_MAX_REQUESTS_PER_MONTH.
        env_configured_message: Configurado correctamente mediante la variable de entorno RENTCAST_API_KEY.
        label: Clave API
        placeholder: Introduce aquí tu clave API de RentCast
        usage: "%{used} de %{limit} solicitudes mensuales utilizadas"
      realie_settings:
        title: Realie
        description: Introduce tu clave API de Realie para consultar detalles de propiedades de EE. UU. y estimaciones de valor al añadir una propiedad. El nivel gratuito está limitado a 25 solicitudes API al mes, compartidas entre búsquedas de propiedades y actualizaciones diarias de valoración. En un plan de pago, aumenta el límite con la variable de entorno REALIE_MAX_REQUESTS_PER_MONTH.
        env_configured_message: Configurado correctamente mediante la variable de entorno REALIE_API_KEY.
        label: Clave API
        placeholder: Introduce aquí tu clave API de Realie
        usage: "%{used} de %{limit} solicitudes mensuales utilizadas"
      chimnie_settings:
        title: Chimnie
        description: Introduce tu clave API de Chimnie para valorar viviendas del Reino Unido por su UPRN. Crea una clave gratuita en dashboard.chimnie.com (el registro exige un email de empresa o de dominio propio; no se aceptan direcciones de Gmail, Outlook y similares). Las valoraciones por UPRN son gratuitas y se actualizan cada mes; Sure las limita a 1.000 peticiones al mes, algo que puedes cambiar con la variable de entorno CHIMNIE_MAX_REQUESTS_PER_MONTH.
        env_configured_message: Configurado correctamente mediante la variable de entorno CHIMNIE_API_KEY.
        label: Clave API
        placeholder: Introduce aquí tu clave API de Chimnie
        usage: "%{used} de %{limit} peticiones mensuales usadas"
      tiingo_settings:
        title: Tiingo
        description: Introduce el token de API proporcionado por Tiingo. El plan gratuito admite 50 símbolos únicos por hora con más de 30 años de datos históricos.
        env_configured_message: Configurado correctamente mediante la variable de entorno TIINGO_API_KEY.
        label: Token de API
        placeholder: Introduce aquí tu token de API de Tiingo
        show_details: (ver detalles)
        step_1_html: Visita <a href="https://www.tiingo.com" target="_blank" rel="noopener noreferrer" class="underline">tiingo.com</a> y crea una cuenta gratuita.
        step_2_html: Ve a la página <a href="https://www.tiingo.com/account/api/token" target="_blank" rel="noopener noreferrer" class="underline">API Token</a>.
        step_3: Copia tu token de API y pégalo abajo.
      tinkoff_invest_settings:
        title: T-Invest (T-Bank)
        description: Introduce un token de API de T-Invest de solo lectura. Se usa para obtener los logotipos de marcas de los valores (incl. fondos y bonos, incluso cuando los cotiza MOEX) y, si lo activas arriba, los precios de instrumentos rusos.
        moex_only_notice: No activado para precios arriba. T-Invest se usa para obtener los logotipos de marca de todos tus valores siempre que haya un token configurado, independientemente de la casilla de arriba.
        env_configured_message: Configurado correctamente mediante la variable de entorno TINKOFF_INVEST_API_KEY.
        label: Token de API
        placeholder: Introduce aquí tu token de API de T-Invest
        show_details: (ver detalles)
        step_1: Abre las inversiones de T-Bank, luego Ajustes y después Tokens de API (requiere una cuenta de bróker abierta en T-Bank).
        step_2: Crea un token con acceso de solo lectura.
        step_3: Copia el token y pégalo abajo.
      eodhd_settings:
        title: EODHD
        description: Introduce el token de API proporcionado por EODHD. Admite ETF de la UE en LSE, XETRA y otras bolsas internacionales.
        env_configured_message: Configurado correctamente mediante la variable de entorno EODHD_API_KEY.
        label: Token de API
        placeholder: Introduce aquí tu token de API de EODHD
        show_details: (ver detalles)
        step_1_html: Visita <a href="https://eodhd.com/register" target="_blank" rel="noopener noreferrer" class="underline">eodhd.com</a> y crea una cuenta gratuita.
