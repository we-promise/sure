        select_demo_family: Primeiro selecione uma família de demonstração descartável.
      disconnect_external_assistant:
        external_assistant_disconnected: Assistente externo desligado
      clear_cache:
        cache_cleared: A cache de dados foi limpa. A operação pode demorar alguns
