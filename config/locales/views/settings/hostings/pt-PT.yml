      not_authorized: Não está autorizado a efetuar esta operação
      ensure_admin:
        not_authorized: Não está autorizado a efetuar esta operação
      ensure_super_admin_for_onboarding:
        not_authorized: Não está autorizado a efetuar esta operação
      sync_auto_sync_scheduler!:
        scheduler_sync_failed: >-
          As definições foram guardadas, mas não foi possível atualizar o agendamento
          da sincronização. Tente novamente ou consulte os registos do servidor.
      sync_settings:
        auto_sync_label: Ativar sincronização automática
        auto_sync_description: >-
          Quando ativada, todas as contas serão sincronizadas automaticamente todos
          os dias à hora especificada.
        auto_sync_time_label: Hora de sincronização (HH:MM)
        auto_sync_time_description: Defina a hora para a sincronização automática.
        include_pending_label: Incluir transações pendentes
        include_pending_description: >-
          Quando ativada, a opção permite importar automaticamente as transações pendentes
          (não liquidadas) e reconciliá-las quando forem registadas. Desative-a se
          o seu banco fornecer informações pouco fiáveis sobre transações pendentes.
        env_configured_message: >-
          Esta definição está desativada porque está definida uma variável de ambiente
          do serviço (SIMPLEFIN_INCLUDE_PENDING ou PLAID_INCLUDE_PENDING). Remova-a
          para ativar esta definição.
      categorization_provider_selector:
        confidence_threshold_env_notice: Definido pela variável de ambiente CATEGORIZATION_CONFIDENCE_THRESHOLD.
        confidence_threshold_help: >-
          Abaixo desse nível de confiança, a categoria não é aplicada e a transação
          fica sem categoria, permitindo uma nova tentativa numa execução posterior.
          Nada é descartado. Defina como 0 para aplicar todas as respostas.
        confidence_threshold_label: Confiança mínima (0–1)
        data_retention_direct: >-
          As descrições e os valores das transações, além dos nomes das suas categorias,
          são enviados à TypeSafe para categorização. Reveja a política de retenção
          da empresa antes de ativar este recurso com dados reais.
        data_retention_heading: Partilha de dados
        data_retention_proxied: >-
          As descrições e os valores das transações, além dos nomes das suas categorias,
          são enviados a %{host}, que os encaminha à TypeSafe. Reveja as políticas
          de retenção de ambos os fornecedores antes de ativar este recurso com dados
          reais.
        description: >-
          Escolha o fornecedor que categoriza as transações. Esta configuração é independente
          do fornecedor de IA acima, responsável pelo chat e pelo processamento de
          PDFs.
        env_notice: Definido como %{type} por variáveis de ambiente.
        jev_configured: Chave de API do Jev configurada.
        jev_not_configured: >-
          O Jev está selecionado, mas não tem uma chave de API configurada. A categorização
          continua a utilizar o fornecedor de IA até adicionar uma chave abaixo.
        preview_pill: Pré-visualizar
        provider_help: >-
          O fornecedor de IA lê um lote de transações e devolve os nomes das categorias.
          O Jev escolhe entre as categorias da sua lista e devolve um nível de confiança
          calibrado para cada transação.
        provider_jev: Jev (TypeSafe)
        provider_label: Fornecedor de categorização
        provider_llm: Fornecedor de IA (OpenAI ou Anthropic)
        shadow_rate_env_notice: Definido pela variável de ambiente CATEGORIZATION_SHADOW_RATE.
        shadow_rate_help: >-
          Executa o fornecedor que NÃO selecionou em paralelo com o escolhido, registando
          divergências sem alterar qualquer categoria. Isto duplica o custo da API
          em cada execução de categorização incluída na amostra. Defina 0 para desativar.
        shadow_rate_label: Taxa de comparação em paralelo (0–1)
        title: Categorização de transações
      categorization_shadow_results:
        shadow_disagreement_confidence: "(confiança %{confidence})"
        shadow_disagreement_row: >-
          %{applied_provider} escolheu %{applied_category}; %{shadow_provider} escolheu
          %{shadow_category}.
        shadow_disagreements_heading: Divergências mais recentes
        shadow_no_category: sem categoria
        shadow_no_disagreements: Os dois fornecedores concordaram em todas as transações
          da amostra.
        shadow_results_empty: >-
          Nenhuma comparação registada ainda. Defina uma taxa de comparação em paralelo
          maior que 0 e execute a categorização para recolher resultados.
        shadow_results_heading: Comparação em paralelo
        shadow_results_summary: "%{agreement}%% de concordância em %{count} transações
          da amostra."
      demo_refresh_settings:
        description: >-
          Atualiza automaticamente apenas a família de demonstração selecionada. Todos
          os dados e acessos dela serão removidos. As outras famílias não serão afetadas.
          Requer um worker em execução com pelo menos 2 GiB de RAM. Primeiro crie
          uma família descartável com o gerador de demonstração e depois selecione-a
          aqui. Não escolha uma família de utilizadores reais.
        enabled_label: Ativar atualização diária da família de demonstração
        family_label: Família de demonstração descartável
        none: Nenhuma família de demonstração selecionada
        save_family: Guardar família de demonstração
      jev_settings:
        api_key_label: Chave de API
        api_key_placeholder: Introduza a sua chave de API da TypeSafe
        endpoint_label: Endpoint (opcional)
        endpoint_placeholder: https://api.typesafe.ai/v1/systemone (predefinição)
        env_configured_message: Configurado com sucesso através de variáveis de ambiente.
        model_help: >-
          Por predefinição, liga diretamente à TypeSafe. Para aceder ao Jev através
          do OpenRouter, defina o endpoint como https://openrouter.ai/api/alpha/decisions
          e o modelo como ~typesafe/jev-latest.
        model_label: Modelo (Opcional)
        model_placeholder: jev-latest (predefinição)
      mansa_settings:
        description: >-
          Introduza a chave de API da Mansa API. Oferece suporte à NGX (bolsa nigeriana),
          que não é coberta por nenhum outro fornecedor aqui. A Mansa também cobre
          outras bolsas africanas, mas apenas a NGX foi verificada nesta integração.
        env_configured_message: Configurado com sucesso pela variável de ambiente
          MANSA_API_KEY.
        label: Chave de API
        placeholder: Introduza a sua chave de API da Mansa aqui
        rate_limit_warning: >-
          O plano gratuito da Mansa é limitado a 100 chamadas de API por dia e fornece
          apenas cotações atuais; os preços históricos exigem um plano pago. Apenas
          a NGX (bolsa nigeriana) foi verificada nesta integração; as outras bolsas
          africanas cobertas pela Mansa ainda não são compatíveis aqui.
        show_details: "(mostrar detalhes)"
        step_1_html: >-
          Visite <a href="https://mansaapi.com" target="_blank" rel="noopener noreferrer"
          class="underline">mansaapi.com</a> e obtenha a sua chave de API gratuita,
          sem necessidade de cartão.
        step_2: Copie a sua chave de API e cole-a abaixo.
        title: Mansa
