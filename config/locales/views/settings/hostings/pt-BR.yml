          são combinados.
        securities_title: Serviços de Valores Mobiliários
        tinkoff_invest_hint: >-
          requer token somente de leitura — preços de ações/fundos/títulos russos
          e logotipos das marcas
        twelve_data_hint: requer chave de API, 800 créditos/dia
        yahoo_finance_hint: gratuito, sem necessidade de chave de API
      brand_fetch_settings:
        description: Insira o Client ID fornecido pelo Brandfetch
        label: ID do cliente
        placeholder: Insira seu Client ID aqui
        title: Configurações do Brandfetch
        env_configured_message: >-
          Configurou com sucesso o seu Client ID da Brandfetch através da variável
          de ambiente BRAND_FETCH_CLIENT_ID.
        high_res_description: >-
          Quando ativado, os logotipos serão obtidos na resolução 120x120 em vez de
          40x40. Isso oferece imagens mais nítidas em telas de alta densidade de pixels.
        high_res_label: Ativar logotipos de alta resolução
        setup_step_1_html: >-
          Visite <a href="https://brandfetch.com/developers" target="_blank" rel="noopener
          noreferrer" class="underline">brandfetch.com</a> e crie uma conta gratuita
          de desenvolvedor da Brandfetch.
        setup_step_2_html: >-
          Vá para a página <a href="https://developers.brandfetch.com/dashboard/logo-api"
          target="_blank" rel="noopener noreferrer" class="underline">Logo API</a>.
        setup_step_3: >-
          Toque no ícone de olho na seção "Your Client ID" para revelar o seu Client
          ID e cole-o abaixo.
        show_details: "(mostrar detalhes)"
      openai_settings:
        description: >-
          Insira o token de acesso e configure opcionalmente um provedor compatível
          com OpenAI personalizado
        env_configured_message: Configurado com sucesso através de variáveis de ambiente.
        access_token_label: Token de Acesso
        access_token_placeholder: Insira seu token de acesso aqui
        uri_base_label: URL Base da API (Opcional)
        uri_base_placeholder: https://api.openai.com/v1 (padrão)
        model_label: Modelo (Opcional)
        model_placeholder: gpt-4.1 (padrão)
        title: OpenAI
        ai_response_timeout_help: >-
          Padrão: 90. Aplica-se apenas ao monitor do tempo total de uma interação
          no chat. Calcule-o como a soma de (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS)
          × tempo limite da solicitação, mais o tempo de execução das ferramentas
          e de espera na fila. AI_RESPONSE_TIMEOUT substitui este campo.
        ai_response_timeout_label: Tempo Limite de Resposta em Segundos (Opcional)
        budget_description: >-
          Aplica-se a chamadas compatíveis com OpenAI (chat, categorização automática,
          identificação de estabelecimentos e processamento de PDFs). Os valores padrão
          são conservadores para modelos locais com contexto pequeno. Aumente-os para
          modelos na nuvem com janelas de contexto maiores.
        budget_heading: Orçamento de Tokens
        context_window_help: >-
          Total de tokens aceitos pelo modelo. Padrão: 2048 — aumente para 8192 ou
          mais para a OpenAI na nuvem ou modelos locais com contexto grande.
        context_window_label: Janela de Contexto (Opcional)
        json_mode_auto: Automático (recomendado)
        json_mode_help: >-
          O modo Estrito funciona melhor com modelos de raciocínio (qwen-thinking,
          deepseek-reasoner). O modo Nenhum funciona melhor com modelos padrão (llama,
          mistral, gpt-oss).
        json_mode_json_object: Objeto JSON
        json_mode_label: Modo JSON
        json_mode_none: Nenhum (melhor para modelos padrão)
        json_mode_strict: Estrito (melhor para modelos de raciocínio)
        max_items_per_call_help: >-
          Limite máximo dos lotes de categorização automática ou identificação de
          estabelecimentos. Padrão: 25. Lotes maiores são divididos automaticamente
          para caber na janela de contexto.
        max_items_per_call_label: Máx. de Itens por Lote (Opcional)
        max_response_tokens_help: >-
          Tokens reservados para a resposta do modelo. Padrão: 512. Reduza para abrir
          espaço para um histórico mais longo.
        max_response_tokens_label: Máx. de Tokens de Resposta (Opcional)
        model_function_calling_help: >-
          O assistente de IA lê seus dados por meio de chamadas de funções. Escolha
          um modelo cujo provedor documente o suporte a ferramentas/chamadas de funções.
          Sem esse suporte, o chat falha com um erro pouco esclarecedor do provedor.
        model_function_calling_link: Verificar o modelo configurado
        openai_request_timeout_help: >-
          Padrão: 60. Aplica-se a cada solicitação HTTP compatível com OpenAI, incluindo
          categorização automática, identificação de estabelecimentos, chat, processamento
          de PDFs e chamadas ao armazenamento de vetores. OPENAI_REQUEST_TIMEOUT substitui
          este campo.
        openai_request_timeout_label: Tempo limite da solicitação em segundos (opcional)
        timeout_description: >-
          Controla por quanto tempo as chamadas a modelos compatíveis com OpenAI podem
          executar antes de o Sure desistir. Aumente estes valores se você usa um
          modelo local em hardware lento.
        timeout_heading: Tempos limite
      yahoo_finance_settings:
        title: Yahoo Finance
        description: >-
          O Yahoo Finance fornece acesso gratuito a preços de ações, taxas de câmbio
          e dados financeiros sem exigir uma chave de API.
        status_active: O Yahoo Finance está ativo e funcionando
        status_inactive: Falha na conexão com o Yahoo Finance
        connection_failed: Não foi possível conectar ao Yahoo Finance
        troubleshooting: >-
          Verifique sua conexão com a internet e as configurações de firewall. O Yahoo
          Finance pode estar temporariamente indisponível.
        rate_limited_message: >-
          Não é necessária qualquer ação. O Sure evitará verificações de estado adicionais
          durante 30 minutos. As operações de preço e de taxa de câmbio continuam
          de forma independente.
        rate_limited_title: Limite de pedidos do Yahoo Finance atingido.
        status_healthy: O Yahoo Finance está ativo e funcionando.
        status_rate_limited: O Yahoo Finance está limitando temporariamente as solicitações.
        status_unavailable: O Yahoo Finance está atualmente indisponível.
        status_unknown: O estado do Yahoo Finance está sendo verificado.
        unavailable_message: >-
          Não foi possível entrar em contato com o Yahoo Finance ou este devolveu
          uma resposta inesperada. Verifique a sua conexão à internet e tente novamente
          mais tarde.
        unavailable_title: Não foi possível verificar o Yahoo Finance.
      twelve_data_settings:
