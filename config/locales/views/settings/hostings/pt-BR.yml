          yahoo_finance: Yahoo Finance
          alpha_vantage: Alpha Vantage
          binance_public: Binance
          eodhd: EODHD
          frankfurter: Frankfurter
          mansa: Mansa
          mfapi: MFAPI.in
          moex_public: MOEX
          tiingo: Tiingo
          tinkoff_invest: T-Invest (T-Bank)
        binance_public_hint: gratuito, sem chave de API -- apenas criptomoedas (BTC,
