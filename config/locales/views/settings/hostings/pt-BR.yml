        page_cache_cooldown_minutes_label: Recriar páginas em cache no máximo a cada (minutos)
        page_cache_cooldown_minutes_description: "Quando os dados de uma página em cache mudam, a versão que você tinha continua sendo exibida enquanto uma nova é gerada em segundo plano, no máximo uma vez a cada intervalo com este número de minutos. O botão Atualizar na página a recria na hora. 0 recria após cada alteração. Padrão: %{default_minutes}. PAGE_CACHE_COOLDOWN_MINUTES tem prioridade sobre este campo."
        page_cache_max_mb_label: Tamanho máximo do cache (MB)
        page_cache_max_mb_description: "O espaço máximo que as páginas em cache podem ocupar juntas. Quando uma nova página ultrapassaria esse limite, as páginas abertas há mais tempo são descartadas primeiro; uma página maior que o limite inteiro é exibida, mas não é mantida. Em uso: %{used} de %{limit}. Padrão: %{default_mb}. PAGE_CACHE_MAX_MB tem prioridade sobre este campo."
        include_pending_label: Incluir transações pendentes
        include_pending_description: Quando ativado, as transações pendentes (ainda não compensadas) serão importadas e conciliadas automaticamente quando forem lançadas. Desative se o seu banco fornece dados de pendentes pouco confiáveis.
