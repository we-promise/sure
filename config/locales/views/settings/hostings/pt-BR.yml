        api_key_placeholder: Digite sua chave de API da TypeSafe
        endpoint_label: Endpoint (opcional)
        endpoint_placeholder: https://api.typesafe.ai/v1/systemone (padrão)
        env_configured_message: Configurado com sucesso através de variáveis de ambiente.
