        title: Anthropic (Claude)
      assistant_settings:
        agent_discovery_configure_first: >-
          Salve uma URL de endpoint válida e um token de API para carregar os agentes
          disponíveis.
        agent_discovery_error: 'Não foi possível carregar os agentes: %{error}'
        agent_id_help: >-
          O Sure carrega esta lista da resposta de /v1/models do endpoint. O agente
          selecionado determina o roteamento; o modelo usado por ele é gerenciado
          pelo serviço externo.
        agent_id_label: Agente (obrigatório)
        agent_id_placeholder: main (padrão)
        confirm_disconnect:
          body: >-
            Isso removerá a URL, o token e o ID do agente salvos e mudará para o assistente
            integrado. Você poderá reconectar depois, informando novas credenciais.
          title: Desconectar assistente externo?
        description: >-
          Escolha como o assistente de chat responde. O assistente integrado usa diretamente
          o provedor de LLM configurado. O externo delega a um agente de IA remoto,
          que pode acessar as ferramentas financeiras do Sure via MCP.
        disconnect_button: Desconectar
        disconnect_description: Remova a conexão com o assistente externo e volte
          ao assistente integrado.
        disconnect_title: Conexão externa
        env_configured_external: Configurado com sucesso através de variáveis de ambiente.
        env_notice: >-
          O tipo de assistente está bloqueado em '%{type}' através da variável de
          ambiente ASSISTANT_TYPE.
        external_agent_invalid: Selecione um agente retornado pelo endpoint configurado.
        external_agent_required: Selecione um agente externo antes de salvar.
        external_agent_reselect: >-
          O endpoint mudou e o agente selecionado anteriormente não está disponível
          nele. Selecione um agente do novo endpoint.
        external_configured: Configurado
        external_info:
          items:
          - >-
            Informe a URL completa do endpoint compatível com OpenAI, terminando em
            /v1/chat/completions.
          - >-
            O Sure descobre os agentes disponíveis em /v1/models depois que o endpoint
            e o token são salvos.
          - >-
            O serviço externo escolhe o modelo de cada agente; o Sure seleciona apenas
            a rota do agente.
          - >-
            Erros de autenticação, endpoint ou agente são retornados pelo serviço
            externo. Consulte os logs dele quando uma solicitação falhar.
          title: Configuração da IA externa
        external_not_configured: >-
          Não configurado. Digite o URL e o token abaixo, ou defina as variáveis de
          ambiente EXTERNAL_ASSISTANT_URL e EXTERNAL_ASSISTANT_TOKEN.
        external_status: Endpoint do assistente externo
        title: Assistente de IA
        token_help: >-
          O token de autenticação fornecido pelo seu agente externo. É enviado como
          um token Bearer com cada pedido.
        token_label: Token de API
        token_placeholder: Digite o token do seu serviço de agente
        type_builtin: Integrado (LLM direto)
        type_external: Externo (agente remoto)
        type_label: Tipo de assistente
        url_help: >-
          A URL completa do endpoint da API do seu agente, fornecida pelo provedor
          do agente.
        url_label: URL do Endpoint
        url_placeholder: https://your-agent-host/v1/chat
      categorization_provider_selector:
        confidence_threshold_env_notice: Definido pela variável de ambiente CATEGORIZATION_CONFIDENCE_THRESHOLD.
        confidence_threshold_help: >-
          Abaixo desse nível de confiança, a categoria não é aplicada e a transação
          fica sem categoria, permitindo uma nova tentativa em uma execução posterior.
          Nada é descartado. Defina como 0 para aplicar todas as respostas.
        confidence_threshold_label: Confiança mínima (0–1)
        data_retention_direct: >-
          As descrições e os valores das transações, além dos nomes das suas categorias,
          são enviados à TypeSafe para categorização. Revise a política de retenção
          da empresa antes de ativar este recurso com dados reais.
        data_retention_heading: Compartilhamento de dados
        data_retention_proxied: >-
          As descrições e os valores das transações, além dos nomes das suas categorias,
          são enviados a %{host}, que os encaminha à TypeSafe. Revise as políticas
          de retenção de ambos os provedores antes de ativar este recurso com dados
          reais.
        description: >-
          Escolha o provedor que categoriza as transações. Esta configuração é independente
          do provedor de IA acima, responsável pelo chat e pelo processamento de PDFs.
        env_notice: Definido como %{type} por variáveis de ambiente.
        jev_configured: Chave de API do Jev configurada.
        jev_not_configured: >-
          O Jev está selecionado, mas não tem uma chave de API configurada. A categorização
          continuará usando o provedor de IA até que você adicione uma chave abaixo.
        preview_pill: Prévia
        provider_help: >-
          O provedor de IA lê um lote de transações e retorna os nomes das categorias.
          O Jev escolhe entre as categorias da sua lista e retorna um nível de confiança
          calibrado para cada transação.
        provider_jev: Jev (TypeSafe)
        provider_label: Provedor de categorização
        provider_llm: Provedor de IA (OpenAI ou Anthropic)
        shadow_rate_env_notice: Definido pela variável de ambiente CATEGORIZATION_SHADOW_RATE.
        shadow_rate_help: >-
          Executa o provedor que você NÃO selecionou em paralelo com o escolhido,
          registrando divergências sem alterar nenhuma categoria. Isso dobra o gasto
          com API em cada execução de categorização incluída na amostra. Defina como
          0 para desativar.
        shadow_rate_label: Taxa de comparação em paralelo (0–1)
        title: Categorização de transações
      categorization_shadow_results:
        shadow_disagreement_confidence: "(confiança %{confidence})"
        shadow_disagreement_row: >-
          %{applied_provider} escolheu %{applied_category}; %{shadow_provider} escolheu
          %{shadow_category}.
        shadow_disagreements_heading: Divergências mais recentes
        shadow_no_category: sem categoria
        shadow_no_disagreements: Os dois provedores concordaram em todas as transações
          da amostra.
        shadow_results_empty: >-
          Nenhuma comparação registrada ainda. Defina uma taxa de comparação em paralelo
          maior que 0 e execute a categorização para coletar resultados.
        shadow_results_heading: Comparação em paralelo
        shadow_results_summary: "%{agreement}%% de concordância em %{count} transações
          da amostra."
      demo_refresh_settings:
        description: >-
          Atualiza automaticamente apenas a família de demonstração selecionada. Todos
          os dados e logins dela serão removidos. As outras famílias não serão afetadas.
          Requer um worker em execução com pelo menos 2 GiB de RAM. Primeiro crie
          uma família descartável com o gerador de demonstração e depois selecione-a
          aqui. Não escolha uma família de usuários reais.
        enabled_label: Ativar atualização diária da família de demonstração
        family_label: Família de demonstração descartável
        none: Nenhuma família de demonstração selecionada
        save_family: Salvar família de demonstração
      disconnect_external_assistant:
