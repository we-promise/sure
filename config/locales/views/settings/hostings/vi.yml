      tinkoff_invest_settings:
        title: T-Invest (T-Bank)
        description: Nhập token API T-Invest chỉ đọc. Dùng để lấy logo thương hiệu cho chứng khoán (kể cả quỹ và trái phiếu, ngay cả khi giá lấy từ MOEX) và, khi được bật ở trên, giá cho các công cụ tài chính Nga.
        moex_only_notice: Chưa bật lấy giá ở trên — T-Invest vẫn được dùng để lấy logo thương hiệu cho mọi chứng khoán của bạn khi đã cấu hình token, bất kể ô đánh dấu ở trên.
        env_configured_message: Đã cấu hình thành công qua biến môi trường TINKOFF_INVEST_API_KEY.
        label: Token API
        placeholder: Nhập token API T-Invest của bạn vào đây
        show_details: (hiển thị chi tiết)
        step_1: Mở mục đầu tư của T-Bank, vào Cài đặt, rồi Token API (cần có tài khoản môi giới T-Bank đang mở).
        step_2: Tạo token với quyền chỉ đọc.
        step_3: Sao chép token và dán vào bên dưới.
      mansa_settings:
        title: Mansa
        description: Nhập khóa API từ Mansa API. Hỗ trợ NGX (Sở giao dịch Nigeria), sàn mà các nhà cung cấp khác ở đây chưa hỗ trợ. Mansa cũng hỗ trợ các sàn châu Phi khác, nhưng chỉ NGX đã được kiểm chứng với tích hợp này.
        env_configured_message: Đã cấu hình thành công qua biến môi trường MANSA_API_KEY.
        label: Khóa API
        placeholder: Nhập khóa API Mansa của bạn vào đây
        show_details: (hiển thị chi tiết)
        step_1_html: Truy cập <a href="https://mansaapi.com" target="_blank" rel="noopener noreferrer" class="underline">mansaapi.com</a> và nhận khóa API miễn phí -- không cần thẻ.
        step_2: Sao chép khóa API và dán vào bên dưới.
        rate_limit_warning: Gói miễn phí của Mansa giới hạn 100 lần gọi API mỗi ngày và chỉ cung cấp giá hiện tại -- giá lịch sử yêu cầu gói trả phí. Chỉ NGX (Sở giao dịch Nigeria) đã được kiểm chứng với tích hợp này; các sàn châu Phi khác mà Mansa hỗ trợ chưa được hỗ trợ ở đây.
