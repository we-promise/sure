        openai_request_timeout_label: Thời gian chờ yêu cầu tính bằng giây (Tùy chọn)
        openai_request_timeout_help: 'Mặc định: 60. Áp dụng cho mỗi yêu cầu HTTP tương thích OpenAI, bao gồm phân loại tự động, phát hiện người bán, trò chuyện, xử lý PDF và lệnh gọi kho vector. OPENAI_REQUEST_TIMEOUT sẽ ghi đè trường này.'
