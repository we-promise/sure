        ai_response_timeout_help: 'Mặc định: 90. Chỉ áp dụng cho bộ giám sát thời gian của toàn bộ lượt trò chuyện, nên hãy đặt giá trị theo tổng: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × thời gian chờ yêu cầu, cộng thời gian thực thi công cụ và thời gian chờ hàng đợi. AI_RESPONSE_TIMEOUT sẽ ghi đè trường này.'
