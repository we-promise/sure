        budget_description: Se aplică apelurilor compatibile OpenAI (chat, categorizare automată, detectarea comercianților și procesarea PDF-urilor). Valorile implicite sunt prudente, pentru modele locale cu context mic. Mărește-le pentru modelele cloud cu ferestre de context mai mari.
