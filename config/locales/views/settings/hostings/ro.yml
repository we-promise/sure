        max_response_tokens_label: Număr maxim de tokeni pentru răspuns (opțional)
        max_response_tokens_help: 'Tokeni rezervați pentru răspunsul modelului. Implicit: 512. Micșorează valoarea pentru a face loc unui istoric mai lung.'
        max_items_per_call_label: Număr maxim de elemente per lot (opțional)
        max_items_per_call_help: 'Limita superioară pentru loturile de categorizare automată / detectare a comercianților. Implicit: 25. Loturile mai mari sunt împărțite automat pentru a încăpea în fereastra de context.'
        timeout_heading: Timpi de expirare
        timeout_description: Controlează cât pot rula apelurile către modelele compatibile OpenAI înainte ca Sure să renunțe. Mărește valorile dacă rulezi un model local pe hardware lent.
        openai_request_timeout_label: Timp de expirare a cererii, în secunde (opțional)
        openai_request_timeout_help: 'Implicit: 60. Se aplică fiecărei cereri HTTP compatibile OpenAI, inclusiv categorizarea automată, detectarea comercianților, chatul, procesarea PDF-urilor și apelurile către depozitul vectorial. OPENAI_REQUEST_TIMEOUT are prioritate față de acest câmp.'
        ai_response_timeout_label: Timp de expirare a răspunsului, în secunde (opțional)
        ai_response_timeout_help: 'Implicit: 90. Se aplică doar limitei de timp pentru o tură completă de chat, așa că dimensionează valoarea ca sumă: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × timpul de expirare a cererii, plus timpul de execuție a instrumentelor și de așteptare în coadă. AI_RESPONSE_TIMEOUT are prioritate față de acest câmp.'
