      mansa_settings:
        title: Mansa
        description: Introdu cheia API de la Mansa API. Acceptă NGX (Nigerian Exchange), care nu este acoperită de niciun alt furnizor de aici. Mansa acoperă și alte burse africane, dar doar NGX este verificată pentru această integrare.
