        step_2_html: Mergi la pagina <a href="https://www.tiingo.com/account/api/token" target="_blank" rel="noopener noreferrer" class="underline">API Token</a>.
        step_3: Copiază tokenul API și lipește-l mai jos.
      tinkoff_invest_settings:
        title: T-Invest (T-Bank)
        description: Introdu un token API T-Invest doar pentru citire. Este folosit pentru a obține logo-urile de brand ale titlurilor de valoare (inclusiv fonduri și obligațiuni, chiar dacă prețurile vin de la MOEX) și, dacă este activat mai sus, prețurile instrumentelor rusești.
        moex_only_notice: Nu este activat pentru prețuri mai sus — T-Invest este folosit pentru a obține logo-urile de brand pentru toate titlurile tale de valoare ori de câte ori este configurat un token, indiferent de caseta de mai sus.
        env_configured_message: Configurat cu succes prin variabila de mediu TINKOFF_INVEST_API_KEY.
        label: Token API
        placeholder: Introdu aici tokenul API T-Invest
        show_details: (afișează detalii)
        step_1: Deschide investițiile T-Bank, apoi Settings, apoi API tokens (necesită un cont de brokeraj T-Bank deschis).
        step_2: Creează un token cu acces doar pentru citire.
        step_3: Copiază tokenul și lipește-l mai jos.
