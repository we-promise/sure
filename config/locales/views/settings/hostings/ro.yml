        rate_limit_warning: Nivelul gratuit Mansa este limitat la 100 de apeluri API pe zi și oferă doar cotațiile curente -- prețurile istorice necesită un plan plătit. Doar NGX (Nigerian Exchange) este verificată pentru această integrare; celelalte burse africane acoperite de Mansa nu sunt încă acceptate aici.
