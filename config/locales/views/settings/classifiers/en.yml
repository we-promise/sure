      matcher:
        lock_similar_merchants: Lock the merchants the matcher sets
        lock_similar_merchants_hint: Stops rules, AI and syncs changing them, unless you click Apply on a rule. Its own locks don't count as confirmed (Merchant matcher tuning).
        rule: Fill in missing merchants from near-duplicates
        rule_hint: "The Merchant matcher rule, on and off with it in Rules. In your rule order, a transaction without a merchant gets the one its near-duplicates, like \"NETFLIX.COM 8812\" and \"Netflix com\", all have. Transfers are left out."
        similar_threshold: Similarity
        similar_threshold_hint: Lowest similarity of the descriptions, ignoring numbers and reference codes (0.5–0.99). Lower fills more, with more mistakes. Auto-tune's Apply sets it too.
      matcher_tuning:
        similar_common_share: Cutoff
        similar_common_share_hint: A word or 3-letter piece in more than this share of the transactions it copies from (0.01–1), and in at least 50 of them, is too common to tell them apart, like "card" or "payment", so it's ignored. Higher counts more of them. Auto-tune's Apply sets it too.
        similar_min_neighbours: Merchants agreeing
        similar_min_neighbours_hint: How many near-duplicates must have the merchant, with none having another. 1 copies a single transaction, mistakes too.
        similar_min_neighbours_option:
          one: 1 merchant
          other: "%{count} merchants"
        similar_skip_self: Don't copy from the matcher's own merchants until confirmed or this many days old
        similar_skip_self_hint: Confirmed means you changed or locked it. A wrong copy isn't spread; one left alone that long counts as accepted.
      merchant:
        merchant_field: Include the merchant as one token, when set
        merchant_field_hint: Counts by identity, so a renamed merchant keeps its history.
        merchant_name_words: Include the merchant's name as words
        merchant_name_words_hint: Read like the description, as the original does, so similar names share evidence. Overlaps with the token below.
      run:
        success: Bayes is categorizing uncategorized transactions. This may take a few moments.
      scoring:
        complement: Use complement naive Bayes
        complement_hint: Scores each category by how badly the transaction fits the others, which copes better with categories of very different sizes. Off is the original multinomial.
        prior: Include how often each category is used
        prior_hint: Leans towards the categories you use most. Off treats every category alike, as the original does.
        separate_fields: Score the merchant and account apart from the words
        separate_fields_hint: Each gets its own distribution, so a long description doesn't outweigh them. Needs the merchant or the account included; the amount is always scored on its own.
        smoothing: Smoothing
        smoothing_hint: Added to every count so an unseen word doesn't rule a category out (0.001–10). 1 is the original's; lower trusts what's been seen more.
      show:
        add_rule_body: There's no %{name} rule in your rules, so there's nothing to turn on. Add it to the top of your rules?
