        skip_self_labels_hint: 직접 변경하거나 잠근 항목은 확인된 것으로 봅니다. 잘못된 예측이 다시 학습되어 강화되지 않게
          하며, 지정한 기간 동안 그대로 둔 예측은 수락한 것으로 간주합니다.
