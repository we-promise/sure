---
ru:
  settings:
    classifiers:
      account:
        account_field: Учитывать счёт как один токен
        account_field_hint: 'Счёт, на котором находится операция, учитывается как признак. Сам по себе он ничего не решает:
          для операции нужно известное слово или продавец.'
      add_rule:
        success: Правило «%{name}» добавлено в начало списка правил.
      amount:
        amount_by_direction: Учитывать направление — поступление или списание
        amount_by_direction_hint: Каждая категория изучает направление движения денег, поэтому возвраты и покупки у одного
          продавца не смешиваются.
        amount_field: Учитывать сумму
        amount_field_hint: Сравнивает сумму с обычными суммами каждой категории в той же валюте по логарифмической шкале.
      category_training:
        apply: Применить
        categories: Категории
        categories_all: Все категории
        categories_hint: Неотмеченные категории и их подкатегории не участвуют в обучении, поэтому Байес их не выбирает.
        categories_some: '%{count} из %{total} категорий'
        exclude_transfers: Исключить переводы
        exclude_transfers_hint: Переводы и платежи между вашими счетами.
        search_categories: Найти категории
        skip_self_labels: Не обучаться на предположениях Байеса, пока их не подтвердят или пока не пройдёт столько дней
        skip_self_labels_hint: Подтверждение — изменение или блокировка категории. Неверное предположение не возвращается
          в обучение и не закрепляется; оставленное без изменений столько времени считается принятым.
      classifier:
        apply: Применить
        lock_results: Блокировать категории, заданные классификатором
        lock_results_hint: Не даёт правилам менять выбор Байеса, пока вы не нажмёте «Применить» у правила. ИИ не меняет выбор
          Байеса ни с блокировкой, ни без неё.
        rule: Категоризировать с помощью классификатора
        rule_hint: Правило «Классификатор категорий» включается и выключается вместе с ним в разделе «Правила». После каждой
          синхронизации оно категоризирует некатегоризированные операции в порядке правил; неуверенные результаты оставляет
          правилу автокатегоризации.
        threshold: Порог
        threshold_hint: Минимальная оценка, при которой действует Байес (0.05–0.99). Меньшее значение категоризирует больше
          операций, но с большим числом ошибок.
      clear_locks:
        success: Блокировки Байеса очищаются. Это может занять несколько секунд.
      evaluation:
        apply_best: Применить эти настройки
        best: Лучший найденный вариант
        best_changes: 'Лучший найденный вариант, отличается от ваших:'
        best_no_changes: Не найдено настроек с результатом лучше вашего.
        buttons_hint: '«Проверить мои настройки» оценивает ваши настройки. «Найти лучшие настройки» ищет по %{tuning} месяцам
          до показанных, поэтому найденный вариант оценивается на месяцах, которых не видел. Критерий — ROC-AUC: насколько
          оценки ставят операции каждой категории выше остальных при любом пороге. Изменение сохраняется, только если результат
          выше в целом и отдельно во всех месяцах, кроме максимум одного из %{tuning}. Сначала выбираются входные данные:
          все сочетания токена продавца, суммы и счёта; затем отдельная оценка продавца и счёта; затем слова названия продавца
          и заметок. Потом по одному проверяются остальные настройки и в конце — раздел «Оценка». По умолчанию используются
          настройки исходного классификатора с вашим выбором категорий; «Сбросить настройки по умолчанию» переключает на них
          и запускает проверку.'
        categories_heading: Классификатор категорий
        change: '%{setting}: %{value}'
        confusion: '%{actual} → %{predicted}'
        confusions: 'Частые ошибки: %{column} при пороге %{threshold}'
        current: Мои настройки
        defaults: По умолчанию
        description: 'Каждый столбец оценивается на последних %{months} месяцах как на новых операциях: для каждого месяца
          обучение идёт на более ранней истории, затем результат сравнивается с вашими категориями. Проверка не меняет категорию
          ни одной операции, а настройки классификатора изменяются только после применения или сброса.'
        find_best: Найти лучшие настройки
        matcher_confusions: 'Частые ошибки продавца: %{column} при схожести %{similarity}'
        matcher_description: 'Продавцы, которыми сопоставитель заполняет операции за те же %{months} месяцев: %{count} операций
          с продавцом, каждая сопоставляется с историей до своего месяца при скрытом продавце; верный ответ — сохранённый
          продавец. Оцениваются каждый порог и число продавцов; лучший найденный вариант даёт лучшую ячейку с учётом цены
          ошибки, и его задаёт «Применить». Проверка не заполняет продавцов.'
        merchants_heading: Сопоставитель продавцов
        no_confusions: При этом пороге ошибок нет.
        no_matcher_confusions: При этой схожести ошибок продавца нет.
        no_uncategorized: При этом пороге все операции категоризированы.
        no_unfilled: При этой схожести все операции содержат продавца.
        none: Ещё не проверено.
        'off': выкл.
        'on': вкл.
        ran_at: Оценка выполнена %{time} назад для %{count} операций (%{months}).
        reset: Сбросить настройки по умолчанию
        reset_confirm: Сбросить все настройки классификатора к значениям по умолчанию и проверить их?
        right_wrong: 'В каждой ячейке указано: верно / неверно.'
        run: Проверить мои настройки
        running: Проверка… раздел обновится после её завершения.
        short_history: Для подбора настроек классификатора категорий пока недостаточно истории. Нужно около %{months} месяцев
          категоризированных операций, поэтому «Применить» пока не меняет его настройки.
        similarity: Схожесть
        stale: Настройки изменились после этой проверки.
        threshold: Порог
        trying: Проверяется %{changes}…
        uncategorized: 'Частые некатегоризированные: %{column} при пороге %{threshold}'
        unfilled: 'Частые операции без продавца: %{column} при схожести %{similarity}'
        weight: Цена ошибки
        weight_hint: 'Определяет, что установит «Применить»: выделенные ячейки, где разность верных ответов и этой цены за
          каждую ошибку максимальна. Для категорий — порог из лучшего найденного варианта; для сопоставителя — порог частоты,
          схожесть и число продавцов.'
        weight_option:
          one: 1 верный ответ
          few: '%{count} верных ответа'
          many: '%{count} верных ответов'
          other: '%{count} верных ответов'
      matcher:
        lock_similar_merchants: Блокировать продавцов, заданных сопоставителем
        lock_similar_merchants_hint: Не даёт правилам, ИИ и синхронизациям менять их, пока вы не нажмёте «Применить» у правила.
          Собственные блокировки не считаются подтверждением при подборе сопоставителя продавцов.
        rule: Заполнять отсутствующих продавцов по похожим операциям
        rule_hint: Правило «Сопоставитель продавцов» включается и выключается вместе с ним в разделе «Правила». В порядке
          ваших правил операция без продавца получает продавца, общего для похожих операций, например «NETFLIX.COM 8812» и
          «Netflix com». Переводы исключаются.
        similar_threshold: Схожесть
        similar_threshold_hint: Минимальная схожесть описаний без учёта чисел и кодов (0.5–0.99). Меньшее значение заполняет
          больше операций, но с большим числом ошибок. Его также задаёт «Применить» при автоподборе.
      matcher_tuning:
        similar_common_share: Порог частоты
        similar_common_share_hint: Слово или последовательность из 3 букв, встречающаяся более чем в этой доле операций-источников
          (0.01–1) и более чем в 50 из них, слишком распространена, чтобы различать операции, как «card» или «payment», поэтому
          игнорируется. При большем значении игнорируется меньше таких фрагментов. Его также задаёт «Применить» при автоподборе.
        similar_min_neighbours: Совпадающих продавцов
        similar_min_neighbours_hint: Сколько похожих операций должны содержать одного продавца, при этом ни одна не должна
          содержать другого. При 1 копируется продавец из одной операции, что тоже может быть ошибкой.
        similar_min_neighbours_option:
          one: 1 продавец
          few: '%{count} продавца'
          many: '%{count} продавцов'
          other: '%{count} продавцов'
        similar_skip_self: Не копировать продавцов, заданных сопоставителем, пока их не подтвердят или пока не пройдёт столько
          дней
        similar_skip_self_hint: Подтверждение — изменение или блокировка продавца. Неверное копирование не распространяется;
          оставленное без изменений столько времени считается принятым.
      merchant:
        merchant_field: Учитывать продавца как один токен, если он указан
        merchant_field_hint: Учитывает идентификатор, поэтому переименованный продавец сохраняет историю.
        merchant_name_words: Учитывать слова из названия продавца
        merchant_name_words_hint: Читает их как описание, как исходный классификатор, поэтому похожие названия используют
          общие признаки. Пересекается с токеном выше.
      run:
        success: Байес категоризирует некатегоризированные операции. Это может занять несколько секунд.
      scoring:
        complement: Использовать комплементарный наивный Байес
        complement_hint: Оценивает каждую категорию по тому, насколько операция не подходит остальным; это лучше работает
          с категориями очень разного размера. При выключенной настройке используется исходный мультиномиальный вариант.
        prior: Учитывать частоту использования каждой категории
        prior_hint: Склоняет выбор к категориям, которые вы используете чаще. При выключенной настройке все категории, как
          в исходном варианте, равнозначны.
        separate_fields: Оценивать продавца и счёт отдельно от слов
        separate_fields_hint: У каждого своё распределение, поэтому длинное описание не перевешивает их. Нужно включить продавца
          или счёт; сумма всегда оценивается отдельно.
        smoothing: Сглаживание
        smoothing_hint: Добавляется к каждому счётчику, чтобы неизвестное слово не исключало категорию (0.001–10). 1 — исходное
          значение; меньшее сильнее доверяет уже встречавшимся словам.
      show:
        account: Настройка счёта
        add_rule_body: В списке правил нет правила «%{name}», поэтому включать нечего. Добавить его в начало списка?
        add_rule_cancel: Нет
        add_rule_confirm: Добавить правило
        add_rule_title: Добавить правило «%{name}»?
        amount: Настройка суммы
        auto_tune: Автоподбор
        category_training: Настройка классификатора категорий
        clear_locks: Снять блокировки Байеса
        clear_locks_confirm_body: Снимает блокировку с категорий, которые Байес заблокировал и которые до сих пор не изменены,
          а также с продавцов, заблокированных сопоставителем. Правила и ИИ снова смогут их менять. Сами категории и продавцы
          сохранятся.
        clear_locks_confirm_button: Снять блокировки
        clear_locks_confirm_title: Снять блокировки Байеса?
        description: Классификатор Байеса обучается на операциях с известными категориями и назначает категории новым операциям
          до обращения к ИИ. Новые настройки вступят в силу при следующем запуске классификатора; уже назначенные категории
          не изменятся.
        matcher: Сопоставитель
        matcher_description: Заполняет отсутствующих продавцов по похожим операциям через правило «Сопоставитель продавцов»
          после каждой синхронизации и при запуске. Он меняет сохранённых продавцов.
        matcher_tuning: Настройка сопоставителя продавцов
        merchant: Настройка продавца
        run: Запустить
        scoring: Оценка
        title: Классификатор
        training: Обучение
        words: Настройка операций
      training:
        max_training_transactions: Операции для обучения
        max_training_transactions_hint: 'Сколько самых новых операций использовать (100–20 000): категоризированные операции,
          на которых обучается классификатор, и операции с продавцом, у которых сопоставитель копирует данные.'
      words:
        bigrams: Учитывать пары слов
        bigrams_hint: Соседние слова также учитываются вместе, например «оплата картой».
        binary: Исключить повторяющиеся слова
        binary_hint: Каждое слово учитывается в операции один раз.
        drop_codes: Исключить коды
        drop_codes_hint: Слова, в которых буквы смешаны с двумя и более цифрами, например 2k4l19.
        drop_numbers: Исключить числа
        drop_numbers_hint: Числа, даты и суммы сохраняются в описании.
        include_notes: Учитывать заметки
        include_notes_hint: Читает заметки вместе с названием.
        keep_single_chars: Учитывать слова из одного символа
        keep_single_chars_hint: Одиночные буквы и цифры, оставшиеся после разбиения, например s в mcdonald's.
        spread_filter: Исключить слова, одинаково используемые во всех категориях
        spread_filter_hint: Они ничего не говорят о категории. Число показывает, насколько использование в одной категории
          должно превышать равную долю.
        word_split: Слова состоят из
        word_split_ascii: a–z и 0–9
        word_split_hint: Любой другой символ разделяет слова. Буквы любого алфавита сохраняют целыми слова вроде Geschäft
          или Кофейня; при внутренних символах буквы, соединённые одним символом, также остаются одним словом, например mcdonald's,
          s/o и m&s (символ на краю, как в *netflix, по-прежнему отбрасывается).
        word_split_symbols: Букв, цифр, внутренних символов
        word_split_unicode: Букв и цифр любого алфавита
