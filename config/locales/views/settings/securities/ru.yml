        compromised_secret_warning:
          title: "Ключи шифрования на самом деле не секретны"
          intro: "Ключи шифрования этой установки были автоматически получены из значения SECRET_KEY_BASE, которое ранее поставлялось как рабочее значение по умолчанию в примерах Docker Compose этого проекта. Любой, кто знает это значение, может вычислить те же ключи шифрования, поэтому эти данные на самом деле не защищены."
          generate: "НЕ задавайте просто новый SECRET_KEY_BASE и не запускайте задачу обратного заполнения: если какие-либо данные уже были зашифрованы скомпрометированным ключом, задача не сможет отличить этот шифротекст от настоящего открытого текста и зашифрует его повторно, сделав данные невосстановимыми. Вместо этого безопасно выполните ротацию при остановленном приложении: сгенерируйте новые ключи командой bin/rails db:encryption:init и задайте их в переменных ACTIVE_RECORD_ENCRYPTION_*, затем выполните bin/rails \"security:backfill_encryption[100,0]\", указав этот SECRET_KEY_BASE в переменной окружения ACTIVE_RECORD_ENCRYPTION_PREVIOUS_SECRET_KEY_BASE только для этой команды, чтобы существующие данные всё ещё расшифровывались и переносились на новые ключи. См. руководство по размещению в Docker."
          settings_secrets: "API-ключи и токены, сохранённые в настройках, шифруются ключом, производным непосредственно от SECRET_KEY_BASE, на который предыдущая схема не распространяется. После изменения SECRET_KEY_BASE повторно зашифруйте их командой bin/rails \"security:rotate_setting_secrets[0]\", передав старое значение в переменной окружения OLD_SECRET_KEY_BASE (см. руководство по размещению в Docker). Повторно введите все ключи, для которых сообщается, что они не расшифровываются."
