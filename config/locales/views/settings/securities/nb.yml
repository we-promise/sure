          intro: "Krypteringsnøklene i denne installasjonen ble automatisk utledet fra en offentlig kjent SECRET_KEY_BASE-verdi (en standardverdi eller plassholder fra prosjektets eksempelfiler eller hostingveiledninger). Alle som kjenner den verdien, kan beregne de samme krypteringsnøklene, så disse dataene er ikke reelt beskyttet."
          generate: "IKKE bare sett en ny SECRET_KEY_BASE og kjør backfill-oppgaven. Hvis noen data allerede er kryptert med den kompromitterte nøkkelen, kan ikke backfill-oppgaven skille den chifferteksten fra ekte klartekst, og vil kryptere den på nytt oppå, slik at den ikke kan gjenopprettes. Roter i stedet trygt mens appen er stoppet: generer nye nøkler med bin/rails db:encryption:init og sett dem som ACTIVE_RECORD_ENCRYPTION_*-variablene. Kjør deretter bin/rails \"security:backfill_encryption[100,0]\" med denne SECRET_KEY_BASE i miljøvariabelen ACTIVE_RECORD_ENCRYPTION_PREVIOUS_SECRET_KEY_BASE, bare for den kommandoen, slik at eksisterende data fortsatt kan dekrypteres og flyttes over til de nye nøklene. Se veiledningen for hosting med Docker."
          settings_secrets: "API-nøkler og tokener som er lagret i innstillingene, krypteres med en nøkkel som er utledet fra selve SECRET_KEY_BASE, og som den forrige fremgangsmåten ikke dekker. Når du har endret SECRET_KEY_BASE, krypterer du dem på nytt med bin/rails \"security:rotate_setting_secrets[0]\", med den gamle verdien i miljøvariabelen OLD_SECRET_KEY_BASE (se veiledningen for hosting med Docker). Legg inn på nytt alle nøkler den rapporterer at ikke kan dekrypteres."
