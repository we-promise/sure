        compromised_secret_warning:
          title: Encryption keys are not actually secret
          intro: This install's encryption keys were auto-derived from a SECRET_KEY_BASE value that was previously shipped as a working default in this project's example Docker Compose files. Anyone who knows that value can compute the same encryption keys, so this data is not actually protected.
          generate: 'Do NOT simply set a new SECRET_KEY_BASE and run the backfill task: if any data was already encrypted under the compromised key, the backfill cannot tell that ciphertext apart from real plaintext and will re-encrypt it on top, making it unrecoverable. Rotate safely instead, with the app stopped: generate new keys with bin/rails db:encryption:init and set them as the ACTIVE_RECORD_ENCRYPTION_* variables, then run bin/rails "security:backfill_encryption[100,0]" with this SECRET_KEY_BASE in the ACTIVE_RECORD_ENCRYPTION_PREVIOUS_SECRET_KEY_BASE environment variable for that command only, so existing data still decrypts and moves to the new keys. See the Docker hosting guide.'
          settings_secrets: 'API keys and tokens saved in the settings are encrypted with a key derived from SECRET_KEY_BASE itself, which the previous scheme does not cover. After changing SECRET_KEY_BASE, re-encrypt them with bin/rails "security:rotate_setting_secrets[0]", passing the old value in the OLD_SECRET_KEY_BASE environment variable (see the Docker hosting guide). Re-enter any key it reports as not decryptable.'
