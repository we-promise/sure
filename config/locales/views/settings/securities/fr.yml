        compromised_secret_warning:
          title: Les clés de chiffrement ne sont pas réellement secrètes
          intro: 'Les clés de chiffrement de cette installation ont été dérivées automatiquement d''une valeur SECRET_KEY_BASE connue publiquement (une valeur par défaut ou d''exemple issue des fichiers d''exemple de ce projet ou des guides d''hébergement). Toute personne qui connaît cette valeur peut calculer les mêmes clés de chiffrement : ces données ne sont donc pas réellement protégées.'
          generate: 'Ne vous contentez PAS de définir un nouveau SECRET_KEY_BASE et de lancer la tâche de backfill : si des données ont déjà été chiffrées avec la clé compromise, le backfill ne peut pas distinguer ce texte chiffré d''un vrai texte en clair et le chiffrera une seconde fois par-dessus, ce qui le rendra irrécupérable. Effectuez plutôt une rotation sûre, application arrêtée : générez de nouvelles clés avec bin/rails db:encryption:init et définissez-les comme variables ACTIVE_RECORD_ENCRYPTION_*, puis lancez bin/rails "security:backfill_encryption[100,0]" avec ce SECRET_KEY_BASE dans la variable d''environnement ACTIVE_RECORD_ENCRYPTION_PREVIOUS_SECRET_KEY_BASE, pour cette commande uniquement, afin que les données existantes restent déchiffrables et passent aux nouvelles clés. Consultez le guide d''hébergement Docker.'
          settings_secrets: Les clés API et les jetons enregistrés dans les paramètres sont chiffrés avec une clé dérivée de SECRET_KEY_BASE lui-même, que le dispositif précédent ne couvre pas. Après avoir modifié SECRET_KEY_BASE, rechiffrez-les avec bin/rails "security:rotate_setting_secrets[0]", en passant l'ancienne valeur dans la variable d'environnement OLD_SECRET_KEY_BASE (voir le guide d'hébergement Docker). Saisissez à nouveau toute clé signalée comme impossible à déchiffrer.
