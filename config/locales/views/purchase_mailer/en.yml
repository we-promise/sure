---
en:
  purchase_mailer:
    unknown_merchant: your order
    view_purchase: View purchase
    linked_to: "Linked to the transaction %{name} on %{account}, %{date}."
    processed:
      subject: "Order read: %{merchant}, %{total}"
      heading: "We read your order from %{merchant}"
      summary: "Ordered on %{date}, total %{total}."
      waiting: We're waiting for the payment to show up in your accounts and will link it automatically.
      needs_matching: More than one transaction could be this payment. Pick the right one on the purchase page.
      manual: This order won't be matched automatically. Link its payment on the purchase page when it arrives.
    matched:
      subject: "Payment found: %{merchant}, %{total}"
      heading: "We found the payment for your order from %{merchant}"
    unmatched:
      subject: "No payment found yet: %{merchant}, %{total}"
      heading: "We haven't found the payment for your order from %{merchant}"
      body: "No transaction of %{total} has shown up in the %{days} days since the order. We'll keep looking, or you can link it yourself."
      link_button: Review purchases to match
    needs_matching:
      subject: "Pick the payment: %{merchant}, %{total}"
      heading: "Which payment was your order from %{merchant}?"
      body: "Several transactions of %{total} could be this order. Pick the right one so its items are recorded on it."
      link_button: Pick the payment
    rejected:
      subject: "Email not added: %{merchant}"
      heading: We couldn't add the email you forwarded
      subject_line: "Email: %{subject}"
      not_an_order: "It doesn't look like an order confirmation: %{reason}"
      no_reason: no order details were found.
      duplicate: This order is already in your purchases.
    failed:
      subject: "We couldn't read your order email: %{merchant}"
      heading: We couldn't read the order email you forwarded
      body: Something went wrong while reading it. Open the purchase to try again.
    preview_required:
      subject: "Turn on preview features to use the order mailbox in %{product_name}"
      heading: Your forwarded email wasn't added
      body: "The order mailbox is a preview feature. Turn on preview features in %{product_name} and forward the email again."
      button: Open preferences
