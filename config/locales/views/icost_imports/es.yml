es:
  icost_imports:
    title: "Importaciones de iCost"
    new_import: "Importar CSV / XLSX de iCost"
    local_notice: "Los archivos se analizan localmente. Se conservan las columnas de origen y los campos desconocidos. No se contacta con servicios de IA, mapas, geocodificación ni imágenes."
    no_imports: "Todavía no se ha revisado ningún archivo de iCost."
    all_imports: "Todo el historial de importaciones"
    file_label: "Archivo de exportación de iCost"
    upload_help: "Elige una exportación original de iCost en CSV o XLSX (hasta 10 MB). Revisa las filas analizadas antes de contabilizarlas. Si vuelves a subir el mismo archivo, se abrirá su revisión existente."
    prepare: "Analizar y previsualizar"
    preview: "Vista previa de la importación de iCost"
    preview_help: "Solo se contabilizan las filas listas. Las filas vinculadas ya están registradas; las que requieren revisión quedan fuera de los totales financieros. Los importes siguientes conservan el signo y la moneda originales. No se deducen los saldos iniciales que faltan."
    publish: "Contabilizar filas listas (%{count})"
    record_title: "Fila de origen de iCost %{row}"
    review_required: "Se necesita información adicional"
    review: "Revisar esta fila"
    review_help: "Elige una cuenta o el sentido de la transferencia solo si los conoces. Al guardar una corrección admitida, la fila vuelve a la vista previa sin contabilizarse. Las relaciones de reembolso y pago a plazos ausentes de la exportación siguen sin resolverse; se conserva tu nota de revisión."
    choose_account: "Selecciona una cuenta en la misma moneda"
    save_review: "Guardar revisión y volver a la vista previa"
    location: "Lugar y coordenadas"
    unknown_coordinate_system: "Desconocido (no se presupone WGS84)"
    location_help: "El texto original del lugar y las coordenadas indicadas explícitamente se muestran localmente. Una dirección por sí sola no proporciona coordenadas. No se convierte un sistema de coordenadas desconocido ni se carga ningún mapa."
    source: "Origen e historial de revisiones"
    source_help: "Se conservan la fecha y hora originales sin presuponer una zona horaria. Una fila de origen se identifica mediante el hash del archivo, la hoja y el número de fila. Esta exportación no es una copia de seguridad completa de iCost ni una conexión de sincronización."
    raw_fields: "Todas las columnas originales (incluidos los campos desconocidos)"
