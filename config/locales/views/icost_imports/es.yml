      amount_required: "Falta el importe."
      amount_invalid: "El importe no es un número decimal finito."
      adjustment_invalid: "Un valor de reembolso, descuento o comisión no es un número decimal válido."
      amount_precision_unsupported: "La precisión del origen supera la precisión de almacenamiento del libro. No se ha redondeado."
      coordinate_invalid: "Una coordenada proporcionada no es válida o está fuera del intervalo permitido. Se conserva el valor original."
      date_invalid: "La fecha o marca temporal no es válida o es ambigua. No se presupone ninguna zona horaria ni formato de fecha."
      currency_invalid: "La moneda falta o no es compatible."
      category_required: "Falta la categoría."
      coordinate_pair_required: "Se necesitan tanto la latitud como la longitud para formar un par de coordenadas."
      amount_type_mismatch: "El signo del importe de origen contradice su tipo de ingreso o gasto."
      counterparty_required: "Falta la contraparte de la transferencia."
      discount_semantics_required: "La exportación no indica si el descuento ya está incluido en el importe."
      fee_semantics_required: "La exportación no indica si la comisión ya está incluida en el importe."
      transaction_type_unsupported: "Este tipo de transacción requiere una interpretación contable explícita."
      existing_entry_mismatch: "Existe una transacción con este identificador de origen, pero sus valores o clasificación ya no coinciden. No se ha sobrescrito ni duplicado."
      possible_duplicate_source: "Ya se ha registrado una fila de origen idéntica desde otro archivo. Confirma si es un duplicado antes de continuar."
      publication_validation_failed: "La validación de la aplicación ha impedido contabilizar esta fila. Sus datos de origen se conservan para revisarlos."
      currency_unsupported: "La aplicación no admite esta moneda. Se conserva su valor de origen sin conversión."
      account_valuation_requires_review: "Esta cuenta contiene movimientos en otras monedas, posiciones u operaciones bursátiles. La contabilización está en pausa para evitar consultas externas de tipos de cambio o precios de mercado; revisa la cuenta antes de continuar."
