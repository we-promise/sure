pt-PT:
  icost_imports:
    title: "Importações do iCost"
    new_import: "Importar CSV / XLSX do iCost"
    local_notice: "Os ficheiros são analisados localmente. As colunas de origem e os campos desconhecidos são preservados. Não é contactado qualquer serviço de IA, mapas, geocodificação ou imagens."
    no_imports: "Ainda não foi revisto nenhum ficheiro do iCost."
    all_imports: "Todo o histórico de importações"
    file_label: "Ficheiro de exportação do iCost"
    upload_help: "Escolha uma exportação original do iCost em CSV ou XLSX (até 10 MB). Reveja as linhas analisadas antes de as registar. Se voltar a carregar o mesmo ficheiro, será aberta a revisão existente."
    prepare: "Analisar e pré-visualizar"
    preview: "Pré-visualização da importação do iCost"
    preview_help: "Apenas as linhas prontas são registadas. As linhas associadas já estão registadas; as que precisam de revisão ficam excluídas dos totais financeiros. Os montantes abaixo mantêm o sinal e a moeda de origem. Não são inferidos os saldos iniciais em falta."
    publish: "Registar linhas prontas (%{count})"
    record_title: "Linha de origem do iCost %{row}"
    review_required: "São necessárias informações adicionais"
    review: "Rever esta linha"
    review_help: "Escolha uma conta ou o sentido da transferência apenas quando tiver essa informação. Guardar uma correção suportada devolve a linha à pré-visualização, sem a registar. As relações de reembolso e pagamento em prestações ausentes da exportação ficam por resolver; a sua nota de revisão é preservada."
    choose_account: "Selecione uma conta na mesma moeda"
    save_review: "Guardar revisão e voltar à pré-visualização"
    location: "Local e coordenadas"
    unknown_coordinate_system: "Desconhecido (não se pressupõe WGS84)"
    location_help: "O texto original do local e as coordenadas fornecidas explicitamente são apresentados localmente. Uma morada, por si só, não fornece coordenadas. Um sistema de coordenadas desconhecido não é convertido e nenhum mapa é carregado."
    source: "Origem e histórico de revisões"
    source_help: "A data e a hora originais são preservadas sem presumir um fuso horário. Uma linha de origem é identificada pelo hash do ficheiro, pela folha e pelo número da linha. Esta exportação não é uma cópia de segurança completa do iCost nem uma ligação de sincronização."
    raw_fields: "Todas as colunas originais (incluindo campos desconhecidos)"
    transaction_details: "Campos de origem do iCost e local"
    empty_value: "Não fornecido"
    unnamed_column: "Coluna sem nome %{index}"
    fields:
      filename: "Ficheiro"
      created_at: "Data de revisão"
      file_sha256: "SHA-256 do ficheiro"
      sheet_name: "Folha de cálculo"
      source_row: "Linha de origem"
      recorded_at_text: "Data e hora originais"
      transaction_type: "Tipo original"
      amount: "Montante original"
      currency: "Moeda"
      category_path: "Hierarquia de categorias"
      account_name: "Conta original 1"
      counterparty_name: "Conta original 2"
      book_name: "Livro de origem"
      note: "Nota original"
      tags: "Etiquetas"
      refund_amount: "Campo de reembolso"
      discount_amount: "Campo de desconto"
      fee_amount: "Campo de comissão"
      image_references: "Referências a imagens (não obtidas)"
      status: "Estado"
      issues: "Motivos de revisão"
      resolved_account: "Conta confirmada"
      from_account: "Conta de origem da transferência"
      to_account: "Conta de destino da transferência"
      review_note: "Nota de revisão"
      location_text: "Local original"
      latitude: "Latitude"
      longitude: "Longitude"
      coordinate_system: "Sistema de coordenadas"
      source_id: "ID de origem"
      row_sha256: "SHA-256 da linha de origem"
      resolution: "Correções confirmadas"
    statuses:
      ready: "Pronta a registar"
      published: "Registada / associada"
      needs_review: "Precisa de revisão"
    messages:
      invalid_upload: "Não foi possível analisar o ficheiro em segurança. Utilize uma exportação CSV ou XLSX não encriptada, até 10 MB e sem células com fórmulas. Os registos existentes não foram alterados."
      prepared: "O ficheiro de origem está pronto para revisão. As linhas existentes só foram associadas quando a origem e os valores financeiros coincidiam."
      published: "As linhas prontas foram processadas. Verifique abaixo o número de linhas registadas e de linhas por rever."
      publish_failed: "Não foi possível registar algumas linhas em segurança. Reveja os problemas e a correspondência das contas antes de tentar novamente."
      review_saved: "Revisão guardada. Verifique o estado da linha antes de a registar a partir da pré-visualização da importação."
      review_invalid: "Esta correção não é válida para a linha. Escolha contas acessíveis na moeda original; as contas da transferência têm de ser diferentes."
    issues:
      account_required: "Falta a conta 1. Confirme a conta correta."
      account_mapping_required: "Não existe uma correspondência inequívoca com uma conta na mesma moeda. Confirme uma conta."
      account_ambiguous: "Mais do que uma conta poderá corresponder a esta origem. Confirme uma conta."
      account_not_found: "Crie ou selecione uma conta adequada na mesma moeda antes de registar."
      transfer_direction_required: "A exportação não indica o sentido da transferência. Confirme ambas as contas."
      installment_details_required: "Faltam o plano de prestações, a contraparte e a relação entre capital e comissões. Mantenha esta linha por rever."
      refund_semantics_required: "A exportação não indica se o montante já inclui o reembolso. Não o deduza duas vezes."
      refund_link_required: "Não é fornecido o ID da transação original deste reembolso. A relação não deve ser presumida."
      duplicate_known_header: "Uma coluna reconhecida aparece mais do que uma vez, pelo que o seu significado é ambíguo."
      unsupported: "Este campo precisa de revisão (%{code})."
      missing_required_header: "Falta uma coluna obrigatória do iCost. Preserve a origem e forneça uma exportação corrigida."
      amount_required: "Falta o montante."
      amount_invalid: "O montante não é um número decimal finito."
      adjustment_invalid: "Um valor de reembolso, desconto ou comissão não é um número decimal válido."
      amount_precision_unsupported: "A precisão da origem excede a precisão de armazenamento do livro. Não foi efetuado qualquer arredondamento."
      coordinate_invalid: "Uma coordenada fornecida é inválida ou está fora do intervalo permitido. O valor original é preservado."
      date_invalid: "A data ou o carimbo temporal é inválido ou ambíguo. Não se presume qualquer fuso horário nem formato de data."
      currency_invalid: "A moeda está em falta ou não é suportada."
      category_required: "Falta a categoria."
      coordinate_pair_required: "São necessárias a latitude e a longitude para formar um par de coordenadas."
      amount_type_mismatch: "O sinal do montante de origem contradiz o respetivo tipo de rendimento ou despesa."
      counterparty_required: "Falta a contraparte da transferência."
      discount_semantics_required: "A exportação não indica se o desconto já está incluído no montante."
      fee_semantics_required: "A exportação não indica se a comissão já está incluída no montante."
      transaction_type_unsupported: "Este tipo de transação exige uma interpretação contabilística explícita."
      existing_entry_mismatch: "Existe uma transação com este identificador de origem, mas os seus valores ou classificação já não coincidem. Não foi substituída nem duplicada."
      possible_duplicate_source: "Já foi registada uma linha de origem idêntica a partir de outro ficheiro. Confirme se é um duplicado antes de continuar."
      publication_validation_failed: "A validação da aplicação impediu o registo desta linha. Os dados de origem são preservados para revisão."
      currency_unsupported: "A aplicação não suporta esta moeda. O valor de origem é preservado sem conversão."
      account_valuation_requires_review: "Esta conta contém movimentos noutras moedas, posições ou operações em bolsa. O registo está suspenso para evitar pedidos externos de taxas de câmbio ou cotações de mercado; reveja a conta antes de continuar."
