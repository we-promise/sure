fr:
  icost_imports:
    title: "Importations iCost"
    new_import: "Importer un fichier iCost CSV / XLSX"
    local_notice: "Les fichiers sont analysés localement. Les colonnes source et les champs inconnus sont conservés. Aucun service d’IA, de cartographie, de géocodage ou d’images n’est contacté."
    no_imports: "Aucun fichier iCost n’a encore été examiné."
    all_imports: "Tout l’historique des importations"
    file_label: "Fichier d’export iCost"
    upload_help: "Choisissez un export iCost original au format CSV ou XLSX (10 Mo maximum). Vérifiez les lignes analysées avant de les comptabiliser. Si vous téléversez à nouveau le même fichier, sa vérification existante se rouvre."
    prepare: "Analyser et prévisualiser"
    preview: "Aperçu de l’importation iCost"
    preview_help: "Seules les lignes prêtes sont comptabilisées. Les lignes liées sont déjà enregistrées ; celles à vérifier restent exclues des totaux financiers. Les montants ci-dessous conservent le signe et la devise d’origine. Aucun solde initial manquant n’est déduit."
    publish: "Comptabiliser les lignes prêtes (%{count})"
    record_title: "Ligne source iCost %{row}"
    review_required: "Des informations complémentaires sont nécessaires"
    review: "Vérifier cette ligne"
    review_help: "Ne choisissez un compte ou un sens de transfert que si vous les connaissez. Enregistrer une correction prise en charge renvoie la ligne dans l’aperçu sans la comptabiliser. Les liens de remboursement et d’échelonnement absents de l’export restent non résolus ; votre note de vérification est conservée."
    choose_account: "Sélectionner un compte dans la même devise"
    save_review: "Enregistrer la vérification et revenir à l’aperçu"
    location: "Lieu et coordonnées"
    unknown_coordinate_system: "Inconnu (WGS84 n’est pas présumé)"
    location_help: "Le lieu d’origine et les coordonnées explicitement fournies sont affichés localement. Une adresse seule ne fournit pas de coordonnées. Un système de coordonnées inconnu n’est pas converti et aucune carte n’est chargée."
    source: "Source et historique des vérifications"
    source_help: "La date et l’heure d’origine sont conservées sans supposer de fuseau horaire. Une ligne source est identifiée par l’empreinte du fichier, la feuille et son numéro de ligne. Cet export n’est ni une sauvegarde iCost complète ni une connexion de synchronisation."
    raw_fields: "Toutes les colonnes d’origine (y compris les champs inconnus)"
    transaction_details: "Champs source iCost et lieu"
    empty_value: "Non fourni"
    unnamed_column: "Colonne sans nom %{index}"
    fields:
      filename: "Fichier"
      created_at: "Date de vérification"
      file_sha256: "SHA-256 du fichier"
      sheet_name: "Feuille"
      source_row: "Ligne source"
      recorded_at_text: "Date et heure d’origine"
      transaction_type: "Type d’origine"
