      currency: "Devise"
      category_path: "Hiérarchie des catégories"
      account_name: "Compte d’origine 1"
      counterparty_name: "Compte d’origine 2"
      book_name: "Registre source"
      note: "Note d’origine"
      tags: "Étiquettes"
      refund_amount: "Champ de remboursement"
      discount_amount: "Champ de remise"
      fee_amount: "Champ de frais"
      image_references: "Références d’images (non récupérées)"
      status: "État"
      issues: "Motifs de vérification"
      resolved_account: "Compte confirmé"
      from_account: "Compte émetteur du transfert"
      to_account: "Compte destinataire du transfert"
      review_note: "Note de vérification"
      location_text: "Lieu d’origine"
      latitude: "Latitude"
      longitude: "Longitude"
      coordinate_system: "Système de coordonnées"
      source_id: "Identifiant source"
      row_sha256: "SHA-256 de la ligne source"
      resolution: "Corrections confirmées"
    statuses:
      ready: "Prête à comptabiliser"
      published: "Enregistrée / liée"
      needs_review: "À vérifier"
    messages:
      invalid_upload: "Le fichier n’a pas pu être analysé en toute sécurité. Utilisez un export CSV ou XLSX non chiffré de 10 Mo maximum, sans cellules contenant des formules. Les enregistrements existants n’ont pas été modifiés."
      prepared: "Le fichier source est prêt à être vérifié. Les lignes existantes n’ont été liées que si leur source et leurs valeurs financières correspondaient."
      published: "Les lignes prêtes ont été traitées. Vérifiez ci-dessous le nombre de lignes enregistrées et de lignes à vérifier."
      publish_failed: "Certaines lignes n’ont pas pu être comptabilisées en toute sécurité. Vérifiez leurs anomalies et l’affectation des comptes avant de réessayer."
      review_saved: "Vérification enregistrée. Consultez l’état de la ligne avant de la comptabiliser depuis l’aperçu de l’importation."
      review_invalid: "Cette correction n’est pas valable pour la ligne. Choisissez des comptes accessibles dans la devise d’origine ; les comptes du transfert doivent être différents."
    issues:
      account_required: "Le compte 1 est manquant. Confirmez le compte approprié."
      account_mapping_required: "Aucune correspondance univoque avec un compte dans la même devise n’existe. Confirmez un compte."
      account_ambiguous: "Plusieurs comptes pourraient correspondre à cette source. Confirmez un compte."
      account_not_found: "Créez ou sélectionnez un compte approprié dans la même devise avant de comptabiliser."
      transfer_direction_required: "L’export n’indique pas le sens du transfert. Confirmez les deux comptes."
      installment_details_required: "L’échéancier, la contrepartie et la répartition entre capital et frais sont manquants. Conservez cette ligne à vérifier."
      refund_semantics_required: "L’export ne précise pas si le montant inclut déjà le remboursement. Ne le déduisez pas deux fois."
      refund_link_required: "Aucun identifiant de transaction d’origine n’est fourni pour ce remboursement. Le lien ne doit pas être supposé."
      duplicate_known_header: "Une colonne reconnue apparaît plusieurs fois, ce qui rend son interprétation ambiguë."
      unsupported: "Ce champ doit être vérifié (%{code})."
      missing_required_header: "Une colonne iCost obligatoire est manquante. Conservez la source et fournissez un export corrigé."
      amount_required: "Le montant est manquant."
      amount_invalid: "Le montant n’est pas un nombre décimal fini."
      adjustment_invalid: "Une valeur de remboursement, de remise ou de frais n’est pas un nombre décimal valide."
      amount_precision_unsupported: "La précision de la source dépasse celle du stockage du registre. Aucun arrondi n’a été effectué."
      coordinate_invalid: "Une coordonnée fournie est invalide ou hors de l’intervalle autorisé. La valeur d’origine est conservée."
      date_invalid: "La date ou l’horodatage est invalide ou ambigu. Aucun fuseau horaire ni format de date n’est supposé."
      currency_invalid: "La devise est manquante ou non prise en charge."
      category_required: "La catégorie est manquante."
      coordinate_pair_required: "La latitude et la longitude sont toutes deux nécessaires pour former une paire de coordonnées."
      amount_type_mismatch: "Le signe du montant source contredit son type de revenu ou de dépense."
      counterparty_required: "La contrepartie du transfert est manquante."
      discount_semantics_required: "L’export ne précise pas si la remise est déjà incluse dans le montant."
      fee_semantics_required: "L’export ne précise pas si les frais sont déjà inclus dans le montant."
      transaction_type_unsupported: "Ce type de transaction nécessite une interprétation comptable explicite."
      existing_entry_mismatch: "Une transaction portant cet identifiant source existe, mais ses valeurs ou sa classification ne correspondent plus. Elle n’a été ni écrasée ni dupliquée."
      possible_duplicate_source: "Une ligne source identique a déjà été enregistrée depuis un autre fichier. Vérifiez s’il s’agit d’un doublon avant de continuer."
      publication_validation_failed: "La validation de l’application a empêché la comptabilisation de cette ligne. Ses données source sont conservées pour vérification."
      currency_unsupported: "La devise n’est pas prise en charge par l’application. Sa valeur source est conservée sans conversion."
      account_valuation_requires_review: "Ce compte contient des écritures dans d’autres devises, des positions ou des opérations boursières. La comptabilisation est suspendue pour éviter toute requête externe de taux de change ou de cours de marché ; vérifiez le compte avant de continuer."
