ru:
  web_push:
    title: Уведомления в браузере
    description: Получайте новые важные уведомления в этом браузере или установленном приложении. На экране блокировки финансовые данные скрыты.
    enable: Включить на этом устройстве
    disable: Отключить на этом устройстве
    test: Проверить на этом устройстве
    preview: Предпросмотр
    session_notice: Уведомления перестают работать после выхода из аккаунта или через 30 дней бездействия. Регулярно открывайте Sure, чтобы сессия оставалась активной.
    ios_guidance: На iPhone или iPad откройте Sure в Safari, выберите «Поделиться» → «На экран Домой», затем включите уведомления в установленном приложении. Требуется iOS или iPadOS 16.4 или новее.
    notification:
      body: Доступно новое финансовое уведомление. Откройте Sure, чтобы ознакомиться с ним.
      test_body: Тестовое уведомление доставлено. Откройте Sure, чтобы продолжить.
    status:
      checking: Проверяем это устройство…
      enabled: Уведомления включены для этого устройства и сессии.
      disabled: Уведомления отключены для этого устройства.
      denied: Уведомления заблокированы в настройках браузера. Разрешите их там и снова включите на этом устройстве.
      unsupported: Этот браузер не поддерживает уведомления. Используйте совместимый браузер или установленное приложение по HTTPS.
      unconfigured: Уведомления в браузере не настроены на этом сервере.
      queued: Тест поставлен в очередь. Ожидаем, когда push-сервис примет его.
      accepted: "Push-сервис принял уведомление. Проверьте это устройство: принятие не подтверждает показ уведомления."
      skipped: Тест пропущен, потому что изменилась сессия, доступ к предпросмотру или истёк срок теста. Включите это устройство и попробуйте снова.
      rejected: Push-сервис отклонил тест. Отключите это устройство, затем включите его снова.
      failed: Не удалось доставить тест. Попробуйте позже.
      enqueue_failed: Не удалось поставить тест в очередь. Попробуйте позже.
      pending: Тест в очереди или повторяется. Доставка может занять некоторое время.
      expired: Тест всё ещё в очереди. Проверьте фоновые задачи или повторите тест позже.
    errors:
      registration: Не удалось зарегистрировать это устройство. Отключите его, затем включите снова.
      preview: Включите функции предпросмотра, прежде чем использовать уведомления в браузере.
      unconfigured: Уведомления в браузере не настроены на этом сервере.
      rate_limited: Слишком много запросов на уведомления. Подождите минуту и попробуйте снова.
      enqueue: Не удалось поставить тестовое уведомление в очередь. Попробуйте позже.
      request: Не удалось обновить уведомления в браузере. Проверьте подключение и попробуйте снова.
      permission: Разрешение на уведомления не получено.
