de:
  web_push:
    notification:
      body: Eine neue Finanzmeldung ist verfügbar. Öffne Sure, um sie anzusehen.
      test_body: Deine Testbenachrichtigung ist angekommen. Öffne Sure, um fortzufahren.
    title: "Browser-Benachrichtigungen"
    description: "Erhalte neue Insights mit hoher Priorität in diesem Browser oder in der installierten App. Auf dem Sperrbildschirm zeigen die Benachrichtigungen keine Finanzdetails."
    enable: "Dieses Gerät aktivieren"
    disable: "Dieses Gerät deaktivieren"
    test: "Dieses Gerät testen"
    preview: "Vorschau"
    session_notice: "Die Benachrichtigungen enden, wenn du dich abmeldest oder deine Sitzung nach 30 Tagen ohne Aktivität abläuft. Öffne Sure regelmäßig, damit deine Sitzung aktiv bleibt."
    ios_guidance: "Öffne Sure auf dem iPhone oder iPad in Safari, wähle Teilen → Zum Home-Bildschirm und aktiviere die Benachrichtigungen dann in der installierten App. Erfordert iOS oder iPadOS 16.4 oder neuer."
    status:
      checking: "Dieses Gerät wird geprüft …"
      enabled: "Benachrichtigungen sind für dieses Gerät und diese Sitzung aktiviert."
      disabled: "Benachrichtigungen sind für dieses Gerät deaktiviert."
      denied: "Benachrichtigungen sind in den Browsereinstellungen blockiert. Erlaube sie dort und aktiviere dieses Gerät dann erneut."
      unsupported: "Dieser Browser unterstützt keine Benachrichtigungen. Nutze einen kompatiblen Browser oder die installierte App über HTTPS."
      unconfigured: "Browser-Benachrichtigungen sind auf diesem Server nicht eingerichtet."
      queued: "Test in der Warteschlange. Warte, bis der Push-Dienst ihn annimmt."
      accepted: "Vom Push-Dienst angenommen. Sieh auf diesem Gerät nach der Benachrichtigung; die Annahme bestätigt nicht, dass sie angezeigt wurde."
      skipped: "Test übersprungen, weil sich diese Sitzung oder der Vorschauzugang geändert hat oder der Test abgelaufen ist. Aktiviere dieses Gerät und versuch es noch einmal."
      rejected: "Der Push-Dienst hat diesen Test abgelehnt. Deaktiviere dieses Gerät und aktiviere es dann erneut."
      failed: "Der Test konnte nicht zugestellt werden. Versuch es später noch einmal."
      enqueue_failed: "Der Test konnte nicht eingereiht werden. Versuch es später noch einmal."
      pending: "Test in der Warteschlange oder in Wiederholung. Die Zustellung kann einen Moment dauern."
      expired: "Der Test steht noch in der Warteschlange. Prüfe die Hintergrund-Worker oder versuch später einen weiteren Test."
    errors:
      registration: "Dieses Gerät konnte nicht registriert werden. Deaktiviere es und aktiviere es dann erneut."
      preview: "Aktiviere die Vorschaufunktionen, bevor du Browser-Benachrichtigungen nutzt."
      unconfigured: "Browser-Benachrichtigungen sind auf diesem Server nicht eingerichtet."
      rate_limited: "Zu viele Benachrichtigungsanfragen. Warte eine Minute und versuch es dann noch einmal."
      enqueue: "Die Testbenachrichtigung konnte nicht eingereiht werden. Versuch es später noch einmal."
      request: "Browser-Benachrichtigungen konnten nicht aktualisiert werden. Prüfe deine Verbindung und versuch es noch einmal."
      permission: "Die Berechtigung für Benachrichtigungen wurde nicht erteilt."
