---
zh-CN:
  insights:
    actions:
      budget: 查看预算
      cash_flow_warning: 查看循环交易
      idle_cash: 前往账户
      maintained_goal_depleted: 查看储备金
      net_worth_milestone: 查看净资产报告
      savings_rate_change: 查看该月份交易
      spending_anomaly: 查看 %{category} 交易
      subscription_audit: 查看循环交易
    card:
      acknowledge: 知道了
      acknowledge_title: 隐藏此条，直到数字变动
      acknowledged: 已忽略洞察
      dig_in: 借助 AI 深入分析
      new: 新
    dig_in:
      prompt: |-
        请帮我深入分析这条财务洞察。

        洞察：%{title}
        Sure 发现的内容：%{body}
        周期：%{period}
        数据：
        %{facts}

        其背后的原因是什么，我应该采取什么行动吗？
    feed:
      acknowledge_aria: 知道了：%{title}
      header: 最新
      header_new: 新
      view_all: 查看所有洞察
    figures:
      days_overdue:
        one: 逾期 %{count} 天
        other: 逾期 %{count} 天
      idle_days:
        one: 闲置 %{count} 天
        other: 闲置 %{count} 天
      need_attention: 需要注意
      of_budget: 占预算
      on_pace: 按目前进度
      today: 今天
      vs_previous: 相较上月
    index:
      empty:
        description: 当您的账户有足够活动时，洞察将在此显示。每晚会自动刷新。
        title: 暂无洞察
      refresh: 检查新洞察
      subtitle: 全面了解您的财务动态，每晚自动更新。
      title: 洞察
    meta:
      date_range: "%{from} 至 %{to}"
      last_n_days:
        one: 过去一天
        other: 过去 %{count} 天
      next_n_days:
        one: 未来一天
        other: 未来 %{count} 天
    notification:
      body: 打开 Sure 查看最新的 AI 洞察。
      title: 新的财务洞察
    refresh:
      checking: 检查中…
      queued: 正在生成最新洞察，请稍后刷新查看。
    templates:
      budget_at_risk:
        near: "%{categories} 本月已接近预算上限。您目前已使用总预算的 %{budget_spent_pct}%。"
        over: "%{categories} 本月已超出预算。您目前已使用总预算的 %{budget_spent_pct}%。"
      budget_on_track: 您已花费 %{budgeted} 预算中的 %{spent}（%{budget_spent_pct}%），所有开销均在限额之内。
      cash_flow_warning:
        low: 根据即将到来的循环交易和日常消费模式，您的现金余额可能在 %{projected_low_date} 前后降至 %{projected_low}。
        negative: 根据即将到来的循环交易和日常消费模式，您的现金余额可能在 %{projected_low_date} 前后跌至 %{projected_low}。
      idle_cash: "%{account} 拥有 %{balance}，且在过去 %{idle_days} 天内没有任何交易活动。"
      maintained_goal_depleted: "%{goal} 目前持有 %{saved}，低于预定目标 %{target}，尚缺 %{missing}。"
      net_worth_milestone: 您的净资产已突破 %{milestone}，目前为 %{net_worth}。
      savings_rate_change:
        down: 您在 %{month} 存下了收入的 %{current_rate}%，比前一个月的 %{previous_rate}% 降低了 %{change_pp}
          个百分点。
        down_negative: 您在 %{month} 的支出超过了收入：储蓄率从前一个月的 %{previous_rate}% 降至 %{current_rate}%。
        up: 您在 %{month} 存下了收入的 %{current_rate}%，比前一个月的 %{previous_rate}% 提高了 %{change_pp}
          个百分点。
      spending_anomaly:
        above: 按目前进度，您本月在 %{category} 上的支出预计为 %{projected_spend}，比近期月均支出 %{baseline_spend}
          高出约 %{deviation_pct}%。
        below: 按目前进度，您本月在 %{category} 上的支出预计为 %{projected_spend}，比近期月均支出 %{baseline_spend}
          低约 %{deviation_pct}%。
      subscription_audit: "%{name}（%{amount}）自预期的 %{expected_on} 后未再出现。可能已被取消，或扣款日期有所变动。"
    titles:
      budget_at_risk:
        one: 预算中有一个分类需要注意
        other: 预算中有 %{count} 个分类需要注意
      budget_on_track: 您的预算进度正常
      cash_flow_warning:
        low: 您的现金余额可能偏低
        negative: 您的现金余额可能出现负数
      idle_cash: "%{account} 中有闲置现金"
      maintained_goal_depleted: "%{goal} 已跌破设定水平"
      net_worth_milestone: 净资产里程碑：%{milestone}
      savings_rate_change:
        down: 您在 %{month} 的储蓄率有所下降
        up: 您在 %{month} 的储蓄率有所提高
      spending_anomaly:
        above: "%{category} 支出呈上升趋势"
        below: "%{category} 支出呈下降趋势"
      subscription_audit: "%{name} 仍在订阅中吗？"
    types:
      budget_at_risk: 预算
      budget_on_track: 预算
      cash_flow_warning: 现金流
      idle_cash: 闲置现金
      maintained_goal_depleted: 储备金
      net_worth_milestone: 净资产
      savings_rate_change: 储蓄率
      spending_anomaly: 支出
      subscription_audit: 订阅
