---
en:
  insights:
    actions:
      budget: View budget
      cash_flow_warning: Review recurring transactions
      idle_cash: Go to account
      maintained_goal_depleted: View reserve
      net_worth_milestone: View net worth report
      savings_rate_change: View that month's transactions
      spending_anomaly: View %{category} transactions
      subscription_audit: Review recurring transactions
    card:
      acknowledge: Got it
      acknowledge_title: Hide this until the numbers change
      acknowledged: Insight dismissed
      dig_in: Dig in with AI
      new: New
    dig_in:
      prompt: |-
        Help me dig into this insight.

        Insight: %{title}
        What Sure found: %{body}
        Period: %{period}
        Figures:
        %{facts}

        What's behind it, and is there anything I should do?
    feed:
      acknowledge_aria: 'Got it: %{title}'
      header: Latest
      header_new: New
      view_all: View all insights
    figures:
      days_overdue:
        one: "%{count} day overdue"
        other: "%{count} days overdue"
      idle_days:
        one: idle %{count} day
        other: idle %{count} days
      need_attention: need attention
      of_budget: of budget
      on_pace: on pace
      today: today
      vs_previous: vs prior month
    index:
      empty:
        description: Insights appear here once there's enough activity in your accounts.
          They refresh automatically every night.
        title: No insights yet
      refresh: Check for new insights
      subtitle: What's happening across your finances, refreshed nightly.
      title: Insights
    meta:
      date_range: "%{from} to %{to}"
      last_n_days:
        one: Last day
        other: Last %{count} days
      next_n_days:
        one: Next day
        other: Next %{count} days
    notification:
      body: Open Sure to review your latest AI insight.
      title: New financial insight
    refresh:
      checking: Checking…
      queued: We're generating fresh insights. Check back in a minute.
    templates:
      budget_at_risk:
        near: "%{categories} are close to their limits this month. You've used %{budget_spent_pct}%
          of your total budget so far."
        over: "%{categories} went over budget this month. You've used %{budget_spent_pct}%
          of your total budget so far."
      budget_on_track: You've spent %{spent} of your %{budgeted} budget (%{budget_spent_pct}%)
        and everything is within its limit.
      cash_flow_warning:
        low: Based on your upcoming recurring transactions and typical spending, your
          cash balance could drop to %{projected_low} around %{projected_low_date}.
        negative: Based on your upcoming recurring transactions and typical spending,
          your cash balance could fall to %{projected_low} around %{projected_low_date}.
      idle_cash: "%{account} holds %{balance} with no activity in the last %{idle_days}
        days."
      maintained_goal_depleted: "%{goal} holds %{saved} of the %{target} it is meant
        to keep. It is %{missing} short."
      net_worth_milestone: Your net worth crossed %{milestone} and now stands at %{net_worth}.
      savings_rate_change:
        down: You saved %{current_rate}% of your income in %{month}, down %{change_pp}
          percentage points from %{previous_rate}% the month before.
        down_negative: 'You spent more than you earned in %{month}: your savings rate
          fell to %{current_rate}%, from %{previous_rate}% the month before.'
        up: You saved %{current_rate}% of your income in %{month}, up %{change_pp}
          percentage points from %{previous_rate}% the month before.
      spending_anomaly:
        above: You're on pace to spend %{projected_spend} on %{category} this month,
          about %{deviation_pct}% more than your recent monthly average of %{baseline_spend}.
        below: You're on pace to spend %{projected_spend} on %{category} this month,
          about %{deviation_pct}% less than your recent monthly average of %{baseline_spend}.
      subscription_audit: "%{name} (%{amount}) hasn't appeared since it was expected
        on %{expected_on}. It may have been cancelled, or the charge may have moved."
    titles:
      budget_at_risk:
        one: One category needs attention in your budget
        other: "%{count} categories need attention in your budget"
      budget_on_track: Your budget is on track
      cash_flow_warning:
        low: Your cash balance may run low
        negative: Your cash balance may go negative
      idle_cash: Idle cash in %{account}
      maintained_goal_depleted: "%{goal} has dropped below its level"
      net_worth_milestone: 'Net worth milestone: %{milestone}'
      savings_rate_change:
        down: Your savings rate dropped in %{month}
        up: Your savings rate improved in %{month}
      spending_anomaly:
        above: "%{category} spending is trending up"
        below: "%{category} spending is trending down"
      subscription_audit: Is %{name} still active?
    types:
      budget_at_risk: Budget
      budget_on_track: Budget
      cash_flow_warning: Cash flow
      idle_cash: Idle cash
      maintained_goal_depleted: Reserve
      net_worth_milestone: Net worth
      savings_rate_change: Savings rate
      spending_anomaly: Spending
      subscription_audit: Subscriptions
