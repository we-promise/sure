    templates:
      budget_at_risk:
        near: >-
          Ebben a hónapban ezek a kategóriák közel járnak a keretükhöz: %{categories}. Eddig a teljes
          költségvetésed %{budget_spent_pct}%-át használtad fel.
        over: >-
          Ebben a hónapban ezek a kategóriák túllépték a keretüket: %{categories}. Eddig a teljes költségvetésed
          %{budget_spent_pct}%-át használtad fel.
      budget_on_track: >-
        A(z) %{budgeted} költségvetésből %{spent} összeget költöttél (%{budget_spent_pct}%), és minden
        kategória a keretén belül van.
      cash_flow_warning:
        low: >-
          A közelgő ismétlődő tranzakcióid és a szokásos kiadásaid alapján a pénzegyenleged %{projected_low_date}
          körül %{projected_low} összegre csökkenhet.
        negative: >-
          A közelgő ismétlődő tranzakcióid és a szokásos kiadásaid alapján a pénzegyenleged %{projected_low_date}
          körül %{projected_low} összegre eshet.
      idle_cash: >-
        A(z) %{account} számlán %{balance} található, és az elmúlt %{idle_days} napban nem történt rajta
        mozgás.
      maintained_goal_depleted: >-
        A(z) %{goal} célban a fenntartandó %{target} összegből %{saved} áll rendelkezésre. Még %{missing}
        hiányzik.
      net_worth_milestone: A nettó vagyonod átlépte a(z) %{milestone} határt, és most %{net_worth}.
      savings_rate_change:
        down: >-
          Ebben a hónapban (%{month}) a jövedelmed %{current_rate}%-át takarítottad meg. Ez %{change_pp}
          százalékponttal kevesebb az előző havi %{previous_rate}%-nál.
        down_negative: >-
          Ebben a hónapban (%{month}) többet költöttél, mint amennyit kerestél: a megtakarítási rátád
          az előző havi %{previous_rate}%-ról %{current_rate}%-ra esett.
        up: >-
          Ebben a hónapban (%{month}) a jövedelmed %{current_rate}%-át takarítottad meg. Ez %{change_pp}
          százalékponttal több az előző havi %{previous_rate}%-nál.
      spending_anomaly:
        above: >-
          A jelenlegi ütem mellett ebben a hónapban várhatóan %{projected_spend} lesz a(z) %{category}
          kategória kiadása, ami körülbelül %{deviation_pct}%-kal több a közelmúlt %{baseline_spend} havi
          átlagánál.
        below: >-
          A jelenlegi ütem mellett ebben a hónapban várhatóan %{projected_spend} lesz a(z) %{category}
          kategória kiadása, ami körülbelül %{deviation_pct}%-kal kevesebb a közelmúlt %{baseline_spend}
          havi átlagánál.
      subscription_audit: >-
        A(z) %{name} (%{amount}) nem jelent meg a várt %{expected_on} dátum óta. Lehetséges, hogy lemondtad,
        vagy megváltozott a terhelés időpontja.
