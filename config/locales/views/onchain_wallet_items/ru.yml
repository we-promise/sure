      exchange_rate_body: Криптовалюта оценивается в USD, а поставщик курсов валют для пересчёта в %{currency} не настроен, поэтому эти кошельки отслеживают количество, но показывают нулевую стоимость. Задайте EXCHANGE_RATE_PROVIDER — для Frankfurter API-ключ не нужен.
      exchange_rate_title: Поставщик курсов валют не настроен
      link: Открыть настройки рыночных данных
      title: Цены криптовалют не настроены
