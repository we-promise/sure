      chain_unreachable: Nie udało się połączyć z publicznym eksploratorem tej sieci.
        Spróbuj ponownie za chwilę.
      rate_limited: Publiczny eksplorator obecnie ogranicza liczbę żądań. Spróbuj
        ponownie za kilka minut.
      unexpected: Coś poszło nie tak podczas odczytu tego portfela. Szczegóły zostały
        zapisane do wsparcia technicznego.
      unrecognized_address: To nie wygląda na adres w żadnej obsługiwanej sieci.
