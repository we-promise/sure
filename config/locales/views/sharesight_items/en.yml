  sharesight_accounts:
    settings_fields:
      title: Sharesight cash and dividends
      description: Choose where this portfolio's cash and dividends live, so Sure doesn't count them twice.
      cash_mode: Cash
      cash_modes:
        broker: Held by the broker
        settlement: Settled through another account
        untracked: Not tracked (shares only)
      cash_mode_help: >-
        With another account or no cash tracked, this account shows shares only. Each trade's cash is offset with a
        transfer, linked to the account it settled through.
      settlement_account: Settlement account
      settlement_starts_on: Settles there from
      settlement_window_days: Days the bank can take to show it
      settlement_help: >-
        Each buy and sell, and each dividend paid there, is matched by amount to a transaction in that account and
        linked as a transfer. A manual account gets the transaction booked for it. Before the start date, the broker
        held the cash.
      choose_account: Choose an account
      no_account: None
      funding_account: Funding account
      funding_match_terms: Funding transaction text
      funding_match_terms_placeholder: CMC Share Transfer, CMC Markets
      funding_help: >-
        Top-ups and withdrawals in the funding account whose name or notes contain any of these (comma-separated)
        are mirrored here and linked as transfers.
      cash_anchor_amount: Cash at the broker
      cash_anchor_on: On
      cash_anchor_help: >-
        For cash Sharesight can't see: the balance on that date, rolled forward through everything booked here since.
        Update it whenever you check the broker.
      dividend_mode: Dividends and distributions
      dividend_modes:
        with_cash: Wherever the cash is
        other_account: Paid to another account
        skip: Don't import (another connection shows them)
      dividend_mode_help: >-
        Paid out ones are still counted as income here, then linked to the deposit in the account they were paid to.
      dividend_account: Paid to
      sync_start_date: Import activity from
      sync_start_date_help: Older trades and dividends are left out, and any already imported are removed.
    errors:
      settlement_account_missing: Choose the account the portfolio settles through.
