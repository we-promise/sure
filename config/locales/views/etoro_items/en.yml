    display_mode:
      label: Show %{account} as
      change: Change
      hint:
        holdings: Each stock, ETF or crypto is a holding, with the buys and sells of its positions.
        totals: eToro's daily total and cash, with everything invested as one holding. Sure keeps no eToro trades or per-position holdings, nor what you changed on them, such as remaps or locked cost bases. A trade you added by hand stays and counts as a holding too, so the cash differs from eToro's by its value on the days before it.
        copies: Each copy-trading portfolio you set up is an account of its own, from the day Sure first recorded it. This account keeps the positions you opened, your cash and any copy not set up. Another mode empties the copy accounts until you switch back, and your edits to their holdings and transfers are lost.
      confirm:
        title: Change how %{account} shows?
        body: Sure rebuilds the account from what eToro sent. Your edits to its eToro trades are lost, and with Totals only also the holdings you remapped and the cost bases you locked. Leaving Per copy portfolio also loses your edits to the copy accounts' holdings and to the transfers to and from them.
        button: Change
