        description: Wise yêu cầu ký một thử thách mã dùng một lần để đọc đầy đủ sao kê giao dịch, bao gồm cả các khoản tiền nhận được. Hãy tạo cặp khóa tại đây và đăng ký khóa công khai với Wise để bật tính năng này.
