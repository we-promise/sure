      reconnect: Reconnect Fineco
      cancel: Cancel login
      status_waiting: Waiting for Fineco login.
      status_verifying: Verifying Fineco investment access.
      status_stopping: Stopping the Fineco login session.
      status_connected: Fineco login verified and the investment snapshot is ready.
      status_expired: This Fineco login session expired. Start again to reconnect.
      status_stopped: Fineco login cancelled.
      status_failed: Fineco login could not be verified. Start again to retry.
      status_unknown: Fineco login status is unavailable.
