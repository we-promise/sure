      history_locked: >-
        O Fio recusou este período do extrato. Desbloqueie o histórico completo da
        conta no serviço bancário online, em Settings → API, e sincronize novamente
        no prazo de 10 minutos.
      statement_fetch_failed: Não foi possível obter o extrato no Fio
      statement_too_large: >-
        O extrato tem mais transações do que o Fio fornece numa pedido. Avance a data
        inicial da sincronização e sincronize novamente.
      sync_failed: Não foi possível sincronizar a ligação com o Fio
    sync:
