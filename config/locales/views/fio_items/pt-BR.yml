      account_sync_schedule_failed: Não foi possível agendar a sincronização da conta
        do Fio
      history_locked: >-
        O Fio recusou este período do extrato. Desbloqueie o histórico completo da
        conta no internet banking, em Configurações → API, e sincronize novamente
        em até 10 minutos.
      statement_fetch_failed: Não foi possível buscar o extrato no Fio
      statement_too_large: >-
        O extrato tem mais transações do que o Fio fornece em uma solicitação. Avance
        a data inicial da sincronização e sincronize novamente.
      sync_failed: Não foi possível sincronizar a conexão com o Fio
    sync:
      status:
        calculating: Calculando saldos...
        checking_setup: Verificando a configuração da conta...
        importing: Importando o extrato do Fio...
        needs_setup:
          one: 1 conta precisa de configuração...
          other: "%{count} contas precisam de configuração..."
        processing: Processando transações...
    sync_status:
      all_synced:
        one: 1 conta sincronizada
        other: "%{count} contas sincronizadas"
      no_accounts: Nenhuma conta encontrada ainda
      partial: "%{linked} sincronizadas, %{unlinked} precisam de configuração"
