  fio_item:
    errors:
      account_mismatch: >-
        Ce jeton correspond à un autre compte Fio que celui déjà synchronisé par cette connexion. Ajoutez-le
        dans une connexion distincte.
      account_processing_failed: Impossible de synchroniser le compte Fio
      account_sync_schedule_failed: Impossible de planifier la synchronisation du compte Fio
      history_locked: >-
        Fio a refusé cette période de relevé. Déverrouillez l’historique complet du compte dans votre
        espace bancaire en ligne, sous Paramètres → API, puis relancez la synchronisation dans les 10
        minutes.
      statement_fetch_failed: Impossible de récupérer le relevé auprès de Fio
      statement_too_large: >-
        Le relevé contient plus de transactions que Fio ne peut fournir en une seule requête. Choisissez
        une date de début de synchronisation plus récente, puis réessayez.
      sync_failed: Impossible de synchroniser la connexion Fio
    sync:
