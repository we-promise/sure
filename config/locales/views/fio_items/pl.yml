    fio:
      create_fio_item:
        default_name: Połączenie z Fio banka
  fio_item:
    errors:
      account_mismatch: >-
        Ten token należy do innego konta Fio niż konto synchronizowane przez to połączenie.
        Dodaj go jako osobne połączenie.
      account_processing_failed: Nie udało się zsynchronizować konta Fio
      account_sync_schedule_failed: Nie udało się zaplanować synchronizacji konta
        Fio
      history_locked: >-
        Fio odrzuciło żądanie wyciągu za ten okres. Odblokuj pełną historię konta
        w bankowości internetowej w sekcji Ustawienia → API, a następnie ponów synchronizację
        w ciągu 10 minut.
      statement_fetch_failed: Nie udało się pobrać wyciągu z Fio
      statement_too_large: >-
        Wyciąg zawiera więcej transakcji, niż Fio udostępnia w jednym żądaniu. Ustaw
        późniejszą datę rozpoczęcia synchronizacji i spróbuj ponownie.
      sync_failed: Nie udało się zsynchronizować połączenia z Fio
    sync:
