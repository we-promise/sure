      title: Sync frequency
      description: Every connection syncs with the family sync, once a day for most providers. Pick an interval under a day to also sync %{name} on its own through the day. An interval of a day or longer replaces the family and hourly syncs for %{name}, so it syncs only on that schedule, though updates the provider pushes (such as Plaid webhooks) can still arrive in between.
      interval_label: Sync
