        Registre um aplicativo OAuth em <a href="https://dashboard.snaptrade.com"
        target="_blank" rel="noopener noreferrer" class="underline">dashboard.snaptrade.com</a>
      oauth_setup_step_2_html: >-
        Somente para o fluxo pelo navegador: adicione a URL de retorno deste aplicativo
        (<code>%{callback_url}</code>) como URI de redirecionamento registrada
      oauth_setup_step_3: >-
        Defina SNAPTRADE_OAUTH_CLIENT_ID no ambiente e reinicie. Isso basta para habilitar
        o fluxo por código de dispositivo; adicione também SNAPTRADE_OAUTH_CLIENT_SECRET
        para habilitar o fluxo pelo navegador
      oauth_status_authorized: Autorizado no SnapTrade.
