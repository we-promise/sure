        sincronizá-las novamente.
      delete_connection_confirm: Excluir conexão
      delete_connection_title: Excluir conexão com a corretora?
      description: >-
        O SnapTrade conecta-se a mais de 25 grandes corretoras (Fidelity, Vanguard,
        Schwab, Robinhood etc.) e fornece o histórico completo de negociações, com
        identificação das atividades e custo de aquisição.
      free_tier_warning: O plano gratuito do SnapTrade inclui 20 conexões com corretoras.
