      success:
        one: "%{count} conta ligada com sucesso."
        other: "%{count} contas associadas com sucesso."
    complete_oauth_device_flow:
      access_denied: A autorização do SnapTrade foi recusada.
      authorization_pending: >-
        O SnapTrade ainda não recebeu a sua confirmação. Aprove o código no SnapTrade
