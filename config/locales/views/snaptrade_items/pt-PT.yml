        Registe uma aplicação OAuth em <a href="https://dashboard.snaptrade.com" target="_blank"
        rel="noopener noreferrer" class="underline">dashboard.snaptrade.com</a>
      oauth_setup_step_2_html: >-
        Apenas para o fluxo no navegador: adicione o URL de retorno desta aplicação
        (<code>%{callback_url}</code>) como URI de redirecionamento registado
      oauth_setup_step_3: >-
        Defina SNAPTRADE_OAUTH_CLIENT_ID no ambiente e reinicie. Isso basta para ativar
        o fluxo por código de dispositivo; adicione também SNAPTRADE_OAUTH_CLIENT_SECRET
        para ativar o fluxo pelo navegador
      oauth_status_authorized: Autorizado no SnapTrade.
      oauth_status_ready: Autorize o Sure a ler os dados da sua conta do SnapTrade.
