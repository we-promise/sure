        Esta ação remove permanentemente do SnapTrade a ligação a %{brokerage}. Todas
        as contas desta corretora serão desassociadas. Terá de voltar a ligar para
        sincronizar estas contas novamente.
      delete_connection_confirm: Eliminar ligação
      delete_connection_title: Eliminar ligação com a corretora?
      description: >-
        O SnapTrade liga-se a mais de 25 grandes corretoras (Fidelity, Vanguard, Schwab,
        Robinhood etc.) e fornece o histórico completo de negociações, com identificação
        das atividades e custo de aquisição.
      free_tier_warning: O plano gratuito do SnapTrade inclui 20 ligações com corretoras.
      loading_connections: A carregar ligações...
