      device_code_required: >-
        Não há uma autorização por dispositivo do SnapTrade em curso para esta ligação.
        Inicie novamente para obter um novo código.
      expired: Este código de dispositivo expirou. Inicie a autorização novamente.
      failed: >-
        Não foi possível concluir a autorização por dispositivo do SnapTrade. Tente
