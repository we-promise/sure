        FUTUSECURITIES: HK
        FUTUINC: US
        FUTUCA: CA
        FUTUMY: MY
        FUTUAU: AU
        FUTUJP: JP
    settlements:
      buy: "Buy %{symbol}"
      sell: "Sell %{symbol}"
    acc_types:
      cash: Cash
      margin: Margin
      derivative: Derivative
    reauth_reasons:
      invalid_grant: moomoo no longer accepts this connection. It expires after 14 days without use, or when access is revoked.
      invalid_client: moomoo no longer knows Sure's registration. Reconnecting registers Sure again.
      token_rejected: moomoo refused a freshly issued access token.
      scope_missing: The trade:read permission or a trading account was not granted.
    moomoo_item:
      deletion_in_progress: Deletion in progress
      syncing: Syncing
