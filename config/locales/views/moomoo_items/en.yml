      account_summary: "%{details} • Balance: %{balance}"
      link: Link
      cancel: Cancel
    connect:
      registration_failed: "Could not register Sure with moomoo: %{message}"
    reauthorize:
      registration_failed: "Could not register Sure with moomoo: %{message}"
    callback:
      success: moomoo connected. Choose the accounts to add.
      invalid_callback: The moomoo authorization link was invalid or has expired. Please connect again.
      access_denied: Authorization was cancelled on moomoo.
      authorization_error: "moomoo reported an error: %{error}"
      authorization_failed: "moomoo authorization failed: %{message}"
      scope_missing: Sure needs the trade:read permission and at least one trading account, so nothing was saved. Try again and tick them.
      write_scope_granted: The consent granted order placing (trade:write), which Sure never uses, so nothing was saved. Try again and leave trade:write unticked; tick only trade:read and the accounts to share.
      already_connected: This moomoo connection was completed in another window. To add another moomoo login, click Connect moomoo again.
    destroy:
      success: moomoo connection scheduled for deletion. You can also revoke Sure's access in the moomoo OpenAPI dashboard.
      unlink_failed: A moomoo account could not be unlinked, so the connection was kept. Try removing it again.
    select_accounts:
      not_configured: Connect moomoo first.
    link_existing_account:
      not_found: Account or moomoo connection not found.
      currency_mismatch: This moomoo account is in %{currency}. Link it to a manual account in %{currency}.
      only_matching_manual_account: A moomoo cash account can only be linked to a manual cash account, and any other moomoo account to a manual investment account.
      already_linked: This moomoo account is already linked.
      not_shared: moomoo no longer shares this account with Sure. Share it again with Change accounts, then link it.
      unsupported_kind: This kind of moomoo account is not supported yet.
      success: Successfully linked to moomoo account.
      failed: Failed to link moomoo account.
      syncing: Wait for the moomoo sync to finish before linking the account.
    complete_account_setup:
      success:
        one: Successfully created %{count} moomoo account.
        other: Successfully created %{count} moomoo accounts.
      none_selected: No accounts were selected.
      none_created: No accounts were created.
      syncing: Wait for the sync to finish before setting up accounts.
