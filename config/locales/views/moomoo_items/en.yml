      page_title: Set Up moomoo Accounts
      dialog_title: Set Up Your moomoo Accounts
      subtitle: Choose the moomoo trading accounts to add to Sure.
      info_box:
        title: moomoo OpenAPI import (read-only)
        items:
          item_1: Current holdings, each in the currency it trades in
          item_2: Buys and sells from up to the last 2 years, without fees for now
          item_3: Total assets and cash, as an account per currency when it holds more than one
          item_4: Deposits, withdrawals, dividends, taxes, fees and currency exchanges from the cash log
      status:
        fetching_accounts: Fetching accounts from moomoo...
        no_accounts_found_title: No account found.
        no_accounts_found_description: moomoo returned no authorized trading account. Reconnect and tick at least one account.
        sync_failed_title: Sure couldn't fetch your accounts.
        sync_failed_description: The last sync with moomoo didn't finish. Try again, or check the connection under Settings → Providers.
        still_syncing: moomoo is still syncing. This list updates when it finishes, and the accounts can be set up then.
      available_accounts:
        title: Available accounts
        account_summary: "%{details} • Balance: %{balance}"
      unsupported:
        title: Not supported yet
        description: Futures, crypto, and moomoo Japan margin or derivative accounts are not imported in this version.
        kinds:
          futures: Futures
          crypto: Crypto
          jp_margin: Japan margin or derivative
          other: Other
      link_existing:
