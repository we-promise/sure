        error: Opa! Verifique se há erros no formulário.
      help:
        blank_redirect_uri: >-
          Deixe em branco se configurou o seu serviço para utilizar Client Credentials,
          Resource Owner Password Credentials ou qualquer outro tipo de concessão
          que não exija um URI de redirecionamento.
        confidential: >-
          O aplicativo será usado em um ambiente em que o segredo do cliente pode
          ser mantido confidencial. Aplicativos móveis nativos e aplicativos de página
          única são considerados não confidenciais.
        redirect_uri: Utilize uma linha por URI
        scopes: Separe os escopos com espaços. Deixe em branco para usar os escopos
          padrão.
      index:
        actions: Ações
        callback_url: URL de retorno
        confidential: Confidencial?
        confidentiality:
          'no': Não
          'yes': Sim
        name: Nome
        new: Novo aplicativo
        title: Seus aplicativos
      new:
        title: Novo aplicativo
      show:
        actions: Ações
        application_id: UID
        callback_urls: URLs de retorno
        confidential: Confidencial
        not_defined: Não definido
        scopes: Escopos
        secret: Segredo
        secret_hashed: Segredo com hash
        title: 'Aplicativo: %{name}'
    authorizations:
      buttons:
        authorize: Autorizar
        deny: Negar
      error:
        go_back: Voltar
        title: Ocorreu um erro
      form_post:
        title: Enviar este formulário
      new:
        able_to: Este aplicativo poderá
        prompt: Autorizar %{client_name} a utilizar a sua conta?
        title: Autorização necessária
      show:
        authorization_code_label: 'Código de autorização:'
        copy_instructions: Copie este código e cole-o no aplicativo.
        title: Código de autorização
    authorized_applications:
      buttons:
        revoke: Revogar
      confirmations:
        revoke: Tem certeza?
      index:
        application: Aplicativo
        created_at: Criado em
        date_format: "%Y-%m-%d %H:%M:%S"
        title: Seus aplicativos autorizados
    errors:
      messages:
        access_denied: O proprietário do recurso ou o servidor de autorização negou
          o pedido.
        admin_authenticator_not_configured: >-
          O acesso ao painel de administração é proibido porque o Doorkeeper.configure.admin_authenticator
          não está configurado.
        credential_flow_not_configured: >-
          O fluxo Resource Owner Password Credentials falhou porque o Doorkeeper.configure.resource_owner_from_credentials
          não está configurado.
        forbidden_token:
          missing_scope: O acesso a este recurso exige o escopo "%{oauth_scopes}".
        invalid_client: >-
          A autenticação do cliente falhou devido a um cliente desconhecido, à ausência
          de autenticação do cliente ou a um método de autenticação não suportado.
        invalid_code_challenge_method:
          one: O code_challenge_method tem de ser %{challenge_methods}.
          other: O code_challenge_method tem de ser um de %{challenge_methods}.
          zero: >-
            O servidor de autorização não oferece suporte a PKCE porque nenhum valor
            de code_challenge_method é aceito.
        invalid_grant: >-
          A concessão de autorização fornecida é inválida, expirou, foi revogada,
          não corresponde ao URI de redirecionamento utilizado no pedido de autorização
          ou foi emitida para outro cliente.
        invalid_redirect_uri: >-
          O URI de redirecionamento pedido está malformado ou não corresponde ao URI
          de redirecionamento do cliente.
        invalid_request:
          invalid_code_challenge: É necessário um code challenge.
          missing_param: 'Parâmetro obrigatório ausente: %{value}.'
          request_not_authorized: >-
            A solicitação precisa ser autorizada. O parâmetro necessário para autorizá-la
            está ausente ou é inválido.
          unknown: >-
            A solicitação não contém um parâmetro obrigatório, inclui um valor de
            parâmetro não compatível ou está malformada de outra maneira.
        invalid_scope: O escopo solicitado é inválido, desconhecido ou malformado.
        invalid_token:
          expired: O token de acesso expirou
          revoked: O token de acesso foi revogado
          unknown: O token de acesso é inválido
        resource_owner_authenticator_not_configured: >-
          A pesquisa de Resource Owner falhou porque o Doorkeeper.configure.resource_owner_authenticator
          não está configurado.
        revoke:
          unauthorized: Não está autorizado a revogar este token
        server_error: >-
          O servidor de autorização encontrou uma condição inesperada que o impediu
          de cumprir o pedido.
        temporarily_unavailable: >-
          O servidor de autorização está atualmente impossibilitado de processar o
          pedido devido a uma sobrecarga temporária ou a manutenção do servidor.
        unauthorized_client: O cliente não está autorizado a realizar este pedido
          com este método.
        unsupported_grant_type: O tipo de concessão de autorização não é suportado
          pelo servidor de autorização.
        unsupported_response_mode: O servidor de autorização não suporta este modo
          de resposta.
        unsupported_response_type: O servidor de autorização não suporta este tipo
          de resposta.
    flash:
      applications:
        create:
          notice: Aplicativo criado.
        destroy:
          notice: Aplicativo excluído.
        update:
          notice: Aplicativo atualizado.
      authorized_applications:
        destroy:
          notice: Autorização do aplicativo revogada.
    layouts:
      admin:
        nav:
          applications: Aplicativos
          home: Início
          oauth2_provider: Provedor OAuth2
        title: Doorkeeper
      application:
        title: Necessária autorização OAuth
    pre_authorization:
      status: Pré-autorização
