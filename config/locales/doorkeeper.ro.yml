          unknown: Solicitării îi lipsește un parametru obligatoriu, include o valoare
            de parametru neacceptată sau este malformată.
        invalid_scope: Domeniul (scope) solicitat este invalid, necunoscut sau malformat.
        invalid_token:
          expired: Token-ul de acces a expirat
          revoked: Token-ul de acces a fost revocat
          unknown: Token-ul de acces este invalid
        resource_owner_authenticator_not_configured: Căutarea Resource Owner a eșuat
          deoarece Doorkeeper.configure.resource_owner_authenticator nu este configurat.
