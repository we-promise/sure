; Cloud in a Bottle all-in-one supervisor config for Sure.
; supervisord is PID 1; each process drops to its service user.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
; Socket in /tmp (tmpfs) so the mounted data dir only holds the cluster;
; same-container clients use the socket, Rails uses TCP 127.0.0.1:5432.
command=/usr/lib/postgresql/16/bin/postgres -D "%(ENV_SURE_DATA_DIR)s/postgres" -k /tmp -c listen_addresses=127.0.0.1 -c port=5432
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
; AOF persistence into the permanent data dir; loopback-only, no port
; published outside the container.
command=redis-server --bind 127.0.0.1 --port 6379 --dir "%(ENV_SURE_DATA_DIR)s/redis" --appendonly yes --protected-mode yes
user=redis
priority=10
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:provision]
command=/opt/cloudinabottle/provision.sh
user=postgres
priority=20
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/opt/cloudinabottle/web.sh
user=rails
priority=30
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=/opt/cloudinabottle/worker.sh
user=rails
priority=30
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
