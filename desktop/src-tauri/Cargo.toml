[package]
name = "sure-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "sure_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
tauri-plugin-decorum = "1"
url = "2"
ureq = { version = "2", features = ["json"] }
open = "5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# Already in the tree through wry; used directly to save attachment responses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURLResponse"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKDownload", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKWebView"] }

[dev-dependencies]
