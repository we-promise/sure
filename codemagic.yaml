workflows:
  ios-release:
    name: Sure iOS Release (no codesign)
    instance_type: mac_mini_m1
    working_directory: mobile
    environment:
      flutter: 3.24.5
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Clean iOS build cache
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod repo update || true
          pod install
          cd ..
      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r sure_mobile.ipa Payload/
          mkdir -p "$CM_BUILD_OUTPUT_DIR"
          cp sure_mobile.ipa "$CM_BUILD_OUTPUT_DIR/"
    artifacts:
      - "**/*.ipa"
