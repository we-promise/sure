---
name: insights_golden_v1
description: >
  Golden dataset for the financial intelligence tools: cash-flow projection,
  liabilities and repayment terms, overdraft terms, seasonal obligations,
  category trends, scenario comparison, uncategorized spending and the
  document vault. Each sample pins the ROUTING contract stated in the tool
  descriptions, because the failure these tools exist to fix was an assistant
  reconstructing a projection by hand from raw transactions and announcing a
  balance computed on outflows only. The harness is single-shot: it observes
  the first round's function selection and text, it does not execute tools,
  so assertions are about which tool is reached for and with what arguments,
  never about final numbers.
eval_type: chat
version: "1.0"
metadata:
  created_at: "2026-09-05"
  source: manual_curation

samples:
  # ===== Area 4: cash-flow projection, income included =====
  # The regression that motivated the whole set. Answering any of these from
  # get_transactions means summing outflows by hand and understating income.
  - id: insights_cashflow_001
    difficulty: easy
    tags: [project_cash_balance, cashflow, anti_regression]
    input:
      prompt: "Am I going to be overdrawn on the 1st of October?"
    expected:
      functions:
        - name: "project_cash_balance"
      response_contains: []

  - id: insights_cashflow_002
    difficulty: easy
    tags: [project_cash_balance, cashflow]
    input:
      prompt: "Will I make it to the end of the month without going negative?"
    expected:
      functions:
        - name: "project_cash_balance"
      response_contains: []

  - id: insights_cashflow_003
    difficulty: medium
    tags: [project_cash_balance, cashflow]
    input:
      prompt: "When does my cash bottom out over the next three months, and how low does it get?"
    expected:
      functions:
